tool: arachni
tags: [web, scanner, security, pentest, vulnerability, enumeration]

actions:
# === BASIC SCANS & OUTPUT ===
 - title:
     en: arachni - basic scan
     tr: arachni - temel tarama
   desc:
     en: |
       Performs a standard scan against the target URL using default settings.
       This command will audit forms, links, and cookies while loading all default security checks.
       It is the quickest way to start a vulnerability assessment on a single web application.
       Note that default scans might miss subdomains or specific complex input vectors.
     tr: |
       Hedef URL'ye varsayılan ayarlarla standart tarama yapar.
       Bu komut, tüm varsayılan güvenlik denetimlerini yüklerken form, bağlantı ve çerezleri denetler.
       Tek bir web uygulamasında zafiyet değerlendirmesine başlamanın en hızlı yoludur.
       Varsayılan taramaların alt alan adlarını veya belirli karmaşık girdi vektörlerini kaçırabileceğini unutmayın.
   command: "arachni {{url}}"

 - title:
     en: arachni - verbose scan with report saving
     tr: arachni - rapor kaydetmeli ayrıntılı tarama
   desc:
     en: |
       Runs a scan with verbose output and saves the final result to an Arachni Framework Report (.afr) file.
       The verbose output helps monitor the scanner's progress and identify any connection issues in real-time.
       The generated .afr file is essential because it can be converted into HTML, JSON, or XML reports later.
       Always use this when you need to document your findings for a professional pentest report.
     tr: |
       Ayrıntılı çıktıyla tarama çalıştırıp nihai sonucu Arachni Framework Raporu (.afr) dosyasına kaydeder.
       Ayrıntılı çıktı, tarayıcının ilerlemesini izlemeye ve bağlantı sorunlarını gerçek zamanlı tespit etmeye yardımcı olur.
       Üretilen .afr dosyası daha sonra HTML, JSON veya XML raporlara dönüştürülebildiği için gereklidir.
       Bulguları profesyonel sızma testi raporu için belgelemeniz gerektiğinde bunu kullanın.
   command: "arachni --output-verbose --report-save-path={{report_name|scan_results.afr}} {{url}}"

 - title:
     en: arachni - output only positive results
     tr: arachni - yalnızca olumlu sonuçları gösterme
   desc:
     en: |
       Filters the console output to only show successfully identified vulnerabilities and security issues.
       This is highly useful for large-scale scans where you want to ignore noise and focus on actionable findings.
       It does not affect the actual scan depth, only what is printed to the terminal screen during the process.
       Use this when running the tool in a background terminal or CI/CD pipeline.
     tr: |
       Konsol çıktısını yalnızca başarıyla tespit edilen zafiyet ve güvenlik sorunlarını gösterecek şekilde filtreler.
       Gürültüyü yoksayıp eyleme geçirilebilir bulgulara odaklanmak istediğiniz geniş ölçekli taramalarda oldukça yararlıdır.
       Gerçek tarama derinliğini etkilemez; yalnızca işlem sırasında terminale yazılanı değiştirir.
       Aracı arka plan terminalinde veya CI/CD hattında çalıştırırken kullanın.
   command: "arachni --output-only-positives {{url}}"

# === SCOPE & DEPTH CONTROL ===
 - title:
     en: arachni - include subdomains in scan
     tr: arachni - taramaya alt alan adlarını dahil etme
   desc:
     en: |
       Instructs the scanner to follow and audit links that lead to subdomains of the target.
       By default, Arachni restricts itself to the provided domain to prevent "scope creep" and accidental scanning of third parties.
       Enabling this is crucial for full-surface reconnaissance of a corporate web infrastructure.
       Be cautious as this can significantly increase scan time and resource consumption.
     tr: |
       Tarayıcıya hedefin alt alan adlarına giden bağlantıları izleyip denetlemesini söyler.
       Arachni varsayılan olarak "kapsam kayması"nı ve üçüncü tarafların yanlışlıkla taranmasını önlemek için verilen alan adıyla sınırlıdır.
       Bunu etkinleştirmek, kurumsal web altyapısının tam yüzey keşfi için kritiktir.
       Tarama süresi ve kaynak tüketimini belirgin artırabileceğinden dikkatli olun.
   command: "arachni --scope-include-subdomains {{url}}"

 - title:
     en: arachni - limit crawl depth and page count
     tr: arachni - tarama derinliği ve sayfa sayısını sınırlama
   desc:
     en: |
       Restricts the scanner to a maximum directory depth and a specific number of total pages.
       This is an effective way to perform "smoke tests" or quick scans on very large websites without getting stuck in infinite loops.
       The directory depth limit prevents the crawler from going too deep into nested folder structures.
       The page limit ensures the scan terminates after reaching the defined threshold of unique URLs.
     tr: |
       Tarayıcıyı azami dizin derinliği ve belirli toplam sayfa sayısıyla sınırlar.
       Bu, sonsuz döngüye takılmadan çok büyük sitelerde "duman testi" veya hızlı tarama yapmanın etkili yoludur.
       Dizin derinliği sınırı, tarayıcının iç içe klasör yapılarına çok derine inmesini engeller.
       Sayfa sınırı, tanımlı benzersiz URL eşiğine ulaşınca taramanın sonlanmasını sağlar.
   command: "arachni --scope-directory-depth-limit {{depth|3}} --scope-page-limit {{page_limit|100}} {{url}}"

 - title:
     en: arachni - exclude specific URL patterns
     tr: arachni - belirli URL kalıplarını hariç tutma
   desc:
     en: |
       Uses regular expressions to exclude certain paths or actions from being crawled or audited.
       This is critical for avoiding sensitive areas like logout buttons, "delete account" pages, or administrative panels.
       Preventing the scanner from hitting logout links ensures that authenticated sessions remain active throughout the scan.
       You can use this multiple times to exclude various sensitive patterns in the application.
     tr: |
       Taranacak veya denetlenecek belirli yol ya da eylemleri hariç tutmak için düzenli ifadeler kullanır.
       Bu, çıkış düğmeleri, "hesap sil" sayfaları veya yönetim panelleri gibi hassas alanlardan kaçınmak için kritiktir.
       Tarayıcının çıkış bağlantılarına dokunmasını engellemek, kimlik doğrulamalı oturumların tarama boyunca etkin kalmasını sağlar.
       Uygulamadaki çeşitli hassas kalıpları hariç tutmak için bunu birden çok kez kullanabilirsiniz.
   command: "arachni --scope-exclude-pattern {{regex_pattern}} {{url}}"

# === TARGETED AUDITING ===
 - title:
     en: arachni - audit specific elements (links, forms, cookies)
     tr: arachni - belirli öğeleri denetleme (bağlantı, form, çerez)
   desc:
     en: |
       Explicitly tells the scanner which types of web elements to test for vulnerabilities.
       By focusing only on specific vectors like cookies or headers, you can perform highly targeted security checks.
       This is often used when a previous scan showed issues in a specific area and you want to verify fixes quickly.
       Auditing headers and cookies extensively can significantly increase the number of requests sent to the server.
     tr: |
       Tarayıcıya zafiyet için hangi tür web öğelerini test edeceğini açıkça söyler.
       Yalnızca çerez veya başlık gibi belirli vektörlere odaklanarak son derece hedefli güvenlik denetimleri yapabilirsiniz.
       Bu, önceki tarama belirli bir alanda sorun gösterdiğinde ve düzeltmeleri hızlı doğrulamak istediğinizde sık kullanılır.
       Başlık ve çerezleri kapsamlı denetlemek sunucuya gönderilen istek sayısını belirgin artırabilir.
   command: "arachni --audit-links --audit-forms --audit-cookies --audit-headers {{url}}"

 - title:
     en: arachni - audit JSON and XML inputs
     tr: arachni - JSON ve XML girdilerini denetleme
   desc:
     en: |
       Enables specialized auditing for modern web applications that pass data via JSON or XML payloads.
       Standard scanners often miss vulnerabilities hidden within API calls or AJAX requests if these flags are not set.
       It is highly recommended for auditing RESTful APIs and single-page applications (SPAs).
       Ensure the target URL points to the API endpoint or the page making these requests.
     tr: |
       Veriyi JSON veya XML yükleriyle taşıyan modern web uygulamaları için özel denetimi etkinleştirir.
       Bu bayraklar ayarlanmazsa standart tarayıcılar API çağrıları veya AJAX isteklerindeki gizli zafiyetleri sıkça kaçırır.
       RESTful API'ler ve tek sayfa uygulamaları (SPA) denetiminde şiddetle önerilir.
       Hedef URL'nin API uç noktasını veya bu istekleri yapan sayfayı gösterdiğinden emin olun.
   command: "arachni --audit-jsons --audit-xmls {{url}}"

# === VULNERABILITY CHECK SELECTION ===
 - title:
     en: arachni - run specific vulnerability checks
     tr: arachni - belirli zafiyet denetimlerini çalıştırma
   desc:
     en: |
       Loads only the specified security checks, such as XSS or SQL injection, using wildcards.
       This allows for faster, more focused scans when you are only interested in a specific class of vulnerabilities.
       Using 'xss*' will load all Cross-Site Scripting related modules.
       It is a great way to reduce server load by disabling checks that are not relevant to the target environment.
     tr: |
       Jokerlerle yalnızca belirtilen güvenlik denetimlerini (ör. XSS veya SQL enjeksiyonu) yükler.
       Bu, yalnızca belirli bir zafiyet sınıfıyla ilgilendiğinizde daha hızlı ve odaklı taramalara olanak tanır.
       'xss*' kullanmak tüm Siteler Arası Betik Çalıştırma modüllerini yükler.
       Hedef ortamla ilgisiz denetimleri kapatarak sunucu yükünü azaltmanın iyi yoludur.
   command: "arachni --checks={{check_pattern|xss*}} {{url}}"

 - title:
     en: arachni - exclude specific checks
     tr: arachni - belirli denetimleri hariç tutma
   desc:
     en: |
       Loads all default checks except for those explicitly mentioned with a minus sign prefix.
       This is useful if certain checks are causing the application to crash or triggering an Intrusion Detection System (IDS).
       For example, you might want to exclude 'csrf' checks if they are generating too many false positives or logs.
       It provides a balance between a comprehensive scan and a stable testing environment.
     tr: |
       Eksi işareti önekiyle açıkça belirtilenler dışındaki tüm varsayılan denetimleri yükler.
       Bu, belirli denetimler uygulamayı çökertiyor veya Saldırı Tespit Sistemini (IDS) tetikliyorsa yararlıdır.
       Örneğin 'csrf' denetimleri çok fazla yanlış pozitif veya log üretiyorsa hariç tutmak isteyebilirsiniz.
       Kapsamlı tarama ile kararlı test ortamı arasında denge sağlar.
   command: "arachni --checks=*,-{{excluded_check|csrf}} {{url}}"

# === AUTHENTICATION & HTTP CONFIGURATION ===
 - title:
     en: arachni - scan using HTTP Basic Authentication
     tr: arachni - HTTP Temel Kimlik Doğrulamayla tarama
   desc:
     en: |
       Configures the scanner to authenticate against a web server using HTTP Basic Auth credentials.
       This is necessary for scanning staging environments or protected administrative directories.
       The scanner will include the 'Authorization' header in every request it sends.
       Make sure the credentials provided have sufficient permissions to view the entire application.
     tr: |
       Tarayıcıyı HTTP Temel Kimlik Doğrulama bilgileriyle web sunucusuna kimlik doğrulayacak şekilde yapılandırır.
       Bu, hazırlık ortamlarını veya korumalı yönetim dizinlerini taramak için gereklidir.
       Tarayıcı gönderdiği her isteğe 'Authorization' başlığını ekler.
       Verilen kimlik bilgilerinin tüm uygulamayı görmeye yeterli izni olduğundan emin olun.
   command: "arachni --http-authentication-username {{username}} --http-authentication-password {{password}} {{url}}"

 - title:
     en: arachni - scan using session cookies
     tr: arachni - oturum çerezleriyle tarama
   desc:
     en: |
       Provides a pre-authenticated cookie string to the scanner for session-based testing.
       This is the most common way to scan protected areas of an application after logging in manually in a browser.
       Ensure the session does not expire during the scan by setting a long timeout on the server or using a persistent session.
       The format should match the standard 'Cookie' HTTP header (e.g., "session_id=123; user=admin").
     tr: |
       Oturum tabanlı test için tarayıcıya önceden kimliği doğrulanmış çerez dizesi verir.
       Bu, tarayıcıda elle oturum açtıktan sonra uygulamanın korumalı alanlarını taramanın en yaygın yoludur.
       Sunucuda uzun zaman aşımı ayarlayarak veya kalıcı oturum kullanarak oturumun taramada sona ermediğinden emin olun.
       Biçim standart 'Cookie' HTTP başlığıyla eşleşmelidir (ör. "session_id=123; user=admin").
   command: "arachni --http-cookie-string \"{{cookie_string}}\" {{url}}"

 - title:
     en: arachni - scan through a proxy
     tr: arachni - vekil sunucu üzerinden tarama
   desc:
     en: |
       Routes all scanner traffic through a specified proxy server, such as Burp Suite or a SOCKS5 proxy.
       This is useful for monitoring the scanner's requests or for bypassing network restrictions via a pivot host.
       You can also specify the proxy type (e.g., socks5) if it is not a standard HTTP proxy.
       Be aware that scanning through a proxy might slow down the overall scan speed.
     tr: |
       Tüm tarayıcı trafiğini Burp Suite veya SOCKS5 vekili gibi belirtilen vekil sunucudan geçirir.
       Bu, tarayıcı isteklerini izlemek veya bir pivot host üzerinden ağ kısıtlarını aşmak için yararlıdır.
       Standart HTTP vekili değilse vekil türünü de (ör. socks5) belirtebilirsiniz.
       Vekil üzerinden taramanın genel tarama hızını yavaşlatabileceğini unutmayın.
   command: "arachni --http-proxy {{proxy_address|127.0.0.1:8080}} {{url}}"

# === ADVANCED BROWSER CLUSTER ===
 - title:
     en: arachni - scan with JavaScript/DOM support
     tr: arachni - JavaScript/DOM destekli tarama
   desc:
     en: |
       Uses a browser cluster to analyze the DOM and execute JavaScript on the target pages.
       This is essential for modern web applications (like React, Angular, or Vue) where content is rendered dynamically.
       Without this, Arachni will only see the initial static HTML and might miss many inputs and links.
       Increasing the pool size can speed up the scan but requires significantly more RAM and CPU.
     tr: |
       Hedef sayfalarda DOM'u analiz edip JavaScript çalıştırmak için tarayıcı kümesi kullanır.
       Bu, içeriğin dinamik işlendiği modern web uygulamaları (React, Angular veya Vue gibi) için gereklidir.
       Bu olmadan Arachni yalnızca ilk statik HTML'i görür ve birçok girdi ile bağlantıyı kaçırabilir.
       Havuz boyutunu artırmak taramayı hızlandırabilir ancak belirgin daha fazla RAM ve CPU gerektirir.
   command: "arachni --browser-cluster-pool-size {{pool_size|6}} --scope-dom-depth-limit {{dom_depth|5}} {{url}}"

# === REPORTING & SNAPSHOTS ===
 - title:
     en: arachni - set scan timeout and suspend
     tr: arachni - tarama zaman aşımı ve duraklatma
   desc:
     en: |
       Stops the scan automatically after a specified duration and saves a snapshot of its current state.
       The snapshot can be used later to resume the scan from exactly where it left off using 'arachni_restore'.
       This is a vital feature for pentests with strict time windows or for handling unexpected system reboots.
       The duration format is HOURS:MINUTES:SECONDS.
     tr: |
       Belirtilen süre sonunda taramayı otomatik durdurup geçerli durumun anlık görüntüsünü kaydeder.
       Anlık görüntü, 'arachni_restore' ile taramayı tam kaldığı yerden sürdürmek için daha sonra kullanılabilir.
       Bu, katı zaman pencereli sızma testleri veya beklenmedik sistem yeniden başlatmaları için hayati özelliktir.
       Süre biçimi SAAT:DAKİKA:SANİYE'dir.
   command: "arachni --timeout {{duration|01:00:00}} --timeout-suspend --snapshot-save-path {{snapshot_path|scan.snapshot}} {{url}}"
