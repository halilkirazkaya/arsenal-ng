tool: wget
tags: [network, download, utility, scraping, file-transfer, automation]

actions:
  # === BASIC FILE OPERATIONS ===
  - title:
      en: wget - basic file download
      tr: wget - temel dosya indirme
    desc:
      en: |
        Download a single file from a remote server to the current directory. 
        This is the most common use case for fetching tools, scripts, or archives. 
        The filename on the local system will match the filename in the URL by default.
      tr: |
        Uzak bir sunucudan tek bir dosyayı mevcut dizine indirir.
        Bu, araçları, betikleri veya arşivleri almak için en yaygın kullanım şeklidir.
        Yerel sistemdeki dosya adı varsayılan olarak URL'deki dosya adıyla aynı olur.
    command: "wget {{url}}"

  - title:
      en: wget - save to specific filename
      tr: wget - belirli dosya adına kaydetme
    desc:
      en: |
        Download a file and save it under a custom name locally using the -O flag. 
        This is useful when the remote URL does not represent a friendly filename or when downloading to a specific directory path. 
        Note that this will overwrite existing files with the same name without warning.
      tr: |
        Bir dosyayı indirir ve -O bayrağıyla yerel olarak özel bir adla kaydeder.
        Bu, uzak URL kolay bir dosya adı sunmadığında veya belirli bir dizin yoluna indirirken kullanışlıdır.
        Bu işlem aynı adda mevcut dosyaların üzerine uyarı vermeden yazacağını unutmayın.
    command: "wget -O {{filename|output.txt}} {{url}}"

  - title:
      en: wget - resume interrupted download
      tr: wget - kesintili indirmeyi sürdürme
    desc:
      en: |
        Continue a download that was interrupted or stopped previously. 
        Wget will check the local file size and request the remaining bytes from the server using the Range header. 
        This is essential for large files where network stability might be an issue.
      tr: |
        Daha önce kesintiye uğramış veya durdurulmuş bir indirmeye devam eder.
        Wget yerel dosya boyutunu kontrol eder ve Range başlığıyla sunucudan kalan baytları ister.
        Bu, ağ kararlılığının sorun olabileceği büyük dosyalar için gereklidir.
    command: "wget -c {{url}}"

  - title:
      en: wget - download in background
      tr: wget - arka planda indirme
    desc:
      en: |
        Start the download process in the background immediately. 
        The output is redirected to a log file (defaulting to wget-log) so you can safely close the terminal session. 
        This is ideal for long-running downloads on remote servers over SSH sessions.
      tr: |
        İndirme sürecini hemen arka planda başlatır.
        Çıktı bir günlük dosyasına (varsayılan olarak wget-log) yönlendirilir, böylece terminal oturumunu güvenle kapatabilirsiniz.
        Bu, SSH oturumları üzerinden uzak sunucularda uzun süren indirmeler için idealdir.
    command: "wget -b {{url}}"

  - title:
      en: wget - download multiple URLs from file
      tr: wget - dosyadan çoklu URL indirme
    desc:
      en: |
        Read a list of URLs from a local file and download them sequentially. 
        This is the most efficient way to handle batch downloads without writing manual loops in the terminal. 
        The input file should contain one URL per line.
      tr: |
        Yerel bir dosyadaki URL listesini okur ve bunları sırayla indirir.
        Bu, terminalde elle döngü yazmadan toplu indirme yapmanın en verimli yoludur.
        Girdi dosyası satır başına bir URL içermelidir.
    command: "wget -i {{file_path|urls.txt}}"

  # === NETWORK & PERFORMANCE ===
  - title:
      en: wget - limit download speed
      tr: wget - indirme hızını sınırlama
    desc:
      en: |
        Restrict the download speed to a specific rate to prevent bandwidth exhaustion. 
        Suffixes like 'k' for kilobytes and 'm' for megabytes are supported (e.g., 500k). 
        Use this on shared networks to ensure other applications remain responsive during large transfers.
      tr: |
        Bant genişliği tükenmesini önlemek için indirme hızını belirli bir oranla kısıtlar.
        Kilobayt için 'k', megabayt için 'm' gibi son ekler desteklenir (örn. 500k).
        Büyük aktarımlar sırasında diğer uygulamaların yanıt vermeye devam etmesi için paylaşımlı ağlarda kullanın.
    command: "wget --limit-rate={{rate|100k}} {{url}}"

  - title:
      en: wget - spider mode link check
      tr: wget - örümcek modu bağlantı kontrolü
    desc:
      en: |
        Run wget as a "spider" to check if the remote file exists without downloading it. 
        It validates the link by examining the server response headers rather than fetching the content. 
        This is frequently used in scripts to verify the availability of resources before performing tasks.
      tr: |
        Wget'i uzak dosyanın mevcut olup olmadığını indirmeden kontrol eden bir "örümcek" olarak çalıştırır.
        Bağlantıyı içeriği çekmek yerine sunucu yanıt başlıklarını inceleyerek doğrular.
        Görevlerden önce kaynakların kullanılabilirliğini doğrulamak için betiklerde sıkça kullanılır.
    command: "wget --spider {{url}}"

  - title:
      en: wget - set custom user-agent
      tr: wget - özel kullanıcı aracısı belirleme
    desc:
      en: |
        Change the User-Agent string sent to the server to mimic a specific browser. 
        Some servers block the default Wget agent to prevent automated scraping or bot activity. 
        Mimicking a common browser like Chrome or Firefox can help bypass these basic security filters.
      tr: |
        Belirli bir tarayıcıyı taklit etmek için sunucuya gönderilen User-Agent dizesini değiştirir.
        Bazı sunucular otomatik kazımayı veya bot etkinliğini engellemek için varsayılan Wget aracısını engeller.
        Chrome veya Firefox gibi yaygın bir tarayıcıyı taklit etmek bu temel güvenlik filtrelerini aşmaya yardımcı olabilir.
    command: "wget --user-agent={{user_agent|Mozilla/5.0}} {{url}}"

  # === RECURSIVE & MIRRORING ===
  - title:
      en: wget - recursive directory download
      tr: wget - özyinelemeli dizin indirme
    desc:
      en: |
        Download a directory or an entire section of a website by following links. 
        The -r flag enables recursion, and -np (no-parent) ensures the tool does not climb up to parent directories. 
        This is commonly used for offline documentation or mirroring specific subfolders of a site.
      tr: |
        Bağlantıları izleyerek bir dizini veya web sitesinin tamamını indirir.
        -r bayrağı özyinelemeyi etkinleştirir, -np (üst diziye çıkma) aracın üst dizinlere tırmanmasını engeller.
        Bu, çevrimdışı dokümanlar veya bir sitenin belirli alt klasörlerini yansıtmak için yaygın kullanılır.
    command: "wget -r -np {{url}}"

  - title:
      en: wget - full website mirror
      tr: wget - tam site yansıtma
    desc:
      en: |
        Create a local mirror of an entire website with infinite recursion and timestamping. 
        This command is a shortcut for several options including recursion, time-stamping, and infinite depth. 
        It is the most efficient way to create a static backup of a website for offline viewing.
      tr: |
        Sonsuz özyineleme ve zaman damgasıyla bir web sitesinin yerel bir aynasını oluşturur.
        Bu komut, özyineleme, zaman damgası ve sonsuz derinlik dahil çeşitli seçeneklerin kısayoludur.
        Çevrimdışı görüntüleme için bir sitenin statik yedeğini oluşturmanın en verimli yoludur.
    command: "wget -m {{url}}"

  - title:
      en: wget - mirror and convert links for offline
      tr: wget - çevrimdışı için yansıtma ve bağlantı dönüştürme
    desc:
      en: |
        Download a website and convert the links to point to local files for offline browsing. 
        The -k flag updates the HTML/CSS links, and -p ensures all requisites like images and scripts are downloaded. 
        This makes the downloaded copy behave like a local application rather than a broken web structure.
      tr: |
        Bir web sitesini indirir ve bağlantıları çevrimdışı gezinme için yerel dosyalara işaret edecek şekilde dönüştürür.
        -k bayrağı HTML/CSS bağlantılarını günceller, -p ise resim ve betikler gibi gerekli dosyaların indirilmesini sağlar.
        Bu, indirilen kopyanın bozuk bir web yapısı yerine yerel bir uygulama gibi davranmasını sağlar.
    command: "wget -m -p -E -k {{url}}"

  # === AUTHENTICATION & SECURITY ===
  - title:
      en: wget - basic http authentication
      tr: wget - temel http kimlik doğrulama
    desc:
      en: |
        Provide credentials for websites requiring Basic HTTP authentication. 
        This allows downloading from protected directories or internal private repositories. 
        Be cautious as passwords provided in the command line may be stored in your shell history.
      tr: |
        Temel HTTP kimlik doğrulaması gerektiren korumalı dizinlerden indirme için kimlik bilgileri verir.
        Bu, korumalı dizinlerden veya dahili özel depolardan indirmeye olanak tanır.
        Komut satırında verilen parolaların kabuk geçmişinize kaydedilebileceğini unutmayın, dikkatli olun.
    command: "wget --user={{username}} --password={{password}} {{url}}"

  - title:
      en: wget - ignore ssl certificate errors
      tr: wget - ssl sertifika hatalarını yoksayma
    desc:
      en: |
        Skip the validation of SSL/TLS certificates when connecting to HTTPS websites. 
        This is particularly useful for internal servers with self-signed certificates or expired credentials. 
        Warning: This makes the connection vulnerable to man-in-the-middle (MITM) attacks.
      tr: |
        HTTPS web sitelerine bağlanırken SSL/TLS sertifikalarının doğrulanmasını atlar.
        Bu, özellikle kendinden imzalı sertifikalı veya süresi dolmuş kimlik bilgili iç sunucular için kullanışlıdır.
        Uyarı: Bu, bağlantıyı ortadaki adam (MITM) saldırılarına karşı savunmasız bırakır.
    command: "wget --no-check-certificate {{url}}"

  - title:
      en: wget - use custom http header
      tr: wget - özel http başlığı kullanma
    desc:
      en: |
        Include a custom string among the HTTP headers sent to the server. 
        This can be used to pass API keys, custom authentication tokens, or specific content-type requirements. 
        Multiple headers can be added by repeating the flag for each specific header string.
      tr: |
        Sunucuya gönderilen HTTP başlıkları arasına özel bir dize ekler.
        Bu, API anahtarları, özel kimlik doğrulama jetonları veya belirli içerik türü gereksinimleri geçirmek için kullanılabilir.
        Her başlık dizesi için bayrağı tekrarlayarak birden fazla başlık eklenebilir.
    command: "wget --header={{header|Authorization: Bearer TOKEN}} {{url}}"

  # === FILE TYPE FILTERING ===
  - title:
      en: wget - download specific file types
      tr: wget - belirli dosya türlerini indirme
    desc:
      en: |
        Download only files that match a specific extension or list of extensions. 
        The -A (accept) flag takes a comma-separated list of file suffixes to keep. 
        This is very effective when you only want to extract PDFs, images, or ZIP files from a target directory.
      tr: |
        Yalnızca belirli bir uzantıya veya uzantı listesine uyan dosyaları indirir.
        -A (kabul) bayrağı tutulacak dosya son eklerinin virgülle ayrılmış listesini alır.
        Bu, hedef dizinden yalnızca PDF, resim veya ZIP dosyalarını çıkarmak istediğinizde oldukça etkilidir.
    command: "wget -r -A {{extensions|pdf,jpg,png}} {{url}}"

  - title:
      en: wget - reject specific file types
      tr: wget - belirli dosya türlerini hariç tutma
    desc:
      en: |
        Download all files from a directory except those that match specific extensions. 
        The -R (reject) flag prevents unwanted files from being saved to your local machine. 
        Use this to avoid large video files or unnecessary log files during a recursive crawl.
      tr: |
        Belirli uzantılara uyanlar hariç bir dizindeki tüm dosyaları indirir.
        -R (reddet) bayrağı istenmeyen dosyaların yerel makineye kaydedilmesini engeller.
        Özyinelemeli tarama sırasında büyük video dosyalarından veya gereksiz günlük dosyalarından kaçınmak için kullanın.
    command: "wget -r -R {{extensions|gif,mp4}} {{url}}"
