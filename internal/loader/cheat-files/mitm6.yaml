tool: mitm6
tags: [network, pentest, security, exploitation, mitm, ipv6, active-directory, dns]

actions:
  # === BASIC EXPLOITATION ===
  - title:
      en: mitm6 - basic network takeover
      tr: mitm6 - temel ağ ele geçirme
    desc:
      en: |
        Launches a basic IPv6 DNS takeover attack on the specified interface.
        This command starts listening for DHCPv6 requests and replies to them, making the attacker's machine the primary DNS server for victims.
        It is the most common starting point for internal network penetration tests where IPv6 is enabled but unconfigured.
        Ensure you are running this as root or with sudo privileges to manage network interfaces.
      tr: |
        Belirtilen arayüzde temel bir IPv6 DNS ele geçirme saldırısı başlatır.
        Bu komut DHCPv6 isteklerini dinlemeye başlar ve yanıtlayarak saldırganın makinesini kurbanlar için birincil DNS sunucusu yapar.
        IPv6'nın etkin ancak yapılandırılmamış olduğu iç ağ sızma testleri için en yaygın başlangıç noktasıdır.
        Ağ arayüzlerini yönetmek için bunu root olarak veya sudo yetkileriyle çalıştırdığınızdan emin olun.
    command: "mitm6 -i {{interface|eth0}}"

  - title:
      en: mitm6 - target specific domain
      tr: mitm6 - belirli hedef etki alanı
    desc:
      en: |
        Filters the attack to only respond to DHCPv6 and DNS requests from a specific domain.
        This is highly recommended in enterprise environments to avoid affecting guest networks or unrelated machines.
        Using the -d flag reduces the noise generated by the tool and focuses exploitation efforts on the target AD domain.
        It helps prevent unintended consequences on systems outside the assessment scope.
      tr: |
        Saldırıyı yalnızca belirli bir etki alanından gelen DHCPv6 ve DNS isteklerine yanıt verecek şekilde filtreler.
        Misafir ağları veya ilgisiz makineleri etkilemekten kaçınmak için kurumsal ortamlarda şiddetle önerilir.
        -d bayrağını kullanmak aracın ürettiği gürültüyü azaltır ve sömürü çabalarını hedef AD etki alanına odaklar.
        Değerlendirme kapsamı dışındaki sistemlerde istenmeyen sonuçların önüne geçmeye yardımcı olur.
    command: "mitm6 -i {{interface|eth0}} -d {{domain_name}}"

  # === ADVANCED RELAYING & AUTHENTICATION ===
  - title:
      en: mitm6 - relay target for credential capture
      tr: mitm6 - kimlik bilgisi yakalama için aktarma hedefi
    desc:
      en: |
        Configures a relay target hostname to trigger authentication attempts.
        This is typically used in conjunction with ntlmrelayx to capture or relay NTLM/Kerberos credentials.
        The tool will provide this fake hostname as the DNS server, forcing victims to authenticate when they attempt to connect to it.
        Note that this is one of the most effective ways to escalate privileges in a Windows environment without existing credentials.
      tr: |
        Kimlik doğrulama denemelerini tetiklemek için bir aktarma hedefi makine adı yapılandırır.
        Bu genellikle NTLM/Kerberos kimlik bilgilerini yakalamak veya aktarmak için ntlmrelayx ile birlikte kullanılır.
        Araç bu sahte makine adını DNS sunucusu olarak sunar ve kurbanları ona bağlanmaya çalışırken kimlik doğrulamaya zorlar.
        Bunun mevcut kimlik bilgileri olmadan bir Windows ortamında yetki yükseltmenin en etkili yollarından biri olduğunu unutmayın.
    command: "mitm6 -i {{interface|eth0}} -d {{domain_name}} -r {{relay_target_hostname}}"

  - title:
      en: mitm6 - attack with local domain search suffix
      tr: mitm6 - yerel etki alanı arama son ekiyle saldırı
    desc:
      en: |
        Sets a custom local domain name to be used as the DNS search domain for victims.
        This can be used to hijack short-name resolutions (e.g., 'wpad' or 'fileserver') by appending the search suffix.
        By default, mitm6 uses the first DNS domain it encounters, but manually setting this can improve reliability.
        It is particularly useful when you want to ensure victims look for resources within your controlled namespace.
      tr: |
        Kurbanlar için DNS arama etki alanı olarak kullanılacak özel bir yerel etki alanı adı ayarlar.
        Arama son ekini ekleyerek kısa ad çözümlemelerini ('wpad' veya 'fileserver' gibi) kaçırmak için kullanılabilir.
        Varsayılan olarak mitm6 karşılaştığı ilk DNS etki alanını kullanır, ancak bunu manuel ayarlamak güvenilirliği artırabilir.
        Kurbanların kaynakları denetiminizdeki ad alanı içinde aramasını sağlamak istediğinizde özellikle kullanışlıdır.
    command: "mitm6 -i {{interface|eth0}} -l {{local_domain|corp.local}}"

  # === STEALTH AND FILTERING ===
  - title:
      en: mitm6 - stealth mode (no router advertisements)
      tr: mitm6 - gizli mod (yönlendirici duyurusu yok)
    desc:
      en: |
        Disables the sending of Router Advertisements (RA) during the attack.
        Some network security solutions or "Rogue RA" protections may trigger alerts when they see unauthorized RAs on the wire.
        This mode relies exclusively on DHCPv6 responses to assign DNS settings, which is often enough for Windows targets.
        Use this flag when you need to maintain a lower profile while still performing DNS hijacking.
      tr: |
        Saldırı sırasında Yönlendirici Duyuruları (RA) gönderimini devre dışı bırakır.
        Bazı ağ güvenlik çözümleri veya "Sahte RA" korumaları hatta yetkisiz RA iletileri gördüğünde uyarı tetikleyebilir.
        Bu mod DNS ayarlarını atamak için yalnızca DHCPv6 yanıtlarına dayanır ve bu Windows hedefler için genellikle yeterlidir.
        Hâlâ DNS kaçırma yaparken daha düşük profil sürdürmeniz gerektiğinde bu bayrağı kullanın.
    command: "mitm6 -i {{interface|eth0}} -a"

  - title:
      en: mitm6 - whitelist specific hosts
      tr: mitm6 - belirli makineleri beyaz listeye alma
    desc:
      en: |
        Limits the attack to only target specific hostnames via an allowlist.
        This is crucial when you have been assigned specific targets and want to ensure no other production machines are affected.
        The -hw flag accepts FQDNs and will ignore any DHCPv6 queries from hosts not in this list.
        It provides a safe way to conduct testing on a subset of the network.
      tr: |
        Saldırıyı bir izin listesiyle yalnızca belirli makine adlarını hedefleyecek şekilde sınırlar.
        Size belirli hedefler atanmışken başka üretim makinelerinin etkilenmemesini sağlamak istediğinizde kritik öneme sahiptir.
        -hw bayrağı FQDN kabul eder ve bu listede olmayan makinelerden gelen DHCPv6 sorgularını yoksayar.
        Ağın bir alt kümesinde güvenli test yapmanın bir yolunu sağlar.
    command: "mitm6 -i {{interface|eth0}} -hw {{target_hostname}}"

  - title:
      en: mitm6 - blacklist sensitive hosts
      tr: mitm6 - hassas makineleri kara listeye alma
    desc:
      en: |
        Prevents the tool from responding to requests from specific sensitive hosts.
        This is best used to protect Domain Controllers or critical servers from being accidentally disrupted by DNS changes.
        The -hb flag ensures that the specified machines will continue using their legitimate DNS settings.
        Always verify critical infrastructure hostnames before starting a wide-scale mitm6 attack.
      tr: |
        Aracın belirli hassas makinelerden gelen isteklere yanıt vermesini engeller.
        Etki Alanı Denetleyicilerini veya kritik sunucuları DNS değişiklikleriyle kazara aksatmaktan korumak için en iyi kullanımdır.
        -hb bayrağı belirtilen makinelerin meşru DNS ayarlarını kullanmaya devam etmesini sağlar.
        Geniş ölçekli bir mitm6 saldırısı başlatmadan önce kritik altyapı makine adlarını mutlaka doğrulayın.
    command: "mitm6 -i {{interface|eth0}} -hb {{sensitive_hostname}}"

  - title:
      en: mitm6 - ignore non-FQDN queries
      tr: mitm6 - FQDN olmayan sorguları yoksayma
    desc:
      en: |
        Configures the tool to ignore DHCPv6 queries that do not contain a Fully Qualified Domain Name (FQDN).
        This filter helps in reducing processing overhead and ignoring "noisy" or irrelevant traffic from devices not joined to a domain.
        It ensures that the tool focuses on professional workstations and servers that are likely to provide useful credentials.
        This is a common cleanup option for long-running sessions.
      tr: |
        Aracı Tam Nitelikli Etki Alanı Adı (FQDN) içermeyen DHCPv6 sorgularını yoksayacak şekilde yapılandırır.
        Bu filtre işlem yükünü azaltmaya ve etki alanına katılmamış cihazlardan gelen "gürültülü" veya ilgisiz trafiği yoksaymaya yardımcı olur.
        Aracın yararlı kimlik bilgileri sağlaması muhtemel kurumsal iş istasyonlarına ve sunuculara odaklanmasını sağlar.
        Uzun süreli oturumlar için yaygın bir temizleme seçeneğidir.
    command: "mitm6 -i {{interface|eth0}} --ignore-nofqdn"

  # === DEBUGGING ===
  - title:
      en: mitm6 - verbose debug output
      tr: mitm6 - ayrıntılı hata ayıklama çıktısı
    desc:
      en: |
        Runs the tool with maximum verbosity and debugging information enabled.
        Use this if you suspect the attack is not working as expected or if clients are not receiving IPv6 addresses.
        It displays detailed packet information and internal logic decisions made by the tool.
        Be aware that this will generate a large amount of terminal output in busy networks.
      tr: |
        Aracı en yüksek ayrıntı düzeyi ve hata ayıklama bilgisi etkin şekilde çalıştırır.
        Saldırının beklendiği gibi çalışmadığından şüpheleniyorsanız veya istemciler IPv6 adresleri almıyorsa bunu kullanın.
        Ayrıntılı paket bilgisini ve aracın verdiği dahili mantık kararlarını görüntüler.
        Yoğun ağlarda bunun büyük miktarda terminal çıktısı üreteceğini unutmayın.
    command: "mitm6 -i {{interface|eth0}} -v --debug"
