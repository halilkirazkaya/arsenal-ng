tool: aircrack-ng
tags: [wireless, security, pentest, wifi, enumeration, exploitation, cracking]

actions:
# === INTERFACE MANAGEMENT ===

 - title:
     en: airmon-ng - check and kill interfering processes
     tr: airmon-ng - çakışan işlemleri denetle ve sonlandır
   desc:
     en: |
       Identifies and terminates background processes that could interfere with the wireless card's monitor mode.
       Processes like NetworkManager, dhclient, and wpa_supplicant often try to manage the interface, causing issues during packet injection.
       Running this command is a highly recommended first step before starting any wireless assessment to ensure stability.
     tr: |
       Kablosuz kartın izleme kipine engel olabilecek arka plan işlemlerini tespit edip sonlandırır.
       NetworkManager, dhclient ve wpa_supplicant gibi işlemler arayüzü yönetmeye çalışarak paket enjeksiyonunda sorun çıkarır.
       Bu komutu çalıştırmak, kararlılık için her kablosuz değerlendirmeden önce şiddetle önerilen ilk adımdır.
   command: "airmon-ng check kill"

 - title:
     en: airmon-ng - start monitor mode
     tr: airmon-ng - izleme kipini başlat
   desc:
     en: |
       Enables monitor mode on a specific wireless interface, allowing the card to listen to all traffic on a channel.
       The command usually creates a new logical interface named with a 'mon' suffix (e.g., wlan0mon).
       You can optionally specify a channel to lock the interface to that frequency immediately.
     tr: |
       Belirli bir kablosuz arayüzde izleme kipini etkinleştirerek kartın kanaldaki tüm trafiği dinlemesini sağlar.
       Komut genellikle 'mon' son ekli yeni bir mantıksal arayüz oluşturur (ör. wlan0mon).
       Arayüzü hemen o frekansa kilitlemek için isteğe bağlı olarak kanal belirtebilirsiniz.
   command: "airmon-ng start {{interface|wlan0}} {{channel}}"

 - title:
     en: airmon-ng - stop monitor mode
     tr: airmon-ng - izleme kipini durdur
   desc:
     en: |
       Disables monitor mode and returns the wireless interface to managed mode.
       This is used to clean up after an assessment or to restore standard network connectivity.
       It removes the monitor mode virtual interface and re-enables the original hardware interface state.
     tr: |
       İzleme kipini devre dışı bırakıp kablosuz arayüzü yönetilen kipe döndürür.
       Bu, değerlendirme sonrası temizlik veya standart ağ bağlantısını geri yüklemek için kullanılır.
       İzleme kipi sanal arayüzünü kaldırır ve özgün donanım arayüzü durumunu yeniden etkinleştirir.
   command: "airmon-ng stop {{interface|wlan0mon}}"

# === RECONNAISSANCE & CAPTURE ===

 - title:
     en: airodump-ng - general network scanning
     tr: airodump-ng - genel ağ taraması
   desc:
     en: |
       Performs a wide-area scan of all nearby access points and connected stations.
       It displays critical information such as BSSID, signal strength (PWR), beacons, data packets, channel, and encryption type.
       This tool is essential for identifying targets and seeing which clients are associated with which networks.
     tr: |
       Yakındaki tüm erişim noktalarının ve bağlı istemcilerin geniş alan taramasını yapar.
       BSSID, sinyal gücü (PWR), beacon, veri paketleri, kanal ve şifreleme türü gibi kritik bilgileri gösterir.
       Bu araç, hedefleri belirlemek ve hangi istemcinin hangi ağla ilişkili olduğunu görmek için gereklidir.
   command: "airodump-ng {{interface|wlan0mon}}"

 - title:
     en: airodump-ng - targeted handshake capture
     tr: airodump-ng - hedefli el sıkışma yakalama
   desc:
     en: |
       Focuses the capture on a specific Access Point (BSSID) on a single channel to capture the WPA/WPA2 4-way handshake.
       Limiting the scan to one channel increases the probability of capturing the handshake frames without missing them due to channel hopping.
       The captured data is saved to a file prefix, which will generate several files including a .cap file used for cracking.
     tr: |
       WPA/WPA2 4'lü el sıkışmayı yakalamak için yakalamayı tek kanalda belirli bir Erişim Noktasına (BSSID) odaklar.
       Taramayı tek kanalla sınırlamak, kanal atlama yüzünden kaçırmadan el sıkışma çerçevelerini yakalama olasılığını artırır.
       Yakalanan veri bir dosya önekine kaydedilir; kırma için kullanılan .cap dahil birkaç dosya üretir.
   command: "airodump-ng -c {{channel}} --bssid {{bssid}} -w {{file_prefix}} {{interface|wlan0mon}}"

 - title:
     en: airodump-ng - manufacturer lookup
     tr: airodump-ng - üretici sorgulama
   desc:
     en: |
       Displays the manufacturer of the Access Points and Stations based on the IEEE OUI list.
       This helps identify the type of hardware being used (e.g., Cisco, Apple, TP-Link) which can be useful for tailoring attacks.
       Ensure you run airodump-ng-oui-update periodically to keep the manufacturer database current.
     tr: |
       IEEE OUI listesine göre Erişim Noktalarının ve İstasyonların üreticisini gösterir.
       Bu, kullanılan donanım türünü (ör. Cisco, Apple, TP-Link) belirlemeye yardımcı olur; saldırıları uyarlamakta yararlı olabilir.
       Üretici veritabanını güncel tutmak için airodump-ng-oui-update komutunu düzenli çalıştırın.
   command: "airodump-ng --manufacturer {{interface|wlan0mon}}"

# === ATTACK & INJECTION ===

 - title:
     en: aireplay-ng - injection test
     tr: aireplay-ng - enjeksiyon testi
   desc:
     en: |
       Tests the wireless card's ability to inject packets into the air and determines the response rate from nearby APs.
       A successful injection test is mandatory before attempting more complex attacks like deauthentication or ARP replay.
       It provides a percentage of successfully received responses, indicating the quality of the connection.
     tr: |
       Kablosuz kartın havaya paket enjekte etme yeteneğini test eder ve yakındaki AP'lerden yanıt oranını belirler.
       Kimlik doğrulamasını düşürme veya ARP tekrarı gibi karmaşık saldırılara girişmeden önce başarılı enjeksiyon testi zorunludur.
       Bağlantı kalitesini gösteren başarılı yanıt yüzdesi verir.
   command: "aireplay-ng -9 {{interface|wlan0mon}}"

 - title:
     en: aireplay-ng - deauthentication attack
     tr: aireplay-ng - kimlik doğrulamasını düşürme saldırısı
   desc:
     en: |
       Sends deauthentication frames to one or more clients associated with an Access Point.
       This forces the clients to disconnect and attempt to reconnect, which allows airodump-ng to capture the 4-way handshake.
       Be careful as this causes a service disruption for the target; always ensure you have permission before use.
     tr: |
       Erişim Noktasıyla ilişkili bir veya daha çok istemciye kimlik doğrulamasını düşürme çerçeveleri gönderir.
       Bu, istemcileri bağlantıyı kesip yeniden bağlanmaya zorlar; böylece airodump-ng 4'lü el sıkışmayı yakalayabilir.
       Hedefte hizmet kesintisine yol açtığı için dikkatli olun; kullanmadan önce izniniz olduğundan emin olun.
   command: "aireplay-ng -0 {{count|5}} -a {{bssid}} -c {{client_mac}} {{interface|wlan0mon}}"

 - title:
     en: aireplay-ng - fake authentication
     tr: aireplay-ng - sahte kimlik doğrulama
   desc:
     en: |
       Performs a fake authentication with an Access Point to allow further packet injection.
       This is primarily used in WEP attacks where you need an associated MAC address to inject packets, but no real clients are connected.
       It does not actually "crack" the password but tricks the AP into thinking a client is successfully connected.
     tr: |
       Daha fazla paket enjeksiyonuna izin vermek için Erişim Noktasıyla sahte kimlik doğrulama yapar.
       Bu, paket enjekte etmek için ilişkili bir MAC adresi gerektiğinde ama gerçek istemci bağlı olmadığında WEP saldırılarında kullanılır.
       Parolayı gerçekten "kırmaz"; AP'yi bir istemcinin bağlı olduğuna inandırır.
   command: "aireplay-ng -1 0 -e {{essid}} -a {{bssid}} -h {{my_mac}} {{interface|wlan0mon}}"

 - title:
     en: aireplay-ng - ARP request replay
     tr: aireplay-ng - ARP isteği tekrarı
   desc:
     en: |
       Listens for an ARP packet and then replays it back to the Access Point to generate new IVs (Initialization Vectors).
       This is the classic method for speeding up WEP cracking by forcing the AP to produce many encrypted packets quickly.
       You typically need thousands of IVs to successfully crack a WEP key.
     tr: |
       Bir ARP paketini dinleyip yeni IV'ler (Başlatma Vektörleri) üretmek için Erişim Noktasına geri tekrarlar.
       Bu, AP'yi hızla çok sayıda şifreli paket üretmeye zorlayarak WEP kırmayı hızlandıran klasik yöntemdir.
       WEP anahtarını başarıyla kırmak için genellikle binlerce IV gerekir.
   command: "aireplay-ng -3 -b {{bssid}} -h {{my_mac}} {{interface|wlan0mon}}"

# === CRACKING ===

 - title:
     en: aircrack-ng - crack WPA/WPA2 with wordlist
     tr: aircrack-ng - kelime listesiyle WPA/WPA2 kırma
   desc:
     en: |
       Attempts to find the pre-shared key (PSK) of a WPA/WPA2 network using a dictionary attack.
       The tool requires a capture file containing a valid 4-way handshake and a high-quality wordlist.
       Performance depends on CPU speed, but can be significantly boosted using pre-computed PMK databases.
     tr: |
       Sözlük saldırısıyla bir WPA/WPA2 ağının ön paylaşımlı anahtarını (PSK) bulmaya çalışır.
       Araç, geçerli bir 4'lü el sıkışma içeren yakalama dosyası ve kaliteli bir kelime listesi gerektirir.
       Performans CPU hızına bağlıdır, ancak önceden hesaplanmış PMK veritabanlarıyla belirgin şekilde artırılabilir.
   command: "aircrack-ng -w {{wordlist|/usr/share/wordlists/rockyou.txt}} -b {{bssid}} {{capture_file.cap}}"

 - title:
     en: aircrack-ng - crack WEP key
     tr: aircrack-ng - WEP anahtarı kırma
   desc:
     en: |
       Analyzes captured Initialization Vectors (IVs) to statistically determine the WEP key.
       Unlike WPA, WEP cracking does not require a wordlist as it exploits mathematical vulnerabilities in the RC4 cipher.
       The more IVs you capture using aireplay-ng, the higher the chance of a successful crack.
     tr: |
       Yakalanan Başlatma Vektörlerini (IV) analiz ederek WEP anahtarını istatistiksel olarak belirler.
       WPA'den farklı olarak WEP kırma, RC4 şifresindeki matematiksel zafiyetleri kullandığı için kelime listesi gerektirmez.
       aireplay-ng ile ne kadar çok IV yakalarsanız başarılı kırma şansı o kadar artar.
   command: "aircrack-ng -b {{bssid}} {{capture_file.cap}}"

# === ADVANCED UTILITIES ===

 - title:
     en: airbase-ng - create fake access point
     tr: airbase-ng - sahte erişim noktası oluşturma
   desc:
     en: |
       Simulates an Access Point to perform Evil Twin attacks or "Caffe Latte" attacks against clients.
       It creates a virtual tunnel interface (at0) which can be used to redirect traffic or serve as a gateway for MITM attacks.
       This tool is highly versatile for attacking wireless clients rather than the infrastructure itself.
     tr: |
       İstemcilere karşı Evil Twin veya "Caffe Latte" saldırıları için Erişim Noktası taklit eder.
       Trafiği yönlendirmek veya MITM saldırılarında ağ geçidi olarak kullanılabilen sanal tünel arayüzü (at0) oluşturur.
       Bu araç, altyapı yerine kablosuz istemcileri hedef almada oldukça çok yönlüdür.
   command: "airbase-ng -e {{essid}} -c {{channel}} {{interface|wlan0mon}}"

 - title:
     en: airolib-ng - pre-calculate PMK database
     tr: airolib-ng - PMK veritabanını önceden hesaplama
   desc:
     en: |
       Manages a database of ESSIDs and passwords to pre-calculate Pairwise Master Keys (PMKs).
       Pre-calculating PMKs allows aircrack-ng to process thousands of passwords per second during a WPA attack, as the heavy computation is done beforehand.
       This is a three-step process: import ESSIDs, import passwords, and then run the batch calculation.
     tr: |
       İkili Ana Anahtarları (PMK) önceden hesaplamak için ESSID ve parola veritabanını yönetir.
       PMK'leri önceden hesaplamak, ağır işlem önceden yapıldığından aircrack-ng'nin WPA saldırısında saniyede binlerce parola işlemesini sağlar.
       Bu üç adımlı süreçtir: ESSID'leri içe aktar, parolaları içe aktar, ardından toplu hesaplamayı çalıştır.
   command: "airolib-ng {{db_name}} --batch"

 - title:
     en: wpaclean - clean pcap for cracking
     tr: wpaclean - kırma için pcap temizleme
   desc:
     en: |
       Extracts only the essential 4-way handshake packets from a large pcap file and removes all other traffic.
       This results in a much smaller file size, making it easier to share or upload to cloud cracking services.
       It is a best practice to clean capture files before starting long brute-force sessions.
     tr: |
       Büyük bir pcap dosyasından yalnızca gerekli 4'lü el sıkışma paketlerini çıkarıp diğer tüm trafiği kaldırır.
       Bu çok daha küçük dosya boyutu sağlar; bulut kırma servisleriyle paylaşmayı veya yüklemeyi kolaylaştırır.
       Uzun kaba kuvvet oturumlarına başlamadan önce yakalama dosyalarını temizlemek en iyi uygulamadır.
   command: "wpaclean {{output.cap}} {{input.cap}}"

 - title:
     en: airdecap-ng - decrypt capture files
     tr: airdecap-ng - yakalama dosyalarının şifresini çözme
   desc:
     en: |
       Decrypts WEP, WPA, or WPA2 capture files once the key or passphrase is known.
       This allows you to view the actual network traffic (HTTP, DNS, etc.) inside a pcap analyzer like Wireshark.
       It creates a new file with a '-dec' suffix containing the decrypted packets.
     tr: |
       Anahtar veya parola bilindiğinde WEP, WPA veya WPA2 yakalama dosyalarının şifresini çözer.
       Bu, Wireshark gibi bir pcap analizöründe gerçek ağ trafiğini (HTTP, DNS vb.) görmenizi sağlar.
       Şifresi çözülmüş paketleri içeren '-dec' son ekli yeni bir dosya oluşturur.
   command: "airdecap-ng -e {{essid}} -p {{passphrase}} {{capture_file.cap}}"

 - title:
     en: besside-ng - automated WPA handshake capture
     tr: besside-ng - otomatik WPA el sıkışma yakalama
   desc:
     en: |
       An automated tool that attempts to deauthenticate all nearby clients and capture WPA handshakes without user intervention.
       It is extremely effective for "war-driving" or rapid assessment of multiple networks in range.
       The handshakes are automatically saved to a file named 'wpa.cap' in the working directory.
     tr: |
       Kullanıcı müdahalesi olmadan yakındaki tüm istemcilerin bağlantısını düşürüp WPA el sıkışmalarını yakalamaya çalışan otomatik araçtır.
       "War-driving" veya menzildeki birden çok ağın hızlı değerlendirilmesi için son derece etkilidir.
       El sıkışmalar çalışma dizininde 'wpa.cap' adlı dosyaya otomatik kaydedilir.
   command: "besside-ng -W {{interface|wlan0mon}}"

 - title:
     en: airgraph-ng - visualize network relationships
     tr: airgraph-ng - ağ ilişkilerini görselleştirme
   desc:
     en: |
       Generates a visual graph (PNG) showing the relationships between Access Points and Clients from an airodump-ng CSV file.
       It helps in identifying which clients are probing for which networks and the overall structure of the wireless environment.
       Supports two types of graphs: CAPR (Client to AP Relationship) and CPG (Common Probe Graph).
     tr: |
       Bir airodump-ng CSV dosyasından Erişim Noktaları ile İstemciler arasındaki ilişkileri gösteren görsel grafik (PNG) üretir.
       Hangi istemcilerin hangi ağları yokladığını ve kablosuz ortamın genel yapısını belirlemeye yardımcı olur.
       İki grafik türünü destekler: CAPR (İstemciden AP'ye İlişki) ve CPG (Ortak Yoklama Grafiği).
   command: "airgraph-ng -i {{airodump_csv}} -o {{output_image.png}} -g CAPR"
