tool: netdiscover
tags: [network, reconnaissance, arp, scanner, pentest, sniffing, security]

actions:
  # === RECONNAISSANCE & SCANNING ===

  - title:
      en: netdiscover - basic auto scan
      tr: netdiscover - temel otomatik tarama
    desc:
      en: |
        Performs an automatic scan of common private network ranges (192.168.0.0/16, 172.16.0.0/12, 10.0.0.0/8).
        This is highly effective when you are connected to a network but do not know the local IP addressing scheme.
        Note that this tool requires root or sudo privileges because it utilizes raw sockets to craft and send ARP packets.
        It will continue to run and update the list as new devices are discovered until manually stopped.
      tr: |
        Yaygın özel ağ aralıklarının (192.168.0.0/16, 172.16.0.0/12, 10.0.0.0/8) otomatik taramasını gerçekleştirir.
        Bir ağa bağlıyken yerel IP adresleme şemasını bilmediğinizde oldukça etkilidir.
        Ham soketlerle ARP paketi oluşturup gönderdiği için bu aracın root veya sudo yetkileri gerektirdiğini unutmayın.
        Manuel durdurulana kadar çalışmaya devam eder ve yeni cihazlar keşfedildikçe listeyi günceller.
    command: "netdiscover"

  - title:
      en: netdiscover - scan specific IP range
      tr: netdiscover - belirli IP aralığını tarama
    desc:
      en: |
        Scans a specific CIDR range provided by the user to identify active hosts.
        This is the most common way to perform targeted discovery within a known subnet like 192.168.1.0/24.
        Using a specific range is much faster than the default auto-scan mode and generates less noise on the network.
        The results will display the IP address, MAC address, MAC vendor, and the number of packets received.
      tr: |
        Etkin makineleri belirlemek için kullanıcı tarafından verilen belirli bir CIDR aralığını tarar.
        192.168.1.0/24 gibi bilinen bir alt ağda hedefli keşif yapmanın en yaygın yoludur.
        Belirli bir aralık kullanmak varsayılan otomatik tarama modundan çok daha hızlıdır ve ağda daha az gürültü üretir.
        Sonuçlar IP adresini, MAC adresini, MAC üreticisini ve alınan paket sayısını görüntüler.
    command: "netdiscover -r {{range}}"

  - title:
      en: netdiscover - passive listening mode
      tr: netdiscover - pasif dinleme modu
    desc:
      en: |
        Enables passive mode where the tool does not send any ARP requests to the network.
        It acts as a silent sniffer, identifying hosts solely by monitoring the ARP traffic generated by other devices.
        This is the most stealthy method of reconnaissance as it leaves no footprint and cannot be detected by basic IDS.
        It is particularly useful in red teaming scenarios where active scanning might trigger security alerts.
      tr: |
        Aracın ağa hiç ARP isteği göndermediği pasif modu etkinleştirir.
        Diğer cihazların ürettiği ARP trafiğini izleyerek makineleri belirleyen sessiz bir dinleyici gibi davranır.
        İz bırakmadığı ve temel IDS tarafından tespit edilemediği için en gizli keşif yöntemidir.
        Etkin taramanın güvenlik uyarılarını tetikleyebileceği kırmızı takım senaryolarında özellikle kullanışlıdır.
    command: "netdiscover -p"

  - title:
      en: netdiscover - specify network interface
      tr: netdiscover - ağ arayüzü belirtme
    desc:
      en: |
        Forces netdiscover to use a specific network interface for its operations.
        This is necessary when your machine has multiple network cards, such as a wired ethernet connection and a wireless adapter.
        Specifying the interface ensures that ARP requests are sent out through the correct physical or virtual gateway.
        Common interface names include eth0, wlan0, or tap0 depending on your environment.
      tr: |
        Netdiscover'ı işlemleri için belirli bir ağ arayüzü kullanmaya zorlar.
        Makinenizde kablolu ethernet ve kablosuz bağdaştırıcı gibi birden fazla ağ kartı olduğunda gereklidir.
        Arayüzü belirtmek ARP isteklerinin doğru fiziksel veya sanal ağ geçidinden gönderilmesini sağlar.
        Ortamınıza göre yaygın arayüz adları eth0, wlan0 veya tap0 içerir.
    command: "netdiscover -i {{interface|eth0}}"

  # === PERFORMANCE & OPTIMIZATION ===

  - title:
      en: netdiscover - enable fast mode
      tr: netdiscover - hızlı modu etkinleştirme
    desc:
      en: |
        Runs the ARP sweep in fast mode which significantly reduces the total scanning time.
        It is recommended for initial reconnaissance where speed is prioritized over thoroughness.
        Fast mode works by optimizing the internal timing of packet transmissions during the discovery process.
        Be aware that in very large or congested networks, high speed might lead to missing some hosts that respond slowly.
      tr: |
        ARP taramasını toplam tarama süresini önemli ölçüde azaltan hızlı modda çalıştırır.
        Hızın kapsamlılığa göre öncelikli olduğu ilk keşif için önerilir.
        Hızlı mod, keşif sürecinde paket iletimlerinin dahili zamanlamasını optimize ederek çalışır.
        Çok büyük veya tıkalı ağlarda yüksek hızın yavaş yanıt veren bazı makinelerin kaçırılmasına yol açabileceğini unutmayın.
    command: "netdiscover -r {{range}} -f"

  - title:
      en: netdiscover - custom timing and retries
      tr: netdiscover - özel zamanlama ve yeniden denemeler
    desc:
      en: |
        Allows fine-tuning of the scan speed and reliability by setting custom sleep times and retry counts.
        The -s flag sets the delay in milliseconds between each ARP request, while -c sets how many times each request is repeated.
        Increasing the count (default is 1) helps in discovering hosts on unreliable networks with high packet loss.
        Decreasing the sleep time makes the scan faster but may overwhelm small network devices or trigger flood protections.
      tr: |
        Özel bekleme süreleri ve yeniden deneme sayıları ayarlayarak tarama hızı ve güvenilirliğinde ince ayar yapmaya olanak tanır.
        -s bayrağı her ARP isteği arasındaki gecikmeyi milisaniye cinsinden ayarlarken -c her isteğin kaç kez yineleneceğini ayarlar.
        Sayıyı artırmak (varsayılan 1) paket kaybı yüksek güvenilmez ağlardaki makineleri keşfetmeye yardımcı olur.
        Bekleme süresini azaltmak taramayı hızlandırır ancak küçük ağ cihazlarını zorlayabilir veya taşma korumalarını tetikleyebilir.
    command: "netdiscover -r {{range}} -s {{sleep_ms|100}} -c {{count|3}}"

  - title:
      en: netdiscover - hardcore sleep suppression
      tr: netdiscover - hardcore bekleme bastırma
    desc:
      en: |
        Enables "hardcore mode" by suppressing the sleep time between each ARP request.
        This will send packets as fast as the system and network interface can handle them.
        Use this with caution as it is extremely noisy and might be interpreted as a Denial of Service (DoS) attempt by some network monitors.
        It is primarily used for stress testing or very rapid discovery in controlled environments.
      tr: |
        Her ARP isteği arasındaki bekleme süresini bastırarak "hardcore modunu" etkinleştirir.
        Paketleri sistemin ve ağ arayüzünün işleyebildiği hızda gönderir.
        Son derece gürültülü olduğundan ve bazı ağ izleyicilerce Hizmet Dışı Bırakma (DoS) saldırısı olarak yorumlanabileceğinden dikkatli kullanın.
        Öncelikle denetimli ortamlarda stres testi veya çok hızlı keşif için kullanılır.
    command: "netdiscover -r {{range}} -S"

  # === INPUT & OUTPUT MANAGEMENT ===

  - title:
      en: netdiscover - scan ranges from file
      tr: netdiscover - dosyadan aralık tarama
    desc:
      en: |
        Reads a list of target IP ranges from a text file and scans them one by one.
        The file should contain one range per line in standard CIDR notation or range format.
        This is ideal for large-scale assessments where you need to scan multiple non-contiguous subnets automatically.
        It helps in maintaining a structured workflow by keeping target lists organized in external files.
      tr: |
        Hedef IP aralıklarının listesini bir metin dosyasından okur ve tek tek tarar.
        Dosya satır başına standart CIDR gösterimi veya aralık biçiminde bir aralık içermelidir.
        Bitişik olmayan birden fazla alt ağı otomatik taramanız gereken geniş ölçekli değerlendirmeler için idealdir.
        Hedef listelerini harici dosyalarda düzenli tutarak yapılandırılmış iş akışını sürdürmeye yardımcı olur.
    command: "netdiscover -l {{file_path}}"

  - title:
      en: netdiscover - parsable output for scripting
      tr: netdiscover - betikleme için ayrıştırılabilir çıktı
    desc:
      en: |
        Formats the scan results into a simplified, machine-readable output that is easy to parse with other tools like grep, awk, or custom scripts.
        The -P flag ensures the tool prints the results and exits immediately after the active scan is completed.
        This is essential for automation and integrating netdiscover into a larger reconnaissance pipeline.
        Adding the -N flag can further simplify output by removing the header information.
      tr: |
        Tarama sonuçlarını grep, awk veya özel betikler gibi araçlarla kolayca ayrıştırılabilen basitleştirilmiş, makinece okunabilir çıktıya biçimlendirir.
        -P bayrağı aracın sonuçları yazdırıp etkin tarama tamamlandıktan hemen sonra çıkmasını sağlar.
        Otomasyon ve netdiscover'ı daha büyük bir keşif hattına entegre etmek için gereklidir.
        -N bayrağını eklemek başlık bilgisini kaldırarak çıktıyı daha da basitleştirebilir.
    command: "netdiscover -r {{range}} -P"

  - title:
      en: netdiscover - scan with known MAC list
      tr: netdiscover - bilinen MAC listesiyle tarama
    desc:
      en: |
        Uses a file containing known MAC addresses and hostnames to help identify devices during the scan.
        This allows the tool to map discovered hardware addresses to specific, user-defined labels.
        It is very helpful in enterprise environments where you want to distinguish between known assets and rogue devices.
        The mapping file should follow the format required by netdiscover to ensure correct identification.
      tr: |
        Tarama sırasında cihazları belirlemeye yardımcı olmak için bilinen MAC adresleri ve makine adları içeren bir dosya kullanır.
        Bu, aracın keşfedilen donanım adreslerini belirli, kullanıcı tanımlı etiketlere eşlemesine olanak tanır.
        Bilinen varlıkları başıboş cihazlardan ayırt etmek istediğiniz kurumsal ortamlarda çok yardımcıdır.
        Eşleme dosyası doğru tanımlama için netdiscover'ın gerektirdiği biçimi izlemelidir.
    command: "netdiscover -r {{range}} -m {{mac_file}}"
