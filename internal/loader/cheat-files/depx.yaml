tool: depx
tags: [security, supply-chain, audit, malware, pentest, enumeration, dependencies]

actions:
# === INTELLIGENCE FEED & DASHBOARD ===

 - title: depx - intelligence dashboard
   desc: |
     Display the intelligence dashboard for recently disclosed malicious packages. 
     This view provides a high-level summary of threats detected within a specific time window, defaulting to the last 3 days. 
     It is the primary way to stay updated on emerging supply-chain attacks across various ecosystems like npm, PyPI, and Go.
   command: "depx --since {{time_window|3d}}"

 - title: depx - ecosystem filtered feed
   desc: |
     View a filtered list of malicious packages for a specific ecosystem. 
     This is useful when you only care about threats relevant to your specific tech stack, such as npm or Python. 
     The --list flag simplifies the output to a single header line per result for easier skimming.
   command: "depx feed -e {{ecosystem|npm}} --list"

# === LOCAL AUDITING ===

 - title: depx - sweep home directory
   desc: |
     Perform a broad audit of the current user's home directory for malicious dependencies. 
     The tool automatically searches for lockfiles and project trees (npm, PyPI, Go, Cargo, etc.) and compares them against a local index. 
     This is a highly efficient way to check all local development projects and global installs for supply-chain risks.
   command: "depx audit"

 - title: depx - audit specific project
   desc: |
     Scan a specific project directory or a single SBOM/lockfile for known malicious packages. 
     You can point this command at a folder containing a package-lock.json or a standalone CycloneDX/SPDX file. 
     It is the standard method for verifying the safety of a specific application's dependency tree before deployment.
   command: "depx audit {{target_path}}"

 - title: depx - audit with exclusions
   desc: |
     Scan a project while ignoring specific packages known to be safe or internal. 
     The exclusion file should contain "ecosystem:package" entries to prevent false positives from halting your workflow. 
     Use this when your organization uses internal tools that might share names with flagged packages or when a specific finding has been manually triaged.
   command: "depx audit {{target_path}} --exclude-pkg {{ignore_file|.depxignore}}"

# === CI/CD & PIPELINE INTEGRATION ===

 - title: depx - CI gate audit
   desc: |
     Run a dependency audit that fails the build if any malicious package is discovered. 
     The --require-clean flag ensures the process exits with a non-zero code upon finding a threat, making it perfect for CI/CD pipelines. 
     Pairing this with JSON output allows for automated processing of the security findings by other tools in your pipeline.
   command: "depx audit {{project_path}} --require-clean -j"

 - title: depx - export audit reports
   desc: |
     Generate detailed security reports in multiple formats including JSON, CSV, and SARIF. 
     SARIF exports are particularly useful for integrating findings into GitHub Code Scanning or other vulnerability management platforms. 
     You can also generate an audited SBOM (Software Bill of Materials) for compliance and documentation purposes.
   command: "depx audit {{target}} --output {{output_name|report}} --output-format {{format|json,csv}} --sarif-export {{sarif_path|results.sarif}}"

# === GITHUB REPOSITORY AUDITING ===

 - title: depx - audit GitHub repository
   desc: |
     Scan a public or private GitHub repository using the GitHub Dependency Graph API. 
     This allows you to check remote projects for malicious dependencies without cloning the code locally. 
     Ensure the GITHUB_TOKEN environment variable is set to access private repositories or to avoid rate-limiting issues.
   command: "depx github {{owner_repo|projectdiscovery/depx}}"

 - title: depx - audit GitHub organization
   desc: |
     Perform a bulk audit of all repositories within a specific GitHub organization or user account. 
     This is an essential command for security teams looking to monitor the supply-chain health of an entire organization's codebase. 
     By default, it scans a limited number of repositories unless a higher limit is specified with the -n flag.
   command: "depx github {{org_name}} -n {{limit|100}}"

# === SEARCH & LOOKUP ===

 - title: depx - search malicious packages
   desc: |
     Search the local malicious package index for specific package names or keywords. 
     This is helpful for checking if a package you are considering using has a known history of malicious activity. 
     The search covers all supported ecosystems unless restricted by global flags.
   command: "depx search {{query}}"

 - title: depx - lookup specific package
   desc: |
     Check a specific package name and ecosystem to see if it is flagged as malicious. 
     The input format should be "ecosystem:package_name" to ensure the lookup is precise. 
     It provides immediate feedback on whether the package is currently considered clean or malicious in the database.
   command: "depx {{ecosystem_package|npm:lodash}}"

 - title: depx - lookup advisory ID
   desc: |
     Retrieve detailed information about a specific security advisory using its ID (e.g., MAL ID). 
     This is useful for investigating the specifics of a threat, such as the publication date and the nature of the malicious code. 
     Use the --raw flag if you need the original OSV record for programmatic analysis.
   command: "depx id {{advisory_id}}"

# === MAINTENANCE ===

 - title: depx - update tool and database
   desc: |
     Update the depx binary and its local malicious package index to the latest available version. 
     Regular updates are critical because new malicious packages are discovered and added to the database daily. 
     Running this command ensures your audits are performed against the most current threat intelligence.
   command: "depx update"