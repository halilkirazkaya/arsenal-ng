tool: lsassy
tags: [active-directory, credential-dumping, pentest, security, lsass, windows, exploitation, post-exploitation]

actions:
  # === AUTHENTICATION METHODS ===
  - title:
      en: lsassy - dump lsass using domain credentials
      tr: lsassy - etki alanı kimlik bilgileriyle lsass dökümü
    desc:
      en: |
        Extract credentials from remote hosts using standard domain authentication. This is the primary method for retrieving passwords and hashes when you have valid administrative domain credentials. The tool will target the LSASS process on the remote machine and attempt to pull credentials remotely. Ensure you have administrative rights on the target systems for this to function.
      tr: |
        Standart etki alanı kimlik doğrulaması kullanarak uzak makinelerden kimlik bilgilerini çıkarın. Geçerli yönetici etki alanı kimlik bilgilerine sahipken parola ve karma almak için birincil yöntemdir. Araç uzak makinedeki LSASS sürecini hedefler ve kimlik bilgilerini uzaktan çekmeye çalışır. Bunun çalışması için hedef sistemlerde yönetici haklarına sahip olduğunuzdan emin olun.
    command: "lsassy -d {{domain}} -u {{username}} -p {{password}} {{targets}}"

  - title:
      en: lsassy - authenticate with NT hash (Pass-the-Hash)
      tr: lsassy - NT karmasıyla kimlik doğrulama (Pass-the-Hash)
    desc:
      en: |
        Perform remote credential dumping by authenticating with a user's NT hash instead of a plaintext password. This is essential for lateral movement after obtaining hashes from other sources like SAM or NTDS.dit. You can provide the hash in either LM:NT or just NT format. This technique helps bypass the need for cleartext credentials while maintaining administrative access.
      tr: |
        Düz metin parola yerine kullanıcının NT karmasıyla kimlik doğrulayarak uzaktan kimlik bilgisi dökümü gerçekleştirin. SAM veya NTDS.dit gibi kaynaklardan karma elde ettikten sonra yatay hareket için gereklidir. Karmayı LM:NT veya yalnızca NT biçiminde verebilirsiniz. Bu teknik yönetici erişimini korurken açık metin kimlik bilgisi ihtiyacını aşmaya yardımcı olur.
    command: "lsassy -d {{domain}} -u {{username}} -H {{nt_hash}} {{targets}}"

  - title:
      en: lsassy - authenticate with Kerberos ticket
      tr: lsassy - Kerberos biletiyle kimlik doğrulama
    desc:
      en: |
        Use an existing Kerberos TGT for authentication to perform dumping without providing a password or hash. Before running this, you must set the KRB5CCNAME environment variable to point to your valid .ccache file. This method is highly effective in environments where Kerberos is preferred and helps avoid triggering alerts related to password-based logins. Use the FQDN of the target for better compatibility with Kerberos.
      tr: |
        Parola veya karma vermeden döküm yapmak için kimlik doğrulamada mevcut bir Kerberos TGT kullanın. Bunu çalıştırmadan önce KRB5CCNAME ortam değişkenini geçerli .ccache dosyanızı işaret edecek şekilde ayarlamalısınız. Bu yöntem Kerberos'un tercih edildiği ortamlarda oldukça etkilidir ve parola tabanlı oturum açımlarla ilgili uyarıları tetiklemekten kaçınmaya yardımcı olur. Kerberos ile daha iyi uyumluluk için hedefin FQDN adresini kullanın.
    command: "lsassy -k {{targets}}"

  # === DUMPING METHODS ===
  - title:
      en: lsassy - dump using Procdump method
      tr: lsassy - Procdump yöntemiyle döküm
    desc:
      en: |
        Utilize the Procdump utility from Sysinternals to dump the LSASS process memory. This method requires you to specify the local path to the procdump.exe binary which will be uploaded to the target. It is a reliable alternative when built-in methods like comsvcs.dll are being blocked or monitored by security software. Be aware that uploading binaries to a target may increase the risk of detection by EDR solutions.
      tr: |
        LSASS süreç belleğini dökmek için Sysinternals'in Procdump aracını kullanın. Bu yöntem hedefe yüklenecek procdump.exe ikilisinin yerel yolunu belirtmenizi gerektirir. Comsvcs.dll gibi yerleşik yöntemler güvenlik yazılımlarınca engelleniyor veya izleniyorsa güvenilir bir alternatiftir. Hedefe ikili yüklemenin EDR çözümlerince tespit riskini artırabileceğini unutmayın.
    command: "lsassy -d {{domain}} -u {{username}} -p {{password}} {{targets}} -m procdump -O procdump_path={{local_procdump_path}}"

  - title:
      en: lsassy - dump using Dumpert method
      tr: lsassy - Dumpert yöntemiyle döküm
    desc:
      en: |
        Use the Dumpert tool to dump LSASS memory via direct system calls to bypass API hooking. This method is specifically designed to evade EDR and AV solutions that monitor common Windows APIs used for memory dumping. You must provide the path to the local dumpert.exe or dumpert.dll file. It represents a more advanced and stealthy approach compared to standard dumping techniques.
      tr: |
        API kancalamayı aşmak için doğrudan sistem çağrılarıyla LSASS belleğini dökmek amacıyla Dumpert aracını kullanın. Bu yöntem bellek dökümü için kullanılan yaygın Windows API'lerini izleyen EDR ve AV çözümlerinden kaçmak için özel olarak tasarlanmıştır. Yerel dumpert.exe veya dumpert.dll dosyasının yolunu vermelisiniz. Standart döküm tekniklerine kıyasla daha gelişmiş ve gizli bir yaklaşımı temsil eder.
    command: "lsassy -d {{domain}} -u {{username}} -p {{password}} {{targets}} -m dumpert -O dumpert_path={{local_dumpert_path}}"

  - title:
      en: lsassy - dump using nanodump method
      tr: lsassy - nanodump yöntemiyle döküm
    desc:
      en: |
        Employ the nanodump method for a highly specialized and often stealthier dumping process. Nanodump is designed to be a minimalist tool for dumping LSASS, often bypassing modern security controls. This is useful in hardened environments where standard administrative shares or WMI calls are heavily monitored. Like other custom methods, check if specific options are needed for the version of nanodump you are using.
      tr: |
        Son derece özelleşmiş ve genellikle daha gizli bir döküm süreci için nanodump yöntemini kullanın. Nanodump, LSASS dökmek için minimalist bir araç olacak şekilde tasarlanmıştır ve genellikle modern güvenlik denetimlerini aşar. Standart yönetici paylaşımlarının veya WMI çağrılarının yoğun izlendiği sıkılaştırılmış ortamlarda kullanışlıdır. Diğer özel yöntemlerde olduğu gibi kullandığınız nanodump sürümü için özel seçenekler gerekip gerekmediğini denetleyin.
    command: "lsassy -d {{domain}} -u {{username}} -p {{password}} {{targets}} -m nanodump"

  # === FILE & DATA OPERATIONS ===
  - title:
      en: lsassy - parse existing remote dump
      tr: lsassy - mevcut uzak dökümü ayrıştırma
    desc:
      en: |
        Extract credentials from an LSASS dump file that is already present on the remote target system. This is useful if a dump was previously created by another tool or a manual process, preventing the need for a new dumping action. You must specify the remote directory path and the name of the dump file. Note that using --parse-only will prevent lsassy from automatically deleting the dump file after processing.
      tr: |
        Uzak hedef sistemde zaten bulunan bir LSASS döküm dosyasından kimlik bilgilerini çıkarın. Döküm daha önce başka bir araçla veya manuel işlemle oluşturulmuşsa yeni bir döküm eylemine gerek kalmaması açısından kullanışlıdır. Uzak dizin yolunu ve döküm dosyasının adını belirtmelisiniz. --parse-only kullanmanın işlemden sonra lsassy'nin döküm dosyasını otomatik silmesini engelleyeceğini unutmayın.
    command: "lsassy -d {{domain}} -u {{username}} -p {{password}} {{targets}} --parse-only --dump-path {{remote_path|/Windows/Temp}} --dump-name {{dump_name|lsass.dmp}}"

  - title:
      en: lsassy - harvest Kerberos tickets and DPAPI keys
      tr: lsassy - Kerberos biletleri ve DPAPI anahtarları toplama
    desc:
      en: |
        Automatically collect Kerberos tickets and DPAPI master keys from the target while dumping credentials. Tickets are saved locally in ccache format, which can be reused for further Kerberos-based attacks. DPAPI master keys are extracted in GUID:SHA1 format for offline decryption of sensitive Windows data. This significantly expands the scope of the post-exploitation phase by gathering various secrets at once.
      tr: |
        Kimlik bilgilerini dökerken hedeften Kerberos biletlerini ve DPAPI ana anahtarlarını otomatik toplayın. Biletler yerel olarak ccache biçiminde kaydedilir ve sonraki Kerberos tabanlı saldırılarda yeniden kullanılabilir. DPAPI ana anahtarları hassas Windows verilerinin çevrimdışı şifresini çözmek için GUID:SHA1 biçiminde çıkarılır. Bu, çeşitli gizli bilgileri bir arada toplayarak sömürü sonrası aşamanın kapsamını önemli ölçüde genişletir.
    command: "lsassy -d {{domain}} -u {{username}} -p {{password}} {{targets}} -K {{kerberos_dir|./tickets}} -M {{masterkeys_file|./masterkeys.txt}}"

  # === OUTPUT & PERFORMANCE ===
  - title:
      en: lsassy - output results in JSON format
      tr: lsassy - sonuçları JSON biçiminde çıkarma
    desc:
      en: |
        Generate the extracted credential information in JSON format for automated processing or logging. This is particularly useful when lsassy is part of a larger automation pipeline or when you need to parse results with tools like jq. You can combine this with the --outfile flag to save the results directly to a file on your disk. This avoids cluttered terminal output when dealing with a large number of targets.
      tr: |
        Çıkarılan kimlik bilgisi verisini otomatik işlem veya kayıt için JSON biçiminde üretin. Bu, lsassy daha büyük bir otomasyon hattının parçası olduğunda veya sonuçları jq gibi araçlarla ayrıştırmanız gerektiğinde özellikle kullanışlıdır. Sonuçları doğrudan diskinizdeki bir dosyaya kaydetmek için bunu --outfile bayrağıyla birleştirebilirsiniz. Bu, çok sayıda hedefle uğraşırken kalabalık terminal çıktısının önüne geçer.
    command: "lsassy -d {{domain}} -u {{username}} -p {{password}} {{targets}} --format json --outfile {{output_file|results.json}}"

  - title:
      en: lsassy - execute with multiple threads
      tr: lsassy - çok iş parçacığıyla çalıştırma
    desc:
      en: |
        Increase the speed of the dumping process across multiple targets by using concurrent threads. You can set the number of threads between 1 and 256 depending on your network capacity and target list size. This is ideal for quickly scanning large network ranges or host lists found in an Active Directory environment. Use caution with very high thread counts as it might increase the noisiness of the operation.
      tr: |
        Eşzamanlı iş parçacıkları kullanarak birden fazla hedefte döküm sürecinin hızını artırın. Ağ kapasitenize ve hedef liste boyutunuza bağlı olarak iş parçacığı sayısını 1 ile 256 arasında ayarlayabilirsiniz. Active Directory ortamında bulunan geniş ağ aralıklarını veya makine listelerini hızlıca taramak için idealdir. Operasyonun gürültüsünü artırabileceğinden çok yüksek iş parçacığı sayılarında dikkatli olun.
    command: "lsassy -d {{domain}} -u {{username}} -p {{password}} {{targets}} --threads {{thread_count|32}}"

  - title:
      en: lsassy - filter output for user accounts only
      tr: lsassy - çıktıyı yalnızca kullanıcı hesaplarına filtreleme
    desc:
      en: |
        Filter the results to only display credentials belonging to user accounts, excluding computer account data. This makes the output much cleaner and easier to read during manual analysis, as it focuses on high-value targets. Computer account hashes (ending in $) are often less useful for initial lateral movement compared to domain admin or user accounts. This flag is particularly helpful when dumping a large number of machines simultaneously.
      tr: |
        Sonuçları bilgisayar hesabı verilerini hariç tutarak yalnızca kullanıcı hesaplarına ait kimlik bilgilerini gösterecek şekilde filtreleyin. Bu, yüksek değerli hedeflere odaklandığından manuel analiz sırasında çıktıyı çok daha temiz ve okunabilir kılar. Bilgisayar hesabı karmaları (sonu $ ile biten) ilk yatay hareket için etki alanı yöneticisi veya kullanıcı hesaplarına kıyasla genellikle daha az kullanışlıdır. Bu bayrak çok sayıda makineyi aynı anda dökerken özellikle yardımcıdır.
    command: "lsassy -d {{domain}} -u {{username}} -p {{password}} {{targets}} --users"
