tool: wfuzz
tags: [web, pentest, enumeration, bruteforce, fuzzing, security]

actions:
  # === BASIC ENUMERATION ===
  - title:
      en: wfuzz - basic directory discovery
      tr: wfuzz - temel dizin keşfi
    desc:
      en: |
        Performs a simple directory and file search against a target URL using a specified wordlist.
        The FUZZ keyword is replaced by entries from the wordlist to find hidden resources.
        This is the primary way to use Wfuzz for initial reconnaissance on a web server.
      tr: |
        Belirtilen bir kelime listesi kullanarak hedef URL'ye karşı basit bir dizin ve dosya araması gerçekleştirir.
        FUZZ anahtar kelimesi, gizli kaynakları bulmak için listedeki girdilerle değiştirilir.
        Bu, bir web sunucusunda ilk keşif için Wfuzz'u kullanmanın birincil yoludur.
    command: "wfuzz -c -w {{wordlist|/usr/share/wordlists/dirb/common.txt}} {{url}}/FUZZ"

  - title:
      en: wfuzz - filter by status code
      tr: wfuzz - durum koduna göre filtreleme
    desc:
      en: |
        Hides specific HTTP response codes from the output to reduce noise.
        Using --hc (Hide Code) followed by 404 is standard practice to ignore "Not Found" responses.
        This makes it much easier to identify valid paths and restricted areas (like 200 OK or 403 Forbidden).
      tr: |
        Çıktıdaki gürültüyü azaltmak için belirli HTTP yanıt kodlarını gizler.
        "Bulunamadı" yanıtlarını yok saymak için 404 ile birlikte --hc kullanmak standart uygulamadır.
        Bu, geçerli yolları ve kısıtlı alanları (200 OK veya 403 Forbidden gibi) tespit etmeyi çok kolaylaştırır.
    command: "wfuzz -c -w {{wordlist|/usr/share/wordlists/dirb/common.txt}} --hc {{code|404}} {{url}}/FUZZ"

  - title:
      en: wfuzz - fuzzing multiple positions
      tr: wfuzz - birden fazla konumda fuzzing
    desc:
      en: |
        Utilizes multiple wordlists to fuzz different parts of the request simultaneously.
        FUZZ is replaced by the first wordlist, and FUZ2Z is replaced by the second.
        This is particularly useful for finding files with specific extensions or testing multiple parameters.
      tr: |
        İsteğin farklı bölümlerini aynı anda bulanıklaştırmak için birden fazla kelime listesi kullanır.
        FUZZ ilk listenin, FUZ2Z ise ikincisinin girdisiyle değiştirilir.
        Bu, özellikle belirli uzantılara sahip dosyaları bulmak veya birden fazla parametreyi test etmek için kullanışlıdır.
    command: "wfuzz -c -w {{wordlist}} -w {{ext_list|/usr/share/wordlists/dirb/extensions_common.txt}} {{url}}/FUZZ.FUZ2Z"

  # === ADVANCED DISCOVERY ===
  - title:
      en: wfuzz - subdomain enumeration
      tr: wfuzz - alt alan adı numaralandırma
    desc:
      en: |
        Discovers subdomains by fuzzing the Host header in the HTTP request.
        This technique is effective for finding virtual hosts that are not indexed by DNS but exist on the server.
        Note that you should often filter out the default response size (chars/words) of the main domain to see valid subdomains.
      tr: |
        HTTP isteğindeki Host başlığını bulanıklaştırarak alt alan adlarını keşfeder.
        Bu teknik, DNS'de dizine eklenmemiş ancak sunucuda bulunan sanal konakları bulmada etkilidir.
        Geçerli alt alan adlarını görmek için genellikle ana alanın varsayılan yanıt boyutunu (karakter/kelime) filtrelemeniz gerektiğini unutmayın.
    command: "wfuzz -c -w {{wordlist|/usr/share/wordlists/dnsutils/subdomains-top1mil.txt}} -H \"Host: FUZZ.{{domain}}\" {{url}}"

  - title:
      en: wfuzz - recursive directory discovery
      tr: wfuzz - özyinelemeli dizin keşfi
    desc:
      en: |
        Automatically performs discovery on subdirectories found during the initial scan.
        The -R flag defines the depth of recursion (e.g., -R 2 scans two levels deep).
        Use this carefully on large sites as it can generate a massive amount of traffic and take a long time.
      tr: |
        İlk taramada bulunan alt dizinlerde otomatik olarak keşif gerçekleştirir.
        -R bayrağı özyineleme derinliğini tanımlar (örn. -R 2 iki düzey derinlikte tarar).
        Büyük sitelerde çok fazla trafik üretebileceği ve uzun sürebileceği için dikkatli kullanın.
    command: "wfuzz -c -w {{wordlist}} -R {{depth|2}} --hc 404 {{url}}/FUZZ"

  # === PARAMETER AND DATA FUZZING ===
  - title:
      en: wfuzz - post data fuzzing
      tr: wfuzz - post verisi fuzzing
    desc:
      en: |
        Sends fuzzed data within the body of a POST request to test for vulnerabilities or hidden parameters.
        The -d flag specifies the post data, where the FUZZ keyword marks the injection point.
        This is essential for testing login forms, search fields, and API endpoints for injections.
      tr: |
        Zafiyetleri veya gizli parametreleri test etmek için bir POST isteğinin gövdesinde bulanıklaştırılmış veri gönderir.
        -d bayrağı post verisini belirtir; FUZZ anahtar kelimesi enjeksiyon noktasını işaretler.
        Bu, giriş formlarını, arama alanlarını ve API uç noktalarını enjeksiyonlara karşı test etmek için gereklidir.
    command: "wfuzz -c -w {{wordlist}} -d \"{{param}}=FUZZ&submit=true\" {{url}}"

  - title:
      en: wfuzz - url parameter fuzzing
      tr: wfuzz - url parametre fuzzing
    desc:
      en: |
        Fuzzes GET parameters within the URL to find hidden variables or test for IDOR and injection.
        This is useful when you suspect an endpoint accepts more parameters than are visible in the UI.
        It helps in uncovering debugging modes (e.g., ?debug=true) or administrative overrides.
      tr: |
        Gizli değişkenleri bulmak veya IDOR ve enjeksiyon test etmek için URL içindeki GET parametrelerini bulanıklaştırır.
        Bu, bir uç noktanın arayüzde görünenden daha fazla parametre kabul ettiğinden şüphelendiğinizde kullanışlıdır.
        Hata ayıklama modlarını (örn. ?debug=true) veya yönetimsel geçersiz kılmaları ortaya çıkarmaya yardımcı olur.
    command: "wfuzz -c -w {{wordlist}} \"{{url}}/page.php?FUZZ=test\""

  # === AUTHENTICATION AND SESSIONS ===
  - title:
      en: wfuzz - authenticated fuzzing
      tr: wfuzz - kimlik doğrulamalı fuzzing
    desc:
      en: |
        Enables fuzzing on resources that require HTTP Basic, NTLM, or Digest authentication.
        The format is "user:pass", and you can even fuzz the credentials themselves using the FUZZ keyword.
        This allows for security testing of administrative consoles or internal developer tools.
      tr: |
        HTTP Basic, NTLM veya Digest kimlik doğrulaması gerektiren kaynaklarda fuzzing yapmayı etkinleştirir.
        Biçim "kullanıcı:parola" şeklindedir ve FUZZ anahtar kelimesiyle kimlik bilgilerinin kendisini bile bulanıklaştırabilirsiniz.
        Bu, yönetim konsolları veya dahili geliştirici araçlarının güvenlik testine olanak tanır.
    command: "wfuzz -c -w {{wordlist}} --basic \"{{user|admin}}:{{pass|admin}}\" {{url}}/FUZZ"

  - title:
      en: wfuzz - cookie fuzzing
      tr: wfuzz - çerez fuzzing
    desc:
      en: |
        Injects fuzzed values into HTTP cookies using the -b flag to test for session management issues.
        It is useful for discovering insecure direct object references (IDOR) or privilege escalation through cookies.
        Multiple cookies can be set by repeating the -b flag or using a semicolon.
      tr: |
        Oturum yönetimi sorunlarını test etmek için -b bayrağıyla HTTP çerezlerine bulanıklaştırılmış değerler enjekte eder.
        Çerezler üzerinden güvenli olmayan doğrudan nesne referanslarını (IDOR) veya ayrıcalık yükseltmeyi keşfetmek için kullanışlıdır.
        -b bayrağını tekrarlayarak veya noktalı virgül kullanarak birden fazla çerez ayarlanabilir.
    command: "wfuzz -c -w {{wordlist}} -b \"sessionid=FUZZ\" -b \"user=admin\" {{url}}"

  # === PROXIES AND FILTERS ===
  - title:
      en: wfuzz - routing through a proxy
      tr: wfuzz - proxy üzerinden yönlendirme
    desc:
      en: |
        Routes all Wfuzz traffic through a specified proxy, such as Burp Suite or a Tor listener.
        The format is ip:port:type (type can be HTTP, SOCKS4, or SOCKS5).
        This is crucial for analyzing fuzzer traffic in a proxy or bypassing IP-based restrictions.
      tr: |
        Tüm Wfuzz trafiğini Burp Suite veya Tor dinleyicisi gibi belirtilen bir proxy üzerinden yönlendirir.
        Biçim ip:port:tip şeklindedir (tip HTTP, SOCKS4 veya SOCKS5 olabilir).
        Bu, fuzzing trafiğini bir proxy'de analiz etmek veya IP tabanlı kısıtlamaları aşmak için kritiktir.
    command: "wfuzz -c -w {{wordlist}} -p {{proxy|127.0.0.1:8080}} {{url}}/FUZZ"

  - title:
      en: wfuzz - filter by response content (Regex)
      tr: wfuzz - yanıt içeriğine göre filtreleme (Regex)
    desc:
      en: |
        Filters or highlights responses based on a regular expression matching the content.
        The --ss flag shows responses that contain the specified regex, while --hs hides them.
        This is highly effective for identifying specific error messages or successful exploitation indicators.
      tr: |
        Yanıt içeriğiyle eşleşen bir düzenli ifadeye göre yanıtları filtreler veya vurgular.
        --ss bayrağı belirtilen regex'i içeren yanıtları gösterir, --hs ise gizler.
        Bu, belirli hata mesajlarını veya başarılı sömürü göstergelerini belirlemede oldukça etkilidir.
    command: "wfuzz -c -w {{wordlist}} --ss \"{{regex|root:x:0:0}}\" {{url}}/FUZZ"

  - title:
      en: wfuzz - filter by response size
      tr: wfuzz - yanıt boyutuna göre filtreleme
    desc:
      en: |
        Hides responses based on the number of characters (--hh), words (--hw), or lines (--hl).
        This is the most common way to filter out false positives when the server returns a 200 OK for everything (custom 404 pages).
        Check the baseline response size of a non-existent page first, then use that value to filter.
      tr: |
        Karakter sayısına (--hh), kelime sayısına (--hw) veya satır sayısına (--hl) göre yanıtları gizler.
        Bu, sunucunun her şey için 200 OK döndürdüğü (özel 404 sayfaları) durumlarda yanlış pozitifleri filtrelemenin en yaygın yoludur.
        Önce mevcut olmayan bir sayfanın temel yanıt boyutunu kontrol edip ardından bu değeri filtre için kullanın.
    command: "wfuzz -c -w {{wordlist}} --hh {{char_count}} {{url}}/FUZZ"
