tool: masscan
tags: [network, scanner, security, pentest, enumeration, port-scanner, reconnaissance]

actions:
# === BASIC SCANNING ===

 - title:
     en: masscan - basic port scan
     tr: masscan - temel port taraması
   desc:
     en: |
       Performs a standard SYN scan against a target range for specific ports. 
       This is the most common way to use masscan for internal or external network discovery. 
       Note that masscan uses its own custom TCP/IP stack, meaning it requires root or administrator privileges to run.
       It is significantly faster than traditional scanners because it operates asynchronously.
     tr: |
       Belirli portlar için hedef aralığa karşı standart bir SYN taraması gerçekleştirir.
       Dahili veya harici ağ keşfi için masscan kullanmanın en yaygın yoludur.
       Masscan kendi özel TCP/IP yığınını kullandığından çalıştırmak için root veya yönetici yetkileri gerektirdiğini unutmayın.
       Asenkron çalıştığı için geleneksel tarayıcılardan önemli ölçüde daha hızlıdır.
   command: "masscan {{target_range}} -p {{ports}}"

 - title:
     en: masscan - scan multiple port ranges
     tr: masscan - birden fazla port aralığı tarama
   desc:
     en: |
       Allows scanning for multiple specific ports or ranges simultaneously. 
       You can define ports separated by commas or use a dash for a continuous range of ports.
       This is useful when you are looking for specific common services like web (80, 445) and management (22, 3389) across a large network.
       The output will list each discovered open port alongside the IP address.
     tr: |
       Birden fazla belirli port veya aralığın aynı anda taranmasına olanak tanır.
       Portları virgülle ayırarak tanımlayabilir veya sürekli bir port aralığı için tire kullanabilirsiniz.
       Geniş bir ağda web (80, 445) ve yönetim (22, 3389) gibi belirli yaygın hizmetleri ararken kullanışlıdır.
       Çıktı keşfedilen her açık portu IP adresiyle birlikte listeler.
   command: "masscan {{target_range}} -p {{port_1}},{{port_2}},{{range_start}}-{{range_end}}"

# === PERFORMANCE TUNING ===

 - title:
     en: masscan - scan with custom rate limit
     tr: masscan - özel hız sınırıyla tarama
   desc:
     en: |
       Adjusts the speed of the scan by setting the packets-per-second (pps) rate. 
       Increasing this value makes the scan faster but can overwhelm network bandwidth or trigger security alerts (IDS/IPS). 
       By default, masscan is set to a relatively slow 100 packets/second to avoid crashing low-end consumer routers.
       For high-speed internet scanning, this value is often set to 100,000 or higher depending on your uplink.
     tr: |
       Saniyedeki paket (pps) hızını ayarlayarak tarama hızını düzenler.
       Bu değeri artırmak taramayı hızlandırır ancak ağ bant genişliğini zorlayabilir veya güvenlik uyarılarını (IDS/IPS) tetikleyebilir.
       Varsayılan olarak masscan, düşük segment tüketici yönlendiricileri çökertmekten kaçınmak için görece yavaş 100 paket/saniye değerine ayarlıdır.
       Yüksek hızlı internet taramalarında bu değer yukarı bağlantınıza göre genellikle 100.000 veya daha yükseğe ayarlanır.
   command: "masscan {{target_range}} -p {{ports}} --rate {{rate|1000}}"

 - title:
     en: masscan - top ports scan
     tr: masscan - popüler port taraması
   desc:
     en: |
       Scans the most common ports as defined by frequency of use. 
       While masscan does not have a built-in "--top-ports" flag like Nmap, you can manually specify the most popular ports.
       This approach saves time by focusing on the most likely entry points rather than scanning all 65,535 ports.
       Commonly used for quick situational awareness on very large subnets.
     tr: |
       Kullanım sıklığına göre tanımlanan en yaygın portları tarar.
       Masscan'da Nmap'teki gibi yerleşik bir "--top-ports" bayrağı yoktur, ancak en popüler portları manuel belirtebilirsiniz.
       Bu yaklaşım 65.535 portun tümünü taramak yerine en olası giriş noktalarına odaklanarak zaman kazandırır.
       Çok geniş alt ağlarda hızlı durum farkındalığı için yaygın kullanılır.
   command: "masscan {{target_range}} --ports {{ports|21,22,23,25,53,80,110,139,443,445,3389}}"

# === ADVANCED ENUMERATION ===

 - title:
     en: masscan - banner grabbing
     tr: masscan - banner yakalama
   desc:
     en: |
       Enables banner grabbing to identify service versions and software information on open ports. 
       This requires masscan to establish a full TCP connection (Three-way handshake), which is slower than a simple SYN scan. 
       Use this when you need to fingerprint services like SSH, HTTP, or FTP to find vulnerabilities.
       It provides more context than just knowing a port is open.
     tr: |
       Açık portlardaki hizmet sürümlerini ve yazılım bilgisini belirlemek için banner yakalamayı etkinleştirir.
       Bu, masscan'in tam bir TCP bağlantısı (Üçlü el sıkışma) kurmasını gerektirir ve basit bir SYN taramasından daha yavaştır.
       Zafiyet bulmak için SSH, HTTP veya FTP gibi hizmetlerin parmak izini çıkarmanız gerektiğinde bunu kullanın.
       Bir portun açık olduğunu bilmekten daha fazla bağlam sağlar.
   command: "masscan {{target_range}} -p {{ports}} --banners"

 - title:
     en: masscan - scan the entire internet
     tr: masscan - tüm interneti tarama
   desc:
     en: |
       Configures masscan to scan the entire IPv4 address space for a specific port. 
       This is the signature feature of masscan, allowing a full internet scan in minutes if given enough bandwidth. 
       Always ensure you have permission and are following ethical guidelines before scanning public IP space.
       The rate should be carefully managed to avoid local network saturation.
     tr: |
       Masscan'i belirli bir port için tüm IPv4 adres alanını tarayacak şekilde yapılandırır.
       Yeterli bant genişliğiyle dakikalar içinde tüm interneti taramaya olanak tanıyan masscan'in imza özelliğidir.
       Genel IP alanını taramadan önce izniniz olduğundan ve etik kurallara uyduğunuzdan mutlaka emin olun.
       Yerel ağ doygunluğunu önlemek için hız dikkatli yönetilmelidir.
   command: "masscan 0.0.0.0/0 -p {{port}} --rate {{rate|10000}}"

# === EXCLUSIONS AND FILTERS ===

 - title:
     en: masscan - exclude specific targets
     tr: masscan - belirli hedefleri hariç tutma
   desc:
     en: |
       Excludes specific IP addresses or ranges from being scanned even if they fall within the target range. 
       This is critical for avoiding sensitive systems like production databases, medical equipment, or VOIP phones. 
       You can provide a single range or point to a file containing multiple exclusions using the --excludefile flag.
       This helps prevent accidental downtime on critical infrastructure.
     tr: |
       Hedef aralık içinde kalsalar bile belirli IP adreslerini veya aralıkları tarama dışı bırakır.
       Üretim veritabanları, tıbbi cihazlar veya VOIP telefonlar gibi hassas sistemlerden kaçınmak için kritiktir.
       Tek bir aralık verebilir veya --excludefile bayrağıyla birden fazla hariç tutma içeren bir dosyayı işaret edebilirsiniz.
       Bu, kritik altyapıda kazara kesintileri önlemeye yardımcı olur.
   command: "masscan {{target_range}} -p {{ports}} --exclude {{exclude_range}}"

# === OUTPUT AND CONFIGURATION ===

 - title:
     en: masscan - save output in multiple formats
     tr: masscan - çıktıyı çoklu biçimlerde kaydetme
   desc:
     en: |
       Saves the scan results in a specific file format such as JSON, XML, or Grepable. 
       JSON is highly recommended for modern automation and integration with other security tools like Python scripts or ELK stacks. 
       The -oX flag provides XML output which is useful for importing results into tools like Metasploit or Zenmap.
       Using the binary format (-oB) is the most efficient for extremely large scans.
     tr: |
       Tarama sonuçlarını JSON, XML veya Grepable gibi belirli bir dosya biçiminde kaydeder.
       Modern otomasyon ve Python betikleri veya ELK yığınları gibi diğer güvenlik araçlarıyla bütünleşme için JSON şiddetle önerilir.
       -oX bayrağı, sonuçları Metasploit veya Zenmap gibi araçlara aktarmak için kullanışlı XML çıktısı sağlar.
       İkili biçimi (-oB) kullanmak son derece büyük taramalar için en verimlisidir.
   command: "masscan {{target_range}} -p {{ports}} -oJ {{output_file|results.json}}"

 - title:
     en: masscan - manual network interface config
     tr: masscan - manuel ağ arayüzü yapılandırması
   desc:
     en: |
       Manually specifies the source IP, source MAC address, and router MAC address for the scan. 
       This is necessary if masscan fails to auto-detect your network interface settings correctly. 
       It is often required in complex virtualized environments, over VPNs, or when using specialized network adapters.
       Incorrectly setting these may lead to no results or "packet dropped" errors.
     tr: |
       Tarama için kaynak IP, kaynak MAC adresi ve yönlendirici MAC adresini manuel belirtir.
       Masscan ağ arayüzü ayarlarınızı otomatik algılayamazsa bu gereklidir.
       Karmaşık sanallaştırılmış ortamlarda, VPN üzerinden veya özel ağ bağdaştırıcıları kullanırken genellikle gerekir.
       Bunları yanlış ayarlamak sonuç alınamamasına veya "paket düşürüldü" hatalarına yol açabilir.
   command: "masscan {{target_range}} -p {{ports}} --adapter-ip {{source_ip}} --adapter-mac {{source_mac}} --router-mac {{gateway_mac}}"

 - title:
     en: masscan - generate and use config files
     tr: masscan - yapılandırma dosyası üretme ve kullanma
   desc:
     en: |
       Generates a configuration file based on the current command-line arguments or runs a scan from an existing config. 
       The --echo flag is useful for learning all available parameters and creating a template for future scans. 
       Using a configuration file helps in documenting the scan parameters and ensures reproducibility.
       This is preferred for complex, recurring scans in enterprise environments.
     tr: |
       Geçerli komut satırı bağımsız değişkenlerine dayalı bir yapılandırma dosyası üretir veya mevcut bir yapılandırmadan tarama çalıştırır.
       --echo bayrağı tüm kullanılabilir parametreleri öğrenmek ve gelecek taramalar için şablon oluşturmak açısından kullanışlıdır.
       Yapılandırma dosyası kullanmak tarama parametrelerini belgelemeye yardımcı olur ve tekrarlanabilirliği sağlar.
       Kurumsal ortamlardaki karmaşık, yinelenen taramalar için bu tercih edilir.
   command: "masscan -c {{config_file|myscan.conf}}"
