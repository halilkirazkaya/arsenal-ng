tool: impacket-getadusers
tags: [active-directory, enumeration, pentest, impacket, security, ldap, windows, reconnaissance]

actions:
  # === BASIC ENUMERATION ===
  - title:
      en: impacket-GetADUsers - basic user enumeration
      tr: impacket-GetADUsers - temel kullanıcı numaralandırma
    desc:
      en: |
        Performs a basic enumeration of users within the target domain that have an email address configured. 
        This is a common starting point for identifying valid usernames for further attacks like password spraying or credential stuffing. 
        It requires valid domain credentials to successfully query the Active Directory database via the SAMR/LDAP protocols.
      tr: |
        E-posta adresi yapılandırılmış kullanıcıları listeleyerek hedef etki alanında temel kullanıcı numaralandırması yapar.
        Parola püskürtme veya kimlik bilgisi doldurma gibi saldırılar için geçerli kullanıcı adlarını belirlemenin yaygın başlangıç noktasıdır.
        Active Directory veritabanını SAMR/LDAP protokolleriyle sorgulamak için geçerli etki alanı kimlik bilgileri gerekir.
    command: "impacket-GetADUsers {{domain}}/{{username}}:{{password}}"

  - title:
      en: impacket-GetADUsers - enumerate all users
      tr: impacket-GetADUsers - tüm kullanıcıları numaralandırma
    desc:
      en: |
        Queries the domain for all user accounts, including those without email addresses and those that are currently disabled. 
        Using the -all flag ensures that no accounts are missed during the initial reconnaissance phase, providing a complete user list. 
        This is critical for finding service accounts or old accounts that might have been overlooked but still possess sensitive permissions.
      tr: |
        E-posta adresi olmayan ve devre dışı bırakılmış hesaplar dahil etki alanındaki tüm kullanıcı hesaplarını sorgular.
        -all bayrağı, ilk keşif aşamasında hiçbir hesabın gözden kaçmamasını sağlayarak eksiksiz kullanıcı listesi verir.
        Gözden kaçmış olabilecek ancak hassas yetkilere sahip hizmet veya eski hesapları bulmak için kritiktir.
    command: "impacket-GetADUsers -all {{domain}}/{{username}}:{{password}}"

  - title:
      en: impacket-GetADUsers - query specific user details
      tr: impacket-GetADUsers - belirli kullanıcı ayrıntılarını sorgulama
    desc:
      en: |
        Requests detailed information for a single specific username instead of listing every user in the directory. 
        This is useful when you want to verify the existence of a high-value target or check specific attributes of a single account. 
        If the user is disabled, you should combine this command with the -all flag to ensure the data is returned.
      tr: |
        Dizindeki tüm kullanıcıları listelemek yerine tek bir kullanıcı adı için ayrıntılı bilgi ister.
        Yüksek değerli bir hedefin varlığını doğrulamak veya tek bir hesabın özniteliklerini incelemek istediğinizde kullanışlıdır.
        Kullanıcı devre dışıysa verinin dönmesi için bu komutu -all bayrağıyla birlikte kullanın.
    command: "impacket-GetADUsers -user {{target_user}} {{domain}}/{{username}}:{{password}}"

  # === ADVANCED CONNECTION & AUTHENTICATION ===
  - title:
      en: impacket-GetADUsers - specify domain controller IP
      tr: impacket-GetADUsers - etki alanı denetleyicisi IP'si belirtme
    desc:
      en: |
        Directs the tool to communicate with a specific Domain Controller IP address for the query. 
        This is necessary in environments where the local machine cannot resolve the domain FQDN (Fully Qualified Domain Name) via DNS. 
        It ensures the connection is established directly with the intended server, bypassing potential local name resolution issues.
      tr: |
        Sorgu için belirli bir Etki Alanı Denetleyicisi IP adresiyle iletişim kurar.
        Yerel makinenin etki alanı FQDN adresini DNS ile çözümleyemediği ortamlarda gereklidir.
        Bağlantının yerel ad çözümleme sorunlarını atlayarak doğrudan hedeflenen sunucuya kurulmasını sağlar.
    command: "impacket-GetADUsers -dc-ip {{dc_ip}} {{domain}}/{{username}}:{{password}}"

  - title:
      en: impacket-GetADUsers - authentication via NTLM hashes
      tr: impacket-GetADUsers - NTLM hash'leri ile kimlik doğrulama
    desc:
      en: |
        Authenticates to the target domain using NTLM hashes instead of a cleartext password. 
        This "Pass-the-Hash" technique is ideal for scenarios where you have recovered hashes from memory or local databases. 
        The format for the hashes must be LMHASH:NTHASH; if you only have the NTHASH, provide 32 zeros for the LM part.
      tr: |
        Hedef etki alanında açık parola yerine NTLM hash'leriyle kimlik doğrulaması yapar.
        Hash'leri bellekten veya yerel veritabanlarından kurtardığınız senaryolar için ideal bir Pass-the-Hash tekniğidir.
        Hash biçimi LMHASH:NTHASH olmalı; yalnızca NTHASH varsa LM kısmı için 32 sıfır verin.
    command: "impacket-GetADUsers -hashes {{hash}} {{domain}}/{{username}}"

  - title:
      en: impacket-GetADUsers - kerberos authentication
      tr: impacket-GetADUsers - Kerberos ile kimlik doğrulama
    desc:
      en: |
        Uses Kerberos tickets stored in a CCACHE file for authentication instead of traditional NTLM. 
        The tool will look for a valid ticket in the path specified by the KRB5CCNAME environment variable. 
        This is highly effective for avoiding NTLM-based detections and is commonly used in post-exploitation on Linux-based attack hosts.
      tr: |
        Geleneksel NTLM yerine CCACHE dosyasındaki Kerberos biletleriyle kimlik doğrulaması yapar.
        Araç, KRB5CCNAME ortam değişkeninin gösterdiği yolda geçerli bir bilet arar.
        NTLM tabanlı tespitlerden kaçınmak için oldukça etkilidir; Linux tabanlı saldırı makinelerinde sızma sonrası yaygın kullanılır.
    command: "impacket-GetADUsers -k -no-pass {{domain}}/{{username}}"

  - title:
      en: impacket-GetADUsers - kerberos authentication via AES key
      tr: impacket-GetADUsers - AES anahtarı ile Kerberos kimlik doğrulaması
    desc:
      en: |
        Authenticates using a known Kerberos AES-128 or AES-256 key to request information. 
        This is a "Pass-the-Key" method that allows for authentication without knowing the user's cleartext password. 
        It is particularly useful when keys have been extracted from a domain controller's NTDS.dit file or from the LSASS process on a compromised host.
      tr: |
        Bilgi istemek için bilinen bir Kerberos AES-128 veya AES-256 anahtarıyla kimlik doğrulaması yapar.
        Kullanıcının açık parolasını bilmeden kimlik doğrulamaya olanak tanıyan bir Pass-the-Key yöntemidir.
        Anahtarlar etki alanı denetleyicisinin NTDS.dit dosyasından veya ele geçirilmiş makinedeki LSASS sürecinden çıkarıldığında özellikle kullanışlıdır.
    command: "impacket-GetADUsers -aesKey {{aes_key}} {{domain}}/{{username}}"

  # === LOGGING AND DEBUGGING ===
  - title:
      en: impacket-GetADUsers - debug mode with timestamps
      tr: impacket-GetADUsers - zaman damgalı hata ayıklama modu
    desc:
      en: |
        Executes the enumeration with detailed debug output and timestamps for every log entry. 
        This is helpful for troubleshooting connection errors, authentication failures, or understanding the underlying RPC/LDAP calls. 
        Use this when the tool is behaving unexpectedly or when you need a detailed log for a penetration testing report.
      tr: |
        Numaralandırmayı ayrıntılı hata ayıklama çıktısı ve her günlük girdisinde zaman damgasıyla çalıştırır.
        Bağlantı hataları, kimlik doğrulama sorunları veya RPC/LDAP çağrılarını anlamak için yararlıdır.
        Araç beklenmedik davrandığında veya sızma testi raporu için ayrıntılı günlük gerektiğinde kullanın.
    command: "impacket-GetADUsers -debug -ts {{domain}}/{{username}}:{{password}}"