tool: username-anarchy
tags: [pentest, reconnaissance, enumeration, usernames, osint, brute-force]

actions:
  # === BASIC NAME GENERATION ===
  - title:
      en: username-anarchy - basic single name generation
      tr: username-anarchy - temel tek isim üretimi
    desc:
      en: |
        Generates a wide variety of username permutations for a single individual's name. 
        This is the most common starting point during reconnaissance to identify potential login IDs for a target person.
        The output includes standard patterns like first initial followed by last name, full names, and various delimiters.
      tr: |
        Tek bir kişinin adı için çok çeşitli kullanıcı adı permütasyonları üretir.
        Bu, keşif sırasında hedef kişi için olası giriş kimliklerini belirlemeye yönelik en yaygın başlangıç noktasıdır.
        Çıktı, adın baş harfi + soyadı, tam adlar ve çeşitli ayraçlar gibi standart kalıpları içerir.
    command: "username-anarchy {{first_name}} {{last_name}}"

  - title:
      en: username-anarchy - generation from input file
      tr: username-anarchy - girdi dosyasından üretim
    desc:
      en: |
        Processes a list of names from a file to generate usernames for multiple targets at once.
        The input file can be space, CSV, or TAB delimited and should ideally contain first and last names.
        This is highly efficient for generating bulk wordlists during an internal or external network penetration test.
      tr: |
        Birden fazla hedef için toplu kullanıcı adı üretmek üzere bir dosyadaki ad listesini işler.
        Girdi dosyası boşluk, CSV veya TAB ile ayrılmış olabilir ve ideal olarak ad ve soyad içermelidir.
        Bu, iç veya dış ağ sızma testinde toplu kelime listeleri üretmek için oldukça verimlidir.
    command: "username-anarchy -i {{input_file}}"

  # === AUTOMATED DISCOVERY ===
  - title:
      en: username-anarchy - auto-generate by country
      tr: username-anarchy - ülkeye göre otomatik üretim
    desc:
      en: |
        Automatically generates a list of likely usernames based on common names from a specific country.
        This uses datasets like PublicProfiler to create a broad dictionary of names when specific target names are unknown.
        Supported countries include 'us', 'uk', 'germany', 'france', and many others listed in the tool's help.
      tr: |
        Belirli bir ülkedeki yaygın adlara dayanarak olası kullanıcı adlarından oluşan geniş bir liste otomatik üretir.
        Belirli hedef adları bilinmediğinde geniş bir ad sözlüğü oluşturmak için PublicProfiler gibi veri kümelerini kullanır.
        Desteklenen ülkeler arasında aracın yardımında listelenen 'us', 'uk', 'germany', 'france' ve daha fazlası bulunur.
    command: "username-anarchy -a -c {{country|us}}"

  - title:
      en: username-anarchy - recognize username format
      tr: username-anarchy - kullanıcı adı biçimini tanıma
    desc:
      en: |
        Attempts to identify the naming convention used by an organization based on a known valid username.
        It cross-references the input against common name datasets to determine if the format is "first.last", "flast", or others.
        Use the verbose flag (-v) to see the progress and detailed analysis of the recognition process.
      tr: |
        Bilinen geçerli bir kullanıcı adından yola çıkarak kuruluşun kullandığı adlandırma kuralını tespit etmeye çalışır.
        Girdiyi yaygın ad veri kümeleriyle karşılaştırarak biçimin "first.last", "flast" veya başka bir kalıp olup olmadığını belirler.
        Tanıma sürecinin ilerlemesini ve ayrıntılı analizini görmek için verbose bayrağını (-v) kullanın.
    command: "username-anarchy -r {{known_username}}"

  # === FORMATTING AND FILTERING ===
  - title:
      en: username-anarchy - select specific format plugins
      tr: username-anarchy - belirli biçim eklentileri seçme
    desc:
      en: |
        Limits the output to specific, known username formats to keep the wordlist concise and targeted.
        This is useful when you have identified the target's naming convention and want to avoid unnecessary permutations.
        Common plugins include 'flastname', 'first.l', or 'first.last'; multiple plugins can be comma-separated.
      tr: |
        Çıktıyı bilinen belirli kullanıcı adı biçimleriyle sınırlandırarak kelime listesini kısa ve hedefli tutar.
        Bu, hedeflenen adlandırma kuralını tespit ettiğinizde gereksiz permütasyonlardan kaçınmak için kullanışlıdır.
        Yaygın eklentiler arasında 'flastname', 'first.l' veya 'first.last' bulunur; birden fazlası virgülle ayrılabilir.
    command: "username-anarchy -f {{format_list|flastname,first.last}} {{first_name}} {{last_name}}"

  - title:
      en: username-anarchy - define custom format string
      tr: username-anarchy - özel biçim dizesi tanımlama
    desc:
      en: |
        Provides the ability to define a highly specific naming convention using a format string.
        This is used when the target organization utilizes a non-standard pattern that is not covered by built-in plugins.
        The format string uses identifiers like 'f' for first initial and 'last' for the full surname (e.g., 'f.last').
      tr: |
        Bir biçim dizesi kullanarak oldukça belirli bir adlandırma kuralı tanımlama olanağı sağlar.
        Bu, hedef kuruluş yerleşik eklentilerin kapsamadığı standart dışı bir kalıp kullandığında kullanılır.
        Biçim dizesi, adın baş harfi için 'f' ve tam soyadı için 'last' gibi tanımlayıcılar kullanır (örn. 'f.last').
    command: "username-anarchy -F {{format_string|f.last}} {{first_name}} {{last_name}}"

  # === OUTPUT MODIFICATIONS ===
  - title:
      en: username-anarchy - append email domain suffix
      tr: username-anarchy - e-posta alan adı son eki ekleme
    desc:
      en: |
        Appends a domain suffix to every generated username, essentially creating an email address list.
        This is perfect for preparing candidate lists for phishing simulations or attacking cloud services like Office 365.
        Ensure the domain provided does not include the '@' symbol as the tool handles the prefixing automatically.
      tr: |
        Üretilen her kullanıcı adına bir alan adı son eki ekleyerek fiilen bir e-posta adresi listesi oluşturur.
        Bu, oltalama simülasyonları veya Office 365 gibi bulut servislerine yönelik aday listeleri hazırlamak için idealdir.
        Araç öneki kendisi eklediği için verilen alan adının '@' işareti içermediğinden emin olun.
    command: "username-anarchy -@ {{domain|example.com}} -i {{input_file}}"

  - title:
      en: username-anarchy - case insensitive output
      tr: username-anarchy - büyük/küçük harf duyarsız çıktı
    desc:
      en: |
        Controls the casing of the generated usernames, defaulting to lowercase.
        Setting the case-insensitive option to False can be useful if the target system distinguishes between uppercase and lowercase.
        By default, usernames are generated in all lowercase to match the most common Unix and Active Directory behaviors.
      tr: |
        Üretilen kullanıcı adlarının harf büyüklüğünü kontrol eder, varsayılan olarak küçük harf kullanır.
        Hedef sistem büyük ve küçük harfi ayırt ediyorsa büyük/küçük harf duyarsız seçeneğini False yapmak faydalı olabilir.
        Varsayılan olarak kullanıcı adları en yaygın Unix ve Active Directory davranışlarına uyacak şekilde tamamen küçük harfle üretilir.
    command: "username-anarchy --case-insensitive {{boolean|True}} {{first_name}} {{last_name}}"

  # === ADVANCED MANIPULATION ===
  - title:
      en: username-anarchy - name substitution
      tr: username-anarchy - isim ikamesi
    desc:
      en: |
        Enables or disables name substitutions to handle common nicknames or variations.
        When turned on, the tool may substitute names like 'Robert' with 'Bob' to catch more potential username variations.
        This increases the list size but significantly improves the chances of finding valid usernames in diverse environments.
      tr: |
        Yaygın takma adları veya varyasyonları işlemek için isim ikamelerini etkinleştirir veya devre dışı bırakır.
        Açıkken araç, daha fazla olası kullanıcı adı varyasyonu yakalamak için 'Robert' gibi adları 'Bob' ile değiştirebilir.
        Bu liste boyutunu büyütür ancak çeşitli ortamlarda geçerli kullanıcı adları bulma şansını önemli ölçüde artırır.
    command: "username-anarchy -s {{state|on}} -m {{max_sub|3}} -i {{input_file}}"
