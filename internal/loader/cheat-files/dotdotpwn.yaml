tool: dotdotpwn
tags: [network, security, pentest, enumeration, exploitation, web, fuzzer, directory-traversal]

actions:
# === HTTP & WEB FUZZING ===

 - title:
     en: dotdotpwn - basic http fuzzing
     tr: dotdotpwn - temel http bulanıklaştırma
   desc:
     en: |
       Performs a standard directory traversal attack against a target web server. 
       This is the most common starting point for identifying vulnerabilities in web servers running on default ports. 
       The tool will attempt to access various sensitive files using a variety of traversal patterns.
     tr: |
       Hedef web sunucusuna karşı standart bir dizin geçiş (traversal) saldırısı gerçekleştirir.
       Varsayılan portlarda çalışan web sunucularındaki zafiyetleri tespit etmenin en yaygın başlangıç noktasıdır.
       Araç, çeşitli geçiş kalıpları kullanarak hassas dosyalara erişmeye çalışır.
   command: "dotdotpwn -m http -h {{host}}"

 - title:
     en: dotdotpwn - fuzzing specific URL parameter
     tr: dotdotpwn - belirli URL parametresini bulanıklaştırma
   desc:
     en: |
       Targets a specific URL parameter by replacing its value with the TRAVERSAL keyword. 
       This is highly effective when you suspect a specific script or endpoint (like download.php?file=) is vulnerable. 
       You must explicitly include the "TRAVERSAL" string in the URL to indicate the injection point.
     tr: |
       Değerini TRAVERSAL anahtar sözcüğüyle değiştirerek belirli bir URL parametresini hedefler.
       Belirli bir betik veya uç noktanın (download.php?file= gibi) zafiyetli olduğundan şüphelenildiğinde oldukça etkilidir.
       Enjeksiyon noktasını belirtmek için URL'de açıkça "TRAVERSAL" dizesini eklemelisiniz.
   command: "dotdotpwn -m http-url -u {{url|http://example.com/id.php?file=TRAVERSAL}}"

 - title:
     en: dotdotpwn - fuzzing using POST method
     tr: dotdotpwn - POST yöntemiyle bulanıklaştırma
   desc:
     en: |
       Changes the default HTTP request method from GET to POST for the specified target. 
       Many modern applications process file paths or resource identifiers through POST data rather than URL parameters. 
       This command ensures you are testing the application's handling of data sent in the request body.
     tr: |
       Belirtilen hedef için varsayılan HTTP istek yöntemini GET'ten POST'a değiştirir.
       Modern uygulamaların çoğu dosya yollarını veya kaynak tanımlayıcıları URL parametreleri yerine POST verisiyle işler.
       Bu komut, uygulamanın istek gövdesinde gönderilen veriyi işleyişini test etmenizi sağlar.
   command: "dotdotpwn -m http -h {{host}} -M POST"

 - title:
     en: dotdotpwn - search for specific file with keyword match
     tr: dotdotpwn - anahtar sözcük eşleşmesiyle belirli dosya arama
   desc:
     en: |
       Configures the fuzzer to look for a specific file and verify success by matching a text pattern in the response. 
       This is crucial for reducing false positives, as it ensures the content returned actually contains the expected data (e.g., "root:" in /etc/passwd). 
       It is especially useful when targets return custom error pages with a 200 OK status code.
     tr: |
       Bulanıklaştırıcıyı belirli bir dosyayı arayacak ve yanıttaki metin kalıbını eşleştirerek başarıyı doğrulayacak şekilde yapılandırır.
       Dönen içeriğin gerçekten beklenen veriyi içerdiğini garantileyerek yanlış pozitifleri azaltmak için kritiktir (/etc/passwd içinde "root:" gibi).
       Hedeflerin 200 OK durum koduyla özel hata sayfaları döndürdüğü durumlarda özellikle kullanışlıdır.
   command: "dotdotpwn -m http-url -u {{url_with_traversal}} -f {{file|/etc/passwd}} -k {{keyword|root:}}"

# === PROTOCOL SPECIFIC FUZZING ===

 - title:
     en: dotdotpwn - ftp service fuzzing
     tr: dotdotpwn - ftp hizmeti bulanıklaştırma
   desc:
     en: |
       Scans an FTP server to identify directory traversal vulnerabilities that could allow escaping the home directory. 
       The module uses common FTP commands to test if the service properly restricts file access. 
       You can provide specific credentials if the server does not support anonymous login.
     tr: |
       Ev dizininden kaçışa izin verebilecek dizin geçiş zafiyetlerini tespit için FTP sunucusunu tarar.
       Modül, hizmetin dosya erişimini düzgün kısıtlayıp kısıtlamadığını test etmek için yaygın FTP komutlarını kullanır.
       Sunucu anonim girişi desteklemiyorsa belirli kimlik bilgileri verebilirsiniz.
   command: "dotdotpwn -m ftp -h {{host}} -U {{username|anonymous}} -P {{password|anonymous@example.com}}"

 - title:
     en: dotdotpwn - tftp service fuzzing
     tr: dotdotpwn - tftp hizmeti bulanıklaştırma
   desc:
     en: |
       Initiates a directory traversal scan against a TFTP (Trivial File Transfer Protocol) service. 
       TFTP is often used for booting diskless workstations or transferring configuration files and often lacks authentication. 
       Note that TFTP usually runs on UDP port 69 and might require specific firewall rules to test.
     tr: |
       Bir TFTP (Basit Dosya Aktarım Protokolü) hizmetine karşı dizin geçiş taraması başlatır.
       TFTP genellikle disksiz iş istasyonlarını başlatmak veya yapılandırma dosyalarını aktarmak için kullanılır ve çoğu zaman kimlik doğrulaması yoktur.
       TFTP'nin genellikle 69 numaralı UDP portunda çalıştığını ve test için özel güvenlik duvarı kuralları gerekebileceğini unutmayın.
   command: "dotdotpwn -m tftp -h {{host}}"

# === ADVANCED CONFIGURATION & OPTIMIZATION ===

 - title:
     en: dotdotpwn - advanced scanning with depth and OS type
     tr: dotdotpwn - derinlik ve işletim sistemi türüyle gelişmiş tarama
   desc:
     en: |
       Optimizes the fuzzing process by specifying the traversal depth and the target operating system. 
       Setting the OS type (windows, unix, or generic) helps the tool select the most relevant file paths to attempt. 
       Increasing the depth (e.g., to 8 or 10) allows the tool to search deeper within the file system hierarchy.
     tr: |
       Geçiş derinliğini ve hedef işletim sistemini belirterek bulanıklaştırma işlemini iyileştirir.
       İşletim sistemi türünü ayarlamak (windows, unix veya generic) aracın en uygun dosya yollarını seçmesine yardımcı olur.
       Derinliği artırmak (ör. 8 veya 10) aracın dosya sistemi hiyerarşisinde daha derine inmesini sağlar.
   command: "dotdotpwn -m http -h {{host}} -d {{depth|8}} -o {{os_type|unix}}"

 - title:
     en: dotdotpwn - fuzzing with Nmap OS detection
     tr: dotdotpwn - Nmap işletim sistemi tespitiyle bulanıklaştırma
   desc:
     en: |
       Integrates with Nmap to automatically detect the target's operating system before the scan starts. 
       This ensures that the fuzzer uses the most intelligent payloads relevant to the actual target environment. 
       Be aware that this requires Nmap to be installed and might require elevated privileges (sudo) for accurate fingerprinting.
     tr: |
       Tarama başlamadan önce hedefin işletim sistemini otomatik tespit etmek için Nmap ile bütünleşir.
       Bu, bulanıklaştırıcının gerçek hedef ortama en uygun yükleri kullanmasını sağlar.
       Bunun Nmap kurulu olmasını gerektirdiğini ve doğru parmak izi için yükseltilmiş yetki (sudo) isteyebileceğini unutmayın.
   command: "dotdotpwn -m http -h {{host}} -O"

 - title:
     en: dotdotpwn - slow fuzzing with custom delay
     tr: dotdotpwn - özel gecikmeyle yavaş bulanıklaştırma
   desc:
     en: |
       Sets a custom time delay between each request sent to the target host. 
       Using a delay is important to avoid overloading the target server or triggering rate-limiting and Intrusion Detection Systems (IDS). 
       The value is specified in milliseconds (default is 300ms).
     tr: |
       Hedef hosta gönderilen her istek arasına özel bir zaman gecikmesi koyar.
       Hedef sunucuyu yormaktan veya hız sınırlama ve Saldırı Tespit Sistemlerini (IDS) tetiklemekten kaçınmak için gecikme kullanmak önemlidir.
       Değer milisaniye cinsinden belirtilir (varsayılan 300ms'dir).
   command: "dotdotpwn -m http -h {{host}} -t {{delay_ms|500}}"

 - title:
     en: dotdotpwn - quiet mode and report generation
     tr: dotdotpwn - sessiz kip ve rapor oluşturma
   desc:
     en: |
       Runs the fuzzer in quiet mode while saving the results to a specified report file. 
       This is ideal for automated pentesting pipelines or long-running scans where you don't want to flood the terminal. 
       The resulting text file will contain all the successfully identified traversal paths.
     tr: |
       Bulanıklaştırıcıyı sessiz kipte çalıştırırken sonuçları belirtilen rapor dosyasına kaydeder.
       Terminali doldurmak istemediğiniz otomatik sızma testi hatları veya uzun süren taramalar için idealdir.
       Oluşan metin dosyası, başarıyla tespit edilen tüm geçiş yollarını içerir.
   command: "dotdotpwn -m http -h {{host}} -q -r {{report_name|results.txt}}"

 - title:
     en: dotdotpwn - break on first vulnerability found
     tr: dotdotpwn - ilk zafiyette durma
   desc:
     en: |
       Instructs the tool to stop the fuzzing process immediately after the first vulnerability is confirmed. 
       This is useful for quick assessments or "Proof of Concept" tasks where you only need to prove a weakness exists. 
       It saves time and reduces the number of requests sent to the target server.
     tr: |
       Araca, ilk zafiyet doğrulandıktan hemen sonra bulanıklaştırma işlemini durdurmasını söyler.
       Yalnızca bir zayıflığın varlığını kanıtlamanız gereken hızlı değerlendirmeler veya "Kavram Kanıtı" işleri için kullanışlıdır.
       Zaman kazandırır ve hedef sunucuya gönderilen istek sayısını azaltır.
   command: "dotdotpwn -m http -h {{host}} -b"
