tool: dig
tags: [network, dns, enumeration, reconnaissance, pentest, troubleshooting]

# === BASIC ENUMERATION ===

actions:
 - title:
     en: dig - basic A record lookup
     tr: dig - temel A kaydı sorgulama
   desc:
     en: |
       Performs a standard DNS lookup to retrieve the IPv4 address (A record) for a specific domain. 
       This is the primary way to verify what IP a hostname resolves to using the system's default DNS settings. 
       It is a fundamental tool for initial reconnaissance to identify target infrastructure.
     tr: |
       Belirli alan adına ait IPv4 adresini standart DNS yoklamasıyla getirir.
       Sistemin öntanımlı DNS ayarlarıyla makine adının hangi IP adresine çözüldüğünü doğrulamanın birincil yoludur.
       Hedef altyapıyı belirlemeye yönelik ilk keşif bakımından temel araçtır.
   command: "dig {{domain}}"

 - title:
     en: dig - query specific nameserver
     tr: dig - belirli ad sunucusuna sorgu
   desc:
     en: |
       Queries a specific DNS server directly rather than using the local system resolver. 
       This is useful for bypassing cached results or checking if a specific server like 8.8.8.8 or a target's authoritative server is updated. 
       Use this to verify DNS propagation or to test for DNS poisoning on specific servers.
     tr: |
       Yerel sistem çözümleyicisini kullanmak yerine doğrudan belirli DNS sunucusuna sorar.
       Önbellek sonuçlarını atlatmak ya da 8.8.8.8 gibi genel sunucunun veya hedefin yetkili sunucusunun güncel olup olmadığını yoklamak istediğinizde yararlıdır.
       DNS yayılımını doğrulamak ya da belirli sunucularda DNS zehirlenmesini sınamak adına kullanın.
   command: "dig @{{dns_server|8.8.8.8}} {{domain}}"

 - title:
     en: dig - short response format
     tr: dig - kısa yanıt biçimi
   desc:
     en: |
       Returns only the IP address or the record value without the verbose header and metadata. 
       This mode is ideal for scripting or when you need a clean output for piping into other tools. 
       It strips away the "QUESTION", "ANSWER", and "AUTHORITY" sections for brevity.
     tr: |
       Ayrıntılı başlık ile üstveri olmadan yalnız IP adresini ya da kayıt değerini döndürür.
       Betikleme ya da çıktıyı öteki araçlara aktarmak üzere yalın sonuç gerektiğinde idealdir.
       QUESTION, ANSWER, AUTHORITY bölümlerini kısalık adına ayıklar.
   command: "dig {{domain}} +short"

 - title:
     en: dig - detailed multiline output
     tr: dig - ayrıntılı çok satırlı çıktı
   desc:
     en: |
       Displays DNS records in a highly readable, expanded multiline format. 
       This is particularly helpful when examining complex records like SOA or DNSSEC keys that contain many fields. 
       It makes it easier to distinguish between TTL values, record types, and the actual data.
     tr: |
       DNS kayıtlarını okunması kolay genişletilmiş çok satırlı biçimde gösterir.
       Çok alan barındıran SOA ya da DNSSEC anahtarları gibi karmaşık kayıtları incelerken özellikle yardımcı olur.
       TTL değerleri, kayıt türleri ile gerçek veriyi ayırt etmeyi kolaylaştırır.
   command: "dig {{domain}} +multiline"

# === RECORD TYPES ===

 - title:
     en: dig - lookup mail exchange (MX) records
     tr: dig - posta aktarım (MX) kayıtları
   desc:
     en: |
       Queries the MX records for a domain to identify the servers responsible for receiving email. 
       In a security context, this helps identify third-party email providers or potential entry points for phishing simulations. 
       The output includes a priority value where lower numbers indicate higher preference.
     tr: |
       Alan adına ait MX kayıtlarını sorarak e-posta alımından sorumlu sunucuları belirler.
       Güvenlik bağlamında üçüncü parti e-posta sağlayıcıları ya da oltalama benzetimi giriş noktalarını saptamaya yardımcı olur.
       Çıktıdaki öncelik değerinde küçük sayı yüksek önceliği gösterir.
   command: "dig {{domain}} MX"

 - title:
     en: dig - lookup nameservers (NS)
     tr: dig - ad sunucusu (NS) sorgulama
   desc:
     en: |
       Retrieves the authoritative nameservers for a specific domain. 
       Knowing the authoritative servers allows you to direct further queries specifically to the source of truth for that domain. 
       This is often the first step in performing a deeper DNS enumeration of an organization.
     tr: |
       Belirli alan adına ait yetkili ad sunucularını getirir.
       Yetkili sunucuları bilmek sonraki yoklamaları doğrudan güvenilir kaynağa yönlendirmeyi sağlar.
       Kuruluşa yönelik derin DNS yoklamanın çoğunlukla ilk adımıdır.
   command: "dig {{domain}} NS"

 - title:
     en: dig - lookup text (TXT) records
     tr: dig - metin (TXT) kaydı sorgulama
   desc:
     en: |
       Queries TXT records which are often used for SPF, DKIM, and DMARC email security policies. 
       They are also frequently used for domain ownership verification by services like Google or Microsoft. 
       Security professionals check these to identify misconfigured email policies or hidden information about the domain's services.
     tr: |
       Çoğunlukla SPF, DKIM, DMARC e-posta güvenlik ilkelerinde kullanılan TXT kayıtlarını sorar.
       Google ya da Microsoft gibi hizmetlerin alan adı sahiplik doğrulamasında sıkça yer alır.
       Güvenlik uzmanları yanlış yapılandırılmış e-posta ilkelerini ya da alan adının hizmetlerine dair gizli bilgileri saptamak adına bunları inceler.
   command: "dig {{domain}} TXT"

 - title:
     en: dig - lookup all records (ANY)
     tr: dig - bütün kayıtlar (ANY) sorgulama
   desc:
     en: |
       Attempts to retrieve all available DNS record types for a domain in a single query. 
       Note that many modern DNS servers and CDNs (like Cloudflare) may block or limit ANY queries to prevent DNS amplification attacks. 
       Use this for a quick overview, but be prepared to query specific types if this fails.
     tr: |
       Alan adına ait bütün DNS kayıt türlerini tek yoklamada getirmeyi dener.
       Cloudflare gibi güncel DNS sunucuları ile içerik dağıtım ağları DNS yükseltme saldırılarını önlemek adına ANY yoklamalarını engelleyebilir ya da sınırlayabilir.
       Hızlı genel bakış adına kullanın; başarısız olursa belirli türleri tek tek sorgulamaya hazır olun.
   command: "dig {{domain}} ANY"

# === ADVANCED LOOKUPS ===

 - title:
     en: dig - reverse DNS lookup
     tr: dig - tersine DNS sorgulama
   desc:
     en: |
       Performs a reverse lookup to find the domain name associated with a given IP address. 
       This uses the PTR (Pointer) record within the in-addr.arpa or ip6.arpa zones. 
       It is essential for identifying the purpose of an IP discovered during network scanning.
     tr: |
       Verilen IP adresiyle ilişkili alan adını bulmak üzere tersine yoklama yapar.
       in-addr.arpa ya da ip6.arpa bölgelerindeki PTR kayıtlarını kullanır.
       Ağ taramasında rastlanan IP adresinin işlevini belirlemekte vazgeçilmezdir.
   command: "dig -x {{ip_address}}"

 - title:
     en: dig - trace DNS delegation
     tr: dig - DNS yetki zincirini izleme
   desc:
     en: |
       Follows the DNS resolution path from the root servers down to the authoritative nameservers. 
       This is an excellent diagnostic tool for identifying where a DNS resolution failure is occurring in the hierarchy. 
       It shows every step of the referral process, providing visibility into how the query is handled across the internet.
     tr: |
       Kök sunuculardan yetkili ad sunucularına uzanan DNS çözümleme yolunu izler.
       DNS çözümleme arızasının hiyerarşinin hangi basamağında oluştuğunu saptayan mükemmel tanı aracıdır.
       Yönlendirme sürecinin her basamağını göstererek yoklamanın internet genelinde nasıl işlendiğini görünür kılar.
   command: "dig {{domain}} +trace"

 - title:
     en: dig - zone transfer (AXFR)
     tr: dig - bölge aktarımı (AXFR)
   desc:
     en: |
       Attempts to perform a full zone transfer, which requests the entire DNS database for a domain. 
       If the server is misconfigured to allow unauthorized transfers, it will leak every internal and external record in that zone. 
       This is a high-impact discovery technique, but it is rarely successful on properly secured public nameservers.
     tr: |
       Alan adına ait bütün DNS veritabanını isteyen tam bölge aktarımı dener.
       Sunucu yetkisiz aktarıma yanlışlıkla izin veriyorsa bölgedeki bütün iç ve dış kayıtları sızdırır.
       Etkisi yüksek keşif tekniğidir; düzgün korunan herkese açık ad sunucularında ender başarılı olur.
   command: "dig @{{dns_server}} {{domain}} axfr"

# === PROTOCOL & TROUBLESHOOTING ===

 - title:
     en: dig - query over TCP
     tr: dig - TCP üzerinden sorgu
   desc:
     en: |
       Forces the DNS query to use TCP instead of the standard UDP protocol. 
       This is necessary for large responses that exceed the 512-byte UDP limit or for certain types of DNS inspection. 
       It can also be used to test if a firewall is blocking DNS over TCP, which is required for zone transfers.
     tr: |
       DNS yoklamasını standart UDP yerine TCP kullanmaya zorlar.
       512 baytlık UDP sınırını aşan büyük yanıtlar ya da belirli DNS inceleme türleri adına gereklidir.
       Bölge aktarımlarının gerektirdiği TCP üzerinden DNS trafiğini güvenlik duvarının engelleyip engellemediğini sınamakta kullanılabilir.
   command: "dig {{domain}} +tcp"

 - title:
     en: dig - query specific port
     tr: dig - belirli kapıdan sorgu
   desc:
     en: |
       Directs the DNS query to a non-standard port instead of the default port 53. 
       This is useful when testing internal DNS servers that have been moved for security or when testing through a port-forwarding setup. 
       Ensure the target server is actually listening on the specified port to avoid connection refused errors.
     tr: |
       DNS yoklamasını öntanımlı 53 kapısı yerine standart dışı kapıya yöneltir.
       Güvenlik gerekçesiyle taşınan iç DNS sunucularını yoklarken ya da kapı yönlendirme düzeneği üzerinden sınama yaparken yararlıdır.
       Bağlantı reddi hatalarından kaçınmak adına hedef sunucunun belirtilen kapıyı gerçekten dinlediğinden emin olun.
   command: "dig @{{dns_server}} {{domain}} -p {{port|53}}"
