tool: impacket-psexec
tags: [pentaest, security, exploitation, lateral-movement, smb, windows, impacket]

actions:
  # === AUTHENTICATION METHODS ===
  - title:
      en: impacket-psexec - basic password authentication
      tr: impacket-psexec - temel parolalı kimlik doğrulama
    desc:
      en: |
        Provides a remote interactive shell on the target machine using a plaintext password.
        This is the most common way to gain SYSTEM level access if you have administrative credentials.
        Note that this method requires the user to have administrative privileges and access to the ADMIN$ share.
        Execution involves creating a temporary service on the target which might be flagged by AV/EDR.
      tr: |
        Düz metin parolayla hedef makinede uzak etkileşimli kabuk sağlar.
        Yönetici kimlik bilgileriyle SİSTEM düzeyinde erişim kazanmanın en yaygın yoludur.
        Bu yöntemin kullanıcının yönetici yetkilerine ve ADMIN$ paylaşımına erişime sahip olmasını gerektirdiğini unutmayın.
        Çalıştırma, hedefte AV/EDR tarafından işaretlenebilecek geçici bir hizmet oluşturmayı içerir.
    command: "impacket-psexec {{domain|.}}/{{username}}:{{password}}@{{target_ip}}"

  - title:
      en: impacket-psexec - pass-the-hash (ntlm)
      tr: impacket-psexec - hash ile kimlik doğrulama (NTLM)
    desc:
      en: |
        Performs authentication using NTLM hashes instead of a cleartext password.
        This is extremely useful during lateral movement when you have extracted hashes from memory or SAM databases.
        If you only have the NT hash, you can leave the LM hash part empty (e.g., :NTHASH).
        This bypasses the need for the actual password while still granting full administrative shell access.
      tr: |
        Açık parola yerine NTLM hash'leriyle kimlik doğrulaması yapar.
        Bellekten veya SAM veritabanlarından hash çıkardığınızda yanal hareket sırasında son derece kullanışlıdır.
        Yalnızca NT hash'i varsa LM hash kısmı boş bırakılabilir (ör. :NTHASH).
        Gerçek parolaya ihtiyacı ortadan kaldırırken tam yönetici kabuk erişimi sağlar.
    command: "impacket-psexec -hashes {{hash}} {{domain|.}}/{{username}}@{{target_ip}}"

  - title:
      en: impacket-psexec - kerberos authentication (ticket)
      tr: impacket-psexec - Kerberos ile kimlik doğrulama (bilet)
    desc:
      en: |
        Authenticates using a Kerberos ticket stored in the KRB5CCNAME environment variable.
        The -k flag tells the tool to use Kerberos, and -no-pass ensures it doesn't prompt for a password.
        This is essential in environments where NTLM is disabled or when performing silver/golden ticket attacks.
        Ensure your target matches the SPN in the ticket and that DNS resolution is working correctly for the domain.
      tr: |
        KRB5CCNAME ortam değişkenindeki Kerberos biletiyle kimlik doğrulaması yapar.
        -k bayrağı araca Kerberos kullanmasını söyler, -no-pass parola sormamasını sağlar.
        NTLM'nin devre dışı olduğu ortamlarda veya silver/golden ticket saldırılarında esastır.
        Hedefin biletteki SPN ile eşleştiğinden ve etki alanı için DNS çözümlemesinin çalıştığından emin olun.
    command: "impacket-psexec -k -no-pass {{domain}}/{{username}}@{{target_name}}"

  - title:
      en: impacket-psexec - kerberos authentication (aes key)
      tr: impacket-psexec - Kerberos ile kimlik doğrulama (AES anahtarı)
    desc:
      en: |
        Uses a specific AES hex key (128 or 256 bits) for Kerberos authentication instead of a password.
        This is often used when you have intercepted or extracted machine account keys or user AES keys.
        It provides a more "stealthy" way to authenticate than NTLM in modern Windows environments.
        The -dc-ip flag is often recommended here to ensure the tool knows where to send Kerberos requests.
      tr: |
        Parola yerine Kerberos kimlik doğrulaması için belirli bir AES onaltılık anahtar (128 veya 256 bit) kullanır.
        Genellikle ele geçirilmiş makine hesap anahtarları veya kullanıcı AES anahtarları olduğunda kullanılır.
        Modern Windows ortamlarında NTLM'den daha gizli bir kimlik doğrulama yolu sağlar.
        Kerberos isteklerinin nereye gönderileceğini aracın bilmesi için -dc-ip bayrağı burada sıkça önerilir.
    command: "impacket-psexec -k -aesKey {{hex_key}} {{domain}}/{{username}}@{{target_name}}"

  # === EXECUTION & FILE OPERATIONS ===
  - title:
      en: impacket-psexec - execute local binary on target
      tr: impacket-psexec - hedefte yerel ikili dosya çalıştırma
    desc:
      en: |
        Uploads a local executable file to the target system and executes it.
        The tool will copy the specified file to the remote system, run it as a service, and then remove it.
        This is the standard way to run custom payloads, agents, or specialized diagnostic tools remotely.
        Any arguments required by the uploaded binary can be passed at the end of the command string.
      tr: |
        Yerel bir çalıştırılabilir dosyayı hedef sisteme yükler ve çalıştırır.
        Araç belirtilen dosyayı uzak sisteme kopyalar, hizmet olarak çalıştırır ve sonra kaldırır.
        Özel yükleri, ajanları veya özel tanı araçlarını uzakta çalıştırmanın standart yoludur.
        Yüklenen ikili dosyanın gerektirdiği tüm argümanlar komut dizesinin sonuna eklenebilir.
    command: "impacket-psexec -c {{local_path}} {{domain|.}}/{{username}}@{{target_ip}} {{args}}"

  - title:
      en: impacket-psexec - run specific command (non-interactive)
      tr: impacket-psexec - tek komut çalıştırma (etkileşimsiz)
    desc:
      en: |
        Executes a single specific command on the remote target and returns the output.
        Instead of dropping into a full interactive cmd.exe shell, it runs the provided string and exits.
        This is ideal for automated scripts or quick reconnaissance tasks like checking the current user or network config.
        The default command if none is specified is always cmd.exe.
      tr: |
        Tam etkileşimli cmd.exe kabuğuna girmek yerine uzak hedefte tek bir belirli komut çalıştırır ve çıktıyı döndürür.
        Sağlanan dizeyi çalıştırıp çıkar; otomatik betikler veya mevcut kullanıcıyı denetleme gibi hızlı keşif işleri için idealdir.
        Varsayılan komut belirtilmezse her zaman cmd.exe'dir.
    command: "impacket-psexec {{domain|.}}/{{username}}@{{target_ip}} {{command|whoami /all}}"

  # === ADVANCED CONFIGURATION & STEALTH ===
  - title:
      en: impacket-psexec - custom service and binary names
      tr: impacket-psexec - özel hizmet ve ikili dosya adları
    desc:
      en: |
        Customizes the name of the service and the binary uploaded to the target.
        By default, PSEXEC uses "RemComSvc" and "RemComSvc.exe", which are easily detected by security software.
        Changing these to something more benign (like "SvcHostUpdate") can help in bypassing basic signature-based detection.
        This is a simple but effective technique for basic obfuscation during an engagement.
      tr: |
        Hedefe yüklenen hizmet ve ikili dosyanın adını özelleştirir.
        PSEXEC varsayılan olarak kolayca tespit edilen "RemComSvc" ve "RemComSvc.exe" adlarını kullanır.
        Bunları daha zararsız görünen adlarla ("SvcHostUpdate" gibi) değiştirmek temel imza tabanlı tespitten kaçınmaya yardımcı olabilir.
        Çalışma sırasında temel gizleme için basit ama etkili bir tekniktir.
    command: "impacket-psexec -service-name {{service_name|SystemUpdate}} -remote-binary-name {{binary_name|update.exe}} {{domain|.}}/{{username}}@{{target_ip}}"

  - title:
      en: impacket-psexec - specify domain controller and target ip
      tr: impacket-psexec - etki alanı denetleyicisi ve hedef IP belirtme
    desc:
      en: |
        Manually specifies the Domain Controller IP and the target machine's IP address.
        Use -dc-ip when the domain name cannot be resolved via DNS or when targeting a specific DC.
        Use -target-ip when the target's NetBIOS/DNS name is known but not resolvable in the current network context.
        This ensures the SMB connection goes to the correct host while the authentication context remains valid.
      tr: |
        Etki Alanı Denetleyicisi IP'sini ve hedef makinenin IP adresini elle belirtir.
        Etki alanı adı DNS ile çözülemediğinde veya belirli bir DC hedeflendiğinde -dc-ip kullanın.
        Hedefin NetBIOS/DNS adı biliniyor ancak mevcut ağ bağlamında çözülemediğinde -target-ip kullanın.
        Bu, SMB bağlantısının doğru makineye gitmesini sağlarken kimlik doğrulama bağlamını geçerli tutar.
    command: "impacket-psexec -dc-ip {{dc_ip}} -target-ip {{target_ip}} {{domain}}/{{username}}@{{target_name}}"

  - title:
      en: impacket-psexec - change default smb port
      tr: impacket-psexec - varsayılan SMB portunu değiştirme
    desc:
      en: |
        Connects to the remote SMB server on a non-standard port.
        While SMB traditionally runs on port 445, some environments might use port forwarding or non-standard configurations.
        This option allows you to redirect the tool's traffic to the specific port where the SMB service is listening.
        Useful for bypassing certain firewall restrictions or when targeting forwarded services in lab environments.
      tr: |
        Uzak SMB sunucusuna standart dışı bir porttan bağlanır.
        SMB geleneksel olarak 445 portunda çalışsa da bazı ortamlar port yönlendirme veya standart dışı yapılandırma kullanır.
        Bu seçenek, aracın trafiğini SMB hizmetinin dinlediği belirli porta yönlendirir.
        Belirli güvenlik duvarı kısıtlamalarını atlamak veya laboratuvar ortamlarında yönlendirilmiş hizmetleri hedeflemek için kullanışlıdır.
    command: "impacket-psexec -port {{port|445}} {{domain|.}}/{{username}}@{{target_ip}}"