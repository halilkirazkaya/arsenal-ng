tool: impacket-wmiquery
tags: [network, windows, pentest, enumeration, wmi, security, impacket]

actions:
  # === AUTHENTICATION METHODS ===
  - title:
      en: impacket-wmiquery - interactive shell with password
      tr: impacket-wmiquery - parolalı etkileşimli kabuk
    desc:
      en: |
        Establishes an interactive WQL shell using standard username and password authentication. 
        This is the most common way to start enumerating a remote Windows host via WMI. 
        Once connected, you can issue SELECT queries to retrieve system information, process lists, or service states.
      tr: |
        Standart kullanıcı adı ve parola kimlik doğrulamasıyla etkileşimli bir WQL kabuğu kurar.
        WMI üzerinden uzak bir Windows makineyi listelemeye başlamanın en yaygın yoludur.
        Bağlandıktan sonra sistem bilgisi, işlem listeleri veya hizmet durumlarını almak için SELECT sorguları gönderebilirsiniz.
    command: "impacket-wmiquery {{domain}}/{{username}}:{{password}}@{{target_ip}}"

  - title:
      en: impacket-wmiquery - authenticate using NTLM hashes
      tr: impacket-wmiquery - NTLM hash'leri ile kimlik doğrulaması
    desc:
      en: |
        Performs authentication using NTLM hashes instead of a plaintext password, enabling Pass-the-Hash (PtH) attacks. 
        This is particularly useful during post-exploitation when you have recovered hashes from memory or the SAM database. 
        The format for hashes is LMHASH:NTHASH; if the LM hash is empty, use the format :NTHASH.
      tr: |
        Açık parola yerine NTLM hash'leri ile kimlik doğrulaması yaparak Pass-the-Hash (PtH) saldırılarına olanak tanır.
        Bellekten veya SAM veritabanından hash kurtardığınız sömürü sonrası aşamada özellikle faydalıdır.
        Hash biçimi LMHASH:NTHASH'tir; LM hash'i boşsa :NTHASH biçimini kullanın.
    command: "impacket-wmiquery -hashes {{hash}} {{domain}}/{{username}}@{{target_ip}}"

  - title:
      en: impacket-wmiquery - authenticate using Kerberos
      tr: impacket-wmiquery - Kerberos ile kimlik doğrulaması
    desc:
      en: |
        Uses Kerberos tickets for authentication, which is often more stealthy and avoids sending NTLM traffic over the network. 
        The -k flag instructs the tool to look for a valid TGT in the location specified by the KRB5CCNAME environment variable. 
        It is highly recommended to use the target's FQDN (Fully Qualified Domain Name) rather than an IP address when using Kerberos.
      tr: |
        Kimlik doğrulama için Kerberos biletlerini kullanır; bu genellikle daha gizlidir ve ağ üzerinden NTLM trafiği göndermekten kaçınır.
        -k bayrağı araca KRB5CCNAME ortam değişkeniyle belirtilen konumda geçerli bir TGT aramasını söyler.
        Kerberos kullanırken IP adresi yerine hedefin FQDN'ini (Tam Nitelikli Etki Alanı Adı) kullanmanız önemle önerilir.
    command: "impacket-wmiquery -k -no-pass -dc-ip {{dc_ip}} {{domain}}/{{username}}@{{target_fqdn}}"

  - title:
      en: impacket-wmiquery - authenticate using AES keys
      tr: impacket-wmiquery - AES anahtarlarıyla kimlik doğrulaması
    desc:
      en: |
        Authenticates using Kerberos AES-128 or AES-256 keys instead of a password or NTLM hash. 
        This is useful in modern Active Directory environments where NTLM might be disabled or monitored. 
        The user must provide the hex-encoded AES key and ensure the environment is configured for Kerberos.
      tr: |
        Parola veya NTLM hash'i yerine Kerberos AES-128 veya AES-256 anahtarlarıyla kimlik doğrulaması yapar.
        NTLM'in devre dışı olabileceği veya izlenebileceği modern Active Directory ortamlarında faydalıdır.
        Kullanıcı, hex kodlanmış AES anahtarını vermeli ve ortamın Kerberos için yapılandırıldığından emin olmalıdır.
    command: "impacket-wmiquery -aesKey {{aes_key}} -k -no-pass {{domain}}/{{username}}@{{target_fqdn}}"

  # === NAMESPACE AND QUERY OPTIONS ===
  - title:
      en: impacket-wmiquery - query specific namespace
      tr: impacket-wmiquery - belirli ad alanını sorgulama
    desc:
      en: |
        Specifies a non-default WMI namespace for the connection. 
        The default namespace is 'root/cimv2', but other namespaces like 'root/subscription' are critical for hunting WMI persistence. 
        Navigating different namespaces allows access to hardware-specific info, virtualization data, or security settings.
      tr: |
        Bağlantı için varsayılan dışı bir WMI ad alanı belirtir.
        Varsayılan ad alanı 'root/cimv2'dir, ancak 'root/subscription' gibi diğer ad alanları WMI kalıcılığı avında kritik öneme sahiptir.
        Farklı ad alanlarında gezinmek donanıma özgü bilgilere, sanallaştırma verilerine veya güvenlik ayarlarına erişim sağlar.
    command: "impacket-wmiquery -namespace {{namespace|root/subscription}} {{domain}}/{{username}}:{{password}}@{{target_ip}}"

  - title:
      en: impacket-wmiquery - execute queries from a file
      tr: impacket-wmiquery - dosyadan sorgu çalıştırma
    desc:
      en: |
        Reads and executes a sequence of WQL queries from a local text file. 
        This automation method is ideal for running complex audit scripts or gathering a standardized set of data across multiple hosts. 
        Each line in the file should contain a valid WQL query to be executed by the tool.
      tr: |
        Yerel bir metin dosyasından bir dizi WQL sorgusu okuyup çalıştırır.
        Bu otomasyon yöntemi, karmaşık denetim betikleri çalıştırmak veya birden çok makineden standartlaştırılmış bir veri kümesi toplamak için idealdir.
        Dosyadaki her satır, araçça çalıştırılacak geçerli bir WQL sorgusu içermelidir.
    command: "impacket-wmiquery -file {{query_file}} {{domain}}/{{username}}:{{password}}@{{target_ip}}"

  # === ADVANCED CONFIGURATION ===
  - title:
      en: impacket-wmiquery - set RPC authentication level
      tr: impacket-wmiquery - RPC kimlik doğrulama düzeyini ayarlama
    desc:
      en: |
        Defines the RPC authentication level, which can be set to 'default', 'integrity', or 'privacy'. 
        Some WMI providers, such as the Cluster provider (root/MSCluster), strictly require the 'privacy' level for successful connection. 
        If you encounter 'Access Denied' errors despite having correct credentials, increasing the auth level to 'privacy' may resolve the issue.
      tr: |
        'default', 'integrity' veya 'privacy' olarak ayarlanabilen RPC kimlik doğrulama düzeyini tanımlar.
        Cluster sağlayıcısı (root/MSCluster) gibi bazı WMI sağlayıcıları başarılı bağlantı için kesinlikle 'privacy' düzeyi gerektirir.
        Doğru kimlik bilgilerine rağmen 'Access Denied' hatalarıyla karşılaşırsanız kimlik doğrulama düzeyini 'privacy' seviyesine yükseltmek sorunu çözebilir.
    command: "impacket-wmiquery -rpc-auth-level {{level|privacy}} {{domain}}/{{username}}:{{password}}@{{target_ip}}"

  - title:
      en: impacket-wmiquery - enable debug and timestamps
      tr: impacket-wmiquery - hata ayıklama ve zaman damgalarını etkinleştirme
    desc:
      en: |
        Enables verbose debug output and adds timestamps to every log entry. 
        This is extremely helpful for troubleshooting connection issues, DCOM errors, or protocol mismatches. 
        The timestamps help in correlating the tool's activity with network captures or system logs on the target.
      tr: |
        Ayrıntılı hata ayıklama çıktısını etkinleştirir ve her günlük girdisine zaman damgası ekler.
        Bağlantı sorunlarını, DCOM hatalarını veya protokol uyumsuzluklarını gidermede son derece faydalıdır.
        Zaman damgaları, aracın etkinliğini ağ yakalamalar veya hedefteki sistem günlükleriyle ilişkilendirmeye yardımcı olur.
    command: "impacket-wmiquery -debug -ts {{domain}}/{{username}}:{{password}}@{{target_ip}}"

  - title:
      en: impacket-wmiquery - specify DCOM version
      tr: impacket-wmiquery - DCOM sürümü belirtme
    desc:
      en: |
        Manually sets the DCOM version to be used during the connection attempt. 
        This can be used to bypass specific security patches or to interoperate with older Windows systems that expect a specific version. 
        The format required is MAJOR:MINOR, such as 5.7 for most modern Windows environments.
      tr: |
        Bağlantı denemesi sırasında kullanılacak DCOM sürümünü elle ayarlar.
        Belirli güvenlik yamalarını atlatmak veya belirli bir sürüm bekleyen eski Windows sistemleriyle birlikte çalışmak için kullanılabilir.
        Gereken biçim ANA:ARA şeklindedir; çoğu modern Windows ortamı için 5.7 gibi.
    command: "impacket-wmiquery -com-version {{version|5.7}} {{domain}}/{{username}}:{{password}}@{{target_ip}}"
