tool: dnsenum
tags: [dns, enumeration, reconnaissance, pentest, network, information-gathering, security]

# === BASIC ENUMERATION ===

actions:
 - title:
     en: dnsenum - basic dns enumeration
     tr: dnsenum - Temel DNS numaralandırma
   desc:
     en: |
       Performs a standard DNS enumeration against the target domain. 
       This command identifies host addresses (A), name servers (NS), and mail exchange (MX) records. 
       It is the most common starting point for gathering technical information about a target's infrastructure. 
       By default, it also attempts a zone transfer from all discovered name servers.
     tr: |
       Hedef alan adına karşı standart DNS numaralandırması yapar. Bu komut makine adreslerini (A),
       ad sunucularını (NS) ve posta değişim (MX) kayıtlarını belirler. Hedefin altyapısına dair
       teknik bilgi toplamanın en yaygın başlangıç noktasıdır. Varsayılan olarak bulunan bütün ad
       sunuculardan bölge aktarımı da dener.
   command: "dnsenum {{domain}}"

 - title:
     en: dnsenum - skip reverse lookup
     tr: dnsenum - Tersine sorguyu atlama
   desc:
     en: |
       Runs a standard enumeration but skips the reverse lookup operations. 
       This is useful when you want to speed up the scanning process or when reverse DNS is not relevant to your current goal. 
       It reduces the number of queries sent to the DNS servers, making the scan slightly more stealthy. 
       Use this if the target network range is extremely large and causing performance issues.
     tr: |
       Tersine sorgulama işlemlerini atlayarak standart numaralandırma yapar. Tarama işlemini
       hızlandırmak ya da tersine DNS sorgusunun güncel hedefle ilgisiz olduğu durumlarda
       yararlıdır. DNS sunucularına gönderilen sorgu sayısını azaltır; taramayı bir ölçüde gizli
       kılar. Hedef ağ aralığı çok genişse ve başarım sorunu çıkarıyorsa bu seçenek kullanılmalıdır.
   command: "dnsenum --noreverse {{domain}}"

# === BRUTE FORCE & DICTIONARY ATTACKS ===

 - title:
     en: dnsenum - subdomain brute force
     tr: dnsenum - Alt alan adı kaba kuvveti
   desc:
     en: |
       Attempts to discover subdomains by testing entries from a provided dictionary file. 
       If no file is specified, it typically defaults to the internal dns.txt list provided with the tool. 
       This is essential for finding non-indexed or hidden subdomains like dev, staging, or internal portals. 
       Ensure the wordlist is high-quality to maximize the chances of discovery without excessive noise.
     tr: |
       Verilen sözlük dosyasındaki girdileri deneyerek alt alan adı keşfetmeye çalışır. Dosya
       belirtilmezse araçla gelen dahili dns.txt listesi kullanılır. Dizinde yer almayan dev,
       staging ya da dahili portal gibi gizli alt alan adlarını bulmak için vazgeçilmezdir. Aşırı
       gürültü çıkarmadan keşif şansını büyütmek için nitelikli bir kelime listesi kullanılmalıdır.
   command: "dnsenum -f {{wordlist|/usr/share/dnsenum/dns.txt}} {{domain}}"

 - title:
     en: dnsenum - recursive brute force
     tr: dnsenum - Özyinelemeli kaba kuvvet
   desc:
     en: |
       Enables recursion on subdomains that are discovered and have their own NS records. 
       This allows the tool to automatically pivot and perform brute-forcing on nested subdomains. 
       It is highly effective for large organizations with complex, delegated DNS structures. 
       Be aware that this can significantly increase the duration of the scan and the number of queries.
     tr: |
       Keşfedilen ve kendine ait NS kaydı bulunan alt alan adlarında özyinelemeyi etkinleştirir.
       Böylece araç iç içe alt alan adlarına kendiliğinden yönelip kaba zorlama yapar. Karmaşık,
       devredilmiş DNS yapılı büyük kurumlarda çok etkilidir. Tarama süresini ve sorgu sayısını
       ciddi ölçüde artırabileceği unutulmamalıdır.
   command: "dnsenum -f {{wordlist|/usr/share/dnsenum/dns.txt}} -r {{domain}}"

# === NETWORK & WHOIS ANALYSIS ===

 - title:
     en: dnsenum - whois queries and reverse lookup
     tr: dnsenum - Whois sorguları ve tersine bakış
   desc:
     en: |
       Performs whois queries on Class C network ranges discovered during enumeration and runs reverse lookups. 
       This helps in identifying the full scope of the target's IP space and other hosts residing on the same network. 
       Warning: This operation can generate a massive amount of traffic and may take a long time to complete. 
       Use this only when you have authorization to scan the entire network block associated with the domain.
     tr: |
       Numaralandırma sırasında bulunan C sınıfı ağ aralıklarında Whois sorguları yapar ve tersine
       sorgulama çalıştırır. Hedefin IP alanının bütün kapsamını ve aynı ağda yaşayan başka
       makineleri belirlemeye yardımcı olur. Dikkat: Bu işlem devasa hacimli trafik üretebilir ve
       tamamlanması uzun sürebilir. Yalnızca alan adıyla ilişkili ağ bloğunun tamamını tarama
       yetkisi varken kullanılmalıdır.
   command: "dnsenum -w {{domain}}"

 - title:
     en: dnsenum - comprehensive enumeration shortcut
     tr: dnsenum - Kapsamlı numaralandırma kısayolu
   desc:
     en: |
       Uses the --enum flag, which is a shortcut for a more aggressive and thorough scan. 
       It automatically sets threads to 5, enables whois queries (-w), and sets scraping limits. 
       This is the most efficient way to run a "full" scan with a single command. 
       It is recommended for initial assessment phases where a broad overview of the target is required.
     tr: |
       --enum bayrağını kullanır; bu bayrak daha saldırgan ve etraflı bir taramanın kısayoludur. İş
       parçacığı sayısını kendiliğinden 5 yapar, Whois sorgularını (-w) etkinleştirir ve kazıma
       sınırlarını belirler. Tek komutla tam tarama çalıştırmanın en verimli yoludur. Hedefe dair
       geniş bir genel bakış gereken ilk değerlendirme aşamaları için önerilir.
   command: "dnsenum --enum {{domain}}"

# === ADVANCED CONFIGURATION ===

 - title:
     en: dnsenum - use specific dns server
     tr: dnsenum - Belirli DNS sunucusu kullanma
   desc:
     en: |
       Forces the tool to use a specific DNS server for all A, NS, and MX queries. 
       This is particularly useful if you want to query an internal DNS server directly or bypass a specific recursive resolver. 
       It can also be used to test for inconsistencies between different DNS providers. 
       Ensure the specified server is reachable and allows queries from your current IP.
     tr: |
      Bütün adres, ad sunucusu ve posta değişim sorguları için aracı belirli bir DNS
      sunucusunu kullanmaya zorlar. Dahili DNS sunucusunu doğrudan sorgulamak ya da belirli
      bir özyinelemeli çözümleyiciyi atlamak için özellikle yararlıdır. Farklı DNS sağlayıcılar
      arasındaki tutarsızlıkları sınamak için de kullanılabilir. Belirtilen sunucunun erişilebilir
      ve güncel IP adresinden gelen sorgulara açık olduğu doğrulanmalıdır.
   command: "dnsenum --dnsserver {{dns_server}} {{domain}}"

 - title:
     en: dnsenum - configure thread count and timeout
     tr: dnsenum - İş parçacığı sayısı ve zaman aşımı ayarı
   desc:
     en: |
       Allows manual adjustment of the number of concurrent threads and the query timeout value. 
       Increasing threads can speed up brute-forcing but may lead to rate-limiting or missed results on unstable connections. 
       The timeout value (in seconds) should be adjusted based on the latency of the target DNS servers. 
       Default values are usually sufficient, but optimization is key for large-scale assessments.
     tr: |
       Eşzamanlı iş parçacığı sayısını ve sorgu zaman aşımı değerini elle ayarlamaya olanak tanır.
       İş parçacığını artırmak kaba zorlamayı hızlandırır; ancak kararsız bağlantılarda hız
       sınırlamaya ya da sonuç kaçırmaya yol açabilir. Saniye cinsinden zaman aşımı değeri hedef DNS
       sunucularının gecikmesine göre ayarlanmalıdır. Varsayılan değerler genellikle yeterlidir;
       ancak büyük ölçekli değerlendirmelerde eniyileme belirleyicidir.
   command: "dnsenum --threads {{thread_count|5}} -t {{timeout_seconds|10}} {{domain}}"

# === OUTPUT & DATA MANAGEMENT ===

 - title:
     en: dnsenum - save results to xml
     tr: dnsenum - Sonuçları XML olarak kaydetme
   desc:
     en: |
       Exports the enumeration results into an XML format for integration with other security tools. 
       The generated XML file can be imported into platforms like MagicTree for visualization and reporting. 
       This is crucial for maintaining a structured record of findings during a professional penetration test. 
       The output includes all discovered hosts, IP addresses, and DNS record types.
     tr: |
       Numaralandırma sonuçlarını başka güvenlik araçlarıyla bütünleşmek üzere XML biçiminde dışa
       aktarır. Üretilen XML dosyası görselleştirme ve raporlama için MagicTree gibi ortamlara
       aktarılabilir. Profesyonel bir sızma testi sırasında bulguların düzenli kaydını tutmak için
       kritiktir. Çıktı, bulunan bütün makineleri, IP adreslerini ve DNS kayıt türlerini içerir.
   command: "dnsenum -o {{output_file|results.xml}} {{domain}}"

 - title:
     en: dnsenum - write valid subdomains to file
     tr: dnsenum - Geçerli alt alan adlarını dosyaya yazma
   desc:
     en: |
       Specifically writes only the valid subdomains discovered during the scan to a flat text file. 
       This is extremely useful for piping the results into other tools like HTTP probes (httpx) or vulnerability scanners. 
       It helps in creating a clean "attack surface" list for the next stages of the assessment. 
       Note that this focuses on the hostnames rather than the full DNS record details.
     tr: |
       Tarama sırasında keşfedilen geçerli alt alan adlarından yalnız bunları düz bir metin
       dosyasına yazar. Sonuçları httpx gibi HTTP yoklama araçlarına ya da zafiyet tarayıcılara
       aktarmak için çok yararlıdır. Değerlendirmenin sonraki aşamaları için temiz bir saldırı
       yüzeyi listesi oluşturmaya yardımcı olur. DNS kaydının bütün ayrıntılarından çok makine
       adlarına odaklanır.
   command: "dnsenum --subfile {{subdomain_file|subdomains.txt}} {{domain}}"
