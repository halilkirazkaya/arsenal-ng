tool: impacket-reg
tags: [network, security, pentest, enumeration, exploitation, authentication, windows, registry]

actions:
  # === AUTHENTICATION AND CONNECTIVITY ===
  - title:
      en: impacket-reg - query with password
      tr: impacket-reg - parola ile sorgulama
    desc:
      en: |
        Performs a basic registry query using cleartext password authentication. 
        This is the most straightforward way to list subkeys and values when credentials are known. 
        The command retrieves the next tier of subkeys and entries under the specified path.
        Be aware that using cleartext passwords might leave traces in the command history.
      tr: |
        Açık parola kimlik doğrulaması kullanarak temel bir kayıt defteri sorgusu gerçekleştirir.
        Kimlik bilgileri bilindiğinde alt anahtarları ve değerleri listelemenin en doğrudan yoludur.
        Komut, belirtilen yol altındaki bir sonraki alt anahtar ve girdi katmanını getirir.
        Açık parola kullanmanın komut geçmişinde iz bırakabileceğini unutmayın.
    command: "impacket-reg {{domain|.}}/{{username}}:{{password}}@{{target_ip}} query -keyName {{key_path|HKLM\\SOFTWARE}}"

  - title:
      en: impacket-reg - authenticate using NTLM hashes
      tr: impacket-reg - NTLM hash'leri ile kimlik doğrulaması
    desc:
      en: |
        Connects to the remote registry using Pass-the-Hash (PtH) authentication. 
        This is vital during post-exploitation when you have retrieved NTLM hashes but not the cleartext password. 
        The hash should be provided in the format LMHASH:NTHASH.
        This method allows for stealthier movement within the network as it bypasses the need for the original password.
      tr: |
        Uzak kayıt defterine Pass-the-Hash (PtH) kimlik doğrulaması ile bağlanır.
        NTLM hash'lerini ele geçirip açık parolaya ulaşamadığınız sömürü sonrası aşamada hayati öneme sahiptir.
        Hash, LMHASH:NTHASH biçiminde verilmelidir.
        Bu yöntem, özgün parolaya ihtiyacı ortadan kaldırdığı için ağ içinde daha gizli hareket etmeye olanak tanır.
    command: "impacket-reg {{domain|.}}/{{username}}@{{target_ip}} -hashes {{lmhash:nthash}} query -keyName {{key_path|HKLM\\SYSTEM}}"

  - title:
      en: impacket-reg - kerberos authentication
      tr: impacket-reg - Kerberos kimlik doğrulaması
    desc:
      en: |
        Uses Kerberos tickets for authentication instead of NTLM. 
        This is particularly useful in environments where NTLM is disabled or heavily monitored. 
        The -k flag instructs the tool to use a ccache file (defined in KRB5CCNAME) or the provided credentials.
        Ensure the target name matches the SPN in the ticket and -dc-ip is specified for proper resolution.
      tr: |
        Kimlik doğrulama için NTLM yerine Kerberos biletlerini kullanır.
        NTLM'in devre dışı olduğu veya sıkı izlendiği ortamlarda özellikle faydalıdır.
        -k bayrağı araca bir ccache dosyasını (KRB5CCNAME içinde tanımlı) veya verilen kimlik bilgilerini kullanmasını söyler.
        Hedef adın biletteki SPN ile eşleştiğinden ve doğru çözümleme için -dc-ip belirtildiğinden emin olun.
    command: "impacket-reg {{domain}}/{{username}}@{{target_name}} -k -no-pass -dc-ip {{dc_ip}} query -keyName {{key_path}}"

  # === ENUMERATION ===
  - title:
      en: impacket-reg - list registry subkeys
      tr: impacket-reg - kayıt defteri alt anahtarlarını listeleme
    desc:
      en: |
        Enumerates all subkeys and values within a specific registry hive or path. 
        It is a primary reconnaissance step for finding configuration weaknesses or installed application data. 
        You can specify hives like HKLM (HKEY_LOCAL_MACHINE) or HKCU (HKEY_CURRENT_USER).
        Requires sufficient read permissions on the target registry key.
      tr: |
        Belirli bir kayıt defteri kovanı veya yolu içindeki tüm alt anahtarları ve değerleri listeler.
        Yapılandırma zayıflıklarını veya yüklü uygulama verilerini bulmak için birincil bir keşif adımıdır.
        HKLM (HKEY_LOCAL_MACHINE) veya HKCU (HKEY_CURRENT_USER) gibi kovanlar belirtebilirsiniz.
        Hedef kayıt defteri anahtarı üzerinde yeterli okuma izni gerektirir.
    command: "impacket-reg {{domain|.}}/{{username}}@{{target_ip}} query -keyName {{key_path}}"

  # === DATA EXTRACTION ===
  - title:
      en: impacket-reg - backup SAM/SYSTEM/SECURITY hives
      tr: impacket-reg - SAM/SYSTEM/SECURITY kovanlarını yedekleme
    desc:
      en: |
        Specialized command to remotely back up the most critical Windows registry hives. 
        These files (SAM, SYSTEM, SECURITY) contain the local account hashes and cached domain credentials. 
        Once backed up to your local machine, you can use tools like secretsdump to extract credentials.
        This action typically requires local Administrator or SYSTEM level privileges on the target.
      tr: |
        En kritik Windows kayıt defteri kovanlarını uzaktan yedeklemek için özel komut.
        Bu dosyalar (SAM, SYSTEM, SECURITY) yerel hesap hash'lerini ve önbelleğe alınmış etki alanı kimlik bilgilerini içerir.
        Kendi makinenize yedeklendikten sonra kimlik bilgilerini çıkarmak için secretsdump gibi araçları kullanabilirsiniz.
        Bu işlem genellikle hedefte yerel Administrator veya SYSTEM düzeyinde ayrıcalık gerektirir.
    command: "impacket-reg {{domain|.}}/{{username}}@{{target_ip}} backup"

  - title:
      en: impacket-reg - save specific key to file
      tr: impacket-reg - belirli bir anahtarı dosyaya kaydetme
    desc:
      en: |
        Exports a specific registry subkey and all its recursive content to a local file. 
        This mimics the 'reg save' functionality but works remotely over the SMB protocol. 
        It is useful for capturing specific configurations for offline analysis without downloading the entire hive.
        The output file can later be parsed by registry viewer tools.
      tr: |
        Belirli bir kayıt defteri alt anahtarını ve tüm özyinelemeli içeriğini yerel bir dosyaya aktarır.
        'reg save' işlevini taklit eder ancak SMB protokolü üzerinden uzaktan çalışır.
        Tüm kovanı indirmeden belirli yapılandırmaları çevrimdışı analiz için kaydetmekte faydalıdır.
        Çıktı dosyası daha sonra kayıt defteri görüntüleme araçlarıyla incelenebilir.
    command: "impacket-reg {{domain|.}}/{{username}}@{{target_ip}} save -keyName {{key_path}} -o {{output_filename|key_backup.reg}}"

  # === MODIFICATION AND PERSISTENCE ===
  - title:
      en: impacket-reg - add a new registry entry
      tr: impacket-reg - yeni bir kayıt defteri girdisi ekleme
    desc:
      en: |
        Remotely adds a new subkey or value to the target machine's registry. 
        This is frequently used for establishing persistence, such as adding a command to the 'Run' or 'RunOnce' keys. 
        You must specify the value name (-v), the value type (-vt), and the data (-vd).
        Modifying the registry carries a risk of system instability if incorrect values are added to system-critical keys.
      tr: |
        Hedef makinenin kayıt defterine uzaktan yeni bir alt anahtar veya değer ekler.
        'Run' veya 'RunOnce' anahtarlarına komut eklemek gibi kalıcılık sağlamak için sıkça kullanılır.
        Değer adını (-v), değer türünü (-vt) ve veriyi (-vd) belirtmelisiniz.
        Sistem açısından kritik anahtarlara hatalı değerler eklenirse sistem kararsızlığı riski doğar.
    command: "impacket-reg {{domain|.}}/{{username}}@{{target_ip}} add -keyName {{key_path}} -v {{value_name}} -vt {{type|REG_SZ}} -vd {{value_data}}"

  - title:
      en: impacket-reg - delete a registry entry
      tr: impacket-reg - bir kayıt defteri girdisini silme
    desc:
      en: |
        Removes a specified registry subkey or a specific value from the remote system. 
        This is typically used during the cleanup phase of an engagement to remove persistence mechanisms. 
        If only the -keyName is provided, the entire key is deleted; if -v is provided, only that value is removed.
        Exercise extreme caution, as deleting critical system keys can lead to OS corruption or failure to boot.
      tr: |
        Uzak sistemden belirtilen bir kayıt defteri alt anahtarını veya belirli bir değeri kaldırır.
        Genellikle bir testin temizlik aşamasında kalıcılık mekanizmalarını kaldırmak için kullanılır.
        Yalnızca -keyName verilirse anahtarın tamamı silinir; -v verilirse yalnızca o değer kaldırılır.
        Kritik sistem anahtarlarını silmek işletim sisteminin bozulmasına veya açılmamasına yol açabileceğinden son derece dikkatli olun.
    command: "impacket-reg {{domain|.}}/{{username}}@{{target_ip}} delete -keyName {{key_path}} -v {{value_name}}"

  # === ADVANCED CONNECTIVITY ===
  - title:
      en: impacket-reg - connect to custom SMB port
      tr: impacket-reg - özel SMB portuna bağlanma
    desc:
      en: |
        Forces the tool to connect to a non-standard SMB port. 
        This is used when a target machine has SMB listening on a port other than the default 445 (e.g., through port forwarding). 
        It can also be useful when bypassing certain network filtering rules that block standard ports.
        Ensure the target service is actually an SMB-based registry service.
      tr: |
        Aracı standart dışı bir SMB portuna bağlanmaya zorlar.
        Hedef makinede SMB'nin varsayılan 445 dışındaki bir portta dinlediği durumlarda (örn. port yönlendirme ile) kullanılır.
        Standart portları engelleyen belirli ağ filtreleme kurallarını aşarken de faydalı olabilir.
        Hedef hizmetin gerçekten SMB tabanlı bir kayıt defteri hizmeti olduğundan emin olun.
    command: "impacket-reg {{domain|.}}/{{username}}@{{target_ip}} -port {{port|445}} query -keyName {{key_path}}"

  - title:
      en: impacket-reg - debug connection issues
      tr: impacket-reg - bağlantı sorunlarında hata ayıklama
    desc:
      en: |
        Enables verbose debug output for the connection and registry operations. 
        Use this when you encounter authentication errors, RPC communication failures, or "Access Denied" messages. 
        The debug logs provide detailed information about the SMB/RPC handshake and the specific error codes returned by Windows.
        It is very helpful for troubleshooting complex Kerberos or permission-related issues.
      tr: |
        Bağlantı ve kayıt defteri işlemleri için ayrıntılı hata ayıklama çıktısını etkinleştirir.
        Kimlik doğrulama hataları, RPC iletişim sorunları veya "Access Denied" mesajlarıyla karşılaştığınızda bunu kullanın.
        Hata ayıklama günlükleri, SMB/RPC el sıkışması ve Windows'un döndürdüğü hata kodları hakkında ayrıntılı bilgi sağlar.
        Karmaşık Kerberos veya izin kaynaklı sorunları gidermede çok faydalıdır.
    command: "impacket-reg -debug {{domain|.}}/{{username}}@{{target_ip}} query -keyName {{key_path}}"
