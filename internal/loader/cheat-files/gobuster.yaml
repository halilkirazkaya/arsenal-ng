tool: gobuster
tags: [web, scanning, enumeration, pentest, reconnaissance, dns, brute-force, s3, cloud, security]

actions:
  # === DIRECTORY AND FILE ENUMERATION ===
  - title:
      en: gobuster - basic directory discovery
      tr: gobuster - temel dizin keşfi
    desc:
      en: |
        Perform a standard directory brute-force attack against a target URL.
        This is the most common use case for finding hidden paths, admin panels, or configuration folders.
        It uses the 'dir' mode and requires a wordlist to iterate through potential directory names.
        Ensure you have a reliable wordlist like those found in SecLists or Dirbuster.
      tr: |
        Hedef URL'ye karşı standart bir dizin kaba kuvvet saldırısı yapın.
        Gizli yolları, yönetim panellerini veya yapılandırma klasörlerini bulmanın en yaygın kullanım şeklidir.
        'dir' kipini kullanır ve olası dizin adlarını denemek için bir wordlist gerektirir.
        SecLists veya Dirbuster'dakiler gibi güvenilir bir wordlist'iniz olduğundan emin olun.
    command: "gobuster dir -u {{url}} -w {{wordlist|/usr/share/wordlists/dirb/common.txt}}"

  - title:
      en: gobuster - search for specific file extensions
      tr: gobuster - belirli dosya uzantılarını arama
    desc:
      en: |
        Search for both directories and files with specific extensions simultaneously.
        This is highly effective for finding source code files, backups, or configuration files (e.g., .php, .bak, .zip).
        The -x flag appends the extensions to every word in the wordlist.
        It helps identify the technology stack and potential sensitive data leaks.
      tr: |
        Hem dizinleri hem belirli uzantılara sahip dosyaları aynı anda arayın.
        Kaynak kodu dosyalarını, yedekleri veya yapılandırma dosyalarını (örn. .php, .bak, .zip) bulmak için oldukça etkilidir.
        -x bayrağı uzantıları wordlist'teki her sözcüğe ekler.
        Teknoloji yığınını ve olası hassas veri sızıntılarını belirlemeye yardımcı olur.
    command: "gobuster dir -u {{url}} -w {{wordlist}} -x {{extensions|php,html,txt,bak,zip}}"

  - title:
      en: gobuster - directory scan with status code filtering
      tr: gobuster - durum kodu filtreli dizin taraması
    desc:
      en: |
        Filter the output based on HTTP status codes to reduce noise.
        Use the -b (blacklisted) flag to hide specific codes like 404 or 403, or -s (positive) to only show successes.
        This is crucial when a server returns a 200 OK for every request or when you want to ignore forbidden areas.
        It makes the results much cleaner and easier to analyze during a time-sensitive engagement.
      tr: |
        Gürültüyü azaltmak için çıktıyı HTTP durum kodlarına göre filtreleyin.
        404 veya 403 gibi belirli kodları gizlemek için -b (kara liste), yalnızca başarıları göstermek için -s (pozitif) bayrağını kullanın.
        Sunucu her istekte 200 OK döndürdüğünde veya yasak alanları yoksaymak istediğinizde kritiktir.
        Zaman kısıtlı çalışmalarda sonuçları çok daha temiz ve analiz edilebilir kılar.
    command: "gobuster dir -u {{url}} -w {{wordlist}} -b {{status_codes|404,403}}"

  - title:
      en: gobuster - authenticated directory scan
      tr: gobuster - kimlik doğrulamalı dizin taraması
    desc:
      en: |
        Perform directory enumeration while authenticated using HTTP Basic Auth.
        The -U and -P flags allow you to provide credentials for protected areas of the site.
        This is necessary when the target has a 'dev' or 'staging' area behind a login prompt.
        Failure to provide credentials usually results in 401 Unauthorized responses for all paths.
      tr: |
        HTTP Temel Kimlik Doğrulama ile kimliği doğrulanmış şekilde dizin numaralandırma yapın.
        -U ve -P bayrakları sitenin korumalı alanları için kimlik bilgileri vermenizi sağlar.
        Hedefte giriş istemi arkasında 'dev' veya 'staging' alanı varsa gereklidir.
        Kimlik bilgisi verilmemesi genellikle tüm yollarda 401 Yetkisiz yanıtlarına yol açar.
    command: "gobuster dir -u {{url}} -w {{wordlist}} -U {{username}} -P {{password}}"

  - title:
      en: gobuster - recursive directory scanning
      tr: gobuster - özyineli dizin taraması
    desc:
      en: |
        Automatically scan newly discovered directories in a recursive manner.
        This is useful for deeply nested web applications where manual follow-up would be tedious.
        Use the --depth flag to limit how deep the recursion should go to avoid infinite loops or massive scan times.
        Be cautious as this significantly increases the number of requests sent to the server.
      tr: |
        Yeni keşfedilen dizinleri özyineli şekilde otomatik tarayın.
        Elle takibin sıkıcı olacağı derinden iç içe web uygulamaları için kullanışlıdır.
        Sonsuz döngülerden veya devasa tarama sürelerinden kaçınmak için özyineleme derinliğini --depth bayrağıyla sınırlayın.
        Sunucuya gönderilen istek sayısını ciddi ölçüde artırdığından dikkatli olun.
    command: "gobuster dir -u {{url}} -w {{wordlist}} --recursive --depth {{depth|2}}"

  # === DNS SUBDOMAIN ENUMERATION ===
  - title:
      en: gobuster - dns subdomain enumeration
      tr: gobuster - DNS subdomain numaralandırması
    desc:
      en: |
        Brute-force subdomains for a specific target domain using the 'dns' mode.
        This helps map the external attack surface of an organization by finding hidden sub-environments.
        It relies on DNS resolution rather than HTTP requests, making it useful for finding non-web assets.
        Always use a high-quality subdomain wordlist for better results.
      tr: |
        'dns' kipiyle belirli bir hedef alan adının subdomain'lerine kaba kuvvet uygulayın.
        Gizli alt ortamları bularak kuruluşun dış saldırı yüzeyini haritalamaya yardımcı olur.
        HTTP istekleri yerine DNS çözümlemeye dayanır; web dışı varlıkları bulmak için kullanışlıdır.
        Daha iyi sonuçlar için daima kaliteli bir subdomain wordlist'i kullanın.
    command: "gobuster dns -d {{domain}} -w {{wordlist|/usr/share/wordlists/dirb/subdomains-top1mil-5000.txt}}"

  - title:
      en: gobuster - dns scan with wildcard handling
      tr: gobuster - joker kayıt yönetimli DNS taraması
    desc:
      en: |
        Perform a DNS scan while ignoring domains that resolve to a specific 'wildcard' IP address.
        Many organizations use wildcard DNS records, which can lead to many false positives in a standard scan.
        Gobuster can automatically detect wildcards, but you can also manually specify IPs to ignore.
        This ensures that the results only contain valid, uniquely configured subdomains.
      tr: |
        Belirli bir 'joker' IP adresine çözümlenen alan adlarını yoksayarak DNS taraması yapın.
        Birçok kuruluş joker DNS kaydı kullanır; bu standart taramada çok sayıda yanlış pozitife yol açabilir.
        Gobuster jokerleri otomatik tespit edebilir, ancak yoksayılacak IP'leri elle de belirtebilirsiniz.
        Bu, sonuçların yalnızca geçerli, benzersiz yapılandırılmış subdomain'leri içermesini sağlar.
    command: "gobuster dns -d {{domain}} -w {{wordlist}} -i"

  # === VIRTUAL HOST ENUMERATION ===
  - title:
      en: gobuster - virtual host (VHOST) discovery
      tr: gobuster - sanal host (VHOST) keşfi
    desc:
      en: |
        Identify virtual hosts on a web server by brute-forcing the 'Host' header.
        This is different from DNS enumeration because it checks if the server responds differently to different Host headers on the same IP.
        It is essential for discovering sites that are hosted on the same infrastructure but not publicly indexed in DNS.
        Usually, you should point the URL to the direct IP address of the target server.
      tr: |
        'Host' başlığına kaba kuvvet uygulayarak bir web sunucusundaki sanal hostları belirleyin.
        DNS numaralandırmadan farklıdır çünkü sunucunun aynı IP'de farklı Host başlıklarına farklı yanıt verip vermediğini denetler.
        Aynı altyapıda barındırılıp DNS'te genel olarak dizine eklenmemiş siteleri keşfetmek için gereklidir.
        Genellikle URL'yi hedef sunucunun doğrudan IP adresine yöneltmelisiniz.
    command: "gobuster vhost -u {{url}} -w {{wordlist}}"

  # === CLOUD BUCKET ENUMERATION ===
  - title:
      en: gobuster - amazon s3 bucket enumeration
      tr: gobuster - amazon S3 kovası numaralandırması
    desc:
      en: |
        Search for open or existing Amazon S3 buckets using a wordlist of potential bucket names.
        This is a common method for finding leaked data, backups, or publicly accessible assets in the cloud.
        It checks for bucket existence and tries to determine if the bucket is publicly listable.
        Cloud security misconfigurations are a high-impact finding in modern pentesting.
      tr: |
        Olası kova adlarından oluşan bir wordlist ile açık veya mevcut Amazon S3 kovalarını arayın.
        Buluttaki sızmış verileri, yedekleri veya herkese açık varlıkları bulmanın yaygın bir yoludur.
        Kovanın varlığını denetler ve herkese açık listelenebilir olup olmadığını belirlemeye çalışır.
        Bulut güvenlik yanlış yapılandırmaları modern sızma testlerinde yüksek etkili bir bulgudur.
    command: "gobuster s3 -w {{wordlist}}"

  - title:
      en: gobuster - google cloud storage (GCS) enumeration
      tr: gobuster - google bulut depolama (GCS) numaralandırması
    desc:
      en: |
        Search for publicly accessible Google Cloud Storage buckets.
        Similar to the S3 module, it uses a wordlist to find bucket names that might belong to the target organization.
        This is part of the 'gcs' command suite in newer Gobuster versions.
        It is highly effective for identifying shadow IT or forgotten cloud resources.
      tr: |
        Herkese açık Google Bulut Depolama kovalarını arayın.
        S3 modülüne benzer şekilde hedef kuruluşa ait olabilecek kova adlarını bulmak için wordlist kullanır.
        Yeni Gobuster sürümlerindeki 'gcs' komut takımının bir parçasıdır.
        Gölge BT veya unutulmuş bulut kaynaklarını belirlemede oldukça etkilidir.
    command: "gobuster gcs -w {{wordlist}}"

  # === FUZZING AND OTHER MODES ===
  - title:
      en: gobuster - custom fuzzing mode
      tr: gobuster - özel bulanıklaştırma kipi
    desc:
      en: |
        Use the 'fuzz' mode to replace the 'FUZZ' keyword in a URL, Header, or Request Body.
        This provides the most flexibility, allowing you to brute-force parameters, headers, or specific URL parts.
        It is a lighter alternative to tools like ffuf or Burp Intruder for simple fuzzing tasks.
        Great for testing API endpoints or specific query string parameters.
      tr: |
        Bir URL, başlık veya istek gövdesindeki 'FUZZ' anahtar sözcüğünü değiştirmek için 'fuzz' kipini kullanın.
        Bu, parametrelere, başlıklara veya belirli URL parçalarına kaba kuvvet uygulayarak en fazla esnekliği sağlar.
        Basit bulanıklaştırma işleri için ffuf veya Burp Intruder gibi araçlara daha hafif bir alternatiftir.
        API uç noktalarını veya belirli sorgu dizesi parametrelerini test etmek için idealdir.
    command: "gobuster fuzz -u {{url}}/index.php?id=FUZZ -w {{wordlist}}"

  - title:
      en: gobuster - tftp server enumeration
      tr: gobuster - tftp sunucusu numaralandırması
    desc:
      en: |
        Brute-force filenames on a TFTP (Trivial File Transfer Protocol) server.
        TFTP does not provide a way to list files, so you must guess the filenames to download them.
        This is common in internal network assessments involving VoIP phones, routers, or PXE boot servers.
        Finding configuration files via TFTP can often lead to credential disclosure.
      tr: |
        Bir TFTP (Basit Dosya Aktarım Protokolü) sunucusunda dosya adlarına kaba kuvvet uygulayın.
        TFTP dosya listeleme yolu sunmaz; bu yüzden indirmek için dosya adlarını tahmin etmelisiniz.
        VoIP telefonları, yönlendiriciler veya PXE önyükleme sunucuları içeren iç ağ değerlendirmelerinde yaygındır.
        TFTP ile yapılandırma dosyaları bulmak çoğu zaman kimlik bilgisi açığa çıkmasına yol açabilir.
    command: "gobuster tftp -s {{server_ip}} -w {{wordlist}}"
