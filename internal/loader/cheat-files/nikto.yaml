tool: nikto
tags: [web, scanner, security, pentest, vulnerability, enumeration, reconnaissance]

# === BASIC SCANS ===

actions:
 - title:
     en: nikto - basic scan
     tr: nikto - temel tarama
   desc:
     en: |
       Performs a standard vulnerability scan against a target host on the default port.
       This is the most common starting point for web server reconnaissance to identify outdated software and common misconfigurations.
       It checks for over 6700 potentially dangerous files/programs and reports outdated server versions.
     tr: |
       Varsayılan portta hedef makineye karşı standart bir zafiyet taraması gerçekleştirir.
       Güncel olmayan yazılımları ve yaygın yanlış yapılandırmaları belirlemek için web sunucusu keşfinde en yaygın başlangıç noktasıdır.
       6700'den fazla potansiyel tehlikeli dosya/programı denetler ve güncel olmayan sunucu sürümlerini raporlar.
   command: "nikto -h {{target}}"

 - title:
     en: nikto - scan with ssl/tls
     tr: nikto - ssl/tls ile tarama
   desc:
     en: |
       Forces the use of SSL/TLS for the connection to the target server.
       This is necessary when scanning HTTPS websites or services running on port 443.
       Nikto will attempt to negotiate a secure connection before starting the vulnerability tests.
     tr: |
       Hedef sunucuya bağlantı için SSL/TLS kullanımına zorlar.
       HTTPS siteleri veya 443 portunda çalışan hizmetler taranırken gereklidir.
       Nikto zafiyet testlerine başlamadan önce güvenli bir bağlantı kurmaya çalışır.
   command: "nikto -h {{target}} -ssl"

 - title:
     en: nikto - scan specific port
     tr: nikto - belirli portu tarama
   desc:
     en: |
       Directs the scanner to a specific port number where the web service is running.
       This is useful for non-standard ports like 8080, 8443, or development environments.
       By default, if the port is 443, Nikto will automatically attempt to use SSL.
     tr: |
       Tarayıcıyı web hizmetinin çalıştığı belirli bir port numarasına yönlendirir.
       8080, 8443 gibi standart dışı portlar veya geliştirme ortamları için kullanışlıdır.
       Varsayılan olarak port 443 ise Nikto otomatik olarak SSL kullanmaya çalışır.
   command: "nikto -h {{target}} -p {{port|8080}}"

# === REPORTING AND OUTPUT ===

 - title:
     en: nikto - export results to file
     tr: nikto - sonuçları dosyaya aktarma
   desc:
     en: |
       Saves the scan results into a specific file format for later analysis or reporting.
       Supported formats include htm, csv, json, xml, and txt.
       This is essential for documenting findings during a penetration test or security audit.
     tr: |
       Tarama sonuçlarını daha sonra analiz veya raporlama için belirli bir dosya biçimine kaydeder.
       Desteklenen biçimler htm, csv, json, xml ve txt içerir.
       Sızma testi veya güvenlik denetimi sırasında bulguları belgelemek için gereklidir.
   command: "nikto -h {{target}} -o {{output_file|report.html}} -Format {{format|htm}}"

# === SCAN TUNING AND OPTIMIZATION ===

 - title:
     en: nikto - targeted tuning
     tr: nikto - hedefli ayar
   desc:
     en: |
       Runs only specific categories of tests to make the scan faster and more focused.
       Tuning options include (4) Injection, (9) SQL Injection, (a) Auth Bypass, and (b) Software Identification.
       This reduces the noise generated on the network and minimizes the risk of triggering security alerts for unrelated issues.
     tr: |
       Taramayı daha hızlı ve odaklı yapmak için yalnızca belirli test kategorilerini çalıştırır.
       Ayar seçenekleri (4) Enjeksiyon, (9) SQL Enjeksiyonu, (a) Kimlik Doğrulama Atlatma ve (b) Yazılım Belirleme içerir.
       Bu, ağda üretilen gürültüyü azaltır ve ilgisiz konularda güvenlik uyarılarını tetikleme riskini en aza indirir.
   command: "nikto -h {{target}} -Tuning {{tuning_options|123bde}}"

 - title:
     en: nikto - exclude specific tests
     tr: nikto - belirli testleri hariç tutma
   desc:
     en: |
       Runs all available tests except for the ones specified in the tuning string using the 'x' flag.
       For example, you might want to exclude Denial of Service (6) tests to ensure server stability.
       This is a safer approach when scanning production environments where uptime is critical.
     tr: |
       'x' bayrağıyla ayar dizesinde belirtilenler dışındaki tüm testleri çalıştırır.
       Örneğin sunucu kararlılığını sağlamak için Hizmet Dışı Bırakma (6) testlerini hariç tutmak isteyebilirsiniz.
       Çalışma süresinin kritik olduğu üretim ortamlarını tararken bu daha güvenli bir yaklaşımdır.
   command: "nikto -h {{target}} -Tuning x{{exclude_options|6}}"

 - title:
     en: nikto - set maximum scan time
     tr: nikto - maksimum tarama süresi ayarlama
   desc:
     en: |
       Limits the total duration of the scan to prevent it from running indefinitely.
       You can specify time in hours (h), minutes (m), or seconds (s).
       This is particularly useful in automated CI/CD pipelines or when working within strict testing windows.
     tr: |
       Taramayı süresiz çalışmaktan alıkoymak için toplam süresini sınırlar.
       Süreyi saat (h), dakika (m) veya saniye (s) cinsinden belirtebilirsiniz.
       Otomatik CI/CD hatlarında veya dar test pencerelerinde çalışırken özellikle kullanışlıdır.
   command: "nikto -h {{target}} -maxtime {{time|1h}}"

# === AUTHENTICATION AND EVASION ===

 - title:
     en: nikto - authenticated scan
     tr: nikto - kimlik doğrulamalı tarama
   desc:
     en: |
       Performs a scan using HTTP Basic Authentication credentials.
       The format required is 'id:password' or 'id:password:realm'.
       Be cautious as incorrect credentials might trigger account lockout policies on the target system.
     tr: |
       HTTP Temel Kimlik Doğrulama kimlik bilgileriyle tarama gerçekleştirir.
       Gerekli biçim 'id:password' veya 'id:password:realm' şeklindedir.
       Yanlış kimlik bilgileri hedef sistemde hesap kilitleme ilkelerini tetikleyebileceğinden dikkatli olun.
   command: "nikto -h {{target}} -id {{username}}:{{password}}"

 - title:
     en: nikto - ids evasion techniques
     tr: nikto - ids atlatma teknikleri
   desc:
     en: |
       Employs various encoding and request manipulation techniques to bypass Intrusion Detection Systems (IDS).
       Options include (1) Random URI encoding, (5) Fake parameters, and (8) Windows directory separators.
       Note that using multiple evasion techniques will significantly slow down the overall scan speed.
     tr: |
       Saldırı Tespit Sistemlerini (IDS) aşmak için çeşitli kodlama ve istek manipülasyon teknikleri kullanır.
       Seçenekler (1) Rastgele URI kodlama, (5) Sahte parametreler ve (8) Windows dizin ayırıcılarını içerir.
       Birden fazla atlatma tekniği kullanmanın toplam tarama hızını önemli ölçüde yavaşlatacağını unutmayın.
   command: "nikto -h {{target}} -evasion {{evasion_type|15}}"

 - title:
     en: nikto - use proxy
     tr: nikto - proxy kullanma
   desc:
     en: |
       Routes all scan traffic through a defined proxy server like Burp Suite or a SOCKS proxy.
       The proxy details must be configured in the nikto.conf file or passed as a command-line argument.
       This is useful for intercepting Nikto's requests for manual analysis or bypassing IP-based restrictions.
     tr: |
       Tüm tarama trafiğini Burp Suite veya SOCKS proxy gibi tanımlı bir proxy sunucusundan yönlendirir.
       Proxy ayrıntıları nikto.conf dosyasında yapılandırılmalı veya komut satırı bağımsız değişkeni olarak verilmelidir.
       Nikto isteklerini manuel analiz için araya girmek veya IP tabanlı kısıtlamaları aşmak için kullanışlıdır.
   command: "nikto -h {{target}} -useproxy http://{{proxy_ip|127.0.0.1}}:{{proxy_port|8080}}"

# === ADVANCED ENUMERATION ===

 - title:
     en: nikto - directory and user mutation
     tr: nikto - dizin ve kullanıcı mutasyonu
   desc:
     en: |
       Attempts to guess additional file names, directory names, or usernames via various mutation techniques.
       Mutation (3) enumerates usernames via Apache /~user requests, while (6) guesses directory names from a dictionary.
       This helps discover hidden assets or backup files that are not linked directly within the web application.
     tr: |
       Çeşitli mutasyon teknikleriyle ek dosya adları, dizin adları veya kullanıcı adları tahmin etmeye çalışır.
       Mutasyon (3) Apache /~user istekleriyle kullanıcı adlarını numaralandırırken (6) sözlükten dizin adları tahmin eder.
       Bu, web uygulaması içinde doğrudan bağlantısı olmayan gizli varlıkları veya yedek dosyaları keşfetmeye yardımcı olur.
   command: "nikto -h {{target}} -mutate {{mutation_type|3,6}}"

 - title:
     en: nikto - virtual host scanning
     tr: nikto - sanal host taraması
   desc:
     en: |
       Specifies a virtual host name to be sent in the HTTP Host header.
       This is critical when the target IP address hosts multiple websites (Shared Hosting).
       Without this flag, the scanner might only test the default site associated with the IP address.
     tr: |
       HTTP Host başlığında gönderilecek bir sanal host adı belirtir.
       Hedef IP adresi birden fazla web sitesi barındırdığında (Paylaşımlı Barındırma) kritik öneme sahiptir.
       Bu bayrak olmadan tarayıcı yalnızca IP adresiyle ilişkili varsayılan siteyi test edebilir.
   command: "nikto -h {{target}} -vhost {{domain_name}}"

# === UTILITY ===

 - title:
     en: nikto - list plugins
     tr: nikto - eklentileri listeleme
   desc:
     en: |
       Lists all available plugins that Nikto can use to perform security checks.
       No actual scanning is performed when this flag is used.
       It is a good way to verify your installation and see what specific vulnerabilities Nikto is capable of detecting.
     tr: |
       Nikto'nun güvenlik denetimleri için kullanabileceği tüm eklentileri listeler.
       Bu bayrak kullanıldığında gerçek bir tarama yapılmaz.
       Kurulumunuzu doğrulamak ve Nikto'nun hangi zafiyetleri tespit edebildiğini görmek için iyi bir yoldur.
   command: "nikto -list-plugins"
