        Authenticate to WMI using Windows authentication. Default authentication
        method. Uses Windows credentials for WMI access.
      tr: |
        Windows kimlik doğrulamasıyla WMI kimlik doğrulaması yapar. Varsayılan yöntemdir. WMI
        erişiminde Windows bilgisi kullanılır.
    command: "nxc wmi {{target}} -u {{username}} -p {{password}}"

  - title:
      en: nxc wmi - authenticate Windows auth with domain
      tr: nxc wmi - etki alanı belirterek Windows kimlik doğrulaması
    desc:
      en: |
        Authenticate to WMI with Windows auth when SMB port is closed. Specify
        domain with -d flag to avoid SMB connection.
      tr: |
        SMB bağlantı noktası kapalıyken etki alanı belirterek WMI kimlik doğrulaması yapar. SMB
        bağlantısından kaçınmak için -d bayrağıyla etki alanı verilir.
    command: "nxc wmi {{target}} -u {{username}} -p {{password}} -d {{domain|DOMAIN}}"

  - title:
      en: nxc wmi - authenticate local auth
      tr: nxc wmi - yerel kimlik doğrulama
    desc:
      en: |
        Authenticate to WMI using local authentication. Use --local-auth flag
        for local account instead of domain account.
      tr: |
        Yerel kimlik doğrulamayla WMI kimlik doğrulaması yapar. Etki alanı hesabı yerine yerel hesap
        için --local-auth bayrağı kullanılır.
    command: "nxc wmi {{target}} -u {{username}} -p {{password}} --local-auth"

  - title:
      en: nxc wmi - execute command
      tr: nxc wmi - uzaktan komut çalıştırma
    desc:
      en: |
        Execute command on remote system via WMI. Runs command through WMI
        and displays output. Shows (Pwn3d!) when local admin access is obtained.
      tr: |
        WMI üzerinden uzak sistemde komut çalıştırır. Komut WMI aracılığıyla koşulur, çıktısı
        görüntülenir. Yerel yönetici erişiminde (Pwn3d!) görüntülenir.
    command: "nxc wmi {{target}} -u {{username}} -p {{password}} -x {{command|whoami}}"

  - title:
      en: nxc wmi - password spray
      tr: nxc wmi - parola püskürtme
    desc:
      en: |
        Password spray against WMI services. Tests credentials against multiple
        WMI hosts. Use --no-bruteforce for 1:1 user:password mapping.
      tr: |
        WMI hizmetlerine parola püskürtme yapar. Bilgiler birden çok WMI makinesinde sınanır.
        Birebir kullanıcı:parola eşleşmesi için --no-bruteforce kullanılır.
    command: "nxc wmi {{target}} -u {{users_file|~/users.txt}} -p {{password|Summer18}}"

