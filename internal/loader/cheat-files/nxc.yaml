  - title:
      en: nxc ftp - basic authentication
      tr: nxc ftp - temel kimlik doğrulama
    desc:
      en: |
        Authenticate to FTP server with username and password. Tests FTP
        credentials. No (Pwn3d!) check for FTP protocol.
      tr: |
        Kullanıcı adı ile parolayla FTP kimlik doğrulaması yapar. FTP bilgisi sınanır. FTP
        protokolünde (Pwn3d!) denetimi bulunmaz.
    command: "nxc ftp {{target}} -u {{username}} -p {{password}}"

  - title:
      en: nxc ftp - password spray
      tr: nxc ftp - parola püskürtme
    desc:
      en: |
        Password spray against FTP servers. Tests credentials against multiple
        FTP hosts. Use --no-bruteforce for 1:1 user:password mapping.
      tr: |
        FTP sunucularına parola püskürtme yapar. Bilgiler birden çok FTP makinesinde sınanır. Birebir
        kullanıcı:parola eşleşmesi için --no-bruteforce kullanılır.
    command: "nxc ftp {{target}} -u {{users_file|~/users.txt}} -p {{passwords_file|~/passwords.txt}} --no-bruteforce"

  - title:
      en: nxc ftp - password spray with continue on success
      tr: nxc ftp - başarıda durmadan parola püskürtme
    desc:
      en: |
        Password spray continuing after successful login. Useful for spraying
        single password against large user list.
      tr: |
        Başarılı girişten sonra durmadan püskürtmeye devam eder. Tek parolayı kalabalık kullanıcı
        listesinde püskürtürken işe yarar.
    command: "nxc ftp {{target}} -u {{users_file|~/users.txt}} -p {{password|Summer18}} --continue-on-success"

  - title:
      en: nxc ftp - list files
      tr: nxc ftp - dosya listeleme
    desc:
      en: |
        List files on FTP server. Enumerates files and directories in FTP
        share. Useful for reconnaissance.
      tr: |
        FTP sunucusundaki dosyaları listeler. FTP paylaşımındaki dosya ile dizinler listelenir. Keşif
        için işe yarar.
    command: "nxc ftp {{target}} -u {{username}} -p {{password}} --list"

  - title:
      en: nxc ftp - get file from remote
      tr: nxc ftp - uzaktan dosya indirme
    desc:
      en: |
        Download file from FTP server. Transfers file from remote to local
        system via FTP.
      tr: |
        FTP sunucusundan dosya indirir. Dosya FTP aracılığıyla uzaktan yerele aktarılır.
    command: "nxc ftp {{target}} -u {{username}} -p {{password}} --get-file {{remote_path|/file.txt}} {{local_path|/tmp/file.txt}}"

  - title:
      en: nxc ftp - put file to remote
      tr: nxc ftp - uzak sunucuya dosya yükleme
    desc:
      en: |
        Upload file to FTP server. Transfers local file to remote system via FTP.
      tr: |
        FTP sunucusuna dosya yükler. Yerel dosya FTP aracılığıyla uzak sisteme aktarılır.
    command: "nxc ftp {{target}} -u {{username}} -p {{password}} --put-file {{local_path|/tmp/file.txt}} {{remote_path|/file.txt}}"

  # ============================================================================
  # NFS PROTOCOL
  # ============================================================================

  - title:
      en: nxc nfs - enumerate NFS server
      tr: nxc nfs - NFS sunucusunu inceleme
    desc:
      en: |
        Enumerate NFS server information. Detects supported NFS versions and
        checks for root escape vulnerability.
      tr: |
        NFS sunucu bilgisini inceler. Desteklenen NFS sürümleri bulunur, kök kaçış zafiyeti
        denetlenir.
    command: "nxc nfs {{target}}"

  - title:
      en: nxc nfs - enumerate shares
      tr: nxc nfs - dışa aktarılan paylaşımları listeleme
    desc:
      en: |
        Enumerate exported NFS shares. Lists all available NFS shares with
        permissions, storage usage, and access lists.
      tr: |
        Dışa aktarılan NFS paylaşımlarını listeler. Bütün NFS paylaşımları izinler, disk kullanımı ile
        erişim listeleriyle görüntülenir.
    command: "nxc nfs {{target}} --shares"

  - title:
      en: nxc nfs - list files on share
      tr: nxc nfs - paylaşım içindeki dosyaları listeleme
    desc:
      en: |
        List files on specific NFS share. Shows files and directories in
        specified share path.
      tr: |
        Belirli NFS paylaşımındaki dosyaları listeler. Belirtilen paylaşım yolundaki dosya ile
        dizinler görüntülenir.
    command: "nxc nfs {{target}} --share {{share_path|/var/nfs/general}} --ls {{path|/}}"

  - title:
      en: nxc nfs - enumerate shares recursively
      tr: nxc nfs - özyineli paylaşımları listeleme
    desc:
      en: |
        Enumerate all files recursively on NFS shares. Recursively discovers
        files and folders with specified depth (default 3).
      tr: |
        NFS paylaşımlarındaki bütün dosyaları özyineli listeler. Belirtilen derinlikle (varsayılan 3)
        dosya ile klasörler özyineli keşfedilir.
    command: "nxc nfs {{target}} --enum-shares"

  - title:
      en: nxc nfs - enumerate with custom depth
      tr: nxc nfs - özel derinlikle özyineli listeleme
    desc:
      en: |
        Enumerate shares with custom recursion depth. Specify depth for
        recursive enumeration (default is 3 layers).
      tr: |
        Özel özyin derinliğiyle paylaşım listeler. Özyineli listeleme için derinlik belirtilir
        (varsayılan 3 katman).
    command: "nxc nfs {{target}} --enum-shares {{depth|5}}"

  - title:
      en: nxc nfs - download file
      tr: nxc nfs - paylaşımdan dosya indirme
    desc:
      en: |
        Download file from NFS share. Transfers file from remote NFS share
        to local system.
      tr: |
        NFS paylaşımından dosya indirir. Uzak NFS paylaşımındaki dosya yerel sisteme aktarılır.
    command: "nxc nfs {{target}} --share {{share_path|/var/nfs/general}} --get-file {{remote_path|/file.txt}} {{local_path|/tmp/file.txt}}"

  - title:
      en: nxc nfs - upload file
      tr: nxc nfs - paylaşıma dosya yükleme
    desc:
      en: |
        Upload file to NFS share. Transfers local file to remote NFS share.
      tr: |
        NFS paylaşımına dosya yükler. Yerel dosya uzak NFS paylaşımına aktarılır.
    command: "nxc nfs {{target}} --share {{share_path|/var/nfs/general}} --put-file {{local_path|/tmp/file.txt}} {{remote_path|/file.txt}}"

  - title:
      en: nxc nfs - escape to root filesystem
      tr: nxc nfs - kök dizine kaçış denemesi
    desc:
      en: |
        Attempt root filesystem escape on NFS. Exploits NFS misconfiguration
        to access root filesystem. Requires root escape vulnerability.
      tr: |
        NFS üzerinde kök dizine kaçış dener. Yanlış yapılandırmadan yararlanarak kök dosya sistemine
        erişilmeye çalışılır. Kök kaçış zafiyeti gerekir.
    command: "nxc nfs {{target}} --root-escape"

