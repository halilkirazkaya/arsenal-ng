tool: impacket-registry-read
tags: [pentest, forensic, windows, registry, impacket, security, enumeration]

actions:
  # === BASIC ENUMERATION ===
  - title:
      en: impacket-registry-read - enumerate subkeys
      tr: impacket-registry-read - alt anahtarları listeleme
    desc:
      en: |
        Lists all subkeys for a specific registry path within an offline hive file. This is useful for mapping out the structure of a registry hive that has been extracted from a target system, such as via Volume Shadow Copies or manual dumping. It helps identifying installed software, system configuration nodes, or persistence locations. You must provide a valid path to a hive file like SYSTEM, SOFTWARE, or SAM.
      tr: |
        Çevrimdışı bir kovan dosyası içindeki belirli bir kayıt defteri yolunun tüm alt anahtarlarını listeler. Volume Shadow Copy veya elle döküm gibi yöntemlerle hedef sistemden çıkarılmış bir kovanın yapısını haritalamak için faydalıdır. Yüklü yazılımları, sistem yapılandırma düğümlerini veya kalıcılık konumlarını belirlemeye yardımcı olur. SYSTEM, SOFTWARE veya SAM gibi bir kovan dosyasına geçerli bir yol vermelisiniz.
    command: "impacket-registry-read {{hive_path}} enum_key -keyName {{key_path}}"

  - title:
      en: impacket-registry-read - enumerate values
      tr: impacket-registry-read - değerleri listeleme
    desc:
      en: |
        Retrieves all value names and their corresponding types within a specific registry key. This action is essential for identifying what data is actually stored inside a key once you have navigated to the correct path. It is commonly used during forensic analysis to find system settings, user activity logs, or network configurations. Ensure the key path is provided in the format expected by the hive (e.g., ControlSet001\Services).
      tr: |
        Belirli bir kayıt defteri anahtarı içindeki tüm değer adlarını ve bunlara karşılık gelen türleri getirir. Doğru yola ulaştıktan sonra bir anahtarın içinde gerçekte hangi verinin saklandığını belirlemek için bu işlem gereklidir. Adli analiz sırasında sistem ayarlarını, kullanıcı etkinlik günlüklerini veya ağ yapılandırmalarını bulmak için yaygın kullanılır. Anahtar yolunun kovanın beklediği biçimde verildiğinden emin olun (örn. ControlSet001\Services).
    command: "impacket-registry-read {{hive_path}} enum_values -keyName {{key_path}}"

  # === DATA EXTRACTION ===
  - title:
      en: impacket-registry-read - get specific value data
      tr: impacket-registry-read - belirli bir değerin verisini alma
    desc:
      en: |
        Extracts and displays the actual data content stored in a specific registry value. This command is critical for reading sensitive information like the BootKey, service parameters, or encoded configuration strings. It requires both the specific key path and the exact value name you wish to query. This is typically the final step after identifying an interesting value via the enumeration commands.
      tr: |
        Belirli bir kayıt defteri değerinde saklanan gerçek veri içeriğini çıkarır ve gösterir. BootKey, hizmet parametreleri veya kodlanmış yapılandırma dizgileri gibi hassas bilgileri okumak için bu komut kritik öneme sahiptir. Hem belirli anahtar yolunu hem de sorgulamak istediğiniz değerin tam adını gerektirir. Bu genellikle listeleme komutlarıyla ilginç bir değer tespit edildikten sonraki son adımdır.
    command: "impacket-registry-read {{hive_path}} get_value -keyName {{key_path}} -valueName {{value_name}}"

  - title:
      en: impacket-registry-read - get class information
      tr: impacket-registry-read - sınıf bilgisini alma
    desc:
      en: |
        Retrieves the class information associated with a specified registry key. While used less frequently in standard penetration tests, it provides metadata about the registry object that can be useful for deep forensic investigations. It can help distinguish between different types of registry nodes or objects defined by the Windows Object Manager. This provides a lower-level view of how the registry hive is structured internally.
      tr: |
        Belirtilen bir kayıt defteri anahtarıyla ilişkili sınıf bilgisini getirir. Standart sızma testlerinde daha seyrek kullanılsa da derin adli incelemeler için faydalı olabilecek kayıt defteri nesnesi üstverisini sağlar. Windows Object Manager tarafından tanımlanan farklı kayıt defteri düğümü veya nesne türlerini ayırt etmeye yardımcı olabilir. Kayıt defteri kovanının içten nasıl yapılandığına dair daha düşük seviyeli bir görünüm sunar.
    command: "impacket-registry-read {{hive_path}} get_class -keyName {{key_path}}"

  # === ADVANCED OPERATIONS ===
  - title:
      en: impacket-registry-read - recursive walk
      tr: impacket-registry-read - özyinelemeli tarama
    desc:
      en: |
        Recursively traverses the entire registry hive starting from the specified node or the root. This is the most comprehensive way to dump the structure of an entire hive for offline analysis and searching. Be aware that this can produce a very large volume of output, especially for large hives like SOFTWARE. It is highly recommended to redirect the output to a text file for later processing.
      tr: |
        Belirtilen düğümden veya kökten başlayarak kayıt defteri kovanının tamamını özyinelemeli olarak dolaşır. Çevrimdışı analiz ve arama için bir kovanın yapısını dökmenin en kapsamlı yoludur. Özellikle SOFTWARE gibi büyük kovanlarda çok büyük hacimde çıktı üretebileceğini unutmayın. Çıktıyı daha sonra işlemek üzere bir metin dosyasına yönlendirmeniz önemle önerilir.
    command: "impacket-registry-read {{hive_path}} walk -keyName {{start_key|/}}"

  - title:
      en: impacket-registry-read - debug mode with timestamps
      tr: impacket-registry-read - zaman damgalı hata ayıklama kipi
    desc:
      en: |
        Runs the registry parsing operation with verbose debugging output and timestamps for every log entry. This is indispensable for troubleshooting issues where the tool might fail to parse a corrupted or locked hive file. Timestamps help security researchers correlate tool activities with other system logs during a forensic timeline reconstruction. Use this if the standard commands are not returning the expected data or throwing errors.
      tr: |
        Kayıt defteri çözümleme işlemini ayrıntılı hata ayıklama çıktısı ve her günlük girdisi için zaman damgalarıyla çalıştırır. Aracın bozuk veya kilitli bir kovan dosyasını çözümleyemediği sorunları gidermede vazgeçilmezdir. Zaman damgaları, adli zaman çizelgesi rekonstrüksiyonu sırasında güvenlik araştırmacılarının araç etkinliklerini diğer sistem günlükleriyle ilişkilendirmesine yardımcı olur. Standart komutlar beklenen veriyi döndürmüyor veya hata veriyorsa bunu kullanın.
    command: "impacket-registry-read {{hive_path}} -debug -ts walk"

  - title:
      en: impacket-registry-read - read root of a hive
      tr: impacket-registry-read - bir kovanın kökünü okuma
    desc:
      en: |
        Enumerates the top-level keys available at the root of a provided hive file. This is usually the first command run when you are unsure of the internal structure of a found hive. It allows you to see the primary branches before diving deeper into subkeys. It is a safe way to verify that the hive file is valid and readable by the tool.
      tr: |
        Verilen bir kovan dosyasının kökündeki üst düzey anahtarları listeler. Bulunan bir kovanın iç yapısından emin olunmadığında genellikle çalıştırılan ilk komuttur. Alt anahtarlara inmeden önce birincil dalları görmenizi sağlar. Kovan dosyasının geçerli ve araç tarafından okunabilir olduğunu doğrulamanın güvenli bir yoludur.
    command: "impacket-registry-read {{hive_path}} enum_key -keyName {{root_path|/}}"
