tool: caido-cli
tags: [web, security, proxy, pentest, interception, enumeration]

actions:
# === BASIC SERVICE MANAGEMENT ===
 - title:
     en: caido-cli - basic start
     tr: caido-cli - temel başlatma
   desc:
     en: |
       Starts the Caido instance with default settings. This command initiates the backend 
       and typically opens the web interface in your default browser. It is the quickest 
       way to begin a web security audit session.
     tr: |
       Caido örneğini varsayılan ayarlarla başlatır. Bu komut arka ucu başlatır
       ve genellikle web arayüzünü varsayılan tarayıcınızda açar. Bir web güvenliği
       denetim oturumuna başlamanın en hızlı yoludur.
   command: "caido-cli"

 - title:
     en: caido-cli - listen on specific address
     tr: caido-cli - belirli adreste dinleme
   desc:
     en: |
       Configures the primary listening address and port for the Caido service. Use this 
       when you need the service to be accessible on a specific network interface, 
       such as a VPN or a local network IP. Ensure that the chosen port is not 
       already occupied by other proxy tools.
     tr: |
       Caido hizmeti için birincil dinleme adresini ve bağlantı noktasını yapılandırır. Hizmetin
       VPN veya yerel ağ IP'si gibi belirli bir ağ arayüzünde erişilebilir olması gerektiğinde kullanın.
       Seçilen bağlantı noktasının başka vekil araçlarca kullanılmadığından emin olun.
   command: "caido-cli --listen {{listen_address|127.0.0.1:8080}}"

 - title:
     en: caido-cli - headless mode
     tr: caido-cli - başsız kip
   desc:
     en: |
       Starts the Caido service without automatically opening a browser window. This is 
       ideal for remote server deployments or environments where you prefer to manually 
       navigate to the UI. It prevents unnecessary browser process overhead on the host.
     tr: |
       Caido hizmetini tarayıcı penceresi otomatik açmadan başlatır. Bu,
       uzak sunucu dağıtımları veya arayüze elle gitmeyi tercih ettiğiniz ortamlar için idealdir.
       Host'ta gereksiz tarayıcı işlemi yükünü engeller.
   command: "caido-cli --no-open"

# === NETWORK & PROXY CONFIGURATION ===
 - title:
     en: caido-cli - separate proxy and UI listeners
     tr: caido-cli - ayrı vekil ve arayüz dinleyicileri
   desc:
     en: |
       Defines distinct addresses for the interception proxy and the management UI. This 
       setup is useful for isolating administrative traffic from the traffic being 
       analyzed. It provides better control over network routing and access restrictions.
     tr: |
       Yakalama vekili ve yönetim arayüzü için ayrı adresler tanımlar. Bu
       kurulum, yönetim trafiğini analiz edilen trafikten yalıtmak için yararlıdır.
       Ağ yönlendirme ve erişim kısıtlamaları üzerinde daha iyi denetim sağlar.
   command: "caido-cli --proxy-listen {{proxy_address|127.0.0.1:8081}} --ui-listen {{ui_address|127.0.0.1:8082}}"

 - title:
     en: caido-cli - invisible mode
     tr: caido-cli - görünmez kip
   desc:
     en: |
       Enables invisible mode for all configured listeners. This setting is required 
       when intercepting traffic from applications that are not proxy-aware. It 
       allows Caido to function as a transparent proxy for thick-client testing.
     tr: |
       Yapılandırılmış tüm dinleyiciler için görünmez kipi etkinleştirir. Bu ayar,
       vekil farkında olmayan uygulamalardan trafik yakalarken gereklidir.
       Caido'nun kalın istemci testleri için şeffaf vekil olarak çalışmasına olanak tanır.
   command: "caido-cli --invisible"

 - title:
     en: caido-cli - restrict UI domain
     tr: caido-cli - arayüz alan adını kısıtlama
   desc:
     en: |
       Limits access to the Caido UI to specific allowed domains. This is a security 
       feature that helps prevent unauthorized access to the auditing toolkit. It 
       is particularly important when running Caido on a shared or public server.
     tr: |
       Caido arayüzüne erişimi belirli izinli alan adlarıyla sınırlar. Bu,
       denetim araç setine yetkisiz erişimi önlemeye yardımcı olan bir güvenlik özelliğidir.
       Caido'yu paylaşımlı veya herkese açık bir sunucuda çalıştırırken özellikle önemlidir.
   command: "caido-cli --ui-domain {{allowed_domain|localhost}}"

# === DATA & STORAGE MANAGEMENT ===
 - title:
     en: caido-cli - custom data path
     tr: caido-cli - özel veri yolu
   desc:
     en: |
       Specifies a custom directory for storing project data, logs, and configurations. 
       This allows you to keep your security research data on a specific partition 
       or an encrypted drive. Ensure the user running the command has full read/write 
       permissions for the path.
     tr: |
       Proje verisi, log ve yapılandırmaları saklamak için özel bir dizin belirtir.
       Bu, güvenlik araştırma verinizi belirli bir bölümde veya şifreli sürücüde
       tutmanıza olanak tanır. Komutu çalıştıran kullanıcının yol için tam okuma/yazma
       iznine sahip olduğundan emin olun.
   command: "caido-cli --data-path {{storage_path|./caido_projects}}"

 - title:
     en: caido-cli - disable synchronization
     tr: caido-cli - eşitlemeyi devre dışı bırakma
   desc:
     en: |
       Disables the synchronization feature with the Caido cloud servers. Use this 
       option when working on highly sensitive projects where data must remain 
       strictly local. It ensures that no project metadata or history leaves the machine.
     tr: |
       Caido bulut sunucularıyla eşitleme özelliğini devre dışı bırakır. Verinin
       kesinlikle yerelde kalması gereken yüksek hassasiyetli projelerde bu
       seçeneği kullanın. Proje üstverisi veya geçmişinin makineden ayrılmamasını sağlar.
   command: "caido-cli --no-sync"

 - title:
     en: caido-cli - import custom CA certificate
     tr: caido-cli - özel CA sertifikası içe aktarma
   desc:
     en: |
       Imports an existing Certificate Authority (CA) certificate into Caido for 
       SSL/TLS decryption. This is useful if you have a centralized certificate 
       management system in your lab. You can also provide a password if the 
       certificate file is protected.
     tr: |
       SSL/TLS şifre çözme için mevcut bir Sertifika Yetkilisi (CA) sertifikasını Caido'ya içe aktarır.
       Lab'ınızda merkezi bir sertifika yönetim sisteminiz varsa yararlıdır.
       Sertifika dosyası korumalıysa parola da verebilirsiniz.
   command: "caido-cli --import-ca-cert {{cert_path}} --import-ca-cert-pass {{password}}"

# === SECURITY & MAINTENANCE ===
 - title:
     en: caido-cli - reset credentials
     tr: caido-cli - kimlik bilgilerini sıfırlama
   desc:
     en: |
       Resets the instance credentials used to log into the Caido dashboard. This is a 
       high-risk command that should only be used if you have forgotten your password. 
       Be aware that this might impact your ability to access existing data if not handled properly.
     tr: |
       Caido panosuna giriş için kullanılan örnek kimlik bilgilerini sıfırlar. Bu,
       yalnızca parolanızı unuttuysanız kullanılması gereken yüksek riskli bir komuttur.
       Düzgün yönetilmezse mevcut verilere erişiminizi etkileyebileceğini unutmayın.
   command: "caido-cli --reset-credentials"

 - title:
     en: caido-cli - enable safe mode
     tr: caido-cli - güvenli kipi etkinleştirme
   desc:
     en: |
       Starts the toolkit in safe mode, which limits certain features to prevent 
       instability or crashes. This is useful for troubleshooting performance issues 
       within the application. It can help isolate whether a problem is caused by 
       custom plugins or core functionality.
     tr: |
       Araç setini kararsızlık veya çökmeleri önlemek için belirli özellikleri sınırlayan güvenli kipte başlatır.
       Bu, uygulama içindeki performans sorunlarını gidermede yararlıdır.
       Bir sorunun özel eklentilerden mi yoksa çekirdek işlevden mi kaynaklandığını yalıtmaya yardımcı olabilir.
   command: "caido-cli --safe"

 - title:
     en: caido-cli - debug logging
     tr: caido-cli - hata ayıklama loglaması
   desc:
     en: |
       Enables verbose debug logs to be recorded and displayed in the terminal. Use 
       this when you encounter unexpected behavior or errors during an audit. The 
       logs provide detailed information about network connections and internal processes.
     tr: |
       Ayrıntılı hata ayıklama loglarının kaydedilip terminalde gösterilmesini etkinleştirir.
       Denetim sırasında beklenmedik davranış veya hatalarla karşılaştığınızda kullanın.
       Loglar ağ bağlantıları ve iç süreçler hakkında ayrıntılı bilgi verir.
   command: "caido-cli --debug"

 - title:
     en: caido-cli - allow guest access
     tr: caido-cli - misafir erişimine izin verme
   desc:
     en: |
       Configures the instance to allow logins as a guest user. This can be helpful 
       for quick demonstrations or temporary collaboration without creating full accounts. 
       Exercise caution as this lowers the security posture of your Caido instance.
     tr: |
       Örneği misafir kullanıcı olarak girişlere izin verecek şekilde yapılandırır. Bu,
       tam hesap oluşturmadan hızlı tanıtımlar veya geçici işbirliği için yardımcı olabilir.
       Caido örneğinizin güvenlik duruşunu düşürdüğünden dikkatli kullanın.
   command: "caido-cli --allow-guests"
