tool: impacket-mssqlinstance
tags: [network, pentest, reconnaissance, mssql, enumeration, impacket, security]

actions:
  # === BASIC ENUMERATION ===

  - title:
      en: impacket-mssqlinstance - basic mssql instance enumeration
      tr: impacket-mssqlinstance - temel MSSQL örneği numaralandırma
    desc:
      en: |
        Queries the SQL Server Browser service on a remote host to identify all running MSSQL instances. 
        This is a fundamental reconnaissance step used to discover non-standard ports and instance names before attempting login. 
        It targets UDP port 1434 to retrieve configuration details about the database environment.
      tr: |
        Çalışan tüm MSSQL örneklerini belirlemek için uzak makinedeki SQL Server Browser hizmetini sorgular.
        Giriş denemeden önce standart dışı portları ve örnek adlarını keşfetmek için kullanılan temel bir keşif adımıdır.
        Veritabanı ortamı hakkında yapılandırma ayrıntıları almak için UDP 1434 portunu hedefler.
    command: "impacket-mssqlinstance {{target}}"

  - title:
      en: impacket-mssqlinstance - enumerate with custom timeout
      tr: impacket-mssqlinstance - özel zaman aşımıyla numaralandırma
    desc:
      en: |
        Adjusts the time the tool waits for a response from the target server. 
        This is particularly useful when scanning targets over high-latency connections, unstable VPNs, or congested networks. 
        Increasing the timeout prevents the script from terminating prematurely before receiving the UDP response.
      tr: |
        Aracın hedef sunucudan yanıt bekleme süresini ayarlar.
        Yüksek gecikmeli bağlantılar, kararsız VPN'ler veya kalabalık ağlarda hedef tararken özellikle kullanışlıdır.
        Zaman aşımını artırmak, UDP yanıtı alınmadan betiğin erken sonlanmasını engeller.
    command: "impacket-mssqlinstance -timeout {{timeout_seconds|5}} {{target}}"

  # === ADVANCED TROUBLESHOOTING & LOGGING ===

  - title:
      en: impacket-mssqlinstance - enumeration with debug output
      tr: impacket-mssqlinstance - hata ayıklama çıktısıyla numaralandırma
    desc:
      en: |
        Runs the tool in debug mode to provide verbose internal information about the connection process. 
        Use this when the target does not return results or when you suspect a firewall is interfering with UDP traffic. 
        It displays raw packet handling and library-level execution details which are essential for troubleshooting.
      tr: |
        Bağlantı süreci hakkında ayrıntılı iç bilgi için aracı hata ayıklama modunda çalıştırır.
        Hedef sonuç döndürmediğinde veya güvenlik duvarının UDP trafiğine müdahale ettiğinden şüphelendiğinizde kullanın.
        Sorun giderme için temel ham paket işleme ve kütüphane düzeyi çalıştırma ayrıntılarını görüntüler.
    command: "impacket-mssqlinstance -debug {{target}}"

  - title:
      en: impacket-mssqlinstance - enumeration with timestamps
      tr: impacket-mssqlinstance - zaman damgalarıyla numaralandırma
    desc:
      en: |
        Adds a timestamp to every line of the output generated by the tool. 
        This is a best practice during professional penetration tests to maintain an accurate audit trail of activities. 
        It helps in correlating the scanning activity with target system logs or security monitoring alerts.
      tr: |
        Aracın ürettiği çıktının her satırına zaman damgası ekler.
        Profesyonel sızma testleri sırasında doğru denetim izi tutmak için en iyi uygulamadır.
        Tarama faaliyetini hedef sistem günlükleri veya güvenlik izleme uyarılarıyla ilişkilendirmeye yardımcı olur.
    command: "impacket-mssqlinstance -ts {{target}}"

  - title:
      en: impacket-mssqlinstance - verbose logging with custom timing
      tr: impacket-mssqlinstance - özel zamanlamayla ayrıntılı günlükleme
    desc:
      en: |
        Combines timestamping, debugging, and timeout adjustments for a comprehensive diagnostic scan. 
        This configuration is ideal for complex environments where you need maximum visibility into the communication flow. 
        It ensures that even slow or problematic responses are captured with detailed timing information.
      tr: |
        Kapsamlı tanısal tarama için zaman damgası, hata ayıklama ve zaman aşımı ayarlarını birleştirir.
        İletişim akışında en fazla görünürlüğe ihtiyaç duyduğunuz karmaşık ortamlar için idealdir.
        Yavaş veya sorunlu yanıtların bile ayrıntılı zaman bilgisiyle yakalanmasını sağlar.
    command: "impacket-mssqlinstance -debug -ts -timeout {{timeout_seconds|10}} {{target}}"