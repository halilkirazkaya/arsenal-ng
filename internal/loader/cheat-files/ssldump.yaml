tool: ssldump
tags: [network, security, pentest, tls, ssl, analyzer, sniffing, decryption]

actions:
  # === CAPTURE AND ANALYSIS ===
  - title:
      en: ssldump - live capture on interface
      tr: ssldump - arayüzde canlı yakalama
    desc:
      en: |
        Sniff SSL/TLS traffic live from a specific network interface. This is the most basic usage for 
        real-time monitoring of handshakes and identifying protocol versions used by clients and servers. 
        Note that you typically need root or administrative privileges to capture traffic directly from 
        a hardware interface.
      tr: |
        Belirli bir ağ arayüzünden SSL/TLS trafiğini canlı dinler.
        El sıkışmalarını ve istemci-sunucuların kullandığı protokol sürümlerini gerçek zamanlı izlemenin en temel kullanımıdır.
        Donanım arayüzünden doğrudan yakalama için genelde root veya yönetici yetkisi gerekir.
    command: "ssldump -i {{interface|eth0}}"

  - title:
      en: ssldump - analyze capture file
      tr: ssldump - yakalama dosyasını analiz etme
    desc:
      en: |
        Analyze SSL/TLS traffic stored in a previously captured pcap file. This allows for offline 
        analysis of network traffic without being actively connected to the target environment. 
        It is particularly useful for investigating captured logs from tools like tcpdump or Wireshark 
        to identify handshake details.
      tr: |
        Önceden yakalanmış bir pcap dosyasındaki SSL/TLS trafiğini analiz eder.
        Hedef ortama bağlı kalmadan çevrimdışı ağ trafiği incelemeye olanak tanır.
        tcpdump veya Wireshark gibi araçlardan alınan günlüklerde el sıkışma ayrıntılarını belirlemede özellikle yararlıdır.
    command: "ssldump -r {{dumpfile}}"

  - title:
      en: ssldump - detailed handshake analysis
      tr: ssldump - ayrıntılı el sıkışma analizi
    desc:
      en: |
        Display the full SSL/TLS handshake process with verbose output including certificate details. 
        The verbose flag provides deeper insight into extensions, cipher suite negotiation, and 
        certificate chains. Use this command when debugging connection failures or verifying 
        security configurations of a web server.
      tr: |
        Sertifika ayrıntılarıyla tam SSL/TLS el sıkışma sürecini ayrıntılı gösterir.
        Ayrıntılı flag, uzantılar, şifre paketi uzlaşması ve sertifika zincirleri hakkında daha derin bilgi verir.
        Bağlantı hatalarını ayıklarken veya web sunucusunun güvenlik yapılandırmasını doğrularken bu komutu kullanın.
    command: "ssldump -i {{interface|eth0}} -v"

  # === DECRYPTION ===
  - title:
      en: ssldump - decrypt traffic using private key
      tr: ssldump - özel anahtarla trafiği çözme
    desc:
      en: |
        Decrypt SSL/TLS application data by providing the server's RSA private key file. This 
        functionality only works for RSA key exchanges and will not work for cipher suites 
        utilizing Diffie-Hellman (PFS) as the session keys cannot be derived from the private key 
        alone. Ensure the key file is accessible and provide the password if the key is encrypted.
      tr: |
        Sunucunun RSA özel anahtar dosyasını vererek SSL/TLS uygulama verisini çözer.
        Bu işlev yalnızca RSA anahtar değişiminde çalışır; Diffie-Hellman (PFS) kullanan şifre paketlerinde oturum anahtarları özel anahtardan türetilemediğinden çalışmaz.
        Anahtar dosyasının erişilebilir olduğundan ve şifreliyse parolasını bildiğinizden emin olun.
    command: "ssldump -r {{dumpfile}} -k {{keyfile}} -p {{password}}"

  - title:
      en: ssldump - decrypt using keylog file
      tr: ssldump - keylog dosyasıyla çözme
    desc:
      en: |
        Decrypt traffic using secrets provided in a standard SSL key log file format. This method is 
        effective for decrypting modern cipher suites that use Perfect Forward Secrecy (PFS), such 
        as those used by modern browsers. The log file must contain the pre-master secrets or 
        session keys exported during the capture session.
      tr: |
        Standart SSL anahtar günlüğü biçimindeki sırları kullanarak trafiği çözer.
        Modern tarayıcıların kullandığı İleri Gizlilik (PFS) sağlayan modern şifre paketlerini çözmede etkilidir.
        Günlük dosyasının yakalama sırasında dışa aktarılan pre-master sırları veya oturum anahtarlarını içermesi gerekir.
    command: "ssldump -r {{dumpfile}} -l {{sslkeylogfile}}"

  # === FILTERING AND OUTPUT ===
  - title:
      en: ssldump - capture with BPF filters
      tr: ssldump - BPF filtreleriyle yakalama
    desc:
      en: |
        Apply Berkeley Packet Filters (BPF) to limit the traffic processed to specific hosts or ports. 
        Filtering is essential in high-traffic environments to reduce CPU load and focus on 
        relevant data. The filter syntax is identical to tcpdump, allowing for complex logic like 
        targeting a specific IP and port combination.
      tr: |
        İşlenen trafiği belirli makine veya portlarla sınırlamak için Berkeley Paket Filtreleri (BPF) uygular.
        Yoğun trafikli ortamlarda CPU yükünü azaltmak ve ilgili veriye odaklanmak için filtreleme şarttır.
        Filtre sözdizimi tcpdump ile aynıdır; belirli bir IP ve port bileşimini hedefleyen karmaşık mantığa olanak tanır.
    command: "ssldump -i {{interface|eth0}} host {{target}} and port {{port|443}}"

  - title:
      en: ssldump - timestamped output
      tr: ssldump - zaman damgalı çıktı
    desc:
      en: |
        Display captured packets with absolute or relative timestamps for chronological analysis. 
        The -t flag prints the time of each packet, which helps in correlating network events 
        with application logs. This is vital when investigating the latency of handshakes or 
        timing-based connection issues.
      tr: |
        Kronolojik analiz için yakalanan paketleri mutlak veya göreli zaman damgalarıyla gösterir.
        -t flag'i her paketin zamanını yazdırır; ağ olaylarını uygulama günlükleriyle ilişkilendirmeye yardımcı olur.
        El sıkışma gecikmelerini veya zamanlamaya bağlı bağlantı sorunlarını incelerken hayati önem taşır.
    command: "ssldump -i {{interface|eth0}} -t"

  - title:
      en: ssldump - write filtered traffic to pcap
      tr: ssldump - filtrelenen trafiği pcap'e yazma
    desc:
      en: |
        Save the captured traffic to a file in pcap format while simultaneously analyzing it. 
        This is useful for archiving suspicious traffic for later forensic analysis or for 
        sharing with other team members. Use the -w flag followed by the desired filename 
        to ensure the raw packet data is preserved.
      tr: |
        Analiz ederken yakalanan trafiği pcap biçiminde dosyaya kaydeder.
        Şüpheli trafiği daha sonra adli inceleme için arşivlemek veya ekip üyeleriyle paylaşmak için yararlıdır.
        Ham paket verisinin korunması için -w flag'iyle istenen dosya adını verin.
    command: "ssldump -i {{interface|eth0}} -w {{outpcapfile|output.pcap}}"