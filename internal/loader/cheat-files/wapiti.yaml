tool: wapiti
tags: [web, scanner, security, pentest, enumeration, exploitation, vulnerability-assessment]

actions:
  # === BASIC SCANS ===
  - title:
      en: wapiti - basic scan
      tr: wapiti - temel tarama
    desc:
      en: |
        Performs a default vulnerability scan against a target URL.
        This is the most common starting point for black-box web application testing.
        Wapiti will crawl the site starting from the base URL and attempt to find vulnerabilities like XSS and SQL injection.
        By default, it uses the 'folder' scope, meaning it won't go above the path provided in the URL.
      tr: |
        Hedef URL'ye karşı varsayılan bir zafiyet taraması gerçekleştirir.
        Bu, siyah kutu web uygulaması testleri için en yaygın başlangıç noktasıdır.
        Wapiti, temel URL'den başlayarak siteyi tarar ve XSS ile SQL enjeksiyonu gibi zafiyetleri bulmaya çalışır.
        Varsayılan olarak 'folder' kapsamını kullanır, yani URL'de verilen yolun üzerine çıkmaz.
    command: "wapiti -u {{url}}"

  - title:
      en: wapiti - scan with specific output format
      tr: wapiti - belirli çıktı biçimli tarama
    desc:
      en: |
        Runs a scan and generates a report in a specific file format.
        Supported formats include html, json, xml, txt, and csv.
        This is essential for documenting findings or integrating Wapiti results with other automated tools.
        The HTML report is highly recommended for manual review as it provides detailed descriptions of vulnerabilities.
      tr: |
        Taramayı çalıştırır ve belirli bir dosya biçiminde rapor üretir.
        Desteklenen biçimler arasında html, json, xml, txt ve csv bulunur.
        Bu, bulguları belgelemek veya Wapiti sonuçlarını diğer otomatik araçlarla bütünleştirmek için gereklidir.
        HTML raporu, zafiyetlerin ayrıntılı açıklamalarını sunduğu için manuel inceleme için özellikle önerilir.
    command: "wapiti -u {{url}} -f {{format|html}} -o {{output_path|report.html}}"

  # === SCAN SCOPE & CRAWLING ===
  - title:
      en: wapiti - set scan scope
      tr: wapiti - tarama kapsamı belirleme
    desc:
      en: |
        Defines the boundaries for the crawler to prevent it from wandering off-site.
        The scope can be set to 'page', 'folder', 'subdomain', 'domain', or 'punk'.
        Using 'domain' or 'subdomain' is useful for comprehensive testing of a large infrastructure.
        Be careful with 'punk' mode as it will attack every URL it finds regardless of the domain, which might lead to legal issues.
      tr: |
        Tarayıcının site dışına taşmasını önlemek için sınırlar tanımlar.
        Kapsam 'page', 'folder', 'subdomain', 'domain' veya 'punk' olabilir.
        Büyük bir altyapının kapsamlı testi için 'domain' veya 'subdomain' kullanışlıdır.
        'punk' modunda bulunan her URL'ye saldıracağı için dikkatli olun; bu, yasal sorunlara yol açabilir.
    command: "wapiti -u {{url}} --scope {{scope|folder}}"

  - title:
      en: wapiti - headless scanning
      tr: wapiti - headless tarama
    desc:
      en: |
        Enables the use of a headless Firefox browser for crawling.
        This allows Wapiti to discover links and forms that are generated dynamically via JavaScript.
        It is significantly slower than the default crawler but much more effective for modern Single Page Applications (SPAs).
        You can set the mode to 'hidden' to run in the background or 'visible' to see the browser actions.
      tr: |
        Tarama için headless bir Firefox tarayıcısı kullanmayı etkinleştirir.
        Bu, Wapiti'nin JavaScript ile dinamik üretilen bağlantıları ve formları keşfetmesine olanak tanır.
        Varsayılan tarayıcıdan önemli ölçüde daha yavaştır ancak modern Tek Sayfa Uygulamalarında (SPA) çok daha etkilidir.
        Modu arka planda çalıştırmak için 'hidden', tarayıcı hareketlerini görmek için 'visible' olarak ayarlayabilirsiniz.
    command: "wapiti -u {{url}} --headless {{mode|hidden}}"

  - title:
      en: wapiti - limit crawl depth and links
      tr: wapiti - tarama derinliği ve bağlantı sınırlama
    desc:
      en: |
        Restricts the depth of the crawl and the number of links analyzed per page.
        This is useful for very large websites where a full scan would take too long or consume too many resources.
        Setting a lower depth ensures that the scanner stays focused on the most critical parts of the application.
        Use this to fine-tune performance when working with restricted time windows.
      tr: |
        Tarama derinliğini ve sayfa başına analiz edilen bağlantı sayısını kısıtlar.
        Bu, tam taramanın çok uzun süreceği veya çok fazla kaynak tüketeceği çok büyük web siteleri için kullanışlıdır.
        Daha düşük bir derinlik belirlemek tarayıcının uygulamanın en kritik bölümlerine odaklanmasını sağlar.
        Kısıtlı zaman pencerelerinde çalışırken performansı ayarlamak için kullanın.
    command: "wapiti -u {{url}} -d {{depth|3}} --max-links-per-page {{max|20}}"

  # === AUTHENTICATION ===
  - title:
      en: wapiti - form-based authentication
      tr: wapiti - form tabanlı kimlik doğrulama
    desc:
      en: |
        Performs an authenticated scan by submitting a login form first.
        You must provide the login page URL and the credentials to be used.
        Note that automated scanning with credentials carries a risk of account lockout if the site has brute-force protections.
        Always ensure you have permission to use the provided account for automated testing.
      tr: |
        Önce bir giriş formu göndererek kimlik doğrulamalı bir tarama gerçekleştirir.
        Giriş sayfası URL'sini ve kullanılacak kimlik bilgilerini vermelisiniz.
        Sitede kaba kuvvet korumaları varsa otomatik taramanın hesap kilitlenmesi riski taşıdığını unutmayın.
        Otomatik test için verilen hesabı kullanma izniniz olduğundan her zaman emin olun.
    command: "wapiti -u {{url}} --form-url {{login_url}} --form-user {{username}} --form-password {{password}}"

  - title:
      en: wapiti - cookie-based authentication
      tr: wapiti - çerez tabanlı kimlik doğrulama
    desc:
      en: |
        Uses an existing session cookie to perform an authenticated scan.
        This is often easier than form-based authentication if the site uses complex multi-factor or JS-heavy login processes.
        You can provide a raw cookie string or a JSON file containing exported cookies.
        Ensure the session remains active during the duration of the scan to get accurate results.
      tr: |
        Kimlik doğrulamalı bir tarama için mevcut bir oturum çerezini kullanır.
        Bu, site karmaşık çok faktörlü veya JS ağırlıklı giriş süreçleri kullanıyorsa form tabanlı girişten genellikle daha kolaydır.
        Ham çerez dizesi veya dışa aktarılmış çerezler içeren bir JSON dosyası verebilirsiniz.
        Doğru sonuçlar için tarama süresince oturumun aktif kaldığından emin olun.
    command: "wapiti -u {{url}} -C \"{{cookie_string}}\""

  - title:
      en: wapiti - get cookies utility
      tr: wapiti - çerez yardımcı programı
    desc:
      en: |
        A helper utility to capture and save cookies to a file for later use with Wapiti.
        It can handle login forms and save the resulting session state into a JSON format.
        This is the preferred way to handle complex authentication scenarios before starting the main scan.
        The generated file can then be passed to Wapiti using the '-c' flag.
      tr: |
        Wapiti ile daha sonra kullanmak üzere çerezleri yakalayıp dosyaya kaydeden bir yardımcı programdır.
        Giriş formlarını işleyebilir ve ortaya çıkan oturum durumunu JSON biçiminde kaydedebilir.
        Bu, ana taramaya başlamadan önce karmaşık kimlik doğrulama senaryolarını işlemenin tercih edilen yoludur.
        Üretilen dosya daha sonra Wapiti'ye '-c' bayrağıyla geçirilebilir.
    command: "wapiti-getcookie -u {{login_url}} -c {{cookie_file|cookies.json}} --form-data \"{{post_data}}\""

  # === ATTACK MODULES ===
  - title:
      en: wapiti - run specific modules
      tr: wapiti - belirli modülleri çalıştırma
    desc:
      en: |
        Tells Wapiti to only run a specific set of vulnerability modules.
        This is useful when you only want to check for a particular class of bugs, such as SQL Injection or XSS.
        It saves time by skipping modules that might not be relevant to your current testing goals.
        Use the '--list-modules' flag separately to see all available attack modules.
      tr: |
        Wapiti'ye yalnızca belirli bir zafiyet modülü kümesini çalıştırmasını söyler.
        Bu, SQL Enjeksiyonu veya XSS gibi belirli bir hata sınıfını kontrol etmek istediğinizde kullanışlıdır.
        Mevcut test hedeflerinizle ilgili olmayabilecek modülleri atlayarak zamandan kazandırır.
        Mevcut tüm saldırı modüllerini görmek için ayrıca '--list-modules' bayrağını kullanın.
    command: "wapiti -u {{url}} -m {{module_list|xss,sql,blindsql}}"

  - title:
      en: wapiti - exclude specific URLs or parameters
      tr: wapiti - belirli URL veya parametreleri hariç tutma
    desc:
      en: |
        Excludes specific URLs or parameters from being crawled or attacked.
        This is vital for avoiding 'logout' links that would end your session or destructive actions like 'delete_user'.
        Excluding noisy parameters can also speed up the scan and reduce false positives.
        You can use multiple '-x' flags to exclude several patterns.
      tr: |
        Taranacak veya saldırılacak URL ya da parametreleri hariç tutar.
        Bu, oturumunuzu sonlandıracak 'logout' bağlantıları veya 'delete_user' gibi yıkıcı eylemler için hayati önem taşır.
        Gürültülü parametreleri hariç tutmak taramayı hızlandırabilir ve yanlış pozitifleri azaltabilir.
        Birden fazla kalıbı hariç tutmak için birden çok '-x' bayrağı kullanabilirsiniz.
    command: "wapiti -u {{url}} -x {{exclude_url}} --skip {{parameter_name}}"

  # === NETWORK & EVASION ===
  - title:
      en: wapiti - proxy and tor integration
      tr: wapiti - proxy ve tor bütünleşmesi
    desc:
      en: |
        Routes all traffic through a specified HTTP/SOCKS proxy or the Tor network.
        This is useful for bypassing IP-based restrictions or for maintaining anonymity during an engagement.
        The '--tor' flag automatically configures Wapiti to use the local Tor listener (usually 127.0.0.1:9050).
        Using a proxy also allows you to intercept Wapiti's traffic with tools like Burp Suite for deeper analysis.
      tr: |
        Tüm trafiği belirtilen bir HTTP/SOCKS proxy veya Tor ağı üzerinden yönlendirir.
        Bu, IP tabanlı kısıtlamaları aşmak veya bir görev sırasında anonimliği korumak için kullanışlıdır.
        '--tor' bayrağı Wapiti'yi yerel Tor dinleyicisini kullanacak şekilde otomatik yapılandırır (genellikle 127.0.0.1:9050).
        Proxy kullanmak ayrıca Wapiti trafiğini Burp Suite gibi araçlarla yakalayıp daha derin analiz yapmanıza olanak tanır.
    command: "wapiti -u {{url}} -p {{proxy_url|http://127.0.0.1:8080}}"

  - title:
      en: wapiti - custom user-agent and headers
      tr: wapiti - özel kullanıcı aracısı ve başlıklar
    desc:
      en: |
        Sets a custom User-Agent string or additional HTTP headers for every request.
        This can be used to bypass WAF rules that block the default Wapiti user-agent or to simulate specific mobile devices.
        Custom headers are also useful for bypassing certain access control mechanisms or identifying scanner traffic.
        Be sure to format the header string correctly as "Name: Value".
      tr: |
        Her istek için özel bir User-Agent dizesi veya ek HTTP başlıkları belirler.
        Bu, varsayılan Wapiti kullanıcı aracısını engelleyen WAF kurallarını aşmak veya belirli mobil cihazları taklit etmek için kullanılabilir.
        Özel başlıklar ayrıca belirli erişim kontrol mekanizmalarını aşmak veya tarayıcı trafiğini belirlemek için kullanışlıdır.
        Başlık dizesini "Ad: Değer" biçiminde yazdığınızdan emin olun.
    command: "wapiti -u {{url}} -A \"{{user_agent}}\" -H \"{{header_name}}: {{value}}\""

  # === ADVANCED CONFIGURATION ===
  - title:
      en: wapiti - aggressive scanning
      tr: wapiti - agresif tarama
    desc:
      en: |
        Adjusts the 'scan-force' level to control the intensity of the attack.
        Values range from 'paranoid' (very slow, few requests) to 'insane' (very fast, many requests).
        Aggressive levels might overwhelm the server or trigger rate-limiting and WAF blocks.
        Use 'polite' or 'normal' for production environments to minimize the risk of causing a Denial of Service.
      tr: |
        Saldırının yoğunluğunu kontrol etmek için 'scan-force' düzeyini ayarlar.
        Değerler 'paranoid' (çok yavaş, az istek) ile 'insane' (çok hızlı, çok istek) arasında değişir.
        Agresif düzeyler sunucuyu zorlayabilir veya hız sınırlama ile WAF engellerini tetikleyebilir.
        Hizmet Dışı Bırakma riski yaratmamak için üretim ortamlarında 'polite' veya 'normal' kullanın.
    command: "wapiti -u {{url}} -S {{force_level|aggressive}}"
