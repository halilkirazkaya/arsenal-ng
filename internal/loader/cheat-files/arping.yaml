tool: arping
tags: [network, scanner, security, pentest, enumeration, discovery, arp]

actions:
# === BASIC USAGE ===
 - title:
     en: arping - basic arp ping
     tr: arping - temel arp ping
   desc:
     en: |
       Send ARP requests to a specific target IP address on the local network. 
       This is useful for verifying if a host is alive and obtaining its MAC address even if ICMP (standard ping) is blocked. 
       Note that this tool requires root privileges to send raw packets and only works within the local broadcast domain.
     tr: |
       Yerel ağdaki belirli bir hedef IP adresine ARP istekleri gönderir.
       ICMP (standart ping) engellenmiş olsa bile bir host'un canlı olduğunu doğrulamak ve MAC adresini almak için yararlıdır.
       Bu aracın ham paket göndermek için root yetkisi gerektirdiğini ve yalnızca yerel yayın etki alanında çalıştığını unutmayın.
   command: "arping -i {{interface|eth0}} {{target_ip}}"

 - title:
     en: arping - ping with specific count
     tr: arping - belirli sayılı ping
   desc:
     en: |
       Stop the arping process after a specified number of packets are sent to the target. 
       This prevents the command from running indefinitely and is useful for script integration or quick connectivity checks. 
       The utility will provide a summary of transmitted and received packets once the count is reached.
     tr: |
       Hedefe belirtilen sayıda paket gönderildikten sonra arping işlemini durdurur.
       Bu, komutun süresiz çalışmasını engeller; betik entegrasyonu veya hızlı bağlantı denetimleri için yararlıdır.
       Sayıya ulaşılınca araç gönderilen ve alınan paketlerin özetini verir.
   command: "arping -c {{count|4}} -i {{interface|eth0}} {{target_ip}}"

 - title:
     en: arping - timeout-based ping
     tr: arping - zaman aşımlı ping
   desc:
     en: |
       Specify a timeout in seconds before the utility exits regardless of how many packets were sent. 
       This is useful in automated environments where a hanging command could block other processes. 
       It ensures that the reconnaissance phase does not exceed a predefined time window.
     tr: |
       Kaç paket gönderildiğine bakılmaksızın araç çıkmadan önce saniye cinsinden zaman aşımı belirtir.
       Bu, takılan bir komutun diğer işlemleri engelleyebileceği otomatik ortamlarda yararlıdır.
       Keşif aşamasının önceden tanımlı zaman penceresini aşmamasını sağlar.
   command: "arping -w {{seconds|5}} -i {{interface|eth0}} {{target_ip}}"

# === ENUMERATION & DETECTION ===
 - title:
     en: arping - duplicate ip detection
     tr: arping - yinelenen ip tespiti
   desc:
     en: |
       Detect if multiple MAC addresses are responding to the same IP address on the network. 
       This is a crucial check for identifying IP address conflicts or potential ARP spoofing attacks. 
       The command will exit with an error code if more than one MAC address responds to the request.
     tr: |
       Ağda aynı IP adresine birden çok MAC adresinin yanıt verip vermediğini tespit eder.
       Bu, IP adresi çakışmalarını veya olası ARP sahteciliği saldırılarını belirlemede kritik kontroldür.
       İsteğe birden çok MAC adresi yanıt verirse komut hata koduyla çıkar.
   command: "arping -d -i {{interface|eth0}} {{target_ip}}"

 - title:
     en: arping - audible discovery
     tr: arping - sesli keşif
   desc:
     en: |
       Enable audible pings that beep every time a successful reply is received from the target. 
       This is particularly helpful for hardware troubleshooting when you cannot constantly look at the terminal. 
       Alternatively, use the -e flag to beep only when there is no reply to detect intermittent connectivity.
     tr: |
       Hedeften her başarılı yanıt alındığında bip sesi çıkaran sesli pingleri etkinleştirir.
       Bu, terminale sürekli bakamadığınız donanım sorun gidermede özellikle yardımcıdır.
       Alternatif olarak kesintili bağlantıyı tespit için yalnızca yanıt yokken bip sesi için -e bayrağını kullanın.
   command: "arping -a -i {{interface|eth0}} {{target_ip}}"

 - title:
     en: arping - raw output for scripting
     tr: arping - betikleme için ham çıktı
   desc:
     en: |
       Display only the MAC address or IP address in a raw format for each reply. 
       This stripped-down output is ideal for piping into other tools or saving to a list for further enumeration. 
       It removes all the human-readable metadata, leaving only the essential addressing information.
     tr: |
       Her yanıt için yalnızca MAC adresini veya IP adresini ham biçimde gösterir.
       Bu sadeleştirilmiş çıktı, diğer araçlara aktarmak veya ileri numaralandırma için listeye kaydetmekte idealdir.
       İnsan okunabilir tüm üstveriyi kaldırıp yalnızca gerekli adresleme bilgisini bırakır.
   command: "arping -r -i {{interface|eth0}} {{target_ip}}"

# === ADVANCED NETWORKING ===
 - title:
     en: arping - ping from unconfigured interface
     tr: arping - yapılandırılmamış arayüzden ping
   desc:
     en: |
       Send ARP requests using a source IP address of 0.0.0.0. 
       This is typically used when the local interface has not yet been assigned an IP address, such as during the initial stages of DHCP. 
       It allows for basic network discovery without needing a valid IP in the subnet.
     tr: |
       Kaynak IP adresi 0.0.0.0 kullanarak ARP istekleri gönderir.
       Bu, DHCP'nin ilk aşamalarında olduğu gibi yerel arayüze henüz IP atanmadığında kullanılır.
       Alt ağda geçerli bir IP gerektirmeden temel ağ keşfine olanak tanır.
   command: "arping -0 -i {{interface|eth0}} {{target_ip}}"

 - title:
     en: arping - send unsolicited arp
     tr: arping - istenmeyen arp gönderme
   desc:
     en: |
       Send an unsolicited ARP reply, also known as a Gratuitous ARP, to the network. 
       This is often used to update the ARP caches of other hosts, for instance, when an IP address moves to a different MAC. 
       Use this with extreme caution as it can disrupt network traffic if directed at an incorrect address.
     tr: |
       Ağa istenmeyen ARP yanıtı (Gratuitous ARP olarak da bilinir) gönderir.
       Bu, örneğin bir IP adresi farklı bir MAC'e taşındığında diğer host'ların ARP önbelleklerini güncellemek için sık kullanılır.
       Yanlış adrese yöneltilirse ağ trafiğini bozabileceğinden son derece dikkatli kullanın.
   command: "arping -U -i {{interface|eth0}} {{source_ip}}"

 - title:
     en: arping - spoofed source address
     tr: arping - sahte kaynak adresi
   desc:
     en: |
       Send ARP requests using a custom source IP and a custom source MAC address. 
       This can be used to test how a target or firewall reacts to different identities on the wire. 
       You may need to enable promiscuous mode using the -p flag if the interface does not own the specified MAC.
     tr: |
       Özel bir kaynak IP ve özel bir kaynak MAC adresi kullanarak ARP istekleri gönderir.
       Bu, bir hedefin veya güvenlik duvarının hattaki farklı kimliklere nasıl tepki verdiğini test etmek için kullanılabilir.
       Arayüz belirtilen MAC'e sahip değilse -p bayrağıyla karışık (promiscuous) kipi etkinleştirmeniz gerekebilir.
   command: "arping -S {{source_ip}} -s {{source_mac}} -p -i {{interface|eth0}} {{target_ip}}"

 - title:
     en: arping - vlan tagged ping
     tr: arping - vlan etiketli ping
   desc:
     en: |
       Send ARP requests containing a specific 802.1Q VLAN tag to a target. 
       This is essential for testing connectivity across different VLAN segments when the network interface is connected to a trunk port. 
       It helps in verifying that VLAN tagging and routing are correctly configured on the switch level.
     tr: |
       Hedefe belirli bir 802.1Q VLAN etiketi içeren ARP istekleri gönderir.
       Bu, ağ arayüzü bir trunk bağlantı noktasına bağlıyken farklı VLAN bölümleri arası bağlantıyı test etmek için gereklidir.
       Anahtar düzeyinde VLAN etiketleme ve yönlendirmenin doğru yapılandırıldığını doğrulamaya yardımcı olur.
   command: "arping -V {{vlan_id|10}} -i {{interface|eth0}} {{target_ip}}"
