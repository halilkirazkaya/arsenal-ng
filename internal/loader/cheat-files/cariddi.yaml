tool: cariddi
tags: [recon, web, scanner, pentest, enumeration, security, crawling, osint]

actions:
  # === BASIC COMMANDS ===
  - title:
      en: cariddi - print help and examples
      tr: cariddi - yardım ve örnekleri yazdırma
    desc:
      en: |
        Displays the help menu and usage examples for the tool. 
        This is useful for quickly checking flags and command syntax during an engagement.
        It provides a concise summary of all available hunting and configuration options.
      tr: |
        Aracın yardım menüsünü ve kullanım örneklerini gösterir.
        Çalışma sırasında bayrak ve komut sözdizimini hızlı denetlemek için yararlıdır.
        Tüm mevcut av ve yapılandırma seçeneklerinin özlü özetini verir.
    command: "cariddi -h"

  - title:
      en: cariddi - version check
      tr: cariddi - sürüm denetimi
    desc:
      en: |
        Displays the current version of the cariddi installation. 
        Use this to ensure you are running the latest version with the most up-to-date regex patterns.
        Updating regularly is important as new secrets and vulnerability patterns are added frequently.
      tr: |
        Kurulu cariddi'nin güncel sürümünü gösterir.
        En güncel regex kalıplarına sahip en son sürümü çalıştırdığınızdan emin olmak için kullanın.
        Yeni gizli bilgi ve zafiyet kalıpları sıkça eklendiğinden düzenli güncellemek önemlidir.
    command: "cariddi -version"

  # === HUNTING AND DISCOVERY ===
  - title:
      en: cariddi - intensive crawling
      tr: cariddi - yoğun tarama
    desc:
      en: |
        Performs an intensive crawl by searching for resources matching the second-level domain. 
        This mode is effective for discovering subdomains and related assets that might not be linked directly.
        It helps expand the attack surface by identifying additional hosts within the same organizational scope.
      tr: |
        İkinci düzey alan adıyla eşleşen kaynakları arayarak yoğun tarama yapar.
        Bu kip, doğrudan bağlı olmayabilecek alt alan adlarını ve ilgili varlıkları keşfetmede etkilidir.
        Aynı kurumsal kapsamdaki ek host'ları belirleyerek saldırı yüzeyini genişletmeye yardımcı olur.
    command: "cariddi -intensive < {{input_file|urls.txt}}"

  - title:
      en: cariddi - hunt for secrets
      tr: cariddi - gizli bilgi avı
    desc:
      en: |
        Scans the target URLs for sensitive information such as API keys, tokens, and hardcoded credentials. 
        This action uses a predefined set of regex patterns to identify leaks in JavaScript files and HTML source code.
        It is a critical step for finding unauthorized access vectors during the reconnaissance phase.
      tr: |
        Hedef URL'leri API anahtarları, token'lar ve sabit kodlanmış kimlik bilgileri gibi hassas bilgiler için tarar.
        Bu eylem, JavaScript dosyaları ve HTML kaynak kodundaki sızıntıları belirlemek için önceden tanımlı regex kalıpları kullanır.
        Keşif aşamasında yetkisiz erişim vektörlerini bulmada kritik adımdır.
    command: "cariddi -s < {{input_file|urls.txt}}"

  - title:
      en: cariddi - hunt for endpoints
      tr: cariddi - uç nokta avı
    desc:
      en: |
        Automates the discovery of juicy endpoints and URL parameters from the crawled pages. 
        This helps in identifying potential API routes, administrative panels, or hidden functionalities.
        The results can be used as input for further fuzzing or manual vulnerability assessment.
      tr: |
        Taranan sayfalardaki ilgi çekici uç nokta ve URL parametrelerinin keşfini otomatikleştirir.
        Bu, potansiyel API rotalarını, yönetim panellerini veya gizli işlevleri belirlemeye yardımcı olur.
        Sonuçlar ileri bulanıklaştırma veya elle zafiyet değerlendirmesi için girdi olarak kullanılabilir.
    command: "cariddi -e < {{input_file|urls.txt}}"

  - title:
      en: cariddi - find useful information and errors
      tr: cariddi - yararlı bilgi ve hataları bulma
    desc:
      en: |
        Scans for useful information (like emails or versions) and server-side error messages. 
        Error messages often reveal backend technology stacks, database queries, or file paths that aid in exploitation.
        Combining -info and -err flags provides a comprehensive overview of the target's technical footprint.
      tr: |
        Yararlı bilgileri (e-posta veya sürümler gibi) ve sunucu tarafı hata iletilerini tarar.
        Hata iletileri sıkça sömürüye yardımcı olan arka uç teknoloji yığınlarını, veritabanı sorgularını veya dosya yollarını açığa çıkarır.
        -info ve -err bayraklarını birleştirmek hedefin teknik izinin kapsamlı görünümünü verir.
    command: "cariddi -info -err < {{input_file|urls.txt}}"

  - title:
      en: cariddi - search for juicy file extensions
      tr: cariddi - ilgi çekici dosya uzantılarını arama
    desc:
      en: |
        Searches for sensitive file extensions based on a specific "juiciness" level from 1 to 7. 
        Lower levels (e.g., 1 or 2) focus on highly sensitive files like .bak, .conf, or .sql, while higher levels are more permissive.
        This is highly effective for finding forgotten backups or configuration files on web servers.
      tr: |
        1'den 7'ye belirli bir "cazibe" düzeyine göre hassas dosya uzantılarını arar.
        Düşük düzeyler (ör. 1 veya 2) .bak, .conf veya .sql gibi yüksek hassasiyetli dosyalara odaklanırken yüksek düzeyler daha serbesttir.
        Bu, web sunucularındaki unutulmuş yedek veya yapılandırma dosyalarını bulmada oldukça etkilidir.
    command: "cariddi -ext {{level|2}} < {{input_file|urls.txt}}"

  - title:
      en: cariddi - custom secrets and endpoints hunting
      tr: cariddi - özel gizli bilgi ve uç nokta avı
    desc:
      en: |
        Uses external files containing custom regex patterns for secrets and custom keywords for endpoints. 
        This allows the user to tailor the scan for specific organizational patterns or proprietary technologies.
        It is particularly useful when targeting a specific framework that uses non-standard naming conventions.
      tr: |
        Gizli bilgiler için özel regex kalıpları ve uç noktalar için özel anahtar kelimeler içeren harici dosyalar kullanır.
        Bu, kullanıcının taramayı belirli kurumsal kalıplara veya özel teknolojilere uyarlamasına olanak tanır.
        Standart dışı adlandırma kuralları kullanan belirli bir çatıyı hedeflerken özellikle yararlıdır.
    command: "cariddi -sf {{secrets_regex_file|secrets.txt}} -ef {{endpoints_file|endpoints.txt}} < {{input_file|urls.txt}}"

  # === CONFIGURATION AND STEALTH ===
  - title:
      en: cariddi - concurrency and delay control
      tr: cariddi - eşzamanlılık ve gecikme denetimi
    desc:
      en: |
        Adjusts the speed of the scan by setting the concurrency level and the delay between requests. 
        High concurrency increases speed but may trigger rate limiting or WAF blocks.
        Adding a delay helps in bypassing basic anti-bot protections by simulating more human-like traffic patterns.
      tr: |
        Eşzamanlılık düzeyini ve istekler arası gecikmeyi ayarlayarak tarama hızını ayarlar.
        Yüksek eşzamanlılık hızı artırır ancak hız sınırlama veya WAF engellerini tetikleyebilir.
        Gecikme eklemek, daha insansı trafik kalıpları taklit ederek temel anti-bot korumalarını aşmaya yardımcı olur.
    command: "cariddi -c {{concurrency|20}} -d {{delay_seconds|1}} < {{input_file|urls.txt}}"

  - title:
      en: cariddi - proxy and timeout configuration
      tr: cariddi - vekil ve zaman aşımı yapılandırması
    desc:
      en: |
        Routes all traffic through a specified proxy server (HTTP or SOCKS5) and sets a request timeout. 
        This is essential for remaining anonymous or for routing traffic through tools like Burp Suite for further analysis.
        Setting an appropriate timeout ensures the scanner doesn't hang on unresponsive or slow targets.
      tr: |
        Tüm trafiği belirtilen bir vekil sunucudan (HTTP veya SOCKS5) geçirir ve istek zaman aşımı ayarlar.
        Bu, anonim kalmak veya trafiği ileri analiz için Burp Suite gibi araçlardan geçirmek için gereklidir.
        Uygun bir zaman aşımı ayarlamak tarayıcının yanıt vermeyen veya yavaş hedeflerde takılmamasını sağlar.
    command: "cariddi -proxy {{proxy_url|http://127.0.0.1:8080}} -t {{timeout|10}} < {{input_file|urls.txt}}"

  - title:
      en: cariddi - custom headers and user agents
      tr: cariddi - özel başlıklar ve kullanıcı ajanları
    desc:
      en: |
        Injects custom HTTP headers or uses a random browser User-Agent for every request. 
        Custom headers are necessary for scanning authenticated areas of a website (e.g., using Cookie or Authorization headers).
        Randomizing the User-Agent helps in evading signature-based detection mechanisms.
      tr: |
        Her isteğe özel HTTP başlıkları enjekte eder veya rastgele bir tarayıcı Kullanıcı-Ajanı kullanır.
        Özel başlıklar, bir sitenin kimlik doğrulamalı alanlarını taramak için gereklidir (ör. Çerez veya Authorization başlıklarıyla).
        Kullanıcı-Ajanını rastgeleleştirmek imza tabanlı tespit mekanizmalarından kaçınmaya yardımcı olur.
    command: "cariddi -headers {{headers_string|'Cookie: session=123'}} -rua < {{input_file|urls.txt}}"

  - title:
      en: cariddi - ignore specific URLs or extensions
      tr: cariddi - belirli URL veya uzantıları yoksayma
    desc:
      en: |
        Excludes specific extensions or URLs containing certain keywords from the scan. 
        This prevents the tool from wasting resources on binary files (like images/fonts) or out-of-scope paths (like /blog or /forum).
        Filtering helps keep the results clean and focused on the most relevant parts of the application.
      tr: |
        Belirli uzantıları veya belirli anahtar kelimeler içeren URL'leri taramadan hariç tutar.
        Bu, aracın ikili dosyalarda (görüntü/yazı tipi gibi) veya kapsam dışı yollarda (/blog veya /forum gibi) kaynak harcamasını engeller.
        Filtreleme sonuçların temiz ve uygulamanın en ilgili kısımlarına odaklı kalmasına yardımcı olur.
    command: "cariddi -ie {{ignored_exts|pdf,png,jpg}} -i {{ignored_keywords|logout,signout}} < {{input_file|urls.txt}}"

  # === OUTPUT MANAGEMENT ===
  - title:
      en: cariddi - save results to files
      tr: cariddi - sonuçları dosyalara kaydetme
    desc:
      en: |
        Writes the scan results into structured TXT or HTML files for later reporting and analysis. 
        The HTML output provides a user-friendly interface to browse through discovered secrets and endpoints.
        Saving to text files is ideal for piping the output into other command-line tools in a pipeline.
      tr: |
        Tarama sonuçlarını ileride raporlama ve analiz için yapısal TXT veya HTML dosyalarına yazar.
        HTML çıktısı, keşfedilen gizli bilgi ve uç noktalara göz atmak için kullanıcı dostu arayüz sağlar.
        Metin dosyalarına kaydetmek, çıktıyı hatta başka komut satırı araçlarına aktarmak için idealdir.
    command: "cariddi -ot {{text_output|results.txt}} -oh {{html_output|results_html}} < {{input_file|urls.txt}}"

  - title:
      en: cariddi - JSON output and response storage
      tr: cariddi - JSON çıktısı ve yanıt depolama
    desc:
      en: |
        Outputs the results in JSON format to stdout and stores all HTTP responses locally. 
        JSON format is perfect for integration with custom scripts, databases, or ELK stacks.
        Storing responses allows for offline analysis of the application's behavior without re-scanning the target.
      tr: |
        Sonuçları stdout'a JSON biçiminde çıktılar ve tüm HTTP yanıtlarını yerelde depolar.
        JSON biçimi özel betikler, veritabanları veya ELK yığınlarıyla entegrasyon için mükemmeldir.
        Yanıtları depolamak, hedefi yeniden taramadan uygulamanın davranışının çevrimdışı analizine olanak tanır.
    command: "cariddi -json -sr < {{input_file|urls.txt}}"

  - title:
      en: cariddi - depth control and debug mode
      tr: cariddi - derinlik denetimi ve hata ayıklama kipi
    desc:
      en: |
        Sets the maximum crawling depth and enables debug mode to see detailed execution logs. 
        Controlling depth prevents the crawler from getting stuck in "infinite loops" or overly complex directory structures.
        Debug mode is useful for troubleshooting connection issues or understanding why certain pages are being skipped.
      tr: |
        Azami tarama derinliğini ayarlar ve ayrıntılı çalıştırma loglarını görmek için hata ayıklama kipini etkinleştirir.
        Derinliği denetlemek tarayıcının "sonsuz döngü"lere veya aşırı karmaşık dizin yapılarına takılmasını engeller.
        Hata ayıklama kipi bağlantı sorunlarını gidermede veya belirli sayfaların neden atlandığını anlamada yararlıdır.
    command: "cariddi -md {{max_depth|3}} -debug < {{input_file|urls.txt}}"
