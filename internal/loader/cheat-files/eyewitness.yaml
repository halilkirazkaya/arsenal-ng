tool: eyewitness
tags: [web, reconnaissance, enumeration, scanner, pentest, osint, security, automation]

actions:
  # === BASIC USAGE ===
  - title:
      en: eyewitness - scan urls from file
      tr: eyewitness - dosyadan URL tarama
    desc:
      en: |
        Take screenshots of multiple URLs provided in a line-separated text file. 
        This is the most common way to use the tool during the initial discovery phase of a penetration test to visualize the attack surface. 
        The headless flag is used to run the process in the background without opening a visible browser window.
        Results are saved in the specified directory, creating an easy-to-navigate HTML report.
      tr: |
        Satır satır ayrılmış bir metin dosyasında verilen birden çok URL'nin ekran görüntüsünü alın.
        Sızma testinin ilk keşif aşamasında saldırı yüzeyini görselleştirmek için aracın en yaygın kullanım şeklidir.
        Headless bayrağı, görünür bir tarayıcı penceresi açmadan işlemi arka planda çalıştırmak için kullanılır.
        Sonuçlar belirtilen dizine kaydedilerek kolay gezilebilir bir HTML raporu oluşturulur.
    command: "eyewitness -f {{url_file}} -d {{output_dir|screens}} --headless"

  - title:
      en: eyewitness - scan single url
      tr: eyewitness - tek URL tarama
    desc:
      en: |
        Capture a screenshot, server headers, and basic info for a single specific target URL. 
        Use this when you want to quickly document the state of a specific web application without processing a full list. 
        It provides a rapid way to verify if a site is active and what technology stack it might be running.
        This is particularly useful for verifying findings discovered during manual testing.
      tr: |
        Tek bir hedef URL için ekran görüntüsü, sunucu başlıkları ve temel bilgi yakalayın.
        Tam bir listeyi işlemeden belirli bir web uygulamasının durumunu hızlıca belgelemek istediğinizde kullanın.
        Sitenin aktif olup olmadığını ve hangi teknoloji yığınını çalıştırıyor olabileceğini hızlıca doğrulamanın yoludur.
        Bu, elle test sırasında bulunan bulguları doğrulamak için özellikle kullanışlıdır.
    command: "eyewitness --single {{url}} -d {{output_dir|single_scan}}"

  # === INTEGRATION & INPUTS ===
  - title:
      en: eyewitness - scan from nmap xml
      tr: eyewitness - nmap XML çıktısından tarama
    desc:
      en: |
        Parse an Nmap XML output file to identify and screenshot web services discovered during a port scan. 
        This bridge between network scanning and web reconnaissance saves time by automatically targeting discovered HTTP/HTTPS services. 
        It is highly effective for large internal network ranges where many web interfaces might be hidden on non-standard ports.
        Ensure the Nmap scan was run with the -oX flag to generate the required XML format.
      tr: |
        Port taramasında keşfedilen web hizmetlerini tespit edip ekran görüntüsünü almak için Nmap XML çıktı dosyasını ayrıştırın.
        Ağ taraması ile web keşfi arasındaki bu köprü, keşfedilen HTTP/HTTPS hizmetlerini otomatik hedefleyerek zaman kazandırır.
        Birçok web arayüzünün standart dışı portlarda gizlenebileceği geniş iç ağ aralıkları için oldukça etkilidir.
        Gerekli XML biçiminin üretilmesi için Nmap taramasının -oX bayrağıyla çalıştırıldığından emin olun.
    command: "eyewitness -x {{nmap_xml_file}} -d {{output_dir|nmap_results}} --web"

  - title:
      en: eyewitness - scan from nessus file
      tr: eyewitness - nessus dosyasından tarama
    desc:
      en: |
        Import and process a .nessus scan file to capture screenshots of identified web applications.
        This allows security professionals to visually triage vulnerabilities reported by Nessus and prioritize manual verification.
        It helps in distinguishing between false positives and actual exploitable web interfaces.
        The tool will extract host and port information directly from the Nessus XML structure.
      tr: |
        Tespit edilen web uygulamalarının ekran görüntülerini almak için bir .nessus tarama dosyasını içe aktarıp işleyin.
        Bu, güvenlik uzmanlarının Nessus'un bildirdiği zafiyetleri görsel olarak sınıflandırıp elle doğrulamaya öncelik vermesini sağlar.
        Yanlış pozitifler ile gerçekten sömürülebilir web arayüzlerini ayırt etmeye yardımcı olur.
        Araç, host ve port bilgisini doğrudan Nessus XML yapısından çıkarır.
    command: "eyewitness -x {{nessus_file}} -d {{output_dir|nessus_results}} --web"

  # === PERFORMANCE & TIMING ===
  - title:
      en: eyewitness - high performance scan
      tr: eyewitness - yüksek performanslı tarama
    desc:
      en: |
        Increase the number of concurrent threads and adjust the timeout for faster processing of large URL lists. 
        Increasing threads can significantly speed up the scan but may cause stability issues on the local machine or the target network.
        Adjusting the timeout is useful when dealing with slow-responding applications or high-latency network connections.
        Be careful with high thread counts as they might trigger rate limiting or DoS protections on the target.
      tr: |
        Büyük URL listelerini daha hızlı işlemek için eşzamanlı iş parçacığı sayısını artırın ve zaman aşımını ayarlayın.
        İş parçacığını artırmak taramayı ciddi ölçüde hızlandırabilir ancak yerel makinede veya hedef ağda kararlılık sorunlarına yol açabilir.
        Zaman aşımını ayarlamak, yavaş yanıt veren uygulamalar veya yüksek gecikmeli ağ bağlantılarıyla uğraşırken kullanışlıdır.
        Hedefte hız sınırlama veya DoS korumalarını tetikleyebileceğinden yüksek iş parçacığı sayılarında dikkatli olun.
    command: "eyewitness -f {{url_file}} --threads {{thread_count|10}} --timeout {{timeout_seconds|15}} -d {{output_dir|fast_scan}}"

  - title:
      en: eyewitness - stealthy scan with jitter
      tr: eyewitness - gecikme eklemeli gizli tarama
    desc:
      en: |
        Add random delays (jitter) between requests to mimic human behavior and avoid detection. 
        This is essential during red team engagements where avoiding automated detection systems and WAF alerts is a priority. 
        The jitter flag adds a random number of seconds to the delay, making the traffic pattern less predictable.
        Note that using jitter and delays will significantly increase the total time required to complete the scan.
      tr: |
        İnsan davranışını taklit etmek ve tespitten kaçınmak için istekler arasına rastgele gecikmeler (jitter) ekleyin.
        Otomatik tespit sistemlerinden ve WAF uyarılarından kaçınmanın öncelikli olduğu kırmızı ekip çalışmalarında gereklidir.
        Jitter bayrağı gecikmeye rastgele saniyeler ekleyerek trafik kalıbını daha az öngörülebilir kılar.
        Jitter ve gecikme kullanmanın taramayı tamamlama süresini ciddi ölçüde artıracağını unutmayın.
    command: "eyewitness -f {{url_file}} --jitter {{jitter_seconds|5}} --delay {{delay_seconds|2}} -d {{output_dir|stealth_scan}}"

  # === ADVANCED CONFIGURATION ===
  - title:
      en: eyewitness - scan through proxy
      tr: eyewitness - vekil sunucu üzerinden tarama
    desc:
      en: |
        Route all web requests through a specified proxy server such as Burp Suite, Zap, or a SOCKS5 proxy. 
        This is necessary when targets are only accessible through a specific gateway or when you want to capture the traffic for further analysis. 
        Ensure the proxy is active and reachable; otherwise, all requests within EyeWitness will fail.
        You can specify the type as 'socks5' or 'http' depending on your proxy configuration.
      tr: |
        Tüm web isteklerini Burp Suite, Zap veya SOCKS5 vekil sunucusu gibi belirtilen bir vekilden geçirin.
        Hedeflere yalnızca belirli bir ağ geçidi üzerinden erişilebiliyorsa veya trafiği ileri analiz için yakalamak istiyorsanız gereklidir.
        Vekilin aktif ve erişilebilir olduğundan emin olun; aksi halde EyeWitness içindeki tüm istekler başarısız olur.
        Vekil yapılandırmanıza göre türü 'socks5' veya 'http' olarak belirtebilirsiniz.
    command: "eyewitness -f {{url_file}} --proxy-ip {{proxy_host|127.0.0.1}} --proxy-port {{proxy_port|8080}} --proxy-type {{proxy_type|socks5}} -d {{output_dir|proxy_scan}}"

  - title:
      en: eyewitness - custom user-agent and cookies
      tr: eyewitness - özel user-agent ve çerezler
    desc:
      en: |
        Use a custom User-Agent string and session cookies for the requests. 
        Providing a custom User-Agent can help bypass filters that block default automation headers or mimic specific browser versions. 
        Adding cookies allows EyeWitness to take screenshots of pages that require authentication or specific session states.
        Format cookies as a comma-separated list of key=value pairs.
      tr: |
        İstekler için özel bir User-Agent dizesi ve oturum çerezleri kullanın.
        Özel User-Agent sağlamak, varsayılan otomasyon başlıklarını engelleyen filtreleri aşmaya veya belirli tarayıcı sürümlerini taklit etmeye yardımcı olabilir.
        Çerez eklemek, EyeWitness'in kimlik doğrulama veya belirli oturum durumu gerektiren sayfaların ekran görüntüsünü almasını sağlar.
        Çerezleri anahtar=değer çiftlerinin virgülle ayrılmış listesi olarak biçimlendirin.
    command: "eyewitness -f {{url_file}} --user-agent \"{{user_agent|Mozilla/5.0}}\" --cookies \"{{cookie_string|sessionid=12345}}\" -d {{output_dir|authenticated_scan}}"

  - title:
      en: eyewitness - scan custom web ports
      tr: eyewitness - özel web portlarını tarama
    desc:
      en: |
        Instruct EyeWitness to treat specific non-standard ports as HTTP or HTTPS services. 
        By default, the tool only looks for common ports like 80, 443, 8080, etc. 
        This option ensures you don't miss administrative interfaces or dev environments running on unusual ports like 8443 or 9000.
        It is particularly useful for identifying hidden management consoles on IoT devices or cloud instances.
      tr: |
        EyeWitness'e belirli standart dışı portları HTTP veya HTTPS hizmeti olarak değerlendirmesini söyleyin.
        Araç varsayılan olarak yalnızca 80, 443, 8080 gibi yaygın portlara bakar.
        Bu seçenek, 8443 veya 9000 gibi olağandışı portlarda çalışan yönetim arayüzlerini veya geliştirme ortamlarını kaçırmamanızı sağlar.
        IoT cihazları veya bulut sunucularındaki gizli yönetim konsollarını tespit etmek için özellikle kullanışlıdır.
    command: "eyewitness -f {{url_file}} --add-http-ports {{http_ports|8001,8002}} --add-https-ports {{https_ports|9443}} -d {{output_dir|custom_ports}}"

  # === MAINTENANCE & RESUME ===
  - title:
      en: eyewitness - resume interrupted scan
      tr: eyewitness - kesintiye uğramış taramayı sürdürme
    desc:
      en: |
        Resume a previously interrupted or crashed scan using the local database file generated during the initial run. 
        EyeWitness automatically creates a database (usually ew.db) to track progress, preventing the need to restart large scans from scratch. 
        This feature is a lifesaver when dealing with thousands of targets where network stability or system resources might be an issue.
        Simply point the tool to the path of the existing .db file to pick up where it left off.
      tr: |
        İlk çalışmada üretilen yerel veritabanı dosyasını kullanarak kesintiye uğramış veya çökmüş bir taramayı sürdürün.
        EyeWitness ilerlemeyi takip etmek için otomatik bir veritabanı (genellikle ew.db) oluşturur; büyük taramaları baştan başlatma ihtiyacını ortadan kaldırır.
        Ağ kararlılığının veya sistem kaynaklarının sorun olabileceği binlerce hedefle uğraşırken bu özellik hayat kurtarır.
        Kaldığı yerden devam etmek için aracı mevcut .db dosyasının yoluna yöneltmeniz yeterlidir.
    command: "eyewitness --resume {{db_file|ew.db}}"

  - title:
      en: eyewitness - auto-prepend protocol
      tr: eyewitness - protokolleri otomatik ekleme
    desc:
      en: |
        Automatically add http:// and https:// prefixes to a list of raw domain names or IP addresses. 
        This eliminates the need to manually format target lists that are exported from other tools without a protocol specified. 
        It ensures that EyeWitness attempts to connect to both secure and insecure versions of the target to find the active web service.
        This is a great time-saver when working with raw OSINT data or domain enumeration results.
      tr: |
        Ham alan adı veya IP adresi listesine http:// ve https:// öneklerini otomatik ekleyin.
        Protokol belirtilmeden diğer araçlardan dışa aktarılan hedef listelerini elle biçimlendirme ihtiyacını ortadan kaldırır.
        EyeWitness'in aktif web hizmetini bulmak için hedefin hem güvenli hem güvensiz sürümlerine bağlanmayı denemesini sağlar.
        Ham OSINT verileri veya alan adı numaralandırma sonuçlarıyla çalışırken büyük zaman kazandırır.
    command: "eyewitness -f {{domain_file}} --prepend-https -d {{output_dir|prepended_scan}}"
