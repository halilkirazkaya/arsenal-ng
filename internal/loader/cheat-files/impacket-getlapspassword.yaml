tool: impacket-getlapspassword
tags: [pentest, security, active-directory, impacket, enumeration, post-exploitation, laps]

actions:
# === BASIC AUTHENTICATION ===

 - title:
     en: impacket-GetLAPSPassword - basic authentication
     tr: impacket-GetLAPSPassword - temel kimlik doğrulama
   desc:
     en: |
       Extract all available LAPS passwords from the Active Directory environment using cleartext credentials. 
       This command queries the LDAP server for the ms-Mcs-AdmPwd attribute which stores the local administrator password.
       It is typically used after gaining initial domain credentials to escalate privileges on workstations or servers.
       Note that the user account provided must have read permissions on the computer objects' LAPS attributes.
     tr: |
       Açık kimlik bilgileriyle Active Directory ortamındaki tüm LAPS parolalarını çıkarır.
       Bu komut, yerel yönetici parolasını tutan ms-Mcs-AdmPwd özniteliği için LDAP sunucusunu sorgular.
       Genellikle ilk etki alanı kimlik bilgileri elde edildikten sonra iş istasyonlarında veya sunucularda yetki yükseltmek için kullanılır.
       Sağlanan kullanıcı hesabının bilgisayar nesnelerinin LAPS özniteliklerinde okuma izni olması gerektiğini unutmayın.
   command: "impacket-GetLAPSPassword {{domain}}/{{username}}:{{password}}@{{dc_ip}}"

 - title:
     en: impacket-GetLAPSPassword - pass-the-hash authentication
     tr: impacket-GetLAPSPassword - hash ile kimlik doğrulama
   desc:
     en: |
       Authenticate to the Domain Controller using NTLM hashes instead of a plaintext password.
       This is the standard approach for "Pass-the-Hash" attacks when a user's NTLM hash has been recovered from memory or a SAM database.
       The format for the hash should be LMHASH:NTHASH (use an empty LM hash if only the NT hash is available).
       This method allows for credential reuse without needing to crack the original password.
     tr: |
       Etki Alanı Denetleyicisine NTLM hash'leriyle, düz metin parola olmadan kimlik doğrulaması yapar.
       Kullanıcının NTLM hash'i bellekten veya SAM veritabanından kurtarıldığında standart Pass-the-Hash yaklaşımıdır.
       Hash biçimi LMHASH:NTHASH olmalı (yalnızca NT hash'i varsa boş LM hash'i kullanın).
       Bu yöntem, asıl parolayı kırmaya gerek kalmadan kimlik bilgisi yeniden kullanımına olanak tanır.
   command: "impacket-GetLAPSPassword -hashes {{lmhash:nthash}} {{domain}}/{{username}}@{{dc_ip}}"

# === FILTERING AND OUTPUT ===

 - title:
     en: impacket-GetLAPSPassword - target specific computer
     tr: impacket-GetLAPSPassword - belirli bilgisayarı hedefleme
   desc:
     en: |
       Query the LAPS password for a specific computer name instead of listing all visible passwords.
       This reduces noise and network traffic when you are only interested in a single high-value target.
       The computer name should be provided without the trailing dollar sign ($) in most cases.
       It is highly recommended for large environments to avoid processing thousands of computer objects.
     tr: |
       Görünür tüm parolaları listelemek yerine belirli bir bilgisayar adı için LAPS parolasını sorgular.
       Yalnızca tek bir yüksek değerli hedefle ilgilendiğinizde gürültüyü ve ağ trafiğini azaltır.
       Bilgisayar adı çoğu durumda sondaki dolar işareti ($) olmadan verilmelidir.
       Binlerce bilgisayar nesnesini işlememek için büyük ortamlarda şiddetle önerilir.
   command: "impacket-GetLAPSPassword -computer {{computer_name}} {{domain}}/{{username}}:{{password}}@{{dc_ip}}"

 - title:
     en: impacket-GetLAPSPassword - save results to file
     tr: impacket-GetLAPSPassword - sonuçları dosyaya kaydetme
   desc:
     en: |
       Execute the LAPS password extraction and redirect the output to a specified local file.
       This is useful for maintaining a record of discovered local administrator credentials for later stages of the engagement.
       The tool will format the output in a way that is easy to read or parse with other scripts.
       Ensure you have write permissions in the directory where you are attempting to save the output.
     tr: |
       LAPS parolası çıkarmayı çalıştırır ve çıktıyı belirtilen yerel dosyaya yönlendirir.
       Çalışmanın sonraki aşamaları için keşfedilen yerel yönetici kimlik bilgilerinin kaydını tutmakta yararlıdır.
       Araç, çıktıyı diğer betiklerle kolay okunacak veya ayrıştırılacak biçimde düzenler.
       Çıktıyı kaydetmeye çalıştığınız dizinde yazma izniniz olduğundan emin olun.
   command: "impacket-GetLAPSPassword -o {{output_file|laps_results.txt}} {{domain}}/{{username}}:{{password}}@{{dc_ip}}"

# === ADVANCED CONNECTION & KERBEROS ===

 - title:
     en: impacket-GetLAPSPassword - kerberos authentication
     tr: impacket-GetLAPSPassword - Kerberos ile kimlik doğrulama
   desc:
     en: |
       Perform the LAPS query using Kerberos tickets instead of NTLM authentication.
       The tool will attempt to use the ticket pointed to by the KRB5CCNAME environment variable.
       This is useful in environments where NTLM is disabled or to avoid generating NTLM-based alerts in logs.
       You must ensure that the target parameter matches the SPN/hostname expected by the Kerberos ticket.
     tr: |
       NTLM kimlik doğrulaması yerine Kerberos biletleriyle LAPS sorgusu yapar.
       Araç, KRB5CCNAME ortam değişkeninin gösterdiği bileti kullanmaya çalışır.
       NTLM'nin devre dışı olduğu ortamlarda veya NTLM tabanlı uyarılardan kaçınmak için kullanışlıdır.
       Hedef parametrenin Kerberos biletinin beklediği SPN/ana makine adıyla eşleşmesi gerekir.
   command: "impacket-GetLAPSPassword -k -no-pass {{domain}}/{{username}}@{{dc_hostname}}"

 - title:
     en: impacket-GetLAPSPassword - use secure ldap (LDAPS)
     tr: impacket-GetLAPSPassword - güvenli LDAP (LDAPS) kullanma
   desc:
     en: |
       Force the tool to use LDAP over SSL (LDAPS) for the connection to the Domain Controller.
       This is often required for modern Windows Server versions (e.g., Server 2025) or environments where LDAP signing/encryption is enforced.
       If the target DC uses a self-signed certificate, you might encounter verification issues depending on your local configuration.
       Using LDAPS prevents the transmission of query data (including the passwords) in cleartext over the wire.
     tr: |
       Etki Alanı Denetleyicisi bağlantısı için LDAP over SSL (LDAPS) kullanımını zorlar.
       Modern Windows Server sürümlerinde veya LDAP imzalama/şifrelemenin zorunlu olduğu ortamlarda bu genellikle gereklidir.
       Hedef DC kendinden imzalı sertifika kullanıyorsa yerel yapılandırmanıza göre doğrulama sorunları çıkabilir.
       LDAPS kullanmak, sorgu verilerinin (parolalar dahil) ağda açık iletilmesini engeller.
   command: "impacket-GetLAPSPassword -ldaps -dc-ip {{dc_ip}} {{domain}}/{{username}}:{{password}}@{{domain}}"

 - title:
     en: impacket-GetLAPSPassword - specify domain controller hostname
     tr: impacket-GetLAPSPassword - etki alanı denetleyicisi ana makine adı belirtme
   desc:
     en: |
       Explicitly define the Domain Controller's hostname and IP address for the connection.
       This is useful when DNS resolution is not working correctly or when you need to target a specific DC in a multi-DC environment.
       Providing both -dc-ip and -dc-host ensures the tool knows exactly where to route the LDAP requests.
       This can also help avoid issues with Kerberos SPN validation.
     tr: |
       Bağlantı için Etki Alanı Denetleyicisinin ana makine adını ve IP adresini açıkça tanımlar.
       DNS çözümlemesi düzgün çalışmadığında veya çok DC'li ortamda belirli bir DC hedeflenecekse kullanışlıdır.
       -dc-ip ve -dc-host birlikte vermek, aracın LDAP isteklerini tam olarak nereye yönlendireceğini bilmesini sağlar.
       Bu aynı zamanda Kerberos SPN doğrulamasıyla ilgili sorunlardan kaçınmaya yardımcı olur.
   command: "impacket-GetLAPSPassword -dc-ip {{dc_ip}} -dc-host {{dc_hostname}} {{domain}}/{{username}}:{{password}}@{{domain}}"

# === DEBUGGING ===

 - title:
     en: impacket-GetLAPSPassword - debug mode with timestamps
     tr: impacket-GetLAPSPassword - zaman damgalı hata ayıklama modu
   desc:
     en: |
       Run the tool with debug logging enabled and timestamps added to every line of output.
       This is critical for troubleshooting connection issues, permission errors, or protocol mismatches.
       The verbose output shows exactly what LDAP queries are being sent and the raw responses received.
       Use this if you suspect that passwords exist but are not being displayed by the standard output.
     tr: |
       Aracı hata ayıklama günlüğü etkin ve her satırda zaman damgasıyla çalıştırır.
       Bağlantı sorunları, izin hataları veya protokol uyumsuzluklarını gidermek için kritiktir.
       Ayrıntılı çıktı, gönderilen LDAP sorgularını ve alınan ham yanıtları tam olarak gösterir.
       Parolaların var olduğundan şüpheleniyor ancak standart çıktıda görünmüyorsa bunu kullanın.
   command: "impacket-GetLAPSPassword -debug -ts {{domain}}/{{username}}:{{password}}@{{dc_ip}}"