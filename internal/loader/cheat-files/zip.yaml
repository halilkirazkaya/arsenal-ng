tool: zip
tags: [compression, archive, backup, security, utility, files]

actions:
  # === BASIC OPERATIONS ===
  - title:
      en: zip - basic file compression
      tr: zip - temel dosya sıkıştırma
    desc:
      en: |
        Create a new zip archive containing one or more specific files. This is the most 
        straightforward usage for bundling individual documents or scripts into a single file. 
        The resulting archive will be created in the current directory unless a path is specified. 
        Ensure you have write permissions in the destination directory before execution.
      tr: |
        Bir veya birden fazla belirli dosyayı içeren yeni bir zip arşivi oluşturur. Bu, tek tek belgeleri veya betikleri tek bir dosyada toplamanın en basit kullanımıdır.
        Ortaya çıkan arşiv, yol belirtilmedikçe mevcut dizinde oluşturulur.
        Çalıştırmadan önce hedef dizinde yazma izniniz olduğundan emin olun.
    command: "zip {{archive_name|archive.zip}} {{files|file1.txt file2.txt}}"

  - title:
      en: zip - recursive directory compression
      tr: zip - özyinelemeli dizin sıkıştırma
    desc:
      en: |
        Compress an entire directory tree including all subdirectories and their contents. 
        The -r flag is mandatory when you want to preserve the folder structure and include 
        nested files. This is the standard method for backing up project folders or large data sets. 
        Be aware that hidden files (starting with a dot) are included by default in most environments.
      tr: |
        Bir dizin ağacının tamamını tüm alt dizinleri ve içerikleriyle sıkıştırır.
        Klasör yapısını ve iç içe dosyaları korumak istediğinizde -r bayrağı zorunludur. Bu, proje klasörlerini veya büyük veri kümelerini yedeklemenin standart yöntemidir.
        Gizli dosyaların (noktayla başlayan) çoğu ortamda varsayılan olarak dahil edildiğini unutmayın.
    command: "zip -r {{archive_name|backup.zip}} {{directory_path|folder/}}"

  - title:
      en: zip - move files into archive
      tr: zip - dosyaları arşive taşıma
    desc:
      en: |
        Add files to a zip archive and automatically delete the original source files from the disk. 
        The -m flag is useful when you want to archive data to save space and don't need the 
        uncompressed versions anymore. This operation effectively performs a "cut and paste" 
        into the zip file. Use this with caution as the original files are removed upon successful compression.
      tr: |
        Dosyaları bir zip arşivine ekler ve diskteki özgün kaynak dosyaları otomatik siler.
        -m bayrağı, sıkıştırılmamış sürümlere artık ihtiyaç duymadığınızda yer kazanmak için arşivlemek istediğinizde kullanışlıdır. Bu işlem fiilen zip dosyasına bir "kes ve yapıştır" yapar.
        Özgün dosyalar başarılı sıkıştırmada silindiği için dikkatli kullanın.
    command: "zip -m {{archive_name|archive.zip}} {{files|temp_data.log}}"

  - title:
      en: zip - junk directory names
      tr: zip - dizin adlarını atma
    desc:
      en: |
        Store files in a zip archive without recording their directory paths. Using the -j flag 
        will result in all files being placed in the root of the zip archive, regardless of 
        their original location. This is helpful when you want to flatten a file structure for 
        easier extraction. Note that if two files have the same name in different source folders, 
        the archive may encounter naming conflicts.
      tr: |
        Dosyaları dizin yollarını kaydetmeden bir zip arşivinde saklar. -j bayrağını kullanmak, özgün konumlarından bağımsız olarak tüm dosyaların zip arşivinin köküne yerleştirilmesine yol açar.
        Bu, daha kolay çıkarma için dosya yapısını düzleştirmek istediğinizde yardımcı olur.
        Farklı kaynak klasörlerde aynı adlı iki dosya varsa arşivde adlandırma çakışması olabileceğini unutmayın.
    command: "zip -j {{archive_name|flat.zip}} {{source_path|path/to/files/*}}"

  # === UPDATING AND FILTERING ===
  - title:
      en: zip - update existing archive
      tr: zip - mevcut arşivi güncelleme
    desc:
      en: |
        Update an existing zip archive by adding new files or replacing changed ones. The -u 
        flag compares the modification time of the files on disk with those in the archive. 
        It only processes files that are newer or did not exist in the zip file previously. 
        This is much more efficient than recreating a large archive from scratch.
      tr: |
        Yeni dosyalar ekleyerek veya değişenleri değiştirerek mevcut bir zip arşivini günceller. -u bayrağı diskteki dosyaların değişiklik zamanını arşivdekilerle karşılaştırır.
        Yalnızca daha yeni olan veya zip dosyasında daha önce bulunmayan dosyaları işler.
        Bu, büyük bir arşivi sıfırdan yeniden oluşturmaktan çok daha verimlidir.
    command: "zip -u {{archive_name|existing.zip}} {{files|updated_file.txt}}"

  - title:
      en: zip - delete files from archive
      tr: zip - arşivden dosya silme
    desc:
      en: |
        Remove specific entries from an already existing zip archive. The -d flag allows you 
        to clean up archives by deleting unnecessary files without unzipping the whole package. 
        You must specify the path as it exists inside the zip archive for the command to find it. 
        This operation modifies the archive file directly and reduces its contents.
      tr: |
        Zaten mevcut bir zip arşivinden belirli girdileri kaldırır. -d bayrağı, tüm paketi açmadan gereksiz dosyaları temizleyerek arşivleri düzenlemenize olanak tanır.
        Komutun bulması için yolu zip arşivindeki haliyle belirtmelisiniz.
        Bu işlem arşiv dosyasını doğrudan değiştirir ve içeriğini küçültür.
    command: "zip -d {{archive_name|archive.zip}} {{file_to_remove|old_file.txt}}"

  - title:
      en: zip - exclude specific files or patterns
      tr: zip - belirli dosya veya kalıpları hariç tutma
    desc:
      en: |
        Create an archive while excluding specific files, directories, or patterns. The -x flag 
        is essential for omitting version control folders like .git or temporary build files. 
        Patterns must often be enclosed in quotes to prevent the shell from expanding them. 
        This ensures your final package is clean and contains only the necessary production files.
      tr: |
        Belirli dosyaları, dizinleri veya kalıpları hariç tutarak arşiv oluşturur. -x bayrağı .git gibi sürüm kontrol klasörlerini veya geçici derleme dosyalarını atlamak için gereklidir.
        Kalıpların kabuk tarafından genişletilmesini önlemek için genellikle tırnak içine alınması gerekir.
        Bu, nihai paketinizin yalnızca gerekli üretim dosyalarını içermesini sağlar.
    command: "zip -r {{archive_name|clean_backup.zip}} {{directory|.}} -x {{exclude_pattern|*.git*}}"

  # === ENCRYPTION AND LEVELS ===
  - title:
      en: zip - password protected encryption
      tr: zip - parola korumalı şifreleme
    desc:
      en: |
        Encrypt the contents of the zip archive with a password. When using the -e flag, 
        the program will prompt you to enter and verify a password interactively. This 
        provides a basic layer of security for sensitive data being transferred or stored. 
        Please note that standard ZIP encryption is considered weak; use tools like 7z or 
        GPG for high-security requirements.
      tr: |
        Zip arşivinin içeriğini parolayla şifreler. -e bayrağını kullandığınızda program etkileşimli olarak parola girip doğrulamanızı ister. Bu, aktarılan veya saklanan hassas veriler için temel bir güvenlik katmanı sağlar.
        Standart ZIP şifrelemenin zayıf sayıldığını unutmayın; yüksek güvenlik gereksinimleri için 7z veya GPG gibi araçlar kullanın.
    command: "zip -e {{archive_name|secure.zip}} {{files|sensitive_data.txt}}"

  - title:
      en: zip - maximum compression level
      tr: zip - maksimum sıkıştırma düzeyi
    desc:
      en: |
        Create an archive using the highest possible compression ratio. The -9 flag tells 
        the tool to spend more CPU time to achieve the smallest file size possible. This 
        is ideal for long-term storage or when preparing files for web downloads. Conversely, 
        -1 can be used for the fastest compression with less size reduction.
      tr: |
        Mevcut en yüksek sıkıştırma oranıyla arşiv oluşturur. -9 bayrağı araca mümkün olan en küçük dosya boyutu için daha fazla CPU zamanı harcatır. Bu, uzun süreli depolama veya web indirmeleri için dosyalar hazırlarken idealdir.
        Buna karşılık -1, daha az boyut küçültmeyle en hızlı sıkıştırma için kullanılabilir.
    command: "zip -9 -r {{archive_name|optimized.zip}} {{directory|data_folder/}}"

  # === MAINTENANCE AND INTEGRITY ===
  - title:
      en: zip - test archive integrity
      tr: zip - arşiv bütünlüğünü test etme
    desc:
      en: |
        Verify the integrity of a zip archive to ensure it is not corrupted. The -T flag 
        checks the internal structure and checksums of every file inside the archive. 
        It is a best practice to run this after creating a critical backup to confirm the 
        data can be safely extracted later. If errors are found, the tool will report which 
        entries are damaged.
      tr: |
        Bozuk olmadığından emin olmak için bir zip arşivinin bütünlüğünü doğrular. -T bayrağı arşivdeki her dosyanın iç yapısını ve sağlama toplamlarını denetler.
        Kritik bir yedek oluşturduktan sonra verinin daha sonra güvenle çıkarılabileceğini doğrulamak için bunu çalıştırmak en iyi uygulamadır.
        Hata bulunursa araç hangi girdilerin hasarlı olduğunu bildirir.
    command: "zip -T {{archive_name|archive.zip}}"

  - title:
      en: zip - repair corrupted archive
      tr: zip - bozuk arşivi onarma
    desc:
      en: |
        Attempt to repair a damaged or corrupted zip archive. The -FF (fix-fix) flag tries 
        harder to recover data by scanning the archive for recognizable file headers. 
        It is often used when an archive was partially downloaded or suffered disk errors. 
        The command usually requires the --out flag to specify where the recovered data 
        should be saved.
      tr: |
        Hasarlı veya bozuk bir zip arşivini onarmaya çalışır. -FF (fix-fix) bayrağı tanınabilir dosya başlıkları için arşivi tarayarak veriyi kurtarmaya çalışır.
        Genellikle arşiv kısmen indirildiğinde veya disk hataları yaşadığında kullanılır.
        Komut genellikle kurtarılan verinin nereye kaydedileceğini belirtmek için --out bayrağını gerektirir.
    command: "zip -FF {{corrupt_archive|damaged.zip}} --out {{fixed_archive|recovered.zip}}"

  - title:
      en: zip - preserve symbolic links
      tr: zip - sembolik bağlantıları koruma
    desc:
      en: |
        Store symbolic links as links rather than compressing the actual file they point to. 
        The -y flag is crucial for maintaining system configurations or software projects 
        on Unix-like systems. Without this flag, zip will follow the link and archive the 
        target file, which can significantly increase archive size and break path logic. 
        This is highly recommended when archiving development environments.
      tr: |
        Sembolik bağlantıları işaret ettikleri gerçek dosya yerine bağlantı olarak saklar.
        -y bayrağı Unix benzeri sistemlerde sistem yapılandırmalarını veya yazılım projelerini arşivlerken kritiktir. Bu bayrak olmadan zip bağlantıyı izler ve hedef dosyayı arşivler,
        bu da arşiv boyutunu önemli ölçüde büyütebilir ve yol mantığını bozabilir.
        Geliştirme ortamlarını arşivlerken önemle önerilir.
    command: "zip -ry {{archive_name|system_backup.zip}} {{directory|/etc/}}"
