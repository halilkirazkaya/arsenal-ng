tool: interactsh
tags: [oast, out-of-band, pentest, security, enumeration, exploitation, network]

actions:
# === CLIENT USAGE ===
 - title:
    en: interactsh-client - basic execution
    tr: interactsh-client - temel çalıştırma
   desc:
     en: |
       Starts the interactsh client with default settings to poll the public ProjectDiscovery servers. 
       Upon execution, it generates a unique URL that can be used for Out-of-Band (OAST) testing. 
       The client will continuously monitor for any DNS, HTTP, or SMTP interactions triggered by your payloads.
     tr: |
       Herkese açık ProjectDiscovery sunucularını yoklamak için interactsh istemcisini varsayılan ayarlarla başlatır.
       Çalıştırıldığında Bant Dışı (OAST) testi için kullanılabilecek benzersiz bir URL üretir.
       İstemci, yüklerinizce tetiklenen DNS, HTTP veya SMTP etkileşimlerini sürekli izler.
   command: "interactsh-client"

 - title:
    en: interactsh-client - generate multiple payloads
    tr: interactsh-client - birden çok yük üretme
   desc:
     en: |
       Generates a specific number of unique interactsh payloads in a single session. 
       This is highly useful when you need to test multiple injection points or different parameters simultaneously without mixing up the results. 
       Each generated URL is tracked by the same client instance, providing consolidated feedback for all targets.
     tr: |
       Tek bir oturumda belirli sayıda benzersiz interactsh yükü üretir.
       Sonuçları karıştırmadan birden çok enjeksiyon noktasını veya farklı parametreleri eş zamanlı test etmeniz gerektiğinde oldukça faydalıdır.
       Üretilen her URL aynı istemci örneğince izlenir ve tüm hedefler için toplu geri bildirim sağlar.
   command: "interactsh-client -n {{count|5}}"

 - title:
    en: interactsh-client - use custom self-hosted server
    tr: interactsh-client - özel kendine ait sunucu kullanma
   desc:
     en: |
       Connects the client to a private, self-hosted interactsh server instead of the public ones. 
       This is recommended for professional engagements where data privacy and confidentiality are paramount. 
       If the server is protected, you must provide the corresponding authentication token using the -t flag.
     tr: |
       İstemciyi herkese açık sunucular yerine özel, kendine ait bir interactsh sunucusuna bağlar.
       Veri gizliliği ve mahremiyetin çok önemli olduğu profesyonel çalışmalarda önerilir.
       Sunucu korumalıysa -t bayrağıyla ilgili kimlik doğrulama jetonunu vermelisiniz.
   command: "interactsh-client -server {{server_url}} -token {{auth_token}}"

 - title:
    en: interactsh-client - protocol specific filtering
    tr: interactsh-client - protokole özgü filtreleme
   desc:
     en: |
       Filters the output to display only specific types of interactions such as DNS, HTTP, or SMTP. 
       This helps reduce noise when you are specifically testing for a particular vulnerability class like DNS exfiltration or SSRF via HTTP. 
       You can use flags like -dns-only, -http-only, or -smtp-only depending on your current testing objective.
     tr: |
       Çıktıyı yalnızca DNS, HTTP veya SMTP gibi belirli etkileşim türlerini gösterecek şekilde filtreler.
       DNS sızdırma veya HTTP üzerinden SSRF gibi belirli bir zafiyet sınıfını test ederken gürültüyü azaltmaya yardımcı olur.
       Mevcut test hedefinize göre -dns-only, -http-only veya -smtp-only gibi bayrakları kullanabilirsiniz.
   command: "interactsh-client -{{protocol_filter|dns-only}}"

 - title:
    en: interactsh-client - save results to JSON
    tr: interactsh-client - sonuçları JSON'a kaydetme
   desc:
     en: |
       Redirects all captured interactions into a file in JSONL (JSON Lines) format. 
       JSON output is ideal for automated processing, integration with other security tools, or detailed reporting. 
       Using a log file ensures that you don't lose interaction data if the terminal buffer clears or the session terminates.
     tr: |
       Yakalanan tüm etkileşimleri JSONL (JSON Satırları) biçiminde bir dosyaya yönlendirir.
       JSON çıktısı otomatik işleme, diğer güvenlik araçlarıyla bütünleşme veya ayrıntılı raporlama için idealdir.
       Günlük dosyası kullanmak, terminal arabelleği temizlenirse veya oturum sonlanırsa etkileşim verilerini kaybetmemenizi sağlar.
   command: "interactsh-client -o {{output_file|results.json}} -json"

 - title:
    en: interactsh-client - persistent session management
    tr: interactsh-client - kalıcı oturum yönetimi
   desc:
     en: |
       Stores or reads session data from a specific file to maintain persistence across different runs. 
       This allows you to close the client and resume monitoring for the same generated payloads at a later time. 
       It is extremely useful for long-term testing where callbacks might occur hours or days after the initial injection.
     tr: |
       Farklı çalıştırmalar arasında kalıcılığı korumak için oturum verisini belirli bir dosyada saklar veya okur.
       İstemciyi kapatıp aynı üretilmiş yükler için izlemeye daha sonra devam etmenize olanak tanır.
       Geri aramaların ilk enjeksiyondan saatler veya günler sonra gerçekleşebileceği uzun vadeli testlerde son derece faydalıdır.
   command: "interactsh-client -sf {{session_file|mysession.session}}"

# === SERVER USAGE ===
 - title:
    en: interactsh-server - deploy basic OAST server
    tr: interactsh-server - temel OAST sunucusu kurma
   desc:
     en: |
       Starts a self-hosted interactsh server on a dedicated domain and public IP address. 
       This requires you to have configured NS records for the domain to point to this server's IP address. 
       Self-hosting is the best way to ensure that interaction logs never leave your controlled environment.
     tr: |
       Özel bir etki alanında ve herkese açık IP adresinde kendine ait bir interactsh sunucusu başlatır.
       Bunun için etki alanının NS kayıtlarını bu sunucunun IP adresini gösterecek şekilde yapılandırmış olmanız gerekir.
       Etkileşim günlüklerinin kontrolünüzdeki ortamdan asla çıkmamasını sağlamanın en iyi yolu kendi sunucunuzu barındırmaktır.
   command: "interactsh-server -domain {{domain}} -ip {{public_ip}}"

 - title:
    en: interactsh-server - enable authentication and security
    tr: interactsh-server - kimlik doğrulama ve güvenliği etkinleştirme
   desc:
     en: |
       Secures the self-hosted server by requiring a token for any client attempting to poll data. 
       Using a static token allows multiple team members to share the same server securely. 
       This prevents unauthorized third parties from discovering your payloads or viewing sensitive interaction data.
     tr: |
       Veri yoklamaya çalışan her istemciden jeton isteyerek kendine ait sunucuyu güvenli hale getirir.
       Statik bir jeton kullanmak birden çok ekip üyesinin aynı sunucuyu güvenli şekilde paylaşmasına olanak tanır.
       Yetkisiz üçüncü tarafların yüklerinizi keşfetmesini veya hassas etkileşim verilerini görmesini engeller.
   command: "interactsh-server -domain {{domain}} -auth -token {{secret_token}}"

 - title:
    en: interactsh-server - advanced protocol listeners
    tr: interactsh-server - gelişmiş protokol dinleyicileri
   desc:
     en: |
       Enables additional interaction listeners for protocols like LDAP, SMB, and FTP. 
       Note that SMB listeners often require specific dependencies like Impacket and Python 3 to be installed on the host. 
       These extra services significantly expand the attack surface you can test for Out-of-Band vulnerabilities.
     tr: |
       LDAP, SMB ve FTP gibi protokoller için ek etkileşim dinleyicileri etkinleştirir.
       SMB dinleyicilerinin makinede Impacket ve Python 3 gibi belirli bağımlılıkların kurulu olmasını gerektirdiğini unutmayın.
       Bu ek hizmetler, Bant Dışı zafiyetler için test edebileceğiniz saldırı yüzeyini önemli ölçüde genişletir.
   command: "interactsh-server -domain {{domain}} -ldap -smb -ftp"

 - title:
    en: interactsh-server - custom response configuration
    tr: interactsh-server - özel yanıt yapılandırması
   desc:
     en: |
       Enables dynamic responses and custom directory listing for the HTTP/HTTPS listeners. 
       This allows the server to serve specific files or headers, which can be used to simulate realistic environments or bypass certain security controls. 
       It is particularly useful for advanced SSRF exploitation scenarios where a specific response body is required.
     tr: |
       HTTP/HTTPS dinleyicileri için dinamik yanıtları ve özel dizin listelemeyi etkinleştirir.
       Sunucunun belirli dosyaları veya başlıkları sunmasına olanak tanır; bu, gerçekçi ortamları taklit etmek veya belirli güvenlik denetimlerini atlatmak için kullanılabilir.
       Belirli bir yanıt gövdesinin gerekli olduğu gelişmiş SSRF istismar senaryolarında özellikle faydalıdır.
   command: "interactsh-server -domain {{domain}} -dr -hd {{web_directory|/var/www/html}}"
