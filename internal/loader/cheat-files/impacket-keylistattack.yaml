tool: impacket-keylistattack
tags: [pentest, security, active-directory, kerberos, impacket, exploitation, enumeration]

actions:
  # === BASIC AUTHENTICATION SCENARIOS ===
  - title:
      en: impacket-keylistattack - basic attack with password
      tr: impacket-keylistattack - parolayla temel saldırı
    desc:
      en: |
        Performs the KERB-KEY-LIST-REQ attack using cleartext credentials against a specific KDC.
        This command is the most direct way to attempt secret dumping when you have a valid set of user credentials.
        It communicates with the Key Distribution Center to request key lists without needing to execute code on the target machine.
        Ensure the target user has sufficient privileges to perform the requested actions or list domain objects.
      tr: |
        Belirli bir KDC'ye karşı açık kimlik bilgileriyle KERB-KEY-LIST-REQ saldırısını gerçekleştirir.
        Geçerli bir kullanıcı kimlik bilgisine sahipken gizli veri dökmeyi denemenin en doğrudan yoludur.
        Hedef makinede kod çalıştırmaya gerek kalmadan anahtar listeleri istemek için Anahtar Dağıtım Merkezi ile iletişim kurar.
        Hedef kullanıcının istenen işlemler için yeterli yetkiye sahip olduğundan emin olun.
    command: "impacket-keylistattack {{domain}}/{{username}}:{{password}}@{{kdc_host}}"

  - title:
      en: impacket-keylistattack - authentication using NTLM hashes
      tr: impacket-keylistattack - NTLM hash'leriyle kimlik doğrulama
    desc:
      en: |
        Executes the attack by authenticating with NTLM hashes instead of a plain password.
        This is particularly useful in Pass-the-Hash scenarios where cleartext passwords are not available.
        The tool will use the provided hashes to authenticate to SMB and proceed with the Kerberos key list request.
        Format the hashes as LMHASH:NTHASH, typically leaving the LM part empty if unknown.
      tr: |
        Düz parola yerine NTLM hash'leriyle kimlik doğrulayarak saldırıyı yürütür.
        Açık parolaların bulunmadığı Pass-the-Hash senaryolarında özellikle kullanışlıdır.
        Araç, sağlanan hash'lerle SMB'ye kimlik doğrulaması yapar ve Kerberos anahtar listesi isteğine geçer.
        Hash'leri LMHASH:NTHASH biçiminde verin; LM kısmı bilinmiyorsa genellikle boş bırakın.
    command: "impacket-keylistattack -hashes {{hash}} {{domain}}/{{username}}@{{kdc_host}}"

  - title:
      en: impacket-keylistattack - authentication using Kerberos ticket
      tr: impacket-keylistattack - Kerberos biletiyle kimlik doğrulama
    desc:
      en: |
        Uses an existing Kerberos ticket (ccache file) for authentication to perform the attack.
        This method is more stealthy as it avoids sending NTLM authentication over the network.
        You must have a valid KRB5CCNAME environment variable pointing to your ticket file before running this.
        The -no-pass flag ensures the tool does not prompt for a password during the execution.
      tr: |
        Saldırıyı gerçekleştirmek için mevcut bir Kerberos biletini (ccache dosyası) kullanır.
        Ağ üzerinden NTLM kimlik doğrulaması göndermediği için daha gizli bir yöntemdir.
        Çalıştırmadan önce KRB5CCNAME ortam değişkeninin bilet dosyanızı göstermesi gerekir.
        -no-pass bayrağı, araç çalışırken parola sormamasını sağlar.
    command: "impacket-keylistattack -k -no-pass {{domain}}/{{username}}@{{kdc_host}}"

  # === ENUMERATION & TARGETING ===
  - title:
      en: impacket-keylistattack - attack all domain users
      tr: impacket-keylistattack - tüm etki alanı kullanıcılarına saldırı
    desc:
      en: |
        Attempts to run the KERB-KEY-LIST-REQ attack against every user found in the domain.
        This is a highly aggressive and noisy operation that is likely to be flagged by EDR or SIEM solutions.
        It may also lead to a high volume of TGS requests, which could cause the KDC to reject subsequent requests.
        Use this only when a full dump is required and noise is not a primary concern.
      tr: |
        Etki alanında bulunan her kullanıcıya karşı KERB-KEY-LIST-REQ saldırısını çalıştırmayı dener.
        EDR veya SIEM çözümlerince işaretlenmesi muhtemel, oldukça agresif ve gürültülü bir işlemdir.
        Ayrıca yüksek hacimde TGS isteğine yol açarak KDC'nin sonraki istekleri reddetmesine neden olabilir.
        Yalnızca tam döküm gerektiğinde ve gürültü birincil endişe değilken kullanın.
    command: "impacket-keylistattack -full {{domain}}/{{username}}:{{password}}@{{kdc_host}}"

  - title:
      en: impacket-keylistattack - target specific users from a file
      tr: impacket-keylistattack - dosyadaki belirli kullanıcıları hedefleme
    desc:
      en: |
        Reads a list of target usernames from a text file and performs the attack only on those accounts.
        This approach is much more surgical than a full scan and helps stay under the radar of security monitoring.
        When using the LIST option, you must explicitly provide the domain and KDC parameters.
        The input file should contain one username per line.
      tr: |
        Hedef kullanıcı adlarını bir metin dosyasından okur ve saldırıyı yalnızca bu hesaplarda gerçekleştirir.
        Bu yaklaşım tam taramadan çok daha hedeflidir ve güvenlik izlemesinin radarında kalmaya yardımcı olur.
        LIST seçeneği kullanılırken etki alanı ve KDC parametreleri açıkça verilmelidir.
        Girdi dosyası satır başına bir kullanıcı adı içermelidir.
    command: "impacket-keylistattack -tf {{user_list_file}} -domain {{domain}} -kdc {{kdc_host}} {{domain}}/{{username}}:{{password}}@{{kdc_host}}"

  - title:
      en: impacket-keylistattack - target a single specific user
      tr: impacket-keylistattack - tek bir belirli kullanıcıyı hedefleme
    desc:
      en: |
        Focuses the attack on one specific username provided via the -t parameter.
        This is useful when you have identified a high-value target and want to retrieve their secrets specifically.
        Like other LIST options, this requires the domain and KDC hostname to be specified separately.
        It minimizes network traffic and reduces the risk of account lockouts or detection.
      tr: |
        Saldırıyı -t parametresiyle verilen tek bir kullanıcı adına odaklar.
        Yüksek değerli bir hedef belirleyip özellikle onun gizli verilerini almak istediğinizde kullanışlıdır.
        Diğer LIST seçenekleri gibi bunun için de etki alanı ve KDC ana makine adının ayrıca belirtilmesi gerekir.
        Ağ trafiğini en aza indirir ve hesap kilitleme veya tespit riskini azaltır.
    command: "impacket-keylistattack -t {{target_username}} -domain {{domain}} -kdc {{kdc_host}} {{domain}}/{{username}}:{{password}}@{{kdc_host}}"

  # === SPECIALIZED CONFIGURATIONS ===
  - title:
      en: impacket-keylistattack - RODC specific attack
      tr: impacket-keylistattack - RODC'ye özgü saldırı
    desc:
      en: |
        Performs the attack by leveraging Read-Only Domain Controller (RODC) credentials.
        You must provide the RODC account number and the corresponding AES key for the krbtgt account.
        This is specifically designed for environments where RODCs are deployed and you have compromised the RODC keys.
        The RODC key is essential for decrypting the key list responses provided by the KDC.
      tr: |
        Saldırıyı Salt Okunur Etki Alanı Denetleyicisi (RODC) kimlik bilgilerinden yararlanarak gerçekleştirir.
        RODC hesap numarasını ve krbtgt hesabına ait AES anahtarını sağlamanız gerekir.
        RODC'lerin dağıtıldığı ve RODC anahtarlarının ele geçirildiği ortamlar için özel tasarlanmıştır.
        RODC anahtarı, KDC'nin sağladığı anahtar listesi yanıtlarının şifresini çözmek için esastır.
    command: "impacket-keylistattack -rodcNo {{rodc_number}} -rodcKey {{rodc_aes_key}} {{domain}}/{{username}}:{{password}}@{{kdc_host}}"

  - title:
      en: impacket-keylistattack - specify target IP address
      tr: impacket-keylistattack - hedef IP adresi belirtme
    desc:
      en: |
        Forces the connection to a specific target IP address, bypassing DNS resolution for the NetBIOS name.
        This is helpful when the target KDC hostname cannot be resolved through standard means or in complex network segments.
        It ensures the packets are routed to the correct host while still using the appropriate domain context.
        Use this when you encounter 'Host not found' errors despite the target being reachable via IP.
      tr: |
        NetBIOS adı için DNS çözümlemesini atlayarak bağlantıyı belirli bir hedef IP adresine zorlar.
        Hedef KDC ana makine adı standart yollarla çözülemediğinde veya karmaşık ağ segmentlerinde yararlıdır.
        Uygun etki alanı bağlamı kullanılırken paketlerin doğru makineye yönlenmesini sağlar.
        'Makine bulunamadı' hataları alıp hedefe IP ile erişilebildiğinde bunu kullanın.
    command: "impacket-keylistattack -target-ip {{target_ip}} {{domain}}/{{username}}:{{password}}@{{kdc_host}}"

  - title:
      en: impacket-keylistattack - debug and timestamped output
      tr: impacket-keylistattack - hata ayıklamalı ve zaman damgalı çıktı
    desc:
      en: |
        Runs the attack with full debug output and adds timestamps to every log entry.
        This is crucial for troubleshooting connection issues or understanding why an attack failed (e.g., KDC errors).
        The timestamps help correlate the tool's actions with logs on the domain controller or other monitoring tools.
        Debug mode reveals the underlying Kerberos structures and responses being processed.
      tr: |
        Saldırıyı tam hata ayıklama çıktısı ve her günlük girdisinde zaman damgasıyla çalıştırır.
        Bağlantı sorunlarını gidermek veya saldırının neden başarısız olduğunu anlamak için kritiktir (ör. KDC hataları).
        Zaman damgaları, aracın eylemlerini etki alanı denetleyicisindeki veya diğer izleme araçlarındaki günlüklerle ilişkilendirmeye yardımcı olur.
        Hata ayıklama modu, işlenen temel Kerberos yapılarını ve yanıtları ortaya çıkarır.
    command: "impacket-keylistattack -debug -ts {{domain}}/{{username}}:{{password}}@{{kdc_host}}"