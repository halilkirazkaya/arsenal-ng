tool: drupwn
tags: [security, pentest, enumeration, drupal, cms, web, vulnerability]

actions:
  # === RECONNAISSANCE AND ENUMERATION ===
  - title:
      en: drupwn - basic enumeration
      tr: drupwn - temel numaralandırma
    desc:
      en: |
        Perform a basic discovery scan on the target Drupal website. This command 
        identifies the Drupal core version and checks for the existence of common files. 
        It is the recommended starting point for any Drupal-specific assessment to 
        establish a baseline of the target environment.
      tr: |
        Hedef Drupal sitesinde temel bir keşif taraması yapın. Bu komut
        Drupal çekirdek sürümünü tespit eder ve yaygın dosyaların varlığını denetler.
        Hedef ortamın temelini oluşturmak için Drupal odaklı her değerlendirmenin
        önerilen başlangıç noktasıdır.
    command: "drupwn --mode enum --target {{target}}"

  - title:
      en: drupwn - full component enumeration
      tr: drupwn - tam bileşen numaralandırması
    desc:
      en: |
        Scan for installed modules, themes, and default Drupal files simultaneously. 
        This is essential for identifying third-party components that might have 
        known vulnerabilities. Note that this process can generate significant web 
        traffic depending on the wordlist size and server responsiveness.
      tr: |
        Kurulu modülleri, temaları ve varsayılan Drupal dosyalarını aynı anda tarayın.
        Bilinen zafiyetleri olabilecek üçüncü taraf bileşenleri tespit etmek için gereklidir.
        Bu işlemin, wordlist boyutuna ve sunucu yanıt hızına bağlı olarak ciddi web
        trafiği üretebileceğini unutmayın.
    command: "drupwn --mode enum --target {{target}} --modules --themes --dfiles"

  - title:
      en: drupwn - user and node discovery
      tr: drupwn - kullanıcı ve içerik keşfi
    desc:
      en: |
        Attempt to enumerate valid usernames and published nodes/content using a 
        defined numerical range. This helps in mapping out the site's content structure 
        and identifying potential administrative usernames for brute-force attacks. 
        The range parameter defines how many IDs the tool will attempt to probe.
      tr: |
        Tanımlı bir sayısal aralık kullanarak geçerli kullanıcı adlarını ve yayımlanmış
        düğümleri/içerikleri numaralandırmaya çalışın. Bu, sitenin içerik yapısını
        haritalamaya ve kaba kuvvet saldırıları için olası yönetici kullanıcı adlarını
        belirlemeye yardımcı olur.
        Aralık parametresi, aracın kaç kimliği yoklayacağını belirler.
    command: "drupwn --mode enum --target {{target}} --users --nodes --range {{range|1-100}}"

  # === AUTHENTICATION AND STEALTH ===
  - title:
      en: drupwn - authenticated enumeration
      tr: drupwn - kimlik doğrulamalı numaralandırma
    desc:
      en: |
        Perform enumeration while providing session cookies or basic authentication 
        credentials. This allows the tool to access pages and modules that are 
        restricted to registered users or administrators. Use this when you have 
        obtained credentials to perform a "grey-box" security assessment.
      tr: |
        Oturum çerezleri veya temel kimlik doğrulama bilgileri vererek numaralandırma yapın.
        Bu, aracın kayıtlı kullanıcılara veya yöneticilere kısıtlı sayfa ve modüllere
        erişmesini sağlar. Kimlik bilgisi ele geçirdiğinizde "gri kutu" güvenlik
        değerlendirmesi yapmak için bunu kullanın.
    command: "drupwn --mode enum --target {{target}} --cookies {{cookies}} --bauth {{user:pass}}"

  - title:
      en: drupwn - stealthy scan with delays
      tr: drupwn - gecikmeli gizli tarama
    desc:
      en: |
        Configure the scan with request delays and a custom User-Agent to avoid 
        detection by Web Application Firewalls (WAF) or rate-limiting scripts. 
        Adding a delay ensures the server is not overwhelmed by rapid requests. 
        This is particularly useful when performing assessments against production 
        environments with active monitoring.
      tr: |
        Web Uygulama Güvenlik Duvarları (WAF) veya hız sınırlama betiklerince tespitten
        kaçınmak için taramayı istek gecikmeleri ve özel User-Agent ile yapılandırın.
        Gecikme eklemek sunucunun hızlı isteklerle yorulmasını engeller.
        Bu, aktif izlemesi olan üretim ortamlarına karşı değerlendirme yaparken özellikle kullanışlıdır.
    command: "drupwn --mode enum --target {{target}} --delay {{delay|0.5}} --ua {{user_agent|Mozilla/5.0}}"

  - title:
      en: drupwn - proxied enumeration
      tr: drupwn - vekil sunucu üzerinden numaralandırma
    desc:
      en: |
        Route all scanning traffic through a specified HTTP, HTTPS, or SOCKS proxy. 
        This is useful for anonymizing the source of the scan or for pivoting 
        through a compromised host within a network. You can also provide a file 
        containing a list of proxies to rotate through during the scan.
      tr: |
        Tüm tarama trafiğini belirtilen bir HTTP, HTTPS veya SOCKS vekil sunucusundan geçirin.
        Bu, tarama kaynağını anonimleştirmek veya ağ içinde ele geçirilmiş bir host
        üzerinden yönlenmek için kullanışlıdır. Tarama sırasında dönüşümlü
        kullanmak üzere vekil listesi içeren bir dosya da verebilirsiniz.
    command: "drupwn --mode enum --target {{target}} --proxy {{proxy_url|http://127.0.0.1:8080}}"

  # === ADVANCED OPERATIONS ===
  - title:
      en: drupwn - exploitation mode
      tr: drupwn - sömürü kipi
    desc:
      en: |
        Switch the tool from information gathering to the exploitation phase. 
        In this mode, the tool attempts to leverage known vulnerabilities based 
        on the identified Drupal version and modules. Exercise extreme caution 
        and ensure you have authorization, as exploitation can impact service stability.
      tr: |
        Aracı bilgi toplamadan sömürü aşamasına geçirin.
        Bu kipte araç, tespit edilen Drupal sürümü ve modüllerine dayanarak bilinen
        zafiyetlerden yararlanmaya çalışır. Sömürü hizmet kararlılığını etkileyebileceğinden
        son derece dikkatli olun ve yetkili olduğunuzdan emin olun.
    command: "drupwn --mode exploit --target {{target}}"

  - title:
      en: drupwn - multi-threaded scan with logging
      tr: drupwn - kayıt tutan çok iş parçacıklı tarama
    desc:
      en: |
        Execute an enumeration scan using multiple threads to increase performance 
        and save the output to a log file for later analysis. Increasing the 
        thread count speeds up the process but may cause the target server to 
        become unstable or block the scanning IP. Logging is highly recommended 
        for maintaining an audit trail of the assessment.
      tr: |
        Performansı artırmak için çok iş parçacığıyla numaralandırma taraması yapın
        ve çıktıyı sonradan incelemek üzere bir kayıt dosyasına kaydedin. İş parçacığı
        sayısını artırmak işlemi hızlandırır ancak hedef sunucuyu kararsızlaştırabilir
        veya tarama IP'sinin engellenmesine yol açabilir. Değerlendirmenin denetim
        izini korumak için kayıt tutulması şiddetle önerilir.
    command: "drupwn --mode enum --target {{target}} --thread {{threads|10}} --log"

  - title:
      en: drupwn - update local database
      tr: drupwn - yerel veritabanını güncelleme
    desc:
      en: |
        Update the local plugins, themes, and fingerprinting databases used by the tool. 
        Regular updates ensure that the tool can recognize the latest Drupal versions 
        and the newest community modules. This command should be run periodically 
        to maintain the effectiveness of the enumeration engine.
      tr: |
        Aracın kullandığı yerel eklenti, tema ve parmak izi veritabanlarını güncelleyin.
        Düzenli güncellemeler, aracın en yeni Drupal sürümlerini ve topluluk modüllerini
        tanıyabilmesini sağlar. Numaralandırma motorunun etkinliğini korumak için bu
        komut periyodik olarak çalıştırılmalıdır.
    command: "drupwn --update"
