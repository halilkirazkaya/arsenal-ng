tool: evil-winrm
tags: [winrm, windows, pentest, exploitation, remote-access, powershell]

actions:
  # === AUTHENTICATION ===
  - title:
      en: evil-winrm - basic password authentication
      tr: evil-winrm - temel parola kimlik doğrulaması
    desc:
      en: |
        Establishes a basic WinRM session using a plaintext password. 
        This is the most common method used when you have valid user credentials for a Windows target. 
        By default, it connects to port 5985; ensure the WinRM service is enabled on the remote host.
      tr: |
        Düz metin parola kullanarak temel bir WinRM oturumu kurar.
        Bir Windows hedefi için geçerli kullanıcı kimlik bilgilerine sahipken kullanılan en yaygın yöntemdir.
        Varsayılan olarak 5985 portuna bağlanır; uzak hostta WinRM hizmetinin etkin olduğundan emin olun.
    command: "evil-winrm -i {{ip}} -u {{user}} -p {{password}}"

  - title:
      en: evil-winrm - pass-the-hash authentication
      tr: evil-winrm - hash ile kimlik doğrulama (pass-the-hash)
    desc:
      en: |
        Connects to the target using an NTLM hash instead of a plaintext password. 
        This technique is vital in post-exploitation scenarios where you have dumped hashes from SAM or NTDS.dit but cannot crack them. 
        Ensure you only provide the NT part of the hash if the tool expects a single hash string.
      tr: |
        Hedefe düz metin parola yerine NTLM özeti ile bağlanır.
        SAM veya NTDS.dit'ten özetleri döküp kıramadığınız sömürü sonrası senaryolarda bu teknik hayati önem taşır.
        Araç tek bir özet dizesi bekliyorsa yalnızca NT kısmını verdiğinizden emin olun.
    command: "evil-winrm -i {{ip}} -u {{user}} -H {{nthash}}"

  - title:
      en: evil-winrm - secure connection with SSL
      tr: evil-winrm - SSL ile güvenli bağlantı
    desc:
      en: |
        Connects to the target using WinRM over SSL (WinRM-HTTPS). 
        This is typically used for port 5986 and provides an encrypted channel for your shell activities. 
        Use this when the target environment enforces encrypted management traffic to prevent credential sniffing.
      tr: |
        SSL üzerinden WinRM (WinRM-HTTPS) ile hedefe bağlanır.
        Genellikle 5986 portu için kullanılır ve kabuk etkinlikleriniz için şifreli bir kanal sağlar.
        Kimlik bilgisi koklamayı önlemek için şifreli yönetim trafiği dayatan hedef ortamlarda bunu kullanın.
    command: "evil-winrm -i {{ip}} -u {{user}} -p {{password}} -S"

  - title:
      en: evil-winrm - custom port connection
      tr: evil-winrm - özel port bağlantısı
    desc:
      en: |
        Connects to a WinRM service running on a non-standard port. 
        While 5985 (HTTP) and 5986 (HTTPS) are defaults, administrators sometimes change these to obscure the service. 
        Always perform a port scan first to identify the correct listener port before attempting to connect.
      tr: |
        Standart dışı bir portta çalışan WinRM hizmetine bağlanır.
        5985 (HTTP) ve 5986 (HTTPS) varsayılan olsa da yöneticiler hizmeti gizlemek için bunları bazen değiştirir.
        Bağlanmayı denemeden önce doğru dinleyici portu tespit etmek için daima önce port taraması yapın.
    command: "evil-winrm -i {{ip}} -u {{user}} -p {{password}} -P {{port|5985}}"

  # === ADVANCED LOADING ===
  - title:
      en: evil-winrm - load local powershell scripts
      tr: evil-winrm - yerel powershell betiklerini yükleme
    desc:
      en: |
        Automatically loads a local directory of PowerShell scripts into the remote session memory. 
        Once the session starts, you can invoke these scripts directly by name without uploading them to the disk. 
        This is excellent for running tools like PowerUp or Invoke-Mimikatz while bypassing some basic disk-based detection.
      tr: |
        Yerel bir PowerShell betik dizinini uzak oturum belleğine otomatik yükler.
        Oturum başladıktan sonra bu betikleri diske yüklemeden doğrudan adıyla çağırabilirsiniz.
        PowerUp veya Invoke-Mimikatz gibi araçları çalıştırırken bazı temel disk tabanlı tespitleri atlatmak için mükemmeldir.
    command: "evil-winrm -i {{ip}} -u {{user}} -p {{password}} -s {{scripts_path|/usr/share/powershell-scripts/}}"

  - title:
      en: evil-winrm - load local c# executables
      tr: evil-winrm - yerel c# çalıştırılabilir dosyalarını yükleme
    desc:
      en: |
        Enables the ability to run C# binaries directly from your local machine into the remote memory. 
        After connecting, you can use the 'Bypass-4Ready' or simply type the name of the executable to run it. 
        This "In-Memory" execution helps in evading AV/EDR solutions that primarily monitor files written to the physical drive.
      tr: |
        C# ikili dosyalarını yerel makinenizden doğrudan uzak bellekte çalıştırma olanağı sağlar.
        Bağlandıktan sonra çalıştırmak için 'Bypass-4Ready' komutunu kullanabilir veya çalıştırılabilir dosyanın adını yazabilirsiniz.
        Bu "bellek içi" çalıştırma, öncelikle fiziksel diske yazılan dosyaları izleyen AV/EDR çözümlerinden kaçmaya yardımcı olur.
    command: "evil-winrm -i {{ip}} -u {{user}} -p {{password}} -e {{exes_path|/opt/csharp-bins/}}"

  # === KERBEROS & ENCRYPTION ===
  - title:
      en: evil-winrm - kerberos authentication
      tr: evil-winrm - kerberos kimlik doğrulaması
    desc:
      en: |
        Uses Kerberos tickets for authentication instead of NTLM or passwords. 
        You must have a valid ticket in your local Kerberos cache and the realm must be correctly configured in /etc/krb5.conf. 
        This is highly effective in Active Directory environments for lateral movement and avoiding NTLM-based logging.
      tr: |
        NTLM veya parola yerine kimlik doğrulama için Kerberos biletleri kullanır.
        Yerel Kerberos önbelleğinizde geçerli bir bilet olmalı ve bölge (realm) /etc/krb5.conf içinde doğru yapılandırılmalıdır.
        Active Directory ortamlarında yanal hareket ve NTLM tabanlı kayıtlara yakalanmamak için oldukça etkilidir.
    command: "evil-winrm -i {{fqdn}} -r {{realm}} -u {{user}}"

  - title:
      en: evil-winrm - public/private key authentication
      tr: evil-winrm - genel/özel anahtar kimlik doğrulaması
    desc:
      en: |
        Authenticates using certificate-based authentication via public and private keys. 
        This is a more secure method of authentication often found in hardened environments. 
        You must provide the paths to both the public certificate and the private key to establish the handshake.
      tr: |
        Genel ve özel anahtarlarla sertifika tabanlı kimlik doğrulama kullanır.
        Sertleştirilmiş ortamlarda sık görülen daha güvenli bir kimlik doğrulama yöntemidir.
        El sıkışmayı kurmak için hem genel sertifikanın hem özel anahtarın yollarını vermelisiniz.
    command: "evil-winrm -i {{ip}} -c {{pub_key_path}} -k {{priv_key_path}} -S"

  # === SESSION UTILITIES ===
  - title:
      en: evil-winrm - session logging
      tr: evil-winrm - oturum kaydı
    desc:
      en: |
        Enables local logging of all inputs and outputs during the WinRM session. 
        This is crucial for documentation, reporting, and keeping track of commands executed during a penetration test. 
        Logs are saved to the current working directory, allowing for easy review of long-running enumeration tasks.
      tr: |
        WinRM oturumu sırasındaki tüm girdi ve çıktıların yerel kaydını etkinleştirir.
        Sızma testi sırasında çalıştırılan komutları takip etmek, belgelemek ve raporlamak için kritiktir.
        Kayıtlar çalışma dizinine kaydedilir; uzun süren numaralandırma işlerinin kolayca gözden geçirilmesini sağlar.
    command: "evil-winrm -i {{ip}} -u {{user}} -p {{password}} -l"

  - title:
      en: evil-winrm - custom user agent
      tr: evil-winrm - özel kullanıcı aracısı
    desc:
      en: |
        Modifies the HTTP User-Agent header used during the WinRM connection request. 
        Changing the default 'Microsoft WinRM Client' string can help in bypassing basic WAFs or network filtering rules. 
        It is a simple but effective technique for blending in with normal network traffic patterns.
      tr: |
        WinRM bağlantı isteğinde kullanılan HTTP User-Agent başlığını değiştirir.
        Varsayılan 'Microsoft WinRM Client' dizesini değiştirmek, temel WAF'ları veya ağ filtreleme kurallarını aşmaya yardımcı olabilir.
        Normal ağ trafik kalıplarına karışmak için basit ama etkili bir tekniktir.
    command: "evil-winrm -i {{ip}} -u {{user}} -p {{password}} -a {{user_agent|Test Corp WinRM Client}}"
