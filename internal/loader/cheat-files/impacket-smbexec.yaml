tool: impacket-smbexec
tags: [network, security, pentest, exploitation, authentication, smb, impacket, rce]

actions:
# === AUTHENTICATION METHODS ===

 - title:
    en: impacket-smbexec - password authentication
    tr: impacket-smbexec - parola ile kimlik doğrulaması
   desc:
     en: |
       Establishes a semi-interactive shell on the target system using standard cleartext credentials. 
       This approach is useful when you have obtained a valid username and password through phishing or credential harvesting. 
       The tool creates a temporary service on the target host to execute commands and returns the output to the console. 
       Note that this method triggers service creation events (Event ID 7045), which are often monitored by SOC teams.
     tr: |
       Standart açık kimlik bilgileriyle hedef sistemde yarı etkileşimli bir kabuk kurar.
       Oltalama veya kimlik bilgisi toplama yoluyla geçerli bir kullanıcı adı ve parola elde ettiğinizde faydalı bir yaklaşımdır.
       Araç, komutları çalıştırmak için hedef makinede geçici bir hizmet oluşturur ve çıktıyı konsola döndürür.
       Bu yöntemin SOC ekipleri tarafından sıkça izlenen hizmet oluşturma olaylarını (Olay Kimliği 7045) tetiklediğini unutmayın.
   command: "impacket-smbexec {{domain|.}}/{{username}}:{{password}}@{{target}}"

 - title:
    en: impacket-smbexec - pass-the-hash (PtH)
    tr: impacket-smbexec - pass-the-hash (PtH)
   desc:
     en: |
       Authenticates to the remote system using NTLM hashes instead of a plaintext password. 
       This is the primary method used in post-exploitation after extracting hashes from the SAM database or NTDS.dit. 
       The hash must be provided in the format LMHASH:NTHASH. 
       If the LM hash is not available, you can use a placeholder of 32 zeros (aad3b435b51404eeaad3b435b51404ee).
     tr: |
       Uzak sisteme açık parola yerine NTLM hash'leri ile kimlik doğrulaması yapar.
       SAM veritabanından veya NTDS.dit dosyasından hash çıkardıktan sonraki sömürü sonrası aşamada kullanılan birincil yöntemdir.
       Hash, LMHASH:NTHASH biçiminde verilmelidir.
       LM hash'i yoksa 32 adet sıfırdan oluşan bir yer tutucu kullanabilirsiniz (aad3b435b51404eeaad3b435b51404ee).
   command: "impacket-smbexec -hashes {{hash}} {{domain|.}}/{{username}}@{{target}}"

 - title:
    en: impacket-smbexec - kerberos authentication
    tr: impacket-smbexec - Kerberos kimlik doğrulaması
   desc:
     en: |
       Uses Kerberos tickets for authentication instead of NTLM, which is often preferred in modern Active Directory environments. 
       To use this, you must have a valid Kerberos ticket in your cache (KRB5CCNAME) and ensure you are targeting the FQDN rather than the IP address. 
       The -no-pass flag tells the tool not to prompt for a password and instead rely on the existing ticket. 
       Specifying the -dc-ip is often necessary if the attacker machine cannot resolve the domain controller via DNS.
     tr: |
       NTLM yerine kimlik doğrulama için Kerberos biletlerini kullanır; bu, modern Active Directory ortamlarında genellikle tercih edilir.
       Bunu kullanmak için önbelleğinizde (KRB5CCNAME) geçerli bir Kerberos biletiniz olmalı ve IP adresi yerine FQDN'i hedeflediğinizden emin olmalısınız.
       -no-pass bayrağı araca parola sormamasını, bunun yerine mevcut bilete güvenmesini söyler.
       Saldırgan makine etki alanı denetleyicisini DNS ile çözümleyemiyorsa -dc-ip belirtmek genellikle gereklidir.
   command: "impacket-smbexec -k -no-pass -dc-ip {{dc_ip}} {{domain}}/{{username}}@{{target_fqdn}}"

 - title:
    en: impacket-smbexec - aes key authentication
    tr: impacket-smbexec - AES anahtarıyla kimlik doğrulaması
   desc:
     en: |
       Authenticates using a Kerberos AES key (128 or 256 bits) instead of a password or hash. 
       This method is used when you have intercepted or extracted an account's AES key during an assessment. 
       Like other Kerberos methods, this requires targeting the machine by its hostname/FQDN and having proper time synchronization with the DC. 
       It is a stealthier alternative to NTLM authentication in environments where NTLM is restricted.
     tr: |
       Parola veya hash yerine bir Kerberos AES anahtarıyla (128 veya 256 bit) kimlik doğrulaması yapar.
       Değerlendirme sırasında bir hesabın AES anahtarını ele geçirdiğinizde veya çıkardığınızda kullanılan yöntemdir.
       Diğer Kerberos yöntemleri gibi makineyi ana makine adı/FQDN ile hedeflemeyi ve DC ile doğru zaman eşitleme gerektirir.
       NTLM'in kısıtlı olduğu ortamlarda NTLM kimlik doğrulamasına göre daha gizli bir alternatiftir.
   command: "impacket-smbexec -aesKey {{hex_key}} {{domain}}/{{username}}@{{target_fqdn}}"

# === EXECUTION & SHELL CONFIGURATION ===

 - title:
    en: impacket-smbexec - shell type selection (powershell)
    tr: impacket-smbexec - kabuk türü seçimi (powershell)
   desc:
     en: |
       Changes the command interpreter from the default 'cmd.exe' to 'powershell.exe'. 
       This is highly beneficial when you need to run complex PowerShell scripts or access .NET functionality directly. 
       Using PowerShell can sometimes bypass simple EDR rules that look for suspicious 'cmd /c' executions. 
       However, be aware that PowerShell execution is heavily logged if Script Block Logging or Transcription is enabled.
     tr: |
       Komut yorumlayıcıyı varsayılan 'cmd.exe' yerine 'powershell.exe' olarak değiştirir.
       Karmaşık PowerShell betikleri çalıştırmanız veya doğrudan .NET işlevlerine erişmeniz gerektiğinde oldukça faydalıdır.
       PowerShell kullanmak, şüpheli 'cmd /c' çalıştırmalarını arayan basit EDR kurallarını bazen atlatabilir.
       Ancak Betik Bloğu Günlüğü (Script Block Logging) veya Transkripsiyon etkinse PowerShell çalıştırmanın yoğun şekilde günlüğe kaydedildiğini unutmayın.
   command: "impacket-smbexec -shell-type {{shell|powershell}} {{target}}"

 - title:
    en: impacket-smbexec - custom service name
    tr: impacket-smbexec - özel hizmet adı
   desc:
     en: |
       Specifies a custom name for the service created on the remote machine. 
       By default, impacket uses a randomized string which can be a signature for security products. 
       Choosing a name like 'WindowsUpdate' or 'AppMgmt' can help the service blend in with legitimate Windows services. 
       This is a simple but effective technique to avoid detection by automated scanning tools that look for default Impacket patterns.
     tr: |
       Uzak makinede oluşturulan hizmet için özel bir ad belirtir.
       Varsayılan olarak impacket, güvenlik ürünleri için bir imza olabilecek rastgele bir dizgi kullanır.
       'WindowsUpdate' veya 'AppMgmt' gibi bir ad seçmek hizmetin meşru Windows hizmetleri arasına karışmasına yardımcı olabilir.
       Varsayılan Impacket kalıplarını arayan otomatik tarama araçlarınca tespitten kaçınmak için basit ama etkili bir tekniktir.
   command: "impacket-smbexec -service-name {{service_name|AppMgmt}} {{target}}"

 - title:
    en: impacket-smbexec - server mode for output
    tr: impacket-smbexec - çıktı için sunucu kipi
   desc:
     en: |
       Switches the tool to 'SERVER' mode, which creates a local SMB server on the attacker's machine to capture command output. 
       This is the alternative to 'SHARE' mode, which writes output to a file on the target's C$ share. 
       Server mode is extremely useful when the target's C$ share is not accessible or if there is a local firewall preventing the tool from reading files. 
       Warning: You must run this as root/sudo on your local machine because it needs to bind to port 445.
     tr: |
       Aracı, komut çıktısını yakalamak için saldırgan makinede yerel bir SMB sunucusu oluşturan 'SERVER' kipine geçirir.
       Bu, çıktıyı hedefin C$ paylaşımındaki bir dosyaya yazan 'SHARE' kipine alternatiftir.
       Hedefin C$ paylaşımına erişilemiyorsa veya aracın dosya okumasını engelleyen yerel bir güvenlik duvarı varsa sunucu kipi son derece faydalıdır.
       Uyarı: 445 numaralı porta bağlanması gerektiği için bunu yerel makinenizde root/sudo olarak çalıştırmalısınız.
   command: "impacket-smbexec -mode SERVER {{target}}"

# === ADVANCED NETWORK CONFIGURATION ===

 - title:
    en: impacket-smbexec - custom smb port
    tr: impacket-smbexec - özel SMB portu
   desc:
     en: |
       Connects to the SMB service on a non-standard port instead of the default 445. 
       This is useful in scenarios where port forwarding, SSH tunneling, or non-standard configurations are in place. 
       If you have tunneled SMB through a jump box, you might be pointing this at '127.0.0.1' on a custom local port. 
       Ensure the remote end is actually listening for SMB traffic on the specified port.
     tr: |
       SMB hizmetine varsayılan 445 yerine standart dışı bir porttan bağlanır.
       Port yönlendirme, SSH tünelleme veya standart dışı yapılandırmaların söz konusu olduğu senaryolarda faydalıdır.
       SMB'yi bir atlama makinesi üzerinden tünellediyseniz bunu özel bir yerel porttaki '127.0.0.1' adresine yönlendiriyor olabilirsiniz.
       Uzak ucun belirtilen portta gerçekten SMB trafiğini dinlediğinden emin olun.
   command: "impacket-smbexec -port {{port|445}} {{target}}"

 - title:
    en: impacket-smbexec - custom output share
    tr: impacket-smbexec - özel çıktı paylaşımı
   desc:
     en: |
       Specifies a different share to be used for storing command output during execution. 
       The default is the C$ share, but if that share is disabled or the user lacks permissions, you can specify others like ADMIN$. 
       The tool needs to be able to write the output file to this share and then read it back to display the results. 
       If no writable shares are available, consider switching to '-mode SERVER'.
     tr: |
       Çalıştırma sırasında komut çıktısını depolamak için kullanılacak farklı bir paylaşım belirtir.
       Varsayılan C$ paylaşımıdır, ancak bu paylaşım devre dışıysa veya kullanıcının izni yoksa ADMIN$ gibi başkalarını belirtebilirsiniz.
       Aracın çıktı dosyasını bu paylaşıma yazıp sonuçları göstermek için geri okuyabilmesi gerekir.
       Yazılabilir paylaşım yoksa '-mode SERVER' kipine geçmeyi düşünün.
   command: "impacket-smbexec -share {{share|ADMIN$}} {{target}}"

 - title:
    en: impacket-smbexec - debug and timestamping
    tr: impacket-smbexec - hata ayıklama ve zaman damgası
   desc:
     en: |
       Enables debug output and adds timestamps to the log entries for better troubleshooting and reporting. 
       The -debug flag provides verbose information about the SMB connection, authentication handshake, and service creation. 
       The -ts flag is helpful for documentation purposes during a penetration test to track exactly when actions were performed. 
       Use this if you are encountering connection issues or authentication failures to see the underlying error codes.
     tr: |
       Daha iyi sorun giderme ve raporlama için hata ayıklama çıktısını etkinleştirir ve günlük girdilerine zaman damgaları ekler.
       -debug bayrağı SMB bağlantısı, kimlik doğrulama el sıkışması ve hizmet oluşturma hakkında ayrıntılı bilgi sağlar.
       -ts bayrağı, sızma testi sırasında işlemlerin tam olarak ne zaman yapıldığını izlemek için belgelendirme amacıyla faydalıdır.
       Bağlantı sorunları veya kimlik doğrulama hatalarıyla karşılaşıyorsanız altta yatan hata kodlarını görmek için bunu kullanın.
   command: "impacket-smbexec -debug -ts {{target}}"
