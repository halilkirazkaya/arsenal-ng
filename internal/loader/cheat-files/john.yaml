tool: john
tags: [password-cracking, security, pentest, brute-force, exploitation, authentication, hash-cracking]

actions:
# === BASIC CRACKING OPERATIONS ===

 - title:
    en: john - basic wordlist attack
    tr: john - temel sözlük saldırısı
   desc:
     en: |
       Perform a dictionary attack using a specific wordlist against a target hash file.
       This is the most common method of cracking where John compares hashes of words in the list to the target.
       It is highly effective when using large, proven wordlists like rockyou.txt.
       If no format is specified, John will attempt to auto-detect the hash type.
     tr: |
       Hedef bir hash dosyasına karşı belirli bir sözlükle sözlük saldırısı gerçekleştirir.
       John'un listedeki sözcüklerin hash'lerini hedefle karşılaştırdığı en yaygın kırma yöntemidir.
       rockyou.txt gibi büyük, kanıtlanmış sözlükler kullanıldığında oldukça etkilidir.
       Biçim belirtilmezse John hash türünü otomatik tespit etmeye çalışır.
   command: "john --wordlist={{wordlist|/usr/share/wordlists/rockyou.txt}} {{hash_file}}"

 - title:
    en: john - single crack mode
    tr: john - tekli kırma kipi
   desc:
     en: |
       Execute John's "Single Crack" mode which is often the first step in a professional engagement.
       This mode uses information provided in the login name and GECOS fields to generate potential passwords.
       It is extremely fast and effective for finding users who use variations of their own name as a password.
       Note that this mode is most effective when the input file follows the standard /etc/passwd format.
     tr: |
       Genellikle profesyonel bir çalışmada ilk adım olan John'un "Single Crack" kipini çalıştırır.
       Bu kip, olası parolalar üretmek için giriş adı ve GECOS alanlarındaki bilgileri kullanır.
       Kendi adının varyasyonlarını parola olarak kullanan kullanıcıları bulmada son derece hızlı ve etkilidir.
       Girdi dosyası standart /etc/passwd biçimini izlediğinde bu kipin en etkili olduğunu unutmayın.
   command: "john --single {{hash_file}}"

 - title:
    en: john - incremental brute force mode
    tr: john - artımlı kaba kuvvet kipi
   desc:
     en: |
       Enable the incremental mode to perform a pure brute-force attack.
       This mode tries all possible character combinations until a match is found or the search space is exhausted.
       It is computationally expensive and should generally be used as a last resort for short passwords.
       You can specify a predefined character set (like Alnum or Digits) within the john.conf file.
     tr: |
       Salt bir kaba kuvvet saldırısı yapmak için artımlı kipi etkinleştirir.
       Bu kip, eşleşme bulunana veya arama uzayı tükenene kadar tüm olası karakter kombinasyonlarını dener.
       Hesaplama açısından pahalıdır ve genellikle kısa parolalar için son çare olarak kullanılmalıdır.
       john.conf dosyası içinde önceden tanımlı bir karakter kümesi (Alnum veya Digits gibi) belirtebilirsiniz.
   command: "john --incremental {{hash_file}}"

 - title:
    en: john - show cracked passwords
    tr: john - kırılan parolaları gösterme
   desc:
     en: |
       Display the passwords that have already been successfully cracked for a specific hash file.
       John stores cracked results in its 'john.pot' file, and this command retrieves them for easy viewing.
       You can add the --format flag if you want to filter results for a specific hash type.
       This does not start a new cracking session; it only reports on previous successes.
     tr: |
       Belirli bir hash dosyası için daha önce başarıyla kırılmış parolaları görüntüler.
       John kırılmış sonuçları 'john.pot' dosyasında saklar ve bu komut kolay görüntüleme için onları getirir.
       Belirli bir hash türüne göre sonuçları filtrelemek isterseniz --format bayrağını ekleyebilirsiniz.
       Bu, yeni bir kırma oturumu başlatmaz; yalnızca önceki başarıları raporlar.
   command: "john --show {{hash_file}}"

# === HASH PREPARATION (CONVERTERS) ===

 - title:
    en: john - unshadow linux passwords
    tr: john - linux parolalarını birleştirme (unshadow)
   desc:
     en: |
       Combine the /etc/passwd and /etc/shadow files into a format that John can process.
       The /etc/shadow file contains the actual hashes and is only readable by the root user.
       This tool creates a single file containing both the username information and the password hash.
       Root or sudo privileges are typically required to read the original shadow file.
     tr: |
       /etc/passwd ve /etc/shadow dosyalarını John'un işleyebileceği bir biçimde birleştirir.
       /etc/shadow dosyası gerçek hash'leri içerir ve yalnızca root kullanıcısı tarafından okunabilir.
       Bu araç, hem kullanıcı adı bilgisini hem de parola hash'ini içeren tek bir dosya oluşturur.
       Özgün shadow dosyasını okumak için genellikle root veya sudo ayrıcalıkları gerekir.
   command: "unshadow /etc/passwd /etc/shadow > {{output|unshadowed.txt}}"

 - title:
    en: john - convert zip to crackable hash
    tr: john - zip'i kırılabilir hash'e dönüştürme
   desc:
     en: |
       Extract the password hash from an encrypted ZIP archive into a John-compatible format.
       The output must be redirected to a file, which is then passed to John for the actual cracking process.
       This supports various ZIP encryption methods including PKZIP and WinZip AES.
       Ensure you have the 'zip2john' utility installed as part of the John the Ripper jumbo suite.
     tr: |
       Şifreli bir ZIP arşivinden parola hash'ini John uyumlu bir biçime çıkarır.
       Çıktı bir dosyaya yönlendirilmelidir; bu dosya ardından gerçek kırma işlemi için John'a verilir.
       PKZIP ve WinZip AES dahil çeşitli ZIP şifreleme yöntemlerini destekler.
       John the Ripper jumbo paketinin parçası olarak 'zip2john' aracının kurulu olduğundan emin olun.
   command: "zip2john {{zip_file}} > {{output|zip_hash.txt}}"

 - title:
    en: john - convert rar to crackable hash
    tr: john - rar'ı kırılabilir hash'e dönüştürme
   desc:
     en: |
       Generate a crackable hash string from a password-protected RAR archive.
       The resulting hash file contains the metadata John needs to attempt password guesses against the archive.
       This works for both RAR 3.x and RAR 5.x formats.
       Cracking RAR files is generally slower than ZIP files due to the more complex derivation functions used.
     tr: |
       Parola korumalı bir RAR arşivinden kırılabilir bir hash dizgisi üretir.
       Oluşan hash dosyası, John'un arşive karşı parola tahminleri denemesi için gereken üstveriyi içerir.
       Hem RAR 3.x hem de RAR 5.x biçimlerinde çalışır.
       Kullanılan daha karmaşık türetme işlevleri nedeniyle RAR dosyalarını kırmak genellikle ZIP dosyalarına göre daha yavaştır.
   command: "rar2john {{rar_file}} > {{output|rar_hash.txt}}"

 - title:
    en: john - convert ssh private key to hash
    tr: john - SSH özel anahtarını hash'e dönüştürme
   desc:
     en: |
       Extract the passphrase hash from an SSH private key (like id_rsa).
       This is useful for recovering forgotten passphrases or during penetration testing if a key is found.
       The output hash can be cracked using John's standard wordlist or brute-force modes.
       Modern keys use heavy iteration, so cracking speeds may be relatively slow.
     tr: |
       Bir SSH özel anahtarından (örn. id_rsa) parola öbeği hash'ini çıkarır.
       Unutulan parola öbeklerini kurtarmak için veya bir sızma testi sırasında anahtar bulunduğunda faydalıdır.
       Çıktı hash'i John'un standart sözlük veya kaba kuvvet kipleriyle kırılabilir.
       Modern anahtarlar yoğun yineleme kullandığından kırma hızları nispeten yavaş olabilir.
   command: "ssh2john {{private_key_file}} > {{output|ssh_hash.txt}}"

 - title:
    en: john - convert pdf to crackable hash
    tr: john - PDF'i kırılabilir hash'e dönüştürme
   desc:
     en: |
       Extract the security data from a password-protected PDF document.
       The script parses the PDF structure to find the encryption dictionary and formats it for John.
       PDF cracking speed varies significantly depending on the PDF version (standard vs. extension).
       Once the hash is generated, run John against the output file using a high-quality wordlist.
     tr: |
       Parola korumalı bir PDF belgesinden güvenlik verisini çıkarır.
       Betik, şifreleme sözlüğünü bulmak için PDF yapısını ayrıştırır ve John için biçimlendirir.
       PDF kırma hızı PDF sürümüne (standart veya uzantı) göre önemli ölçüde değişir.
       Hash üretildikten sonra kaliteli bir sözlükle çıktı dosyasına karşı John'u çalıştırın.
   command: "pdf2john {{pdf_file}} > {{output|pdf_hash.txt}}"

# === ADVANCED CRACKING & RULES ===

 - title:
    en: john - wordlist attack with rules
    tr: john - kurallı sözlük saldırısı
   desc:
     en: |
       Apply word mangling rules to a wordlist attack to significantly increase the chances of success.
       Rules will perform operations like appending numbers, changing case, or replacing letters with symbols (e.g., 'a' to '@').
       The default ruleset is defined in john.conf and is designed to catch common user password habits.
       This is much more powerful than a simple wordlist attack but takes longer to process.
     tr: |
       Başarı şansını önemli ölçüde artırmak için sözlük saldırısına sözcük bozma kuralları uygular.
       Kurallar, sayı ekleme, harf büyüklüğü değiştirme veya harfleri simgelerle değiştirme (örn. 'a' yerine '@') gibi işlemler yapar.
       Varsayılan kural kümesi john.conf içinde tanımlıdır ve yaygın kullanıcı parola alışkanlıklarını yakalamak üzere tasarlanmıştır.
       Basit bir sözlük saldırısından çok daha güçlüdür ancak işlenmesi daha uzun sürer.
   command: "john --wordlist={{wordlist}} --rules {{hash_file}}"

 - title:
    en: john - mask mode attack
    tr: john - maske kipi saldırısı
   desc:
     en: |
       Use a mask to crack passwords that follow a specific known pattern or length.
       For example, '?u?l?l?l?d?d' would search for an uppercase letter followed by three lowercase letters and two digits.
       This is highly efficient when you have partial information about the target password policy.
       It is much faster than full incremental brute force as it limits the search space to a specific structure.
     tr: |
       Bilinen belirli bir kalıbı veya uzunluğu izleyen parolaları kırmak için maske kullanır.
       Örneğin '?u?l?l?l?d?d', üç küçük harf ve iki rakamın izlediği bir büyük harfi arar.
       Hedef parola politikası hakkında kısmi bilginiz olduğunda oldukça verimlidir.
       Arama uzayını belirli bir yapıyla sınırladığından tam artımlı kaba kuvvetten çok daha hızlıdır.
   command: "john --mask={{mask|?u?l?l?l?d?d}} {{hash_file}}"

 - title:
    en: john - force specific hash format
    tr: john - belirli hash biçimini zorlama
   desc:
     en: |
       Manually specify the hash algorithm to be used during the cracking process.
       Use this when John fails to auto-detect the hash or when a file contains multiple hash types.
       You can see a full list of supported formats by running 'john --list=formats'.
       Using the correct format explicitly can prevent false positives and improve performance.
     tr: |
       Kırma işlemi sırasında kullanılacak hash algoritmasını elle belirtir.
       John hash'i otomatik tespit edemediğinde veya bir dosya birden çok hash türü içerdiğinde bunu kullanın.
       Desteklenen biçimlerin tam listesini 'john --list=formats' çalıştırarak görebilirsiniz.
       Doğru biçimi açıkça kullanmak yanlış pozitifleri önleyebilir ve performansı artırabilir.
   command: "john --format={{format|raw-md5}} --wordlist={{wordlist}} {{hash_file}}"

# === SESSION & UTILITIES ===

 - title:
    en: john - session management and restore
    tr: john - oturum yönetimi ve sürdürme
   desc:
     en: |
       Name a cracking session so that it can be paused and resumed later.
       This is vital for long-running cracking jobs that might span several days or need to survive a reboot.
       John saves its progress in a .rec file named after the session.
       To resume, simply use the --restore flag with the session name.
     tr: |
       Bir kırma oturumunu daha sonra duraklatılıp sürdürülebilmesi için adlandırır.
       Günlerce sürebilen veya yeniden başlatmadan sağ çıkması gereken uzun kırma işleri için hayati öneme sahiptir.
       John ilerlemesini oturum adını taşıyan bir .rec dosyasına kaydeder.
       Sürdürmek için oturum adıyla birlikte --restore bayrağını kullanmanız yeterlidir.
   command: "john --session={{name|work_task}} --wordlist={{wordlist}} {{hash_file}}"

 - title:
    en: john - restore a session
    tr: john - bir oturumu sürdürme
   desc:
     en: |
       Resume a previously interrupted cracking session using its assigned name.
       John will pick up exactly where it left off by reading the session's recovery file.
       This is essential for maintaining progress during power outages or system maintenance.
       Ensure the original wordlist and hash files are still in the same paths.
     tr: |
       Önceden kesintiye uğramış bir kırma oturumunu atanmış adıyla sürdürür.
       John, oturumun kurtarma dosyasını okuyarak tam olarak kaldığı yerden devam eder.
       Elektrik kesintileri veya sistem bakımı sırasında ilerlemeyi korumak için gereklidir.
       Özgün sözlük ve hash dosyalarının hâlâ aynı yollarda olduğundan emin olun.
   command: "john --restore={{name|work_task}}"

 - title:
    en: john - unique wordlist utility
    tr: john - benzersiz sözlük aracı
   desc:
     en: |
       A standalone utility to remove duplicate entries from a wordlist without changing the original order.
       Cleaning wordlists is important for performance, as John shouldn't waste time hashing the same word twice.
       The tool reads from standard input and writes the unique list to the specified output file.
       It is often used when merging multiple wordlists found during reconnaissance.
     tr: |
       Özgün sırayı değiştirmeden bir sözlükteki yinelenen girdileri kaldıran bağımsız bir araçtır.
       John aynı sözcüğü iki kez hash'leyerek zaman kaybetmemesi gerektiğinden sözlükleri temizlemek performans için önemlidir.
       Araç standart girdiden okur ve benzersiz listeyi belirtilen çıktı dosyasına yazar.
       Keşif sırasında bulunan birden çok sözlüğü birleştirirken sıkça kullanılır.
   command: "unique {{output_file}} < {{input_wordlist}}"
