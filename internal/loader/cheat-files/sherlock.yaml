tool: sherlock
tags: [osint, reconnaissance, security, social-media, usernames, enumeration, investigation]

actions:
  # === BASIC SEARCH ===
  - title:
      en: sherlock - search for a single username
      tr: sherlock - tek kullanıcı adı için arama
    desc:
      en: |
        Search for a specific username across a massive list of social media platforms and websites. 
        This is the primary function of Sherlock, used to map a target's digital footprint and identify associated accounts. 
        The results are displayed in the terminal and automatically saved to a text file named after the username.
      tr: |
        Çok sayıda sosyal medya platformu ve web sitesinde belirli bir kullanıcı adını arar.
        Hedefin dijital ayak izini çıkarmak ve ilişkili hesapları tespit etmek için Sherlock'un temel işlevidir.
        Sonuçlar terminalde gösterilir ve kullanıcı adını taşıyan bir metin dosyasına otomatik kaydedilir.
    command: "sherlock {{username}}"

  - title:
      en: sherlock - search for multiple usernames
      tr: sherlock - birden çok kullanıcı adı için arama
    desc:
      en: |
        Search for multiple distinct usernames simultaneously in one execution. 
        This is highly efficient when investigating an individual who might use variations of a handle or when investigating a group. 
        Each username will have its results stored in its own individual text file within the current directory.
      tr: |
        Tek çalıştırmada birden fazla farklı kullanıcı adını aynı anda arar.
        Bir kişinin kullandığı handle varyasyonlarını veya bir grubu araştırırken oldukça verimlidir.
        Her kullanıcı adının sonuçları, çalışma dizininde kendi metin dosyasına kaydedilir.
    command: "sherlock {{username_1}} {{username_2}} {{username_3}}"

  # === OUTPUT MANAGEMENT ===
  - title:
      en: sherlock - export results to CSV
      tr: sherlock - sonuçları CSV olarak dışa aktarma
    desc:
      en: |
        Generate a Comma-Separated Values (CSV) file containing the search results. 
        This format is ideal for importing the discovered data into spreadsheet software or other automated OSINT tools for further analysis. 
        It provides a structured way to view which platforms the username was found on versus where it was not.
      tr: |
        Arama sonuçlarını Virgülle Ayrılmış Değerler (CSV) dosyası olarak üretir.
        Verileri elektronik tablo yazılımlarına veya diğer otomatik OSINT araçlarına aktarmak için idealdir.
        Kullanıcı adının hangi platformlarda bulunup bulunamadığını düzenli biçimde gösterir.
    command: "sherlock {{username}} --csv"

  - title:
      en: sherlock - export results to Excel (XLSX)
      tr: sherlock - sonuçları Excel (XLSX) olarak dışa aktarma
    desc:
      en: |
        Save the search findings into a modern Microsoft Excel (xlsx) format. 
        Use this when you need a formatted report that is easy to share with non-technical stakeholders or for formal documentation. 
        It organizes the discovered URLs and site names into a clean, readable spreadsheet structure.
      tr: |
        Arama bulgularını modern Microsoft Excel (xlsx) biçiminde kaydeder.
        Teknik olmayan paydaşlarla paylaşılabilecek düzenli bir rapor veya resmi dokümantasyon gerektiğinde kullanın.
        Keşfedilen URL'leri ve site adlarını temiz bir tablo yapısında düzenler.
    command: "sherlock {{username}} --xlsx"

  - title:
      en: sherlock - specify output directory
      tr: sherlock - çıktı dizini belirtme
    desc:
      en: |
        Redirect all generated output files into a specific folder of your choice. 
        This is particularly useful when performing bulk searches for multiple users to keep the workspace organized. 
        If the specified directory does not exist, Sherlock will attempt to create it before saving the results.
      tr: |
        Üretilen tüm çıktı dosyalarını seçtiğiniz klasöre yönlendirir.
        Birden çok kullanıcı için toplu arama yaparken çalışma alanını düzenli tutmak açısından özellikle yararlıdır.
        Belirtilen dizin yoksa Sherlock kaydetmeden önce oluşturmaya çalışır.
    command: "sherlock {{username_list}} --folderoutput {{directory_path}}"

  # === FILTERING AND OPTIMIZATION ===
  - title:
      en: sherlock - limit search to specific sites
      tr: sherlock - aramayı belirli sitelerle sınırlama
    desc:
      en: |
        Restrict the username search to one or more specific platforms instead of the entire database. 
        This significantly reduces execution time and avoids noise when you are only interested in certain networks like Twitter or GitHub. 
        Multiple sites can be specified by repeating the flag for each target platform.
      tr: |
        Kullanıcı adı aramasını tüm veritabanı yerine bir veya daha fazla belirli platformla kısıtlar.
        Yalnızca Twitter veya GitHub gibi belirli ağlarla ilgileniyorsanız yürütme süresini ciddi ölçüde kısaltır ve gürültüyü azaltır.
        Her hedef platform için flag tekrarlanarak birden çok site belirtilebilir.
    command: "sherlock {{username}} --site {{site_name|twitter}}"

  - title:
      en: sherlock - include NSFW sites
      tr: sherlock - NSFW sitelerini dahil etme
    desc:
      en: |
        Explicitly include adult/NSFW websites in the search criteria. 
        By default, Sherlock excludes these sites to maintain a "safe for work" output, but they can be crucial for comprehensive investigations. 
        Use this flag when a full digital footprint is required regardless of the content category.
      tr: |
        Arama kriterlerine yetişkin/NSFW sitelerini açıkça dahil eder.
        Sherlock varsayılan olarak bu siteleri hariç tutar; ancak kapsamlı soruşturmalarda kritik olabilirler.
        İçerik kategorisinden bağımsız tam dijital ayak izi gerektiğinde bu flag'i kullanın.
    command: "sherlock {{username}} --nsfw"

  - title:
      en: sherlock - set custom request timeout
      tr: sherlock - özel istek zaman aşımı ayarlama
    desc:
      en: |
        Adjust the maximum time in seconds that Sherlock waits for a response from each website. 
        The default is 60 seconds, but increasing it can help on slow networks, while decreasing it can speed up the scan at the risk of false negatives. 
        This is an important parameter to tune when dealing with rate-limiting or unstable connections.
      tr: |
        Sherlock'un her web sitesinden yanıt için bekleyeceği azami süreyi saniye cinsinden ayarlar.
        Varsayılan 60 saniyedir; yavaş ağlarda artırmak, taramayı hızlandırmak için azaltmak mümkündür.
        Hız sınırlama veya dengesiz bağlantılarla uğraşırken ayarlanması gereken önemli bir parametredir.
    command: "sherlock {{username}} --timeout {{seconds|20}}"

  # === CONNECTIVITY AND ANONYMITY ===
  - title:
      en: sherlock - route traffic through Tor
      tr: sherlock - trafiği Tor üzerinden yönlendirme
    desc:
      en: |
        Route all web requests through the Tor network to mask your IP address. 
        This provides anonymity during the investigation and helps bypass IP-based rate limits or geo-blocking. 
        Note that Tor must be installed and running on your system for this command to function correctly.
      tr: |
        İzlenmeyi gizlemek için tüm web isteklerini Tor ağı üzerinden yönlendirir.
        Soruşturma sırasında anonimlik sağlar ve IP tabanlı hız sınırlarını veya coğrafi engelleri aşmaya yardımcı olur.
        Bu komutun çalışması için Tor'un sisteminizde kurulu ve çalışıyor olması gerekir.
    command: "sherlock {{username}} --tor"

  - title:
      en: sherlock - use unique Tor circuit for each request
      tr: sherlock - her istek için ayrı Tor devresi kullanma
    desc:
      en: |
        Force Sherlock to request a new Tor circuit (new IP address) for every single site check. 
        This is the highest level of anonymity and is extremely effective against platforms that implement strict anti-scraping measures. 
        Expect significantly slower performance due to the overhead of establishing new circuits repeatedly.
      tr: |
        Sherlock'u her site kontrolü için yeni bir Tor devresi (yeni IP adresi) istemeye zorlar.
        En yüksek anonimlik düzeyidir ve katı anti-scraping önlemleri uygulayan platformlara karşı son derece etkilidir.
        Devreleri tekrar tekrar kurmanın getirdiği ek yük nedeniyle belirgin ölçüde yavaş performans bekleyin.
    command: "sherlock {{username}} --unique-tor"

  - title:
      en: sherlock - route through a specific proxy
      tr: sherlock - belirli bir proxy üzerinden yönlendirme
    desc:
      en: |
        Perform the search using a specific proxy server instead of your direct connection. 
        Supported protocols usually include HTTP, HTTPS, and SOCKS; this is useful for routing traffic through a specific geographic region or corporate gateway. 
        Ensure the proxy URL is formatted correctly (e.g., socks5://127.0.0.1:1080).
      tr: |
        Doğrudan bağlantınız yerine belirli bir proxy sunucusu üzerinden arama yapar.
        HTTP, HTTPS ve SOCKS protokolleri genellikle desteklenir; trafiği belirli bir bölgeden veya kurumsal ağ geçidinden yönlendirmek için yararlıdır.
        Proxy URL'sinin doğru biçimde yazıldığından emin olun (örn. socks5://127.0.0.1:1080).
    command: "sherlock {{username}} --proxy {{proxy_url}}"

  # === ADVANCED WORKFLOW ===
  - title:
      en: sherlock - open results in browser automatically
      tr: sherlock - sonuçları tarayıcıda otomatik açma
    desc:
      en: |
        Automatically open every discovered profile URL in your default web browser once the scan completes. 
        This allows for immediate manual verification of the accounts found by the tool. 
        Be cautious when using this with usernames that appear on many sites, as it may open dozens of browser tabs simultaneously.
      tr: |
        Tarama tamamlandığında keşfedilen her profil URL'sini varsayılan web tarayıcınızda otomatik olarak açar.
        Böylece bulunan hesapların manuel doğrulanması sağlanır.
        Kullanıcı adının çok sayıda sitede bulunduğu durumlarda onlarca sekme açabileceğinden dikkatli kullanın.
    command: "sherlock {{username}} --browse"

  - title:
      en: sherlock - verbose debugging output
      tr: sherlock - ayrıntılı hata ayıklama çıktısı
    desc:
      en: |
        Enable detailed logging to see the internal status of each request and metric. 
        This is highly useful for troubleshooting why a specific site might be failing or to confirm that the proxy settings are working as intended. 
        It provides extra context on response codes and connection attempts during the enumeration process.
      tr: |
        Her isteğin dahili durumunu ve metriklerini görmek için ayrıntılı günlük kaydını etkinleştirir.
        Belirli bir sitenin neden başarısız olduğunu gidermek veya proxy ayarlarının çalıştığını doğrulamak için oldukça yararlıdır.
        Numaralandırma sırasında yanıt kodları ve bağlantı girişimleri hakkında ek bağlam sağlar.
    command: "sherlock {{username}} --verbose"