tool: find
tags: [linux, file-system, enumeration, forensics, utility, security, pentest]

actions:
# === BASIC SEARCH ===
 - title:
     en: find - search for a file by name
     tr: find - ada göre dosya arama
   desc:
     en: |
       Locate files within a directory tree that match a specific filename pattern. This is the most common use case for identifying where a specific configuration or source file is stored. 
       Be aware that searching from the root directory might require elevated privileges to access all folders and avoid "Permission denied" errors. 
       The search is recursive by default, traversing all subdirectories.
     tr: |
       Dizin ağacı içinde belirli bir dosya adı kalıbıyla eşleşen dosyaları bulun. Belirli bir yapılandırma veya kaynak dosyanın nerede saklandığını tespit etmenin en yaygın kullanım şeklidir.
       Kök dizinden aramanın tüm klasörlere erişmek ve "İzin reddedildi" hatalarından kaçınmak için yükseltilmiş yetki gerektirebileceğini unutmayın.
       Arama varsayılan olarak özyinelidir, tüm alt dizinleri dolaşır.
   command: "find {{search_path|/}} -name \"{{filename}}\""

 - title:
     en: find - case-insensitive search
     tr: find - büyük/küçük harf duyarsız arama
   desc:
     en: |
       Search for files regardless of their capitalization using the iname flag. This is particularly useful when you are unsure if a file uses CamelCase, lowercase, or uppercase naming conventions. 
       It helps avoid missing targets due to strict character matching in Unix-like environments. 
       This is often used when looking for specific software components that may vary in naming style.
     tr: |
       Iname bayrağıyla dosyaları büyük/küçük harf ayrımı olmadan arayın. Dosyanın CamelCase, küçük harf veya büyük harf adlandırma kullanıp kullanmadığından emin değilken özellikle kullanışlıdır.
       Unix benzeri ortamlarda katı karakter eşleşmesi nedeniyle hedefleri kaçırmaktan kaçınmaya yardımcı olur.
       Adlandırma biçimi değişebilen belirli yazılım bileşenleri aranırken sıkça kullanılır.
   command: "find {{search_path|/}} -iname \"{{filename}}\""

 - title:
     en: find - filter by type
     tr: find - türe göre filtreleme
   desc:
     en: |
       Limit the search results to either files or directories using the type flag. Use 'f' for regular files or 'd' for directories to narrow down results during system enumeration. 
       This reduces clutter when you are only looking for executable binaries or specific configuration directories. 
       Filtering by type is essential when performing operations that only apply to files, such as content searching.
     tr: |
       Type bayrağıyla arama sonuçlarını dosya veya dizinlerle sınırlayın. Sistem numaralandırmada sonuçları daraltmak için normal dosyalar için 'f', dizinler için 'd' kullanın.
       Yalnızca çalıştırılabilir ikili dosyaları veya belirli yapılandırma dizinlerini ararken kalabalığı azaltır.
       İçerik arama gibi yalnızca dosyalara uygulanan işlemlerde türe göre filtreleme gereklidir.
   command: "find {{search_path|.}} -type {{type|f}} -name \"{{pattern|*.txt}}\""

# === SIZE AND TIME ===
 - title:
     en: find - search by file size
     tr: find - dosya boyutuna göre arama
   desc:
     en: |
       Find files that are larger or smaller than a specific size threshold. This is useful for identifying large log files that consume disk space or unusually small configuration files. 
       Note that suffixes like 'k', 'M', and 'G' are used for kilobytes, megabytes, and gigabytes respectively. 
       Prefixing the size with '+' finds files larger than the value, while '-' finds files smaller than the value.
     tr: |
       Belirli bir boyut eşiğinden büyük veya küçük dosyaları bulun. Disk alanı tüketen büyük kayıt dosyalarını veya olağandışı küçük yapılandırma dosyalarını tespit için kullanışlıdır.
       Kilobayt, megabayt ve gigabayt için sırasıyla 'k', 'M' ve 'G' soneklerinin kullanıldığını unutmayın.
       Boyutun önüne '+' koymak değerden büyük, '-' koymak değerden küçük dosyaları bulur.
   command: "find {{search_path|.}} -size {{size|+100M}}"

 - title:
     en: find - search by modification time
     tr: find - değiştirilme zamanına göre arama
   desc:
     en: |
       Locate files that were modified within a specific number of days. This is an essential technique for forensic analysis or finding recently updated system files after a breach. 
       Using a minus sign (e.g., -7) searches for files modified less than the specified number of days ago. 
       This can also be used to find files modified more than a certain number of days ago by using a plus sign.
     tr: |
       Belirli gün sayısı içinde değiştirilmiş dosyaları bulun. Adli analiz veya ihlal sonrası yakın zamanda güncellenmiş sistem dosyalarını bulmak için gerekli bir tekniktir.
       Eksi işareti (örn. -7) kullanmak, belirtilen gün sayısından daha yakın zamanda değiştirilmiş dosyaları arar.
       Artı işaretiyle belirli gün sayısından daha eski değiştirilmiş dosyalar da bulunabilir.
   command: "find {{search_path|.}} -mtime {{days|-7}}"

# === PERMISSIONS AND OWNERSHIP ===
 - title:
     en: find - search by permissions
     tr: find - izinlere göre arama
   desc:
     en: |
       Find files that have specific numeric or symbolic permission sets. This is often used during security audits to identify world-writable files or files with the SUID bit set. 
       Identifying improperly configured permissions is a key step in privilege escalation. 
       The -perm flag can check for exact matches or for at least the specified bits being set.
     tr: |
       Belirli sayısal veya sembolik izin kümelerine sahip dosyaları bulun. Güvenlik denetimlerinde herkese yazılabilir dosyaları veya SUID biti ayarlı dosyaları tespit için sıkça kullanılır.
       Yanlış yapılandırılmış izinleri tespit etmek, yetki yükseltmede kilit bir adımdır.
       -perm bayrağı tam eşleşmeleri veya en azından belirtilen bitlerin ayarlı olmasını denetleyebilir.
   command: "find {{search_path|/}} -perm {{permissions|0777}}"

 - title:
     en: find - find SUID files
     tr: find - SUID dosyalarını bulma
   desc:
     en: |
       Locate files that have the Set User ID (SUID) bit enabled. These files run with the privileges of the file owner rather than the user executing them, making them prime targets for privilege escalation. 
       Permission '4000' specifically targets the SUID bit. 
       Always verify these files against known binaries to detect potential backdoors.
     tr: |
       Set User ID (SUID) biti etkin dosyaları bulun. Bu dosyalar, çalıştıran kullanıcının değil dosya sahibinin yetkileriyle çalışır; bu yüzden yetki yükseltme için başlıca hedeflerdir.
       '4000' izni özellikle SUID bitini hedefler.
       Olası arka kapıları tespit için bu dosyaları bilinen ikili dosyalarla daima karşılaştırın.
   command: "find {{search_path|/}} -perm -4000 -type f"

 - title:
     en: find - find files by owner
     tr: find - sahiplerine göre dosya bulma
   desc:
     en: |
       Search for files owned by a specific user or group. This is helpful for auditing sensitive data access or identifying files left behind by specific service accounts. 
       It can be combined with other flags to find files owned by a user that also have dangerous permissions. 
       This command is useful for identifying "orphaned" files that belong to users no longer on the system.
     tr: |
       Belirli bir kullanıcı veya gruba ait dosyaları arayın. Hassas veri erişimini denetlemek veya belirli hizmet hesaplarınca bırakılmış dosyaları tespit için yararlıdır.
       Tehlikeli izinlere de sahip kullanıcı dosyalarını bulmak için başka bayraklarla birleştirilebilir.
       Bu komut, sistemde artık olmayan kullanıcılara ait "öksüz" dosyaları tespit için kullanışlıdır.
   command: "find {{search_path|/}} -user {{username|root}}"

# === EXECUTION AND CLEANUP ===
 - title:
     en: find - execute command on results
     tr: find - sonuçlar üzerinde komut çalıştırma
   desc:
     en: |
       Perform a specific shell action on every file that matches the search criteria. The curly braces '{}' are a placeholder for the current file being processed. 
       Use this with caution, especially when executing destructive commands like 'rm' or 'chmod'. 
       The command must end with a semicolon (escaped as \;) or a plus sign for bulk execution.
     tr: |
       Arama ölçütleriyle eşleşen her dosya üzerinde belirli bir kabuk işlemi yapın. Süslü parantezler '{}', işlenen mevcut dosyanın yer tutucusudur.
       Özellikle 'rm' veya 'chmod' gibi yıkıcı komutlar çalıştırırken dikkatli kullanın.
       Komut, noktalı virgülle (\; olarak kaçışlı) veya toplu çalıştırma için artı işaretiyle bitmelidir.
   command: "find {{search_path|.}} -name \"{{pattern|*.log}}\" -exec {{action|ls -l}} {} \\;"

 - title:
     en: find - find empty files or directories
     tr: find - boş dosya veya dizinleri bulma
   desc:
     en: |
       Search for files or directories that contain no data or sub-items. This is helpful for system cleanup or identifying failed processes that created empty placeholders. 
       It is a quick way to audit directory structures for unused resources. 
       This can be combined with the -delete flag to automatically remove empty results.
     tr: |
       Veri veya alt öğe içermeyen dosya ya da dizinleri arayın. Sistem temizliği veya boş yer tutucular oluşturan başarısız işlemleri tespit için yararlıdır.
       Dizin yapılarını kullanılmayan kaynaklara karşı denetlemenin hızlı bir yoludur.
       Boş sonuçları otomatik silmek için -delete bayrağıyla birleştirilebilir.
   command: "find {{search_path|.}} -type {{type|f}} -empty"

 - title:
     en: find - limit search depth
     tr: find - arama derinliğini sınırlama
   desc:
     en: |
       Restrict the search to a maximum depth of directories. This prevents the tool from descending too deep into complex file systems or network mounts. 
       A depth of '1' searches only the current directory. 
       This is highly recommended when searching large volumes to save time and system resources.
     tr: |
       Aramayı maksimum dizin derinliğiyle sınırlayın. Bu, aracın karmaşık dosya sistemlerine veya ağ bağlamalarına çok derine inmesini engeller.
       '1' derinliği yalnızca mevcut dizini arar.
       Büyük hacimleri ararken zaman ve sistem kaynağı kazanmak için şiddetle önerilir.
   command: "find {{search_path|.}} -maxdepth {{depth|2}} -name \"{{pattern|*.conf}}\""
