tool: cupp
tags: [passwords, wordlist, social-engineering, pentest, brute-force, enumeration]

actions:
  # === CORE PROFILING ===
  - title:
      en: cupp - interactive password profiling
      tr: cupp - etkileşimli parola profilleme
    desc:
      en: |
        Starts an interactive session to generate a personalized wordlist based on a target's specific details. 
        The tool will prompt for the target's name, nickname, birthdate, partner's info, and even pet names. 
        This is the most effective way to use the tool when performing social engineering-driven password attacks. 
        It creates a highly relevant list of potential passwords that humans are likely to choose.
      tr: |
        Hedefe özgü ayrıntılardan kişiselleştirilmiş kelime listesi üretmek amacıyla etkileşimli oturum başlatır.
        Araç hedef adını, takma adı, doğum tarihini, eş bilgilerini, hatta evcil hayvan adlarını sorar.
        Sosyal mühendislik odaklı parola saldırılarında aracı kullanmanın en etkili yoludur.
        İnsanların seçme olasılığı yüksek olası parolalardan oluşan son derece ilgili liste hazırlar.
    command: "cupp -i"

  - title:
      en: cupp - improve existing wordlist
      tr: cupp - mevcut listeyi zenginleştirme
    desc:
      en: |
        Uses an existing wordlist or dictionary file as a seed to generate new password variations. 
        This option is useful when you have a list of keywords related to a target and want to apply typical password complexity patterns to them. 
        The tool processes the input file and generates a much larger "pwnsauce" dictionary. 
        Ensure the input file is in a readable text format for the best results.
      tr: |
        Yeni parola türevleri üretmek amacıyla mevcut kelime listesini veya sözlük dosyasını tohum kabul eder.
        Hedefle ilgili anahtar sözcük listesi bulunup tipik parola karmaşıklık kalıpları uygulanmak istendiğinde kullanışlıdır.
        Araç girdi dosyasını işleyerek çok daha büyük "pwnsauce" sözlüğü üretir.
        En iyi sonuç amacıyla girdi dosyasının okunabilir metin biçiminde olmasına dikkat edilmelidir.
    command: "cupp -w {{input_file|dictionary.txt}}"

  # === DATABASE AND REPOSITORY ===
  - title:
      en: cupp - parse alecto default credentials
      tr: cupp - alecto varsayılan kimlik bilgilerini ayrıştırma
    desc:
      en: |
        Parses default usernames and passwords directly from the Alecto Database integration. 
        The Alecto DB merges and enhances purified databases from Phenoelit and CIRT projects. 
        This is extremely useful for identifying default vendor credentials on network equipment, IoT devices, or legacy systems. 
        It saves time by providing a consolidated list of known default access points.
      tr: |
        Alecto veritabanı bütünleşmesi üzerinden varsayılan kullanıcı adlarıyla parolaları doğrudan derler.
        Alecto DB, Phenoelit ile CIRT projelerinden alınan arındırılmış veritabanlarını birleştirip geliştirir.
        Ağ donanımları, nesnelerin interneti cihazları veya eski sistemler üzerindeki üretici varsayılan kimlik bilgilerini belirlemek amacıyla son derece kullanışlıdır.
        Bilinen varsayılan erişim noktalarının toplu listesini sunarak zaman kazandırır.
    command: "cupp -a"

  - title:
      en: cupp - download wordlist repository
      tr: cupp - kelime listesi deposunu indirme
    desc:
      en: |
        Downloads a collection of large wordlists directly from the official CUPP repository. 
        These lists are categorized and can be used for general-purpose brute-forcing or as a base for further profiling. 
        Note that this action requires an active internet connection to reach the remote repository. 
        It is a quick way to populate your local toolset with standard password lists.
      tr: |
        Resmi CUPP deposundan büyük kelime listelerinden oluşan derlemeyi doğrudan indirir.
        Bu listeler sınıflandırılmıştır; genel amaçlı kaba kuvvet denemeleri veya ileri profilleme tabanı biçiminde kullanılabilir.
        Uzak depoya erişmek amacıyla etkin internet bağlantısı gerektiği unutulmamalıdır.
        Yerel araç setini standart parola listeleriyle doldurmanın hızlı yoludur.
    command: "cupp -l"

  # === MISCELLANEOUS ===
  - title:
      en: cupp - show help menu
      tr: cupp - yardım menüsünü gösterme
    desc:
      en: |
        Displays the help menu containing all available command-line arguments and options. 
        This is the quickest way to verify the installed version and see the correct syntax for various flags. 
        Use this whenever you are unsure about the specific parameter requirements for a command. 
        The output provides a brief overview of interactive, database, and wordlist options.
      tr: |
        Tüm komut satırı değişkenleriyle seçenekleri içeren yardım menüsünü gösterir.
        Kurulu sürümü doğrulayıp çeşitli seçeneklerin doğru yazımını görmenin en hızlı yoludur.
        Bir komutun değişken gereksinimlerinden emin olunamadığı durumlarda kullanılmalıdır.
        Çıktı etkileşimli, veritabanı ve kelime listesi seçeneklerine ilişkin kısa genel bakış sunar.
    command: "cupp -h"

  - title:
      en: cupp - display version information
      tr: cupp - sürüm bilgisini görüntüleme
    desc:
      en: |
        Shows the current version of the CUPP tool installed on the system. 
        Checking the version is important for ensuring compatibility with different Python environments and features. 
        Newer versions may include updated logic for password generation or better integration with databases. 
        This command is non-intrusive and does not perform any profiling or network activity.
      tr: |
        Sistemde kurulu CUPP aracının güncel sürümünü gösterir.
        Sürümü denetlemek farklı Python ortamlarıyla özellikler arasındaki uyumluluğu sağlamak açısından önemlidir.
        Yeni sürümler parola üretimine yönelik güncel mantık veya veritabanlarıyla daha iyi bütünleşme içerebilir.
        Bu komut sisteme dokunmadan çalışır; profilleme veya ağ etkinliği yürütmez.
    command: "cupp -v"
