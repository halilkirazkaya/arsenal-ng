tool: impacket-tstool
tags: [pentest, security, impacket, terminal-services, rdp, enumeration, exploitation, windows, post-exploitation]

actions:
  # === ENUMERATION ACTIONS ===

  - title:
      en: impacket-tstool - query session information
      tr: impacket-tstool - oturum bilgilerini sorgulama
    desc:
      en: |
        Displays detailed information about Remote Desktop Services sessions on the target host.
        This command is essential for identifying active, disconnected, or idle users and their associated session IDs.
        It helps a pentester determine which sessions are vulnerable to hijacking or which users are currently active on the system.
      tr: |
        Hedef makinedeki Uzak Masaüstü Hizmetleri oturumları hakkında ayrıntılı bilgi gösterir.
        Bu komut, etkin, bağlantısı kesilmiş veya boşta kullanıcıları ve bunlara ait oturum kimliklerini belirlemek için gereklidir.
        Bir sızma testçisinin hangi oturumların ele geçirilmeye açık olduğunu veya sistemde hangi kullanıcıların etkin olduğunu belirlemesine yardımcı olur.
    command: "impacket-tstool {{domain/username:password|administrator}}@{{target}} qwinsta"

  - title:
      en: impacket-tstool - list remote processes
      tr: impacket-tstool - uzak işlemleri listeleme
    desc:
      en: |
        Retrieves a comprehensive list of all processes currently running on the remote Windows system.
        The output includes the process name and the Process ID (PID), which is required for further actions like killing a process.
        This is useful for identifying security agents, monitoring software, or specific applications running under different user contexts.
      tr: |
        Uzak Windows sisteminde o anda çalışan tüm işlemlerin kapsamlı bir listesini getirir.
        Çıktı, işlem adı ve işlem sonlandırma gibi sonraki işlemler için gereken İşlem Kimliğini (PID) içerir.
        Güvenlik ajanlarını, izleme yazılımlarını veya farklı kullanıcı bağlamlarında çalışan belirli uygulamaları belirlemek için faydalıdır.
    command: "impacket-tstool {{domain/username:password|administrator}}@{{target}} tasklist"

  # === SESSION MANAGEMENT ===

  - title:
      en: impacket-tstool - attach to user session (Hijack)
      tr: impacket-tstool - kullanıcı oturumuna bağlanma (ele geçirme)
    desc:
      en: |
        Attaches a user session to another remote desktop session on the target server.
        This is often used in RDP hijacking scenarios to take over an existing session without knowing the user's password.
        Note that this action typically requires high privileges (System or Admin) and can be used to pivot through different user desktops.
      tr: |
        Hedef sunucuda bir kullanıcı oturumunu başka bir uzak masaüstü oturumuna bağlar.
        Kullanıcının parolasını bilmeden mevcut bir oturumu devralmak için RDP ele geçirme senaryolarında sıkça kullanılır.
        Bu işlemin genellikle yüksek ayrıcalıklar (System veya Admin) gerektirdiğini ve farklı kullanıcı masaüstleri arasında geçiş için kullanılabileceğini unutmayın.
    command: "impacket-tstool {{domain/username:password|administrator}}@{{target}} tscon {{session_id}} --dest {{dest_session_name}}"

  - title:
      en: impacket-tstool - disconnect a session
      tr: impacket-tstool - bir oturumun bağlantısını kesme
    desc:
      en: |
        Disconnects a specific Remote Desktop Services session without logging the user off.
        The user's applications remain running, but their network connection to the desktop is severed.
        This can be used to force a user to re-authenticate or to clear up session slots on a busy server.
      tr: |
        Belirli bir Uzak Masaüstü Hizmetleri oturumunun bağlantısını, kullanıcının oturumunu kapatmadan keser.
        Kullanıcının uygulamaları çalışmaya devam eder, ancak masaüstüne ağ bağlantısı kesilir.
        Bir kullanıcıyı yeniden kimlik doğrulamaya zorlamak veya yoğun bir sunucuda oturum yuvalarını boşaltmak için kullanılabilir.
    command: "impacket-tstool {{domain/username:password|administrator}}@{{target}} tsdiscon {{session_id}}"

  - title:
      en: impacket-tstool - force logoff session
      tr: impacket-tstool - oturumu zorla kapatma
    desc:
      en: |
        Forces a specific session to sign out of the Remote Desktop Services environment.
        Unlike disconnection, this action terminates all running processes within that specific user session.
        It is a destructive action that may result in data loss for the target user if they have unsaved work.
      tr: |
        Belirli bir oturumu Uzak Masaüstü Hizmetleri ortamından çıkmaya zorlar.
        Bağlantı kesmeden farklı olarak bu işlem, ilgili kullanıcı oturumundaki tüm çalışan işlemleri sonlandırır.
        Hedef kullanıcının kaydedilmemiş çalışması varsa veri kaybına yol açabilecek yıkıcı bir işlemdir.
    command: "impacket-tstool {{domain/username:password|administrator}}@{{target}} logoff {{session_id}}"

  - title:
      en: impacket-tstool - send pop-up message
      tr: impacket-tstool - açılır mesaj gönderme
    desc:
      en: |
        Sends a graphical message box to a specific user session or all sessions on the target.
        This is often used for social engineering or to provide official-looking warnings to logged-in users.
        The message appears as a standard Windows dialog box that the user must acknowledge.
      tr: |
        Hedefte belirli bir kullanıcı oturumuna veya tüm oturumlara grafiksel bir mesaj kutusu gönderir.
        Sıklıkla sosyal mühendislik için veya oturum açmış kullanıcılara resmî görünümlü uyarılar vermek için kullanılır.
        Mesaj, kullanıcının onaylaması gereken standart bir Windows iletişim kutusu olarak görünür.
    command: "impacket-tstool {{domain/username:password|administrator}}@{{target}} msg \"{{message|System maintenance starting soon.}}\""

  # === SYSTEM CONTROL ===

  - title:
      en: impacket-tstool - terminate remote process
      tr: impacket-tstool - uzak işlemi sonlandırma
    desc:
      en: |
        Terminates a running task on the remote system using its Process ID (PID) or image name.
        This can be used to disable security software, stop stuck services, or disrupt specific user activities.
        Be cautious as killing system-critical processes can lead to OS instability or immediate reboots.
      tr: |
        Uzak sistemde çalışan bir görevi İşlem Kimliği (PID) veya imaj adıyla sonlandırır.
        Güvenlik yazılımlarını devre dışı bırakmak, takılmış hizmetleri durdurmak veya belirli kullanıcı etkinliklerini kesintiye uğratmak için kullanılabilir.
        Sistem açısından kritik işlemleri sonlandırmak işletim sistemi kararsızlığına veya ani yeniden başlatmalara yol açabileceğinden dikkatli olun.
    command: "impacket-tstool {{domain/username:password|administrator}}@{{target}} taskkill /PID {{pid}}"

  - title:
      en: impacket-tstool - remote system shutdown
      tr: impacket-tstool - uzaktan sistem kapatma
    desc:
      en: |
        Initiates a remote shutdown of the target machine, affecting all logged-in users and sessions.
        This is a high-impact command that completely powers down the remote host.
        Use this only when necessary for post-exploitation or as part of a controlled environment teardown.
      tr: |
        Oturum açmış tüm kullanıcıları ve oturumları etkileyecek şekilde hedef makinenin uzaktan kapatılmasını başlatır.
        Uzak makineyi tamamen kapatan yüksek etkili bir komuttur.
        Bunu yalnızca sömürü sonrası gerektiğinde veya kontrollü bir ortam kapatmanın parçası olarak kullanın.
    command: "impacket-tstool {{domain/username:password|administrator}}@{{target}} shutdown"

  # === AUTHENTICATION & CONNECTION OPTIONS ===

  - title:
      en: impacket-tstool - authenticate with NTLM hashes
      tr: impacket-tstool - NTLM hash'leri ile kimlik doğrulaması
    desc:
      en: |
        Performs Terminal Service actions using NTLM hashes instead of a plaintext password.
        This enables Pass-the-Hash (PtH) attacks, which are crucial when only the NTLM hash has been recovered from memory.
        The hash format should be LMHASH:NTHASH; if the LM hash is unknown, use the standard empty LM value.
      tr: |
        Terminal Hizmeti işlemlerini açık parola yerine NTLM hash'leri kullanarak gerçekleştirir.
        Bu, bellekten yalnızca NTLM hash'i kurtarıldığında kritik olan Pass-the-Hash (PtH) saldırılarına olanak tanır.
        Hash biçimi LMHASH:NTHASH olmalıdır; LM hash'i bilinmiyorsa standart boş LM değerini kullanın.
    command: "impacket-tstool -hashes {{hash}} {{domain/username|administrator}}@{{target}} {{action|qwinsta}}"

  - title:
      en: impacket-tstool - authenticate with Kerberos
      tr: impacket-tstool - Kerberos ile kimlik doğrulaması
    desc:
      en: |
        Uses Kerberos authentication instead of NTLM to perform tasks on the remote host.
        This requires a valid Kerberos ticket (TGT/TGS) available in the environment (KRB5CCNAME).
        Using the -k flag is beneficial in environments where NTLM is disabled or to evade NTLM-specific detection mechanisms.
      tr: |
        Uzak makinede görevleri yerine getirmek için NTLM yerine Kerberos kimlik doğrulaması kullanır.
        Ortamda (KRB5CCNAME) geçerli bir Kerberos bileti (TGT/TGS) bulunmasını gerektirir.
        -k bayrağını kullanmak, NTLM'in devre dışı olduğu ortamlarda veya NTLM'e özgü tespit mekanizmalarından kaçınmak için faydalıdır.
    command: "impacket-tstool -k -no-pass {{domain/username|administrator}}@{{target}} -dc-ip {{dc_ip}} {{action|qwinsta}}"

  - title:
      en: impacket-tstool - specify custom target IP and port
      tr: impacket-tstool - özel hedef IP ve port belirtme
    desc:
      en: |
        Connects to the Terminal Services management interface using a specific IP address and SMB port.
        This is useful when the target's NetBIOS name does not resolve or when the SMB service is running on a non-standard port.
        Providing the -target-ip ensures that the tool connects to the correct physical machine regardless of DNS settings.
      tr: |
        Terminal Hizmetleri yönetim arayüzüne belirli bir IP adresi ve SMB portu kullanarak bağlanır.
        Hedefin NetBIOS adı çözülemediğinde veya SMB hizmeti standart dışı bir portta çalıştığında faydalıdır.
        -target-ip vermek, DNS ayarlarından bağımsız olarak aracın doğru fiziksel makineye bağlanmasını sağlar.
    command: "impacket-tstool -target-ip {{target_ip}} -port {{port|445}} {{domain/username:password|administrator}}@{{target_name}} {{action|qwinsta}}"
