tool: brew
tags: [macos, linux, package-manager, software, installation, maintenance, development]

actions:
# === SEARCH AND DISCOVERY ===
 - title:
     en: brew - search for packages
     tr: brew - paket arama
   desc:
     en: |
       This command allows you to search for available formulas (CLI tools) and casks (GUI apps) in the Homebrew repository.
       It accepts plain text or regular expressions to filter the results.
       Use this when you are unsure of the exact name of a package you wish to install.
     tr: |
       Bu komut, Homebrew deposundaki mevcut formülleri (CLI araçları) ve cask'leri (GUI uygulamaları) aramanıza olanak tanır.
       Sonuçları filtrelemek için düz metin veya düzenli ifadeler kabul eder.
       Kurmak istediğiniz paketin tam adından emin değilken kullanın.
   command: "brew search {{query|wget}}"

 - title:
     en: brew - display package information
     tr: brew - paket bilgisini gösterme
   desc:
     en: |
       Use this command to retrieve detailed metadata about a specific formula or cask.
       It provides information such as the current version, dependencies, conflicts, and the official project URL.
       This is helpful for verifying the requirements of a tool before committing to an installation.
     tr: |
       Belirli bir formül veya cask hakkında ayrıntılı üstveri almak için bu komutu kullanın.
       Geçerli sürüm, bağımlılıklar, çakışmalar ve resmi proje URL'si gibi bilgileri verir.
       Bu, kuruluma karar vermeden önce bir aracın gereksinimlerini doğrulamada yardımcıdır.
   command: "brew info {{formula_or_cask|nmap}}"

# === INSTALLATION AND REMOVAL ===
 - title:
     en: brew - install a package
     tr: brew - paket kurma
   desc:
     en: |
       This is the primary command for installing new software through Homebrew.
       It downloads the source or pre-compiled "bottle," handles dependencies automatically, and links binaries to your path.
       Note that some installations may require sudo privileges for post-install scripts, though Homebrew itself runs as a standard user.
     tr: |
       Bu, Homebrew ile yeni yazılım kurmanın birincil komutudur.
       Kaynağı veya önceden derlenmiş "bottle"ı indirir, bağımlılıkları otomatik yönetir ve ikilileri yolunuza bağlar.
       Homebrew kendisi standart kullanıcı olarak çalışsa da bazı kurulumların kurulum sonrası betikler için sudo yetkisi gerektirebileceğini unutmayın.
   command: "brew install {{formula_or_cask|git}}"

 - title:
     en: brew - uninstall a package
     tr: brew - paket kaldırma
   desc:
     en: |
       This command removes an installed formula or cask from your system.
       It deletes the binaries and associated symlinks created during the installation process.
       Use this to clean up tools you no longer need and free up space in the Homebrew cellar.
     tr: |
       Bu komut, kurulu bir formül veya cask'i sisteminizden kaldırır.
       Kurulum sürecinde oluşturulan ikilileri ve ilişkili sembolik bağları siler.
       Artık gerek duymadığınız araçları temizlemek ve Homebrew mahzeninde yer açmak için kullanın.
   command: "brew uninstall {{formula_or_cask|wget}}"

 - title:
     en: brew - list installed packages
     tr: brew - kurulu paketleri listeleme
   desc:
     en: |
       This command displays a list of all formulas and casks currently installed on your local system.
       It is useful for auditing your environment or checking if a specific tool is already present.
       Running this without arguments lists everything, but you can also provide a name to check a specific package.
     tr: |
       Bu komut, yerel sisteminizde kurulu tüm formül ve cask'lerin listesini gösterir.
       Ortamınızı denetlemek veya belirli bir aracın zaten mevcut olup olmadığını kontrol etmek için yararlıdır.
       Argümansız çalıştırmak her şeyi listeler, ancak belirli bir paketi denetlemek için ad da verebilirsiniz.
   command: "brew list"

# === MAINTENANCE AND UPDATES ===
 - title:
     en: brew - update homebrew
     tr: brew - homebrew güncelleme
   desc:
     en: |
       Running this command updates Homebrew itself along with the local list of available formulas.
       It does not update your installed software, but it ensures you have the latest definitions from the GitHub repositories.
       It is recommended to run this command before installing new tools or performing upgrades.
     tr: |
       Bu komutu çalıştırmak Homebrew'in kendisini ve mevcut formüllerin yerel listesini günceller.
       Kurulu yazılımlarınızı güncellemez, ancak GitHub depolarındaki en son tanımlara sahip olmanızı sağlar.
       Yeni araçlar kurmadan veya yükseltme yapmadan önce bu komutu çalıştırmanız önerilir.
   command: "brew update"

 - title:
     en: brew - upgrade installed packages
     tr: brew - kurulu paketleri yükseltme
   desc:
     en: |
       This command updates all of your installed formulas and casks to their latest available versions.
       If a specific package name is provided, only that tool will be upgraded.
       This is the standard way to keep your command-line environment and applications secure and up to date.
     tr: |
       Bu komut, kurulu tüm formül ve cask'lerinizi mevcut en son sürümlerine günceller.
       Belirli bir paket adı verilirse yalnızca o araç yükseltilir.
       Bu, komut satırı ortamınızı ve uygulamalarınızı güvenli ve güncel tutmanın standart yoludur.
   command: "brew upgrade {{formula_or_cask}}"

 - title:
     en: brew - check for outdated packages
     tr: brew - güncel olmayan paketleri denetleme
   desc:
     en: |
       This command identifies which of your installed packages have newer versions available in the repository.
       It provides a concise list of what can be upgraded without actually performing the upgrade process.
       Use this for a quick status check of your system's software health.
     tr: |
       Bu komut, kurulu paketlerinizden hangilerinin depoda daha yeni sürümlerinin olduğunu belirler.
       Yükseltme işlemini gerçekten yapmadan yükseltilebileceklerin özlü listesini verir.
       Sisteminizin yazılım sağlığının hızlı durum denetimi için kullanın.
   command: "brew outdated"

 - title:
     en: brew - cleanup old versions
     tr: brew - eski sürümleri temizleme
   desc:
     en: |
       Homebrew often keeps old versions of packages and temporary download files, which can consume significant disk space.
       This command removes outdated lock files and stale downloads for all formulas and casks.
       It is a safe way to reclaim storage space without affecting your current software installations.
     tr: |
       Homebrew sıkça paketlerin eski sürümlerini ve geçici indirme dosyalarını tutar; bunlar belirgin disk alanı tüketebilir.
       Bu komut, tüm formül ve cask'lerin güncel olmayan kilit dosyalarını ve bayat indirmelerini kaldırır.
       Geçerli yazılım kurulumlarınızı etkilemeden depolama alanı kazanmanın güvenli yoludur.
   command: "brew cleanup"

# === TROUBLESHOOTING ===
 - title:
     en: brew - check system health
     tr: brew - sistem sağlığını denetleme
   desc:
     en: |
       The doctor command performs a diagnostic check of your system to find common configuration issues.
       It identifies problems like broken symlinks, unlinked kegs, and conflicting software in your path.
       If you encounter errors during installation or updates, this should be your first troubleshooting step.
     tr: |
       Doctor komutu, yaygın yapılandırma sorunlarını bulmak için sisteminizin tanı denetimini yapar.
       Bozuk sembolik bağlar, bağlanmamış keg'ler ve yolunuzdaki çakışan yazılımlar gibi sorunları belirler.
       Kurulum veya güncellemeler sırasında hatalarla karşılaşırsanız bu ilk sorun giderme adımınız olmalıdır.
   command: "brew doctor"

 - title:
     en: brew - show configuration
     tr: brew - yapılandırmayı gösterme
   desc:
     en: |
       This command outputs the current configuration of your Homebrew installation.
       It includes environment variables, paths to the cellar and prefix, and details about your operating system.
       This information is highly valuable when debugging issues or reporting bugs to the Homebrew maintainers.
     tr: |
       Bu komut, Homebrew kurulumunuzun geçerli yapılandırmasını çıktılar.
       Ortam değişkenleri, mahzen ve önek yolları ile işletim sisteminizin ayrıntılarını içerir.
       Bu bilgi, sorunları ayıklarken veya Homebrew geliştiricilerine hata bildirirken oldukça değerlidir.
   command: "brew config"
