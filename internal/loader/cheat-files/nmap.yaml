tool: nmap
tags: [network, scanner, reconnaissance, security, pentest, enumeration, discovery]

actions:
# === HOST DISCOVERY ===
 - title:
     en: nmap - ping scan
     tr: nmap - ping taraması
   desc:
     en: |
       Identifies which hosts are alive within a network range without scanning any ports. 
       This is the fastest method to map a network and is often the first step in reconnaissance. 
       It sends ICMP echo requests and TCP ACK packets to determine host availability while minimizing network traffic.
     tr: |
       Hiçbir port taramadan bir ağ aralığında hangi makinelerin canlı olduğunu belirler.
       Bir ağı haritalamanın en hızlı yöntemidir ve genellikle keşifte ilk adımdır.
       Ağ trafiğini en aza indirirken makine erişilebilirliğini belirlemek için ICMP echo istekleri ve TCP ACK paketleri gönderir.
   command: "nmap -sn {{target_range|192.168.1.0/24}}"

 - title:
     en: nmap - list scan
     tr: nmap - liste taraması
   desc:
     en: |
       Simply lists every host of the network specified without sending any packets to the target. 
       This is useful for verifying that you have the correct IP addresses or hostnames before starting a heavy scan. 
       It performs DNS resolution to provide hostnames, which helps in identifying interesting targets based on their naming convention.
     tr: |
       Hedefe hiç paket göndermeden belirtilen ağın her makinesini yalnızca listeler.
       Ağır bir taramaya başlamadan önce doğru IP adreslerine veya makine adlarına sahip olduğunuzu doğrulamak için kullanışlıdır.
       Makine adları sağlamak için DNS çözümlemesi yapar ve bu, adlandırma düzenine göre ilginç hedefleri belirlemeye yardımcı olur.
   command: "nmap -sL {{target_range}}"

# === SCANNING TECHNIQUES ===
 - title:
     en: nmap - syn stealth scan
     tr: nmap - syn gizli tarama
   desc:
     en: |
       Performs a half-open TCP connection scan which is the most popular and efficient scanning technique. 
       It sends a SYN packet and waits for a response; if a SYN/ACK is received, the port is open, but the connection is never completed. 
       This method requires root/administrator privileges but is less likely to be logged by simple application-level filters.
     tr: |
       En popüler ve verimli tarama tekniği olan yarı açık TCP bağlantı taraması gerçekleştirir.
       Bir SYN paketi gönderir ve yanıt bekler; SYN/ACK alınırsa port açıktır ancak bağlantı asla tamamlanmaz.
       Bu yöntem root/yönetici yetkileri gerektirir ancak basit uygulama düzeyi filtrelerce günlüğe kaydedilme olasılığı daha düşüktür.
   command: "nmap -sS {{target}}"

 - title:
     en: nmap - udp scan
     tr: nmap - udp taraması
   desc:
     en: |
       Scans for open UDP ports on the target machine. 
       UDP scanning is generally much slower than TCP because it often relies on waiting for timeouts or receiving ICMP unreachable messages. 
       Common UDP services like DNS (53), SNMP (161), and DHCP (67/68) are frequently overlooked, making this a crucial step in a full audit.
     tr: |
       Hedef makinedeki açık UDP portlarını tarar.
       UDP taraması genellikle TCP'den çok daha yavaştır çünkü çoğunlukla zaman aşımlarını beklemeye veya ICMP erişilemez iletileri almaya dayanır.
       DNS (53), SNMP (161) ve DHCP (67/68) gibi yaygın UDP hizmetleri sıkça gözden kaçırılır ve bu, tam bir denetimde bunu kritik bir adım yapar.
   command: "nmap -sU {{target}}"

 - title:
     en: nmap - specific port scan
     tr: nmap - belirli port taraması
   desc:
     en: |
       Restricts the scan to a specific set of ports or port ranges defined by the user. 
       By default, Nmap scans the top 1,000 most common ports; using this flag allows you to scan all 65,535 ports or target a custom service. 
       Use 'T:' for TCP ports and 'U:' for UDP ports when scanning both protocols simultaneously.
     tr: |
       Taramayı kullanıcı tanımlı belirli bir port veya port aralığı kümesiyle sınırlar.
       Varsayılan olarak Nmap en yaygın 1.000 portu tarar; bu bayrağı kullanmak 65.535 portun tümünü veya özel bir hizmeti taramanıza olanak tanır.
       Her iki protokolü aynı anda tararken TCP portları için 'T:', UDP portları için 'U:' kullanın.
   command: "nmap -p {{ports|1-65535}} {{target}}"

# === ENUMERATION & DETECTION ===
 - title:
     en: nmap - service and version detection
     tr: nmap - hizmet ve sürüm tespiti
   desc:
     en: |
       Probes open ports to determine what software is running and its specific version number. 
       This is essential for vulnerability research, as it allows the tester to look up specific exploits for the identified versions. 
       The intensity level can be adjusted from 0 to 9 to balance speed versus accuracy.
     tr: |
       Açık portları hangi yazılımın çalıştığını ve belirli sürüm numarasını belirlemek için yoklar.
       Testçinin belirlenen sürümler için belirli exploitleri araştırmasına olanak tanıdığından zafiyet araştırması için gereklidir.
       Hız ve doğruluk dengesini kurmak için yoğunluk düzeyi 0 ile 9 arasında ayarlanabilir.
   command: "nmap -sV --version-intensity {{level|5}} {{target}}"

 - title:
     en: nmap - os detection
     tr: nmap - işletim sistemi tespiti
   desc:
     en: |
       Attempts to identify the operating system of the target by analyzing TCP/IP stack fingerprinting. 
       It examines responses to various probes such as window size, TCP options, and sequence numbers. 
       Knowing the OS helps narrow down the potential attack surface and determine which post-exploitation tools to use.
     tr: |
       TCP/IP yığın parmak izini analiz ederek hedefin işletim sistemini belirlemeye çalışır.
       Pencere boyutu, TCP seçenekleri ve sıra numaraları gibi çeşitli yoklamalara verilen yanıtları inceler.
       İşletim sistemini bilmek olası saldırı yüzeyini daraltmaya ve hangi sömürü sonrası araçların kullanılacağını belirlemeye yardımcı olur.
   command: "nmap -O {{target}}"

 - title:
     en: nmap - aggressive scan
     tr: nmap - agresif tarama
   desc:
     en: |
       A comprehensive scan mode that enables OS detection (-O), version detection (-sV), script scanning (-sC), and traceroute. 
       It provides a wealth of information in a single command, making it a favorite for CTFs and internal testing. 
       Warning: This scan is very noisy and easily detected by Intrusion Detection Systems (IDS).
     tr: |
       İşletim sistemi tespiti (-O), sürüm tespiti (-sV), betik taraması (-sC) ve traceroute'u etkinleştiren kapsamlı bir tarama modudur.
       Tek komutta zengin bilgi sağlar ve CTF'ler ile iç testler için gözdedir.
       Uyarı: Bu tarama çok gürültülüdür ve Saldırı Tespit Sistemleri (IDS) tarafından kolayca tespit edilir.
   command: "nmap -A {{target}}"

# === NMAP SCRIPTING ENGINE (NSE) ===
 - title:
     en: nmap - default script scan
     tr: nmap - varsayılan betik taraması
   desc:
     en: |
       Runs a set of safe, non-intrusive scripts categorized as 'default' against detected services. 
       It can reveal common information like SSH host keys, HTTP headers, or anonymous FTP access. 
       This is often combined with version detection to provide a deeper look at the target's services.
     tr: |
       Tespit edilen hizmetlere karşı 'default' kategorisindeki güvenli, müdahalesiz betikleri çalıştırır.
       SSH makine anahtarları, HTTP başlıkları veya anonim FTP erişimi gibi yaygın bilgileri ortaya çıkarabilir.
       Hedefin hizmetlerine daha derin bakış için genellikle sürüm tespitiyle birleştirilir.
   command: "nmap -sC {{target}}"

 - title:
     en: nmap - vulnerability scan
     tr: nmap - zafiyet taraması
   desc:
     en: |
       Executes scripts from the 'vuln' category to check for known vulnerabilities on the target. 
       These scripts look for specific flaws like Heartbleed, SMB exploits (EternalBlue), and weak configurations. 
       Always use this with caution in production environments as some scripts might cause service instability.
     tr: |
       Hedefteki bilinen zafiyetleri denetlemek için 'vuln' kategorisindeki betikleri çalıştırır.
       Bu betikler Heartbleed, SMB exploitleri (EternalBlue) ve zayıf yapılandırmalar gibi belirli kusurları arar.
       Bazı betikler hizmet kararsızlığına yol açabileceğinden üretim ortamlarında bunu her zaman dikkatli kullanın.
   command: "nmap --script=vuln {{target}}"

 - title:
     en: nmap - brute force scripts
     tr: nmap - kaba kuvvet betikleri
   desc:
     en: |
       Attempts to guess credentials for services like FTP, SSH, or MySQL using NSE scripts. 
       It uses built-in or custom wordlists to identify weak passwords and default accounts. 
       Be careful with this command as it may trigger account lockouts or security alerts on the target system.
     tr: |
       NSE betikleriyle FTP, SSH veya MySQL gibi hizmetlerin kimlik bilgilerini tahmin etmeye çalışır.
       Zayıf parolaları ve varsayılan hesapları belirlemek için yerleşik veya özel sözlükler kullanır.
       Hedef sistemde hesap kilitlenmelerini veya güvenlik uyarılarını tetikleyebileceğinden bu komutta dikkatli olun.
   command: "nmap --script=brute {{target}}"

# === EVASION & TIMING ===
 - title:
     en: nmap - timing templates
     tr: nmap - zamanlama şablonları
   desc:
     en: |
       Controls the speed and aggressiveness of the scan using templates from T0 (Paranoid) to T5 (Insane). 
       T3 is the default, while T4 is recommended for reasonably fast and reliable networks. 
       Using T0 or T1 can help evade IDS detection by increasing the delay between packets significantly.
     tr: |
       T0 (Paranoyak) ile T5 (Aşırı) arasındaki şablonlarla taramanın hızını ve agresifliğini denetler.
       T3 varsayılandır, görece hızlı ve güvenilir ağlar için T4 önerilir.
       Paketler arası gecikmeyi önemli ölçüde artırarak T0 veya T1 kullanmak IDS tespitinden kaçınmaya yardımcı olabilir.
   command: "nmap -T{{level|4}} {{target}}"

 - title:
     en: nmap - fragmentation and decoys
     tr: nmap - parçalama ve yemler
   desc:
     en: |
       Uses packet fragmentation (-f) and decoys (-D) to bypass firewalls and hide the scanner's true IP. 
       Decoys send packets from multiple spoofed IP addresses, making it difficult for admins to identify the real source. 
       This is a classic technique for bypassing simple packet filtering and stateful inspection firewalls.
     tr: |
       Güvenlik duvarlarını aşmak ve tarayıcının gerçek IP'sini gizlemek için paket parçalama (-f) ve yemler (-D) kullanır.
       Yemler birden fazla sahte IP adresinden paket göndererek yöneticilerin gerçek kaynağı belirlemesini zorlaştırır.
       Basit paket filtreleme ve durum denetimli güvenlik duvarlarını aşmak için klasik bir tekniktir.
   command: "nmap -f -D {{decoy1,decoy2,ME}} {{target}}"

# === OUTPUT & MAINTENANCE ===
 - title:
     en: nmap - save all formats
     tr: nmap - tüm biçimlerde kaydetme
   desc:
     en: |
       Exports the scan results into three major formats: normal (.nmap), XML (.xml), and grepable (.gnmap). 
       The XML format is particularly important because it can be imported into tools like Metasploit, Zenmap, or custom parsers. 
       Using '-oA' ensures you have a permanent record of the scan that is easy to search and analyze later.
     tr: |
       Tarama sonuçlarını üç ana biçime aktarır: normal (.nmap), XML (.xml) ve grep'lenebilir (.gnmap).
       XML biçimi özellikle önemlidir çünkü Metasploit, Zenmap veya özel ayrıştırıcılar gibi araçlara aktarılabilir.
       '-oA' kullanmak daha sonra araması ve analiz etmesi kolay kalıcı bir tarama kaydı sağlar.
   command: "nmap -oA {{filename|output_results}} {{target}}"

 - title:
     en: ndiff - compare scan results
     tr: ndiff - tarama sonuçlarını karşılaştırma
   desc:
     en: |
       A utility used to compare two Nmap XML output files and highlight the differences. 
       It shows changes in port states, new services found, or hosts that have disappeared between scans. 
       This is vital for baseline monitoring and identifying changes in an environment over time.
     tr: |
       İki Nmap XML çıktı dosyasını karşılaştırıp farkları vurgulamak için kullanılan bir araçtır.
       Taramalar arasında port durumlarındaki değişiklikleri, bulunan yeni hizmetleri veya kaybolan makineleri gösterir.
       Temel izleme ve bir ortamdaki zaman içindeki değişiklikleri belirlemek için hayati öneme sahiptir.
   command: "ndiff {{yesterday.xml}} {{today.xml}}"

# === SUPPLEMENTARY TOOLS (NCAT & NPING) ===
 - title:
     en: ncat - start listener
     tr: ncat - dinleyici başlatma
   desc:
     en: |
       Starts a TCP listener on a specified port, which can be used for file transfers or receiving reverse shells. 
       The '--keep-open' flag allows the listener to accept multiple connections sequentially without terminating. 
       Ncat is the modern, feature-rich replacement for the original Netcat (nc).
     tr: |
       Dosya aktarımları veya ters kabuk almak için kullanılabilecek, belirtilen bir portta TCP dinleyicisi başlatır.
       '--keep-open' bayrağı dinleyicinin sonlanmadan sırayla birden fazla bağlantı kabul etmesine olanak tanır.
       Ncat, özgün Netcat'in (nc) modern, özellik zengini karşılığıdır.
   command: "ncat -lvp {{port|4444}} --keep-open"

 - title:
     en: nping - custom tcp probe
     tr: nping - özel tcp yoklaması
   desc:
     en: |
       A powerful packet generation tool that allows users to craft custom TCP, UDP, ICMP, and ARP packets. 
       In this example, it sends a TCP SYN packet to a specific port with a custom TTL to test network paths. 
       Useful for troubleshooting network connectivity or testing how firewalls handle specific flag combinations.
     tr: |
       Kullanıcıların özel TCP, UDP, ICMP ve ARP paketleri oluşturmasına olanak tanıyan güçlü bir paket üretim aracıdır.
       Bu örnekte ağ yollarını test etmek için belirli bir porta özel TTL ile TCP SYN paketi gönderir.
       Ağ bağlantısında sorun gidermek veya güvenlik duvarlarının belirli bayrak kombinasyonlarını nasıl işlediğini test etmek için kullanışlıdır.
   command: "nping --tcp -p {{port|80}} --flags syn --ttl {{ttl|2}} {{target}}"
