tool: kubernetes
tags: [orchestration, cloud, containers, security, devops, administration, pentest]

actions:
  # === CONFIGURATION AND CONTEXT ===
  - title:
      en: kubectl - list all contexts
      tr: kubectl - tüm bağlamları listeleme
    desc:
      en: |
        Retrieves a list of all contexts defined in the kubeconfig file. This is essential for identifying which clusters, users, and namespaces are currently configured for access on the local machine. It allows an operator to see the available environments like production, staging, or development.
      tr: |
        Kubeconfig dosyasında tanımlı tüm bağlamların listesini getirir. Bu, yerel makinede erişim için hangi kümelerin, kullanıcıların ve ad alanlarının yapılandırıldığını belirlemek için gereklidir. Operatörün üretim, hazırlık veya geliştirme gibi kullanılabilir ortamları görmesini sağlar.
    command: "kubectl config get-contexts"

  - title:
      en: kubectl - show current context
      tr: kubectl - geçerli bağlamı gösterme
    desc:
      en: |
        Displays the name of the context currently in use by the kubectl CLI. This helps prevent running commands against the wrong cluster by mistake, which is a common source of operational errors. Always verify your current context before performing destructive actions or deployments.
      tr: |
        Kubectl CLI tarafından o anda kullanılan bağlamın adını görüntüler. Bu, yaygın bir operasyonel hata kaynağı olan yanlış kümeye karşı yanlışlıkla komut çalıştırmayı önlemeye yardımcı olur. Yıkıcı eylemler veya dağıtımlar yapmadan önce geçerli bağlamınızı mutlaka doğrulayın.
    command: "kubectl config current-context"

  - title:
      en: kubectl - switch active context
      tr: kubectl - etkin bağlamı değiştirme
    desc:
      en: |
        Sets the current-context in the kubeconfig file to the specified context name. This command effectively switches the active environment you are interacting with. Ensure you have the correct credentials and network connectivity for the target context to avoid connection timeouts or authentication errors.
      tr: |
        Kubeconfig dosyasındaki current-context değerini belirtilen bağlam adına ayarlar. Bu komut etkileşimde olduğunuz etkin ortamı fiilen değiştirir. Bağlantı zaman aşımlarını veya kimlik doğrulama hatalarını önlemek için hedef bağlam için doğru kimlik bilgilerine ve ağ bağlantısına sahip olduğunuzdan emin olun.
    command: "kubectl config use-context {{context_name}}"

  - title:
      en: kubectl - explain resource schema
      tr: kubectl - kaynak şemasını açıklama
    desc:
      en: |
        Displays documentation for various Kubernetes resources and their fields directly from the API server. This is extremely helpful for understanding the structure of a YAML manifest or finding specific field names without leaving the terminal. It acts as a built-in manual for resource schemas and available versions.
      tr: |
        Çeşitli Kubernetes kaynakları ve alanları için belgeleri doğrudan API sunucusundan görüntüler. Terminalden ayrılmadan bir YAML bildiriminin yapısını anlamak veya belirli alan adlarını bulmak için son derece yardımcıdır. Kaynak şemaları ve kullanılabilir sürümler için yerleşik bir kılavuz görevi görür.
    command: "kubectl explain {{resource|pod}}"

  # === ENUMERATION AND RECONNAISSANCE ===
  - title:
      en: kubectl - get all nodes
      tr: kubectl - tüm düğümleri getirme
    desc:
      en: |
        Lists all nodes in the cluster along with their status, roles, and version. Adding the '-o wide' flag provides additional details such as internal/external IP addresses and the OS image. This is a fundamental step for understanding the physical or virtual infrastructure underlying the cluster.
      tr: |
        Kümedeki tüm düğümleri durumları, rolleri ve sürümleriyle birlikte listeler. '-o wide' bayrağını eklemek dahili/harici IP adresleri ve işletim sistemi imajı gibi ek ayrıntılar sağlar. Bu, kümenin altında yatan fiziksel veya sanal altyapıyı anlamak için temel bir adımdır.
    command: "kubectl get nodes -o {{output|wide}}"

  - title:
      en: kubectl - list all namespaces
      tr: kubectl - tüm ad alanlarını listeleme
    desc:
      en: |
        Retrieves all namespaces available within the current Kubernetes cluster. Namespaces are used to partition cluster resources between multiple users or projects. This command is often the first step in reconnaissance to identify where different applications and services are located.
      tr: |
        Geçerli Kubernetes kümesindeki tüm ad alanlarını getirir. Ad alanları, küme kaynaklarını birden fazla kullanıcı veya proje arasında bölümlendirmek için kullanılır. Bu komut genellikle farklı uygulama ve hizmetlerin nerede bulunduğunu belirlemek için keşifte ilk adımdır.
    command: "kubectl get namespaces"

  - title:
      en: kubectl - get pods in namespace
      tr: kubectl - ad alanındaki podları getirme
    desc:
      en: |
        Lists all pods within a specific namespace to check their status, IP addresses, and node placement. Use the '-o wide' flag to see more granular details like which node is hosting which pod. This is critical for troubleshooting application health and verifying that pods are running as expected.
      tr: |
        Durumlarını, IP adreslerini ve düğüm yerleşimlerini denetlemek için belirli bir ad alanındaki tüm podları listeler. Hangi düğümün hangi podu barındırdığı gibi daha ayrıntılı bilgileri görmek için '-o wide' bayrağını kullanın. Bu, uygulama sağlığında sorun gidermek ve podların beklendiği gibi çalıştığını doğrulamak için kritiktir.
    command: "kubectl get pods -n {{namespace|default}} -o {{output|wide}}"

  - title:
      en: kubectl - get pods from all namespaces
      tr: kubectl - tüm ad alanlarındaki podları getirme
    desc:
      en: |
        Lists all pods across every namespace in the cluster simultaneously. This provides a holistic view of all running workloads, which is very useful for cluster-wide audits or identifying rogue processes. Note that this command requires significant permissions and may return a large volume of data in big clusters.
      tr: |
        Kümedeki her ad alanındaki tüm podları aynı anda listeler. Bu, çalışan tüm iş yüklerine bütünsel bir bakış sağlar ve küme genelinde denetimler veya başıbozuk süreçleri belirlemek için çok kullanışlıdır. Bu komutun önemli izinler gerektirdiğini ve büyük kümelerde yüksek hacimli veri döndürebileceğini unutmayın.
    command: "kubectl get pods --all-namespaces"

  - title:
      en: kubectl - list services
      tr: kubectl - hizmetleri listeleme
    desc:
      en: |
        Lists all services within a specific namespace, showing their type, cluster-IP, and external-IP. Services are the primary way to expose applications internally or externally. Checking services helps in identifying internal load balancers and network entry points for different applications.
      tr: |
        Belirli bir ad alanındaki tüm hizmetleri türleri, küme-IP ve harici-IP bilgileriyle listeler. Hizmetler, uygulamaları dahili veya harici olarak kullanıma sunmanın birincil yoludur. Hizmetleri denetlemek, dahili yük dengeleyicileri ve farklı uygulamaların ağ giriş noktalarını belirlemeye yardımcı olur.
    command: "kubectl get services -n {{namespace|default}}"

  - title:
      en: kubectl - list deployments
      tr: kubectl - dağıtımları listeleme
    desc:
      en: |
        Displays all deployments in a given namespace, showing the desired versus current state of replicas. Deployments manage the lifecycle of pods and provide declarative updates. This command helps in understanding how applications are scaled and what their intended availability configuration is.
      tr: |
        Verilen bir ad alanındaki tüm dağıtımları, replikaların istenen ve mevcut durumunu göstererek görüntüler. Dağıtımlar podların yaşam döngüsünü yönetir ve bildirimsel güncellemeler sağlar. Bu komut, uygulamaların nasıl ölçeklendiğini ve amaçlanan kullanılabilirlik yapılandırmasının ne olduğunu anlamaya yardımcı olur.
    command: "kubectl get deployments -n {{namespace|default}}"

  # === DETAILED INSPECTION AND TROUBLESHOOTING ===
  - title:
      en: kubectl - describe resource
      tr: kubectl - kaynak detayı gösterme
    desc:
      en: |
        Provides detailed information about a specific Kubernetes resource, including its configuration, current status, and recent events. It is the most common command for debugging why a resource is failing, as it shows error messages and lifecycle events like pull failures or restarts. Use this when a resource is in a 'Pending' or 'CrashLoopBackOff' state.
      tr: |
        Yapılandırması, mevcut durumu ve son olayları dahil belirli bir Kubernetes kaynağı hakkında ayrıntılı bilgi sağlar. Çekme hataları veya yeniden başlatmalar gibi hata iletilerini ve yaşam döngüsü olaylarını gösterdiği için bir kaynağın neden başarısız olduğunu ayıklamada en yaygın komuttur. Kaynak 'Pending' veya 'CrashLoopBackOff' durumundayken bunu kullanın.
    command: "kubectl describe {{resource_type|pod}}/{{resource_name}} -n {{namespace|default}}"

  - title:
      en: kubectl - stream pod logs
      tr: kubectl - pod günlüklerini akışla izleme
    desc:
      en: |
        Retrieves and streams logs from a specific pod to monitor application output and errors in real-time. The '-f' (follow) flag is essential for watching live logs during a deployment or while reproducing a bug. If the pod contains multiple containers, you must specify the container name using the '-c' flag.
      tr: |
        Uygulama çıktısını ve hataları gerçek zamanlı izlemek için belirli bir poddan günlükleri getirir ve akışla gösterir. '-f' (takip) bayrağı, dağıtım sırasında veya bir hatayı yeniden üretirken canlı günlükleri izlemek için gereklidir. Pod birden fazla kapsayıcı içeriyorsa kapsayıcı adını '-c' bayrağıyla belirtmelisiniz.
    command: "kubectl logs -f pods/{{pod_name}} -n {{namespace|default}}"

  - title:
      en: kubectl - execute command in pod
      tr: kubectl - pod içinde komut çalıştırma
    desc:
      en: |
        Allows running a command directly inside a specific container within a pod, providing an interactive shell. This is a powerful tool for debugging, exploring the internal filesystem, or checking environment variables. Use the '-it' flags to ensure an interactive terminal session is established.
      tr: |
        Bir pod içindeki belirli bir kapsayıcıda doğrudan komut çalıştırmaya olanak tanıyarak etkileşimli bir kabuk sağlar. Hata ayıklama, dahili dosya sistemini keşfetme veya ortam değişkenlerini denetleme için güçlü bir araçtır. Etkileşimli bir terminal oturumu kurulmasını sağlamak için '-it' bayraklarını kullanın.
    command: "kubectl exec -it {{pod_name}} -n {{namespace|default}} -- {{command|/bin/bash}}"

  # === CLUSTER MANAGEMENT AND MAINTENANCE ===
  - title:
      en: kubectl - edit resource
      tr: kubectl - kaynağı düzenleme
    desc:
      en: |
        Opens the configuration of a specific resource in the default system editor for live modification. Once saved, Kubernetes will automatically attempt to apply the changes to the cluster. This is a quick way to change replica counts, image tags, or environment variables without needing a local YAML file.
      tr: |
        Belirli bir kaynağın yapılandırmasını canlı değişiklik için varsayılan sistem düzenleyicide açar. Kaydedildikten sonra Kubernetes değişiklikleri kümeye otomatik uygulamaya çalışır. Yerel bir YAML dosyasına gerek olmadan replika sayılarını, imaj etiketlerini veya ortam değişkenlerini değiştirmenin hızlı bir yoludur.
    command: "kubectl edit {{resource_type|deployment}}/{{resource_name}} -n {{namespace|default}}"

  - title:
      en: kubectl - drain node for maintenance
      tr: kubectl - bakım için düğümü boşaltma
    desc:
      en: |
        Prepares a node for maintenance by safely evicting all pods currently running on it. This command ensures that workloads are rescheduled on other available nodes to maintain application availability. Use this before performing OS updates or hardware repairs on a physical node.
      tr: |
        Üzerinde çalışan tüm podları güvenli şekilde tahliye ederek düğümü bakıma hazırlar. Bu komut, uygulama kullanılabilirliğini sürdürmek için iş yüklerinin diğer uygun düğümlerde yeniden zamanlanmasını sağlar. Fiziksel bir düğümde işletim sistemi güncellemeleri veya donanım onarımları yapmadan önce bunu kullanın.
    command: "kubectl drain {{node_name}} --ignore-daemonsets"

  - title:
      en: kubectl - cordon node
      tr: kubectl - düğümü kordona alma
    desc:
      en: |
        Marks a node as unschedulable, preventing any new pods from being placed on it by the scheduler. Existing pods on the node will continue to run unaffected. This is useful when you want to stop growth on a node before eventually draining it or performing diagnostics.
      tr: |
        Düğümü zamanlanamaz olarak işaretler ve zamanlayıcının üzerine yeni pod yerleştirmesini engeller. Düğümdeki mevcut podlar etkilenmeden çalışmaya devam eder. Bir düğümü boşaltmadan veya tanılama yapmadan önce üzerindeki büyümeyi durdurmak istediğinizde kullanışlıdır.
    command: "kubectl cordon {{node_name}}"

  - title:
      en: kubectl - uncordon node
      tr: kubectl - düğümü kordondan çıkarma
    desc:
      en: |
        Marks a previously cordoned node as schedulable again. This allows the Kubernetes scheduler to start placing new pods on the node. Use this command after maintenance is complete to bring the node back into full service within the cluster.
      tr: |
        Önceden kordona alınmış bir düğümü yeniden zamanlanabilir olarak işaretler. Bu, Kubernetes zamanlayıcısının düğüme yeni podlar yerleştirmeye başlamasına olanak tanır. Bakım tamamlandıktan sonra düğümü küme içinde tam hizmete döndürmek için bu komutu kullanın.
    command: "kubectl uncordon {{node_name}}"

  - title:
      en: kubectl - monitor resource usage
      tr: kubectl - kaynak kullanımını izleme
    desc:
      en: |
        Displays CPU and memory usage for either nodes or pods, providing a quick view of resource consumption. This command requires the Metrics Server to be installed and functioning correctly in the cluster. It is highly effective for identifying resource-hungry pods or nodes that are nearing their capacity limits.
      tr: |
        Düğümler veya podlar için CPU ve bellek kullanımını görüntüleyerek kaynak tüketimine hızlı bir bakış sağlar. Bu komut kümede Metrics Server kurulu ve düzgün çalışıyor olmasını gerektirir. Kaynak açgözlü podları veya kapasite sınırlarına yaklaşan düğümleri belirlemede oldukça etkilidir.
    command: "kubectl top {{type|pod}} -n {{namespace|default}}"
