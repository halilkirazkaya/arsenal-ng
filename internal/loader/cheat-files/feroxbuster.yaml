tool: feroxbuster
tags: [web, scanner, security, pentest, enumeration, discovery, fuzzing]

actions:
  # === BASIC USAGE ===
  - title:
      en: feroxbuster - basic directory scan
      tr: feroxbuster - temel dizin taraması
    desc:
      en: |
        Performs a basic recursive directory discovery scan on the target URL.
        It uses the default wordlist and settings to find unlinked content and directories.
        This is the standard starting point for web reconnaissance to identify hidden paths.
        The tool will automatically recurse into any discovered directories by default.
      tr: |
        Hedef URL üzerinde temel özyineli dizin keşif taraması yapar.
        Bağlantısız içerik ve dizinleri bulmak için varsayılan wordlist ve ayarları kullanır.
        Gizli yolları tespit etmek için web keşfinin standart başlangıç noktasıdır.
        Araç varsayılan olarak keşfedilen dizinlere otomatik olarak özyineli girer.
    command: "feroxbuster -u {{url}}"

  - title:
      en: feroxbuster - scan with specific extensions
      tr: feroxbuster - belirli uzantılarla tarama
    desc:
      en: |
        Appends a list of file extensions to each entry in the wordlist during the scan.
        This is essential for finding specific server-side scripts, configuration files, or backups.
        You can provide multiple extensions separated by commas or multiple flags.
        Common extensions to check include php, html, bak, config, and txt.
      tr: |
        Tarama sırasında wordlist'teki her girdiye bir dosya uzantısı listesi ekler.
        Belirli sunucu taraflı betikleri, yapılandırma dosyalarını veya yedekleri bulmak için gereklidir.
        Virgülle ayrılmış birden çok uzantı veya birden çok bayrak verebilirsiniz.
        Denetlenecek yaygın uzantılar arasında php, html, bak, config ve txt bulunur.
    command: "feroxbuster -u {{url}} -x {{extensions|php,html,txt,bak}}"

  - title:
      en: feroxbuster - use custom wordlist
      tr: feroxbuster - özel wordlist kullanma
    desc:
      en: |
        Specifies a custom wordlist file to be used for the brute-forcing process.
        High-quality wordlists like SecLists improve the chances of finding sensitive endpoints.
        If not specified, feroxbuster uses its built-in default wordlist or the one defined in the config file.
        Ensure the path to the wordlist is correct and accessible by the current user.
      tr: |
        Kaba kuvvet işlemi için kullanılacak özel bir wordlist dosyası belirtir.
        SecLists gibi kaliteli wordlist'ler hassas uç noktaları bulma şansını artırır.
        Belirtilmezse feroxbuster yerleşik varsayılan wordlist'i veya yapılandırma dosyasındakini kullanır.
        Wordlist yolunun doğru ve mevcut kullanıcıca erişilebilir olduğundan emin olun.
    command: "feroxbuster -u {{url}} -w {{wordlist_path|/usr/share/wordlists/dirbuster/directory-list-2.3-medium.txt}}"

  # === PERFORMANCE & RECURSION ===
  - title:
      en: feroxbuster - non-recursive scan
      tr: feroxbuster - özyinesiz tarama
    desc:
      en: |
        Disables the default recursive behavior, scanning only the provided base URL.
        This is useful when you want to quickly audit a single directory without diving into subfolders.
        It significantly reduces the total scan time and the number of requests sent to the server.
        Use this when the target has many nested levels that are irrelevant to your scope.
      tr: |
        Varsayılan özyineli davranışı kapatır, yalnızca verilen temel URL'yi tarar.
        Alt klasörlere girmeden tek bir dizini hızlıca denetlemek istediğinizde kullanışlıdır.
        Toplam tarama süresini ve sunucuya gönderilen istek sayısını ciddi ölçüde azaltır.
        Hedefin kapsamınızla ilgisiz çok sayıda iç içe düzeyi olduğunda bunu kullanın.
    command: "feroxbuster -u {{url}} --no-recursion"

  - title:
      en: feroxbuster - high speed scanning
      tr: feroxbuster - yüksek hızlı tarama
    desc:
      en: |
        Increases the number of concurrent threads to accelerate the discovery process.
        The default thread count is 50; increasing it can speed up scans but may overwhelm the target server.
        Use this with caution as it might trigger Rate Limiting or Web Application Firewalls (WAF).
        It is recommended to monitor the server's response time when using high thread counts.
      tr: |
        Keşif işlemini hızlandırmak için eşzamanlı iş parçacığı sayısını artırır.
        Varsayılan iş parçacığı sayısı 50'dir; artırmak taramaları hızlandırabilir ancak hedef sunucuyu yorabilir.
        Hız sınırlama veya Web Uygulama Güvenlik Duvarlarını (WAF) tetikleyebileceğinden dikkatli kullanın.
        Yüksek iş parçacığı sayılarında sunucunun yanıt süresini izlemeniz önerilir.
    command: "feroxbuster -u {{url}} -t {{threads|100}}"

  - title:
      en: feroxbuster - rate limiting
      tr: feroxbuster - hız sınırlama
    desc:
      en: |
        Limits the total number of requests sent per second to prevent crashing the target.
        This is vital when scanning fragile legacy systems or environments with strict monitoring.
        Setting a rate limit helps in staying under the radar of automated blocking mechanisms.
        The value is defined as requests per second per directory scan.
      tr: |
        Hedefi çökertmemek için saniyede gönderilen toplam istek sayısını sınırlar.
        Kırılgan eski sistemleri veya sıkı izlemeli ortamları tararken hayati önem taşır.
        Hız limiti ayarlamak, otomatik engelleme mekanizmalarının radarına yakalanmamaya yardımcı olur.
        Değer, dizin taraması başına saniyedeki istek olarak tanımlanır.
    command: "feroxbuster -u {{url}} --rate-limit {{requests_per_second|10}}"

  # === FILTERING RESPONSES ===
  - title:
      en: feroxbuster - filter by status codes
      tr: feroxbuster - durum kodlarına göre filtreleme
    desc:
      en: |
        Excludes specific HTTP status codes from the output results.
        This is useful for hiding common but irrelevant responses like 404 (Not Found) or 403 (Forbidden).
        By default, feroxbuster shows all discovered codes unless specified otherwise.
        You can provide a comma-separated list of codes to ignore during the scan.
      tr: |
        Çıktı sonuçlarından belirli HTTP durum kodlarını çıkarır.
        404 (Bulunamadı) veya 403 (Yasak) gibi yaygın ama ilgisiz yanıtları gizlemek için kullanışlıdır.
        Varsayılan olarak feroxbuster, aksi belirtilmedikçe keşfedilen tüm kodları gösterir.
        Tarama sırasında yoksayılacak kodların virgülle ayrılmış listesini verebilirsiniz.
    command: "feroxbuster -u {{url}} -C {{filter_codes|403,401,500}}"

  - title:
      en: feroxbuster - filter by response size
      tr: feroxbuster - yanıt boyutuna göre filtreleme
    desc:
      en: |
        Filters out responses that have a specific body size in bytes.
        This is extremely helpful for bypassing "Soft 404" pages that return a 200 OK status but identical content.
        You can identify the size of the junk response first and then use this flag to hide it.
        Multiple sizes can be filtered simultaneously to clean up the output.
      tr: |
        Gövde boyutu bayt cinsinden belirli bir değerde olan yanıtları eler.
        200 OK durumu döndürüp aynı içeriği veren "yumuşak 404" sayfalarını aşmak için son derece yararlıdır.
        Önce gereksiz yanıtın boyutunu tespit edip sonra bu bayrakla gizleyebilirsiniz.
        Çıktıyı temizlemek için birden çok boyut aynı anda filtrelenebilir.
    command: "feroxbuster -u {{url}} -S {{size_bytes}}"

  - title:
      en: feroxbuster - filter similar pages (Soft 404)
      tr: feroxbuster - benzer sayfaları filtreleme (yumuşak 404)
    desc:
      en: |
        Filters out pages that are dynamically similar to a given URL's response.
        This is the most effective way to handle custom error pages that return 200 status codes.
        Feroxbuster will fetch the provided URL and use its structure to ignore similar results.
        It helps in reducing false positives in modern web applications.
      tr: |
        Verilen bir URL'nin yanıtına dinamik olarak benzeyen sayfaları eler.
        200 durum kodu döndüren özel hata sayfalarını ele almanın en etkili yoludur.
        Feroxbuster verilen URL'yi getirip yapısını kullanarak benzer sonuçları yoksayar.
        Modern web uygulamalarında yanlış pozitifleri azaltmaya yardımcı olur.
    command: "feroxbuster -u {{url}} --filter-similar-to {{example_url}}"

  # === AUTHENTICATION & HEADERS ===
  - title:
      en: feroxbuster - authenticated scan with cookies
      tr: feroxbuster - çerezlerle kimlik doğrulamalı tarama
    desc:
      en: |
        Sends specific session cookies with every request to scan protected areas of the application.
        This allows for the discovery of hidden administrative panels or user-specific directories.
        The format should be a string containing the cookie name and its value.
        Be aware that intensive scanning might trigger account lockout policies if the session expires.
      tr: |
        Uygulamanın korumalı alanlarını taramak için her istekle belirli oturum çerezleri gönderir.
        Bu, gizli yönetim panellerinin veya kullanıcıya özel dizinlerin keşfedilmesini sağlar.
        Biçim, çerez adını ve değerini içeren bir dize olmalıdır.
        Oturum süresi dolarsa yoğun taramanın hesap kilitleme ilkelerini tetikleyebileceğini unutmayın.
    command: "feroxbuster -u {{url}} -b {{cookie_string|session=abc123xyz}}"

  - title:
      en: feroxbuster - custom headers and user-agent
      tr: feroxbuster - özel başlıklar ve user-agent
    desc:
      en: |
        Sets custom HTTP headers or a specific User-Agent for all outgoing requests.
        Custom headers are often required for API scanning (e.g., Authorization tokens) or bypassing WAFs.
        Using a realistic User-Agent can help blend in with legitimate traffic.
        You can use the --random-agent flag as an alternative for automatic rotation.
      tr: |
        Tüm giden istekler için özel HTTP başlıkları veya belirli bir User-Agent ayarlar.
        Özel başlıklar API taraması (örn. Authorization jetonları) veya WAF aşma için sıklıkla gerekir.
        Gerçekçi bir User-Agent kullanmak meşru trafiğe karışmaya yardımcı olabilir.
        Otomatik dönüşüm için alternatif olarak --random-agent bayrağını kullanabilirsiniz.
    command: "feroxbuster -u {{url}} -H \"{{header_name|Authorization}}: {{header_value}}\" -a \"{{user_agent}}\""

  # === PROXY & INTERCEPTION ===
  - title:
      en: feroxbuster - proxy through Burp Suite
      tr: feroxbuster - Burp Suite üzerinden vekil kullanma
    desc:
      en: |
        Routes all traffic through a specified proxy, typically Burp Suite or OWASP ZAP.
        The --burp flag is a shortcut that sets the proxy to http://127.0.0.1:8080 and disables TLS validation.
        This allows for detailed manual inspection of interesting requests discovered by the tool.
        Ensure your proxy tool is running and configured to listen on the specified port.
      tr: |
        Tüm trafiği genellikle Burp Suite veya OWASP ZAP olan belirtilen bir vekilden geçirir.
        --burp bayrağı, vekili http://127.0.0.1:8080 olarak ayarlayan ve TLS doğrulamasını kapatan bir kısayoldur.
        Bu, araçça keşfedilen ilginç isteklerin ayrıntılı elle incelenmesini sağlar.
        Vekil aracınızın çalıştığından ve belirtilen portu dinleyecek şekilde yapılandırıldığından emin olun.
    command: "feroxbuster -u {{url}} --burp"

  - title:
      en: feroxbuster - replay proxy for specific codes
      tr: feroxbuster - belirli kodlar için tekrar vekili
    desc:
      en: |
        Sends only specific successful responses (like 200 or 302) to a secondary proxy.
        This prevents clogging your Burp Suite history with 404 errors while still capturing valid findings.
        It is a highly efficient way to combine automated discovery with manual analysis.
        The --replay-codes flag defines which status codes should be forwarded.
      tr: |
        Yalnızca belirli başarılı yanıtları (200 veya 302 gibi) ikincil bir vekile gönderir.
        Geçerli bulguları yakalarken Burp Suite geçmişinizin 404 hatalarıyla dolmasını engeller.
        Otomatik keşfi elle analizle birleştirmenin oldukça verimli bir yoludur.
        --replay-codes bayrağı hangi durum kodlarının iletileceğini tanımlar.
    command: "feroxbuster -u {{url}} --replay-proxy {{proxy_url|http://127.0.0.1:8080}} --replay-codes {{codes|200,302}} --insecure"

  # === ADVANCED & AUTOMATION ===
  - title:
      en: feroxbuster - smart/thorough discovery
      tr: feroxbuster - akıllı/kapsamlı keşif
    desc:
      en: |
        Enables "Thorough" mode which activates several advanced discovery features at once.
        This mode automatically collects new words from responses, looks for backups, and discovers extensions.
        It is more aggressive and time-consuming but provides a much deeper level of enumeration.
        Ideal for comprehensive security assessments where time is not the primary constraint.
      tr: |
        Birden çok gelişmiş keşif özelliğini aynı anda etkinleştiren "Thorough" kipini açar.
        Bu kip yanıtlardan otomatik yeni sözcük toplar, yedek arar ve uzantı keşfeder.
        Daha agresif ve zaman alıcıdır ancak çok daha derin bir numaralandırma düzeyi sağlar.
        Zamanın birincil kısıt olmadığı kapsamlı güvenlik değerlendirmeleri için idealdir.
    command: "feroxbuster -u {{url}} --thorough"

  - title:
      en: feroxbuster - resume a paused scan
      tr: feroxbuster - duraklatılmış taramayı sürdürme
    desc:
      en: |
        Resumes a previously interrupted scan using a state file generated by feroxbuster.
        State files are created automatically during execution and saved in the current directory.
        This feature is life-saving for long-running scans that were stopped due to network issues or manual intervention.
        Simply point the command to the .state file to pick up exactly where it left off.
      tr: |
        Feroxbuster'ın ürettiği bir durum dosyasını kullanarak kesintiye uğramış taramayı sürdürür.
        Durum dosyaları çalıştırma sırasında otomatik oluşturulup çalışma dizinine kaydedilir.
        Ağ sorunları veya elle müdahale nedeniyle duran uzun taramalarda bu özellik hayat kurtarır.
        Kaldığı yerden devam etmek için komutu .state dosyasına yöneltmeniz yeterlidir.
    command: "feroxbuster --resume-from {{state_file}}"

  - title:
      en: feroxbuster - read targets from STDIN
      tr: feroxbuster - hedefleri STDIN'den okuma
    desc:
      en: |
        Reads a list of URLs from standard input and processes them in parallel.
        This is perfect for piping results from other tools like subfinder, assetfinder, or httpx.
        The --stdin flag tells the tool to ignore the -u requirement and read from the pipe instead.
        This enables powerful automation chains in bug bounty or large-scale internal network scans.
      tr: |
        Standart girdiden bir URL listesi okuyup bunları paralel işler.
        Subfinder, assetfinder veya httpx gibi araçların çıktılarını aktarmak için mükemmeldir.
        --stdin bayrağı araca -u gereksinimini yoksayıp kanaldan (pipe) okumasını söyler.
        Bu, hata ödülü avcılığında veya geniş iç ağ taramalarında güçlü otomasyon zincirleri kurar.
    command: "cat {{targets_file}} | feroxbuster --stdin"

  - title:
      en: feroxbuster - save output to file
      tr: feroxbuster - çıktıyı dosyaya kaydetme
    desc:
      en: |
        Writes the scan results to a specified output file for later reporting or analysis.
        You can also use the --json flag in conjunction with this to save the output in machine-readable format.
        Saving results is critical for documentation during a penetration test or audit.
        The output includes the status code, response size, and the discovered URL.
      tr: |
        Tarama sonuçlarını sonradan raporlama veya analiz için belirtilen çıktı dosyasına yazar.
        Çıktıyı makinece okunabilir biçimde kaydetmek için bununla birlikte --json bayrağını da kullanabilirsiniz.
        Sonuçları kaydetmek, sızma testi veya denetim sırasında belgeleme için kritiktir.
        Çıktı; durum kodu, yanıt boyutu ve keşfedilen URL'yi içerir.
    command: "feroxbuster -u {{url}} -o {{output_file|results.txt}}"
