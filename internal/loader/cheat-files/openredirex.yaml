tool: openredirex
tags: [web, security, pentest, open-redirection, scanner, bug-bounty, enumeration]

actions:
  # === BASIC USAGE ===
  - title:
      en: openredirex - basic scan with default payloads
      tr: openredirex - varsayılan yüklerle temel tarama
    desc:
      en: |
        This command performs a basic scan for open redirection vulnerabilities by reading a list of URLs from a file. 
        It automatically identifies parameters in the URLs and replaces them with a hardcoded list of common redirection payloads. 
        This is the most frequent entry point for testing a large list of endpoints discovered during the reconnaissance phase.
      tr: |
        Bu komut, bir dosyadan okunan URL listesiyle açık yönlendirme zafiyetlerine yönelik temel bir tarama gerçekleştirir.
        URL'lerdeki parametreleri otomatik olarak tespit edip yaygın yönlendirme yüklerinden (payload) oluşan yerleşik listeyle değiştirir.
        Keşif aşamasında bulunan geniş uç nokta listelerini test etmek için en sık kullanılan giriş noktasıdır.
    command: "cat {{url_list}} | openredirex"

  - title:
      en: openredirex - scan using a custom payload file
      tr: openredirex - özel yük dosyasıyla tarama
    desc:
      en: |
        Use this command when you have a specific list of payloads, such as those designed to bypass certain filters or WAFs. 
        The tool will read each line from your provided payload file and inject it into the target URLs. 
        This is highly recommended for more advanced testing where the default payload list might be insufficient.
      tr: |
        Belirli filtreleri veya WAF'leri atlatmak için tasarlanmış özel bir yük (payload) listeniz olduğunda bu komutu kullanın.
        Araç, sağladığınız yük dosyasının her satırını okuyup hedef URL'lere enjekte eder.
        Varsayılan yük listesinin yetersiz kalabileceği daha ileri testler için şiddetle önerilir.
    command: "cat {{url_list}} | openredirex -p {{payload_file}}"

  # === CONFIGURATION & OPTIMIZATION ===
  - title:
      en: openredirex - scan with a custom keyword
      tr: openredirex - özel anahtar sözcükle tarama
    desc:
      en: |
        By default, the tool looks for the string 'FUZZ' within the provided URLs to determine where to inject payloads. 
        If your URLs use a different placeholder or if you want to target a specific parameter name, use this flag to define it. 
        This ensures that the injection occurs exactly where you intend it to, providing better control over the testing process.
      tr: |
        Araç, yüklerin (payload) nereye enjekte edileceğini belirlemek için sağlanan URL'lerde varsayılan olarak 'FUZZ' dizgisini arar.
        URL'leriniz farklı bir yer tutucu kullanıyorsa veya belirli bir parametre adını hedeflemek istiyorsanız bunu tanımlamak için bu bayrağı kullanın.
        Bu, enjeksiyonun tam istediğiniz yerde yapılmasını sağlayarak test süreci üzerinde daha iyi denetim sunar.
    command: "cat {{url_list}} | openredirex -k {{keyword|FUZZ}}"

  - title:
      en: openredirex - adjust concurrency for performance
      tr: openredirex - performans için eşzamanlılığı ayarlama
    desc:
      en: |
        This flag controls the number of concurrent tasks the script runs, which directly impacts the speed of the scan. 
        Increasing the concurrency can drastically reduce the time needed to scan thousands of URLs, but it may also trigger rate limits. 
        The default value is 100, but you should adjust it based on the stability and speed of the target server.
      tr: |
        Bu bayrak, betiğin çalıştırdığı eşzamanlı görev sayısını denetler; bu da tarama hızını doğrudan etkiler.
        Eşzamanlılığı artırmak binlerce URL'yi taramak için gereken süreyi ciddi ölçüde kısaltır, ancak hız sınırlamalarını da tetikleyebilir.
        Varsayılan değer 100'dür; hedef sunucunun kararlılığına ve hızına göre ayarlayın.
    command: "cat {{url_list}} | openredirex -c {{concurrency|50}}"

  # === ADVANCED WORKFLOWS ===
  - title:
      en: openredirex - full custom scan configuration
      tr: openredirex - tam özel tarama yapılandırması
    desc:
      en: |
        Combine multiple flags to execute a highly tailored scan against your target list. 
        This example sets a custom payload file, a specific keyword for injection, and a defined concurrency level simultaneously. 
        This is the ideal approach for professional security assessments and bug bounty hunting on large-scale infrastructures.
      tr: |
        Hedef listenize karşı son derece özelleştirilmiş bir tarama için birden çok bayrağı birleştirir.
        Bu örnekte özel bir yük dosyası, enjeksiyon için belirli bir anahtar sözcük ve tanımlı bir eşzamanlılık düzeyi aynı anda ayarlanır.
        Büyük ölçekli altyapılarda profesyonel güvenlik değerlendirmeleri ve hata ödülü (bug bounty) avcılığı için ideal yaklaşımdır.
    command: "cat {{url_list}} | openredirex -p {{payload_file}} -k {{keyword|FUZZ}} -c {{concurrency|100}}"

  - title:
      en: openredirex - integration with url discovery tools
      tr: openredirex - URL keşif araçlarıyla entegrasyon
    desc:
      en: |
        This command demonstrates how to pipe output from discovery tools like 'waybackurls' directly into the scanner. 
        It filters the discovered URLs and immediately starts checking them for open redirection vulnerabilities. 
        Note that you may need to ensure the URLs contain the appropriate keyword or parameters before piping them.
      tr: |
        Bu komut, 'waybackurls' gibi keşif araçlarının çıktısını doğrudan tarayıcıya aktararak (pipe) nasıl kullanacağınızı gösterir.
        Keşfedilen URL'leri filtreler ve açık yönlendirme zafiyetlerine karşı denetimi hemen başlatır.
        Aktarmadan önce URL'lerin uygun anahtar sözcüğü veya parametreleri içerdiğinden emin olunması gerektiğini unutmayın.
    command: "waybackurls {{domain}} | grep '=' | openredirex -c {{concurrency|100}}"