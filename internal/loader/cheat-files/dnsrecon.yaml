tool: dnsrecon
tags: [network, reconnaissance, dns, pentest, enumeration, security, information-gathering]

actions:
  # === BASIC ENUMERATION ===
  - title:
      en: dnsrecon - standard enumeration
      tr: dnsrecon - Standart numaralandırma
    desc:
      en: |
        Performs a standard DNS enumeration to gather general information about the target. 
        It queries for common records including SOA, NS, A, AAAA, MX, and SRV. 
        This is usually the first step in DNS reconnaissance to identify the target's primary infrastructure and mail servers.
      tr: |
        Hedef hakkında genel bilgi toplamak için standart DNS numaralandırması yapar. SOA, NS, AAAA,
        MX ve SRV dahil yaygın kayıtları sorgular. Hedefin birincil altyapısını ve posta
        sunucularını belirlemede genellikle DNS keşfinin ilk adımıdır.
    command: "dnsrecon -d {{domain}} -t std"

  - title:
      en: dnsrecon - zone transfer attempt
      tr: dnsrecon - Bölge aktarımı denemesi
    desc:
      en: |
        Attempts an AXFR zone transfer against all identified name servers for the target domain. 
        A successful zone transfer allows an attacker to see every record in a DNS zone without brute forcing. 
        This is a critical security misconfiguration that should be tested during every penetration test.
      tr: |
        Hedef alan adının bilinen bütün ad sunucularına karşı AXFR bölge aktarımı dener. Başarılı
        bir bölge aktarımı, kaba zorlamaya gerek kalmadan DNS bölgesindeki bütün kayıtları görmeyi
        sağlar. Her sızma testinde sınanması gereken kritik bir güvenlik yapılandırma hatasıdır.
    command: "dnsrecon -d {{domain}} -a"

  - title:
      en: dnsrecon - comprehensive scan
      tr: dnsrecon - Kapsamlı tarama
    desc:
      en: |
        Combines standard enumeration with a zone transfer attempt and certificate transparency check. 
        This provides a broad overview of the target domain in a single command. 
        It is highly efficient for initial data gathering but might be noisier than individual scans.
      tr: |
        Standart numaralandırmayı bölge aktarımı denemesi ve sertifika şeffaflığı denetimiyle
        birleştirir. Hedef alan adına dair geniş bir genel bakışı tek komutla sunar. İlk veri
        toplama için çok verimlidir; ancak tekil taramalardan daha gürültülü olabilir.
    command: "dnsrecon -d {{domain}} -t std,crt -a"

  # === BRUTE FORCE & DISCOVERY ===
  - title:
      en: dnsrecon - dictionary brute force
      tr: dnsrecon - Sözlükle kaba zorlama
    desc:
      en: |
        Uses a dictionary file to discover subdomains and hostnames by attempting common names. 
        This technique is essential when DNS zone transfers are disabled by the administrator. 
        You can increase the thread count to speed up the discovery process on larger wordlists.
      tr: |
        Yaygın adları deneyerek sözlük dosyasıyla alt alan adı ve makine adı keşfeder. Yöneticinin
        DNS bölge aktarımını kapattığı durumlarda bu teknik vazgeçilmezdir. Büyük kelime
        listelerinde keşif işlemini hızlandırmak için iş parçacığı sayısı artırılabilir.
    command: "dnsrecon -d {{domain}} -D {{wordlist|/usr/share/wordlists/dnsmap.txt}} -t brt --threads {{threads|10}}"

  - title:
      en: dnsrecon - brute force with wildcard filtering
      tr: dnsrecon - Joker filtrelemeli kaba zorlama
    desc:
      en: |
        Performs a brute force attack while filtering out records that resolve to a wildcard IP address. 
        Wildcard DNS can lead to many false positives during subdomain enumeration. 
        Using the -f flag ensures that your results only contain unique and valid host entries.
      tr: |
        Joker IP adresine çözülen kayıtları eleyerek kaba zorlama yapar. Joker DNS, alt alan adı
        numaralandırmada çok sayıda yanlış pozitif doğurabilir. -f bayrağı, sonuçların yalnızca
        tekil ve geçerli makine girdileri içermesini sağlar.
    command: "dnsrecon -d {{domain}} -D {{wordlist}} -t brt -f"

  # === REVERSE & NETWORK MAPPING ===
  - title:
      en: dnsrecon - reverse lookup range
      tr: dnsrecon - Tersine sorgulama aralığı
    desc:
      en: |
        Performs a reverse DNS lookup for a specific IP range or CIDR block to identify associated hostnames. 
        This is useful for mapping internal networks or identifying cloud-hosted assets belonging to a target. 
        It converts IP addresses back into human-readable domain names using PTR records.
      tr: |
        İlişkili makine adlarını belirlemek için belirli bir IP aralığına ya da CIDR bloğuna tersine
        DNS sorgulaması yapar. Dahili ağları haritalamak ya da hedefe ait bulutta barındırılan
        varlıkları belirlemek için yararlıdır. PTR kayıtlarını kullanarak IP adreslerini okunabilir
        alan adlarına çevirir.
    command: "dnsrecon -r {{ip_range}} -t rvl"

  - title:
      en: dnsrecon - reverse lookup from SPF
      tr: dnsrecon - SPF üzerinden tersine sorgulama
    desc:
      en: |
        Extracts IP ranges from SPF (Sender Policy Framework) records and performs reverse lookups on them. 
        SPF records often contain the IP addresses of authorized mail servers and associated networks. 
        This provides a focused way to find infrastructure directly owned or used by the target organization.
      tr: |
        SPF (Gönderici İlkesi Çerçevesi) kayıtlarındaki IP aralıklarını çıkarıp bu aralıklarda
        tersine sorgulama yapar. SPF kayıtları çoğunlukla yetkili posta sunucularının ve ilişkili
        ağların IP adreslerini içerir. Hedef kurumun doğrudan sahip olduğu ya da kullandığı
        altyapıyı bulmak için odaklı bir yol sunar.
    command: "dnsrecon -d {{domain}} -s"

  # === OSINT & EXTERNAL SOURCES ===
  - title:
      en: dnsrecon - certificate transparency search
      tr: dnsrecon - Sertifika şeffaflığı araması
    desc:
      en: |
        Searches for subdomains and hosts using the crt.sh certificate transparency logs. 
        This is a passive reconnaissance technique that does not interact directly with the target's DNS servers. 
        It is excellent for finding hidden subdomains that have had SSL certificates issued in the past.
      tr: |
        crt.sh sertifika şeffaflığı günlüklerini kullanarak alt alan adı ve makine arar. Hedefin DNS
        sunucularıyla doğrudan etkileşime girmeyen edilgen bir keşif tekniğidir. Geçmişte SSL
        sertifikası düzenlenmiş gizli alt alan adlarını bulmakta mükemmeldir.
    command: "dnsrecon -d {{domain}} -t crt"

  - title:
      en: dnsrecon - search engine enumeration
      tr: dnsrecon - Arama motoru numaralandırması
    desc:
      en: |
        Queries search engines like Bing or Yandex to discover subdomains and hosts indexed publicly. 
        This can reveal development or staging environments that are not listed in standard dictionaries. 
        Note that frequent use might trigger CAPTCHAs or temporary blocks from the search providers.
      tr: |
        Herkese açık dizine girmiş alt alan adlarını ve makineleri bulmak için Bing ya da Yandex
        gibi arama motorlarını sorgular. Standart sözlüklerde yer almayan geliştirme ya da hazırlık
        ortamlarını ortaya çıkarabilir. Sık kullanımın arama sağlayıcılarda CAPTCHA ya da geçici
        engel tetikleyebileceği unutulmamalıdır.
    command: "dnsrecon -d {{domain}} -t {{search_engine|bing}}"

  # === ADVANCED TECHNIQUES ===
  - title:
      en: dnsrecon - dnssec zone walk
      tr: dnsrecon - DNSSEC bölge yürüyüşü
    desc:
      en: |
        Attempts a DNSSEC zone walk by exploiting NSEC records to enumerate the entire DNS zone. 
        If the target uses NSEC instead of NSEC3, it is possible to reconstruct the full list of hosts. 
        This is a powerful method for enumerating zones that have otherwise strict access controls.
      tr: |
        NSEC kayıtlarından yararlanarak DNSSEC bölge yürüyüşü dener ve bütün DNS bölgesini
        numaralandırır. Hedef NSEC3 yerine NSEC kullanıyorsa makine listesinin tamamını yeniden
        kurmak mümkündür. Erişim denetimleri sıkı bölgeleri numaralandırmak için güçlü bir
        yöntemdir.
    command: "dnsrecon -d {{domain}} -z"

  - title:
      en: dnsrecon - cache snooping
      tr: dnsrecon - Önbellek gözetleme
    desc:
      en: |
        Performs DNS cache snooping against a specific name server to see if certain domains have been resolved recently. 
        This can provide insight into the browsing habits or software updates of the users behind that DNS server. 
        A dictionary file (-D) and a target name server (-n) must be specified for this attack.
      tr: |
        Belirli bir ad sunucusuna karşı DNS önbellek gözetleme yaparak belirli alan adlarının son
        dönemde çözülüp çözülmediğine bakar. Bu yöntem, DNS sunucusu ardındaki kullanıcıların
        gezinme alışkanlıklarına ya da yazılım güncellemelerine dair içgörü verebilir. Bu saldırı
        için sözlük dosyası (-D) ve hedef ad sunucusu (-n) belirtilmelidir.
    command: "dnsrecon -t snoop -D {{wordlist}} -n {{nameserver}}"

  - title:
      en: dnsrecon - tld expansion
      tr: dnsrecon - TLD genişletmesi
    desc:
      en: |
        Checks the target domain name against all Top-Level Domains (TLDs) registered in IANA. 
        This helps identify related domains, brand protection issues, or potential phishing sites. 
        It effectively strips the original extension and brute forces all other possible TLDs.
      tr: |
        Hedef alan adını IANA kayıtlı bütün üst seviye alan adları (TLD) karşısında sınar. İlişkili
        alan adlarını, marka koruma sorunlarını ya da olası kimlik avı sitelerini belirlemeye
        yardımcı olur. Özgün uzantıyı atıp kalan bütün olası TLD türevlerini kaba zorlamayla yoklar.
    command: "dnsrecon -d {{domain}} -t tld"

  # === DATA MANAGEMENT ===
  - title:
      en: dnsrecon - export to json and xml
      tr: dnsrecon - JSON ve XML olarak dışa aktarma
    desc:
      en: |
        Runs a standard enumeration and saves the output into both JSON and XML formats. 
        Saving results to structured files is crucial for documentation and for automated parsing by other tools. 
        This prevents data loss and allows for easy comparison between different scan sessions.
      tr: |
        Standart numaralandırma yapıp çıktıyı hem JSON hem XML biçiminde kaydeder. Sonuçları düzenli
        dosyalara kaydetmek, belgelendirme ve başka araçlarla otomatik ayrıştırma için kritiktir.
        Veri kaybını engeller ve farklı tarama oturumları arasında kolay karşılaştırmaya olanak
        tanır.
    command: "dnsrecon -d {{domain}} -t std --json {{json_file|results.json}} --xml {{xml_file|results.xml}}"

  - title:
      en: dnsrecon - save to sqlite database
      tr: dnsrecon - SQLite veritabanına kaydetme
    desc:
      en: |
        Executes a scan and stores all discovered records directly into a SQLite database file. 
        Using a database is ideal for large-scale reconnaissance projects where you need to query results later. 
        This keeps the workspace organized and allows for persistent storage of gathered intelligence.
      tr: |
        Tarama yapıp keşfedilen bütün kayıtları doğrudan bir SQLite veritabanı dosyasına yazar.
        Sonuçları daha sonra sorgulamak gereken büyük ölçekli keşif çalışmalarında veritabanı
        kullanımı idealdir. Çalışma alanını düzenli tutar ve toplanan istihbaratın kalıcı
        saklanmasını sağlar.
    command: "dnsrecon -d {{domain}} -t std --db {{db_name|recon.db}}"
