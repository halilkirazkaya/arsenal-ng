tool: rustscan
tags: [network, scanner, security, pentest, enumeration, port-scanner, fast-scan]

# === SECTION: Basic Scanning ===
actions:
  - title:
      en: "rustscan - basic port scan"
      tr: rustscan - temel port taraması
    desc:
      en: |
        Basic port scan against a specified target address or CIDR. This is the default starting point for reconnaissance to quickly discover open ports. By default, it will scan all 65535 ports and pass the discovered open ports to Nmap for a default script scan. It is incredibly fast, usually finishing in seconds depending on network conditions.
      tr: |
        Belirtilen hedef adrese veya CIDR aralığına temel port taraması yapar. Açık portları hızla keşfetmek için keşif aşamasının varsayılan başlangıç noktasıdır. Varsayılan olarak 65535 portun tamamını tarar ve bulunan açık portları varsayılan betik taraması için Nmap'e aktarır. Ağ koşullarına bağlı olarak genellikle saniyeler içinde bitecek kadar inanılmaz hızlıdır.
    command: "rustscan -a {{target}}"
    
  - title:
      en: "rustscan - scan multiple targets from file"
      tr: rustscan - dosyadan çoklu hedef tarama
    desc:
      en: |
        Scan a list of targets specified in a newline-delimited file. This is highly useful for internal network penetration tests where you need to sweep multiple subnets or hosts. It aggregates the open ports across all specified addresses. Ensure your batch size and network capacity can handle the bulk traffic generated by this command.
      tr: |
        Satır sonlarıyla ayrılmış bir dosyada belirtilen hedef listesini tarar. Birden çok alt ağı veya hostu süpürmen gereken iç ağ sızma testlerinde oldukça faydalıdır. Belirtilen tüm adreslerdeki açık portları toplulaştırır. Bu komutun ürettiği toplu trafiği batch size ve ağ kapasitenin kaldırabildiğinden emin ol.
    command: "rustscan -a {{file_path|hosts.txt}}"

  - title:
      en: "rustscan - top 1000 ports"
      tr: rustscan - en yaygın 1000 port
    desc:
      en: |
        Scan only the top 1000 most common ports instead of the entire 65535 range. Use this when you are severely constrained by time or network stealth requirements. It drastically reduces the scan time while still catching the most frequently used services like HTTP, SSH, and FTP. This provides a quick initial overview before performing a full exhaustive scan.
      tr: |
        65535 portluk aralığın tamamı yerine yalnızca en yaygın 1000 portu tarar. Zaman açısından ciddi kısıtların veya ağda gizlilik gereksinimlerinin olduğu durumlarda kullan. HTTP, SSH ve FTP gibi en sık kullanılan hizmetleri yine de yakalarken tarama süresini ciddi ölçüde kısaltır. Tam kapsamlı taramadan önce hızlı bir ilk genel bakış sunar.
    command: "rustscan -a {{target}} --top"

# === SECTION: Port Specification & Filtering ===
  - title:
      en: "rustscan - specific custom ports"
      tr: rustscan - özel port listesi tarama
    desc:
      en: |
        Scan the target for a specific comma-separated list of ports. Use this when you are hunting for a particular service across a large network, such as looking only for web servers or database instances. It skips unnecessary scanning, optimizing both time and network bandwidth. Make sure there are no spaces between the comma-separated port numbers.
      tr: |
        Hedefi virgülle ayrılmış belirli bir port listesine göre tarar. Büyük bir ağda yalnızca web sunucuları veya veritabanı örnekleri gibi belirli bir hizmeti ararken kullan. Gereksiz taramayı atlayarak hem zamandan hem de ağ bant genişliğinden tasarruf sağlar. Virgülle ayrılmış port numaraları arasında boşluk olmadığından emin ol.
    command: "rustscan -a {{target}} -p {{ports|80,443,8080}}"

  - title:
      en: "rustscan - scan a specific port range"
      tr: rustscan - belirli port aralığı tarama
    desc:
      en: |
        Define a specific range of ports to scan using the start-end format. This is beneficial when applications are known to run within a certain dynamic port range (e.g., RPC services). It focuses the scan engine entirely on the provided subset of ports. This is less noisy than a full 65535 port sweep but more comprehensive than specifying single ports.
      tr: |
        Başlangıç-bitiş biçimiyle taranacak belirli bir port aralığı tanımlar. Uygulamaların belirli bir dinamik port aralığında (ör. RPC hizmetleri) çalıştığı bilindiğinde faydalıdır. Tarama motorunu tamamen verilen port alt kümesine odaklar. 65535 portluk tam taramadan daha az gürültülüdür; ancak tekil port belirtmekten daha kapsamlıdır.
    command: "rustscan -a {{target}} -r {{range|1000-5000}}"

  - title:
      en: "rustscan - exclude specific ports"
      tr: rustscan - belirli portları hariç tutma
    desc:
      en: |
        Exclude specific ports from being scanned during the execution. This is extremely helpful when certain ports are known to trigger IPS/IDS alerts or cause legacy systems to crash upon receiving unexpected probes. The excluded ports will be completely ignored by both the RustScan engine and the subsequent Nmap phase. Provide the exclusions as a comma-separated list.
      tr: |
        Çalışma sırasında belirli portları taramanın dışında bırakır. Belirli portların IPS/IDS alarmlarını tetiklediği veya beklenmedik yoklamalarla eski sistemleri çökerttiği bilindiğinde son derece faydalıdır. Hariç tutulan portlar hem RustScan motoru hem de sonraki Nmap aşaması tarafından tamamen yok sayılır. Hariç tutmaları virgülle ayrılmış liste olarak ver.
    command: "rustscan -a {{target}} -e {{exclude_ports|21,22,3389}}"

# === SECTION: Performance & Tuning ===
  - title:
      en: "rustscan - optimize batch size"
      tr: rustscan - batch size ayarlama
    desc:
      en: |
        Adjust the batch size to increase or decrease the scanning speed. A larger batch size allows more concurrent connections, drastically speeding up the scan on highly capable networks. However, setting this too high might cause missed ports or crash the tool if it exceeds the operating system's open file limits. The default value is 4500, but adjusting it based on your system can yield better results.
      tr: |
        Tarama hızını artırmak veya azaltmak için batch size değerini ayarlar. Daha büyük batch size daha fazla eşzamanlı bağlantıya olanak tanır ve güçlü ağlarda taramayı ciddi ölçüde hızlandırır. Ancak bunu çok yüksek ayarlamak, işletim sisteminin açık dosya sınırlarını aşarsa portların kaçırılmasına veya aracın çökmesine yol açabilir. Varsayılan değer 4500'dür; ancak sistemine göre ayarlamak daha iyi sonuç verebilir.
    command: "rustscan -a {{target}} -b {{batch_size|10000}}"

  - title:
      en: "rustscan - automatic ulimit configuration"
      tr: rustscan - otomatik ulimit yapılandırması
    desc:
      en: |
        Automatically increase the operating system's open file limit (ulimit) for the duration of the scan. Port scanners require opening thousands of sockets simultaneously, which often exceeds default OS restrictions and causes errors. Using this flag ensures that RustScan can legally open enough file descriptors to maintain its high-speed batching. Root or sudo privileges might be required on some systems to modify this limit.
      tr: |
        Tarama süresince işletim sisteminin açık dosya sınırını (ulimit) otomatik olarak artırır. Port tarayıcıların aynı anda binlerce soket açması gerekir; bu da genellikle varsayılan işletim sistemi kısıtlarını aşar ve hatalara yol açar. Bu bayrağı kullanmak RustScan'in yüksek hızlı batch işlemini sürdürmek için yasal şekilde yeterli dosya tanımlayıcı açabilmesini sağlar. Bazı sistemlerde bu sınırı değiştirmek için root veya sudo yetkisi gerekebilir.
    command: "rustscan -a {{target}} -u {{ulimit|5000}}"

  - title:
      en: "rustscan - adjust timeout and retries"
      tr: rustscan - zaman aşımı ve yeniden deneme ayarı
    desc:
      en: |
        Modify the connection timeout and the number of retries before a port is considered closed. This is crucial when scanning over high-latency connections, such as VPNs or Tor, where the default 1500ms timeout might be too aggressive. Increasing the timeout and tries improves accuracy on unstable networks at the cost of overall scan speed. Setting tries to zero will automatically be corrected to one.
      tr: |
        Bir port kapalı sayılmadan önceki bağlantı zaman aşımını ve yeniden deneme sayısını değiştirir. Varsayılan 1500 ms zaman aşımının fazla agresif kalabileceği VPN veya Tor gibi yüksek gecikmeli bağlantılarda tarama yaparken kritiktir. Zaman aşımını ve deneme sayısını artırmak tarama hızı pahasına kararsız ağlarda doğruluğu iyileştirir. Deneme sayısı sıfır olarak ayarlanırsa otomatik olarak bire düzeltilir.
    command: "rustscan -a {{target}} -t {{timeout|2000}} --tries {{tries|2}}"

# === SECTION: Advanced Execution & Nmap Integration ===
  - title:
      en: "rustscan - pass custom nmap arguments"
      tr: rustscan - özel Nmap argümanları aktarma
    desc:
      en: |
        Pass custom arguments directly to the underlying Nmap execution using the double dash separator. After RustScan finishes identifying open ports at high speed, it dynamically pipes those exact ports into Nmap. You can use this to run aggressive scans, comprehensive version detection, or specific NSE scripts only on the confirmed open ports. This is the most powerful feature, combining RustScan's speed with Nmap's thoroughness.
      tr: |
        Çift tire ayırıcıyla altta çalışan Nmap'e doğrudan özel argümanlar aktarır. RustScan yüksek hızda açık portları belirlemeyi bitirdikten sonra bu portları dinamik olarak Nmap'e yönlendirir. Bunu, yalnızca doğrulanmış açık portlarda agresif tarama, kapsamlı sürüm tespiti veya belirli NSE betikleri çalıştırmak için kullanabilirsin. RustScan'in hızını Nmap'in titizliğiyle birleştiren en güçlü özelliktir.
    command: "rustscan -a {{target}} -- -A -sC -sV"

  - title:
      en: "rustscan - greppable output only"
      tr: rustscan - yalnızca greplenebilir çıktı
    desc:
      en: |
        Output only the discovered open ports without triggering the default Nmap execution. This is extremely useful when integrating RustScan into automated pipelines, CI/CD workflows, or custom bash scripts. It allows you to pipe the clean output into other security tools for further fuzzing or analysis. The output format is easily parsed using standard Linux text processing utilities.
      tr: |
        Varsayılan Nmap çalıştırmasını tetiklemeden yalnızca keşfedilen açık portları çıktı verir. RustScan'i otomatik boru hatlarına, CI/CD iş akışlarına veya özel bash betiklerine entegre ederken son derece faydalıdır. Temiz çıktıyı daha fazla bulanıklaştırma (fuzzing) veya analiz için diğer güvenlik araçlarına yönlendirmeni sağlar. Çıktı biçimi standart Linux metin işleme araçlarıyla kolayca ayrıştırılır.
    command: "rustscan -a {{target}} -g"

  - title:
      en: "rustscan - udp scanning mode"
      tr: rustscan - UDP tarama modu
    desc:
      en: |
        Perform a UDP port scan to identify open UDP services. This mode is specifically designed to find UDP ports that send back responses, rather than relying strictly on standard ICMP port unreachable errors. UDP scanning is inherently slower and less reliable than TCP, so it is recommended to run this separately from your primary TCP scans. It helps uncover hidden infrastructure services like SNMP, DNS, or TFTP.
      tr: |
        Açık UDP hizmetlerini belirlemek için UDP port taraması gerçekleştirir. Bu mod, standart ICMP port unreachable hatalarına sıkı şekilde dayanmak yerine yanıt döndüren UDP portlarını bulmak için özel olarak tasarlanmıştır. UDP tarama doğası gereği TCP'den daha yavaş ve daha az güvenilirdir; bu yüzden birincil TCP taramalarından ayrı çalıştırılması önerilir. SNMP, DNS veya TFTP gibi gizli altyapı hizmetlerini ortaya çıkarmaya yardımcı olur.
    command: "rustscan -a {{target}} --udp"

  - title:
      en: "rustscan - random scan order"
      tr: rustscan - rastgele tarama sırası
    desc:
      en: |
        Randomize the order in which ports are scanned instead of processing them sequentially. Scanning sequentially can often trigger basic firewalls or intrusion detection systems that look for linear port sweeps. Randomizing the port order makes the scan slightly stealthier and helps distribute the load across the target's network stack. The default behavior is serial, but random is better for evasive assessments.
      tr: |
        Portları sırayla işlemek yerine tarandıkları sırayı rastgele hale getirir. Sıralı tarama, doğrusal port süpürmelerini arayan temel güvenlik duvarlarını veya saldırı tespit sistemlerini sıkça tetikler. Port sırasını rastgele hale getirmek taramayı biraz daha gizli kılar ve yükün hedefin ağ yığınına dağılmasına yardımcı olur. Varsayılan davranış sıralıdır; ancak gizli değerlendirmeler için rastgele daha iyidir.
    command: "rustscan -a {{target}} --scan-order {{scan_order|random}}"
