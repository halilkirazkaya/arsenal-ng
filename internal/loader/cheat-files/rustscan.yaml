tool: rustscan
tags: [network, scanner, security, pentest, enumeration, port-scanner, fast-scan]

# === SECTION: Basic Scanning ===
actions:
  - title: "rustscan - basic port scan"
    desc: |
      Basic port scan against a specified target address or CIDR. This is the default starting point for reconnaissance to quickly discover open ports. By default, it will scan all 65535 ports and pass the discovered open ports to Nmap for a default script scan. It is incredibly fast, usually finishing in seconds depending on network conditions.
    command: "rustscan -a {{target}}"
    
  - title: "rustscan - scan multiple targets from file"
    desc: |
      Scan a list of targets specified in a newline-delimited file. This is highly useful for internal network penetration tests where you need to sweep multiple subnets or hosts. It aggregates the open ports across all specified addresses. Ensure your batch size and network capacity can handle the bulk traffic generated by this command.
    command: "rustscan -a {{file_path|hosts.txt}}"

  - title: "rustscan - top 1000 ports"
    desc: |
      Scan only the top 1000 most common ports instead of the entire 65535 range. Use this when you are severely constrained by time or network stealth requirements. It drastically reduces the scan time while still catching the most frequently used services like HTTP, SSH, and FTP. This provides a quick initial overview before performing a full exhaustive scan.
    command: "rustscan -a {{target}} --top"

# === SECTION: Port Specification & Filtering ===
  - title: "rustscan - specific custom ports"
    desc: |
      Scan the target for a specific comma-separated list of ports. Use this when you are hunting for a particular service across a large network, such as looking only for web servers or database instances. It skips unnecessary scanning, optimizing both time and network bandwidth. Make sure there are no spaces between the comma-separated port numbers.
    command: "rustscan -a {{target}} -p {{ports|80,443,8080}}"

  - title: "rustscan - scan a specific port range"
    desc: |
      Define a specific range of ports to scan using the start-end format. This is beneficial when applications are known to run within a certain dynamic port range (e.g., RPC services). It focuses the scan engine entirely on the provided subset of ports. This is less noisy than a full 65535 port sweep but more comprehensive than specifying single ports.
    command: "rustscan -a {{target}} -r {{range|1000-5000}}"

  - title: "rustscan - exclude specific ports"
    desc: |
      Exclude specific ports from being scanned during the execution. This is extremely helpful when certain ports are known to trigger IPS/IDS alerts or cause legacy systems to crash upon receiving unexpected probes. The excluded ports will be completely ignored by both the RustScan engine and the subsequent Nmap phase. Provide the exclusions as a comma-separated list.
    command: "rustscan -a {{target}} -e {{exclude_ports|21,22,3389}}"

# === SECTION: Performance & Tuning ===
  - title: "rustscan - optimize batch size"
    desc: |
      Adjust the batch size to increase or decrease the scanning speed. A larger batch size allows more concurrent connections, drastically speeding up the scan on highly capable networks. However, setting this too high might cause missed ports or crash the tool if it exceeds the operating system's open file limits. The default value is 4500, but adjusting it based on your system can yield better results.
    command: "rustscan -a {{target}} -b {{batch_size|10000}}"

  - title: "rustscan - automatic ulimit configuration"
    desc: |
      Automatically increase the operating system's open file limit (ulimit) for the duration of the scan. Port scanners require opening thousands of sockets simultaneously, which often exceeds default OS restrictions and causes errors. Using this flag ensures that RustScan can legally open enough file descriptors to maintain its high-speed batching. Root or sudo privileges might be required on some systems to modify this limit.
    command: "rustscan -a {{target}} -u {{ulimit|5000}}"

  - title: "rustscan - adjust timeout and retries"
    desc: |
      Modify the connection timeout and the number of retries before a port is considered closed. This is crucial when scanning over high-latency connections, such as VPNs or Tor, where the default 1500ms timeout might be too aggressive. Increasing the timeout and tries improves accuracy on unstable networks at the cost of overall scan speed. Setting tries to zero will automatically be corrected to one.
    command: "rustscan -a {{target}} -t {{timeout|2000}} --tries {{tries|2}}"

# === SECTION: Advanced Execution & Nmap Integration ===
  - title: "rustscan - pass custom nmap arguments"
    desc: |
      Pass custom arguments directly to the underlying Nmap execution using the double dash separator. After RustScan finishes identifying open ports at high speed, it dynamically pipes those exact ports into Nmap. You can use this to run aggressive scans, comprehensive version detection, or specific NSE scripts only on the confirmed open ports. This is the most powerful feature, combining RustScan's speed with Nmap's thoroughness.
    command: "rustscan -a {{target}} -- -A -sC -sV"

  - title: "rustscan - greppable output only"
    desc: |
      Output only the discovered open ports without triggering the default Nmap execution. This is extremely useful when integrating RustScan into automated pipelines, CI/CD workflows, or custom bash scripts. It allows you to pipe the clean output into other security tools for further fuzzing or analysis. The output format is easily parsed using standard Linux text processing utilities.
    command: "rustscan -a {{target}} -g"

  - title: "rustscan - udp scanning mode"
    desc: |
      Perform a UDP port scan to identify open UDP services. This mode is specifically designed to find UDP ports that send back responses, rather than relying strictly on standard ICMP port unreachable errors. UDP scanning is inherently slower and less reliable than TCP, so it is recommended to run this separately from your primary TCP scans. It helps uncover hidden infrastructure services like SNMP, DNS, or TFTP.
    command: "rustscan -a {{target}} --udp"

  - title: "rustscan - random scan order"
    desc: |
      Randomize the order in which ports are scanned instead of processing them sequentially. Scanning sequentially can often trigger basic firewalls or intrusion detection systems that look for linear port sweeps. Randomizing the port order makes the scan slightly stealthier and helps distribute the load across the target's network stack. The default behavior is serial, but random is better for evasive assessments.
    command: "rustscan -a {{target}} --scan-order {{scan_order|random}}"
