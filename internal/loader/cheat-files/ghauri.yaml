tool: ghauri
tags: [sql-injection, exploitation, security, pentest, enumeration, database, scanner]

actions:
  # === TARGETING & BASIC USAGE ===
  - title:
      en: ghauri - basic url scan
      tr: ghauri - temel URL taraması
    desc:
      en: |
        Perform a basic SQL injection scan on a specific target URL containing a GET parameter.
        This is the most common entry point when you identify a potentially vulnerable web page with query strings.
        The tool will automatically attempt to identify the injection point and determine the backend DBMS type.
        Using the --batch flag is recommended to skip interactive prompts and use the default behavior for all questions.
      tr: |
        GET parametresi içeren belirli bir hedef URL üzerinde temel SQL enjeksiyon taraması yapın.
        Sorgu dizeli, potansiyel zafiyetli bir web sayfası belirlediğinizde en yaygın giriş noktasıdır.
        Araç, enjeksiyon noktasını belirleyip arka uç VTYS türünü otomatik tespit etmeye çalışır.
        Etkileşimli soruları atlayıp tüm sorularda varsayılan davranışı kullanmak için --batch bayrağı önerilir.
    command: "ghauri -u {{url}} --batch"

  - title:
      en: ghauri - scan with post data
      tr: ghauri - POST verisiyle tarama
    desc:
      en: |
        Test for SQL injection vulnerabilities within the body of an HTTP POST request.
        This is essential for testing login forms, search bars, or any interface where data is submitted via POST instead of GET.
        The data string should be formatted as key-value pairs, such as 'id=1&name=test'.
        This command allows ghauri to analyze parameters that are not visible in the browser's address bar.
      tr: |
        HTTP POST isteğinin gövdesindeki SQL enjeksiyon zafiyetlerini test edin.
        Verinin GET yerine POST ile gönderildiği giriş formlarını, arama çubuklarını veya arayüzleri test etmek için gereklidir.
        Veri dizesi 'id=1&name=test' gibi anahtar-değer çiftleri biçiminde olmalıdır.
        Bu komut, ghauri'nin tarayıcı adres çubuğunda görünmeyen parametreleri analiz etmesini sağlar.
    command: "ghauri -u {{url}} --data {{post_data}} --batch"

  - title:
      en: ghauri - load request from file
      tr: ghauri - isteği dosyadan yükleme
    desc:
      en: |
        Load a complete HTTP request from a raw text file, which is highly useful for complex requests.
        This method is commonly used with requests captured from proxy tools like Burp Suite or OWASP ZAP.
        It ensures that all headers, cookies, and the exact structure of the request are preserved exactly as they were sent.
        This is often the most reliable way to test authenticated sessions or mobile application APIs.
      tr: |
        Ham bir metin dosyasından eksiksiz bir HTTP isteği yükleyin; karmaşık istekler için oldukça yararlıdır.
        Bu yöntem, Burp Suite veya OWASP ZAP gibi vekil araçlardan yakalanan isteklerle yaygın kullanılır.
        Tüm başlıkların, çerezlerin ve isteğin tam yapısının gönderildiği gibi korunmasını sağlar.
        Kimliği doğrulanmış oturumları veya mobil uygulama API'lerini test etmenin çoğu zaman en güvenilir yoludur.
    command: "ghauri -r {{request_file}} --batch"

  # === REQUEST CONFIGURATION ===
  - title:
      en: ghauri - custom headers and cookies
      tr: ghauri - özel başlıklar ve çerezler
    desc:
      en: |
        Specify custom HTTP headers or session cookies to bypass authentication or provide necessary context.
        This is necessary when the target application requires a valid login session or specific headers like X-Forwarded-For to work.
        You can provide the entire cookie string exactly as it appears in the browser's developer tools.
        Providing these details allows the tool to reach protected areas of the application that would otherwise be inaccessible.
      tr: |
        Kimlik doğrulamayı aşmak veya gerekli bağlamı sağlamak için özel HTTP başlıkları ya da oturum çerezleri belirtin.
        Hedef uygulama geçerli bir oturum veya X-Forwarded-For gibi belirli başlıklar gerektirdiğinde gereklidir.
        Çerez dizesinin tamamını tarayıcının geliştirici araçlarında göründüğü gibi verebilirsiniz.
        Bu ayrıntıları sağlamak, aracın aksi halde erişilemez uygulamanın korumalı alanlarına ulaşmasını sağlar.
    command: "ghauri -u {{url}} --cookie {{cookie_string}} --header {{header_string}}"

  - title:
      en: ghauri - proxy and delay
      tr: ghauri - vekil ve gecikme
    desc:
      en: |
        Route all traffic through a specified proxy and set a delay between individual HTTP requests.
        Using a proxy like Tor or a local Burp Suite instance helps in masking the source IP or inspecting the tool's traffic.
        The delay parameter is crucial for avoiding rate-limiting, account lockouts, or triggering Web Application Firewalls (WAF).
        Adding a delay makes the scanning process stealthier and less likely to overwhelm a fragile backend server.
      tr: |
        Tüm trafiği belirtilen bir vekilden geçirin ve tekil HTTP istekleri arasına gecikme koyun.
        Tor veya yerel Burp Suite gibi bir vekil kullanmak, kaynak IP'yi gizlemeye veya aracın trafiğini incelemeye yardımcı olur.
        Gecikme parametresi; hız sınırlamasından, hesap kilitlenmelerinden veya Web Uygulama Güvenlik Duvarlarını (WAF) tetiklemekten kaçınmak için kritiktir.
        Gecikme eklemek taramayı daha gizli kılar ve kırılgan bir arka uç sunucuyu yorma olasılığını azaltır.
    command: "ghauri -u {{url}} --proxy {{proxy_url|http://127.0.0.1:8080}} --delay {{delay_seconds|1}}"

  - title:
      en: ghauri - user agent randomization
      tr: ghauri - kullanıcı aracısı rastgeleleştirme
    desc:
      en: |
        Use a randomly selected HTTP User-Agent header for each request or specify a custom one.
        This helps in bypassing basic security filters that block requests from known automated tools.
        You can also use the --mobile flag to imitate a smartphone browser if the site serves different content to mobile users.
        Changing the User-Agent makes the tool's traffic appear more like legitimate human browsing behavior.
      tr: |
        Her istek için rastgele seçilmiş bir HTTP User-Agent başlığı kullanın veya özel bir tane belirtin.
        Bilinen otomatik araçlardan gelen istekleri engelleyen temel güvenlik filtrelerini aşmaya yardımcı olur.
        Site mobil kullanıcılara farklı içerik sunuyorsa akıllı telefon tarayıcısını taklit etmek için --mobile bayrağını da kullanabilirsiniz.
        User-Agent'ı değiştirmek aracın trafiğini daha çok meşru insan gezinmesi gibi gösterir.
    command: "ghauri -u {{url}} --random-agent"

  # === DETECTION & OPTIMIZATION ===
  - title:
      en: ghauri - adjustment of test level and threads
      tr: ghauri - test seviyesi ve iş parçacığı ayarı
    desc:
      en: |
        Increase the depth of testing and the speed of the data extraction process.
        The level parameter (1-3) determines how many payloads are tested; higher levels include more aggressive and diverse checks.
        The threads option allows for concurrent HTTP requests, which significantly reduces the time needed for data dumping.
        Be careful with high thread counts, as they can put significant load on the target and might lead to IP blacklisting.
      tr: |
        Test derinliğini ve veri çıkarma işleminin hızını artırın.
        Seviye parametresi (1-3) kaç yükün test edileceğini belirler; yüksek seviyeler daha agresif ve çeşitli denetimler içerir.
        İş parçacığı seçeneği eşzamanlı HTTP isteklerine olanak tanıyarak veri dökümü süresini ciddi ölçüde kısaltır.
        Yüksek iş parçacığı sayılarında dikkatli olun; hedefe ciddi yük bindirebilir ve IP kara listeye alınmaya yol açabilir.
    command: "ghauri -u {{url}} --level {{level|1}} --threads {{threads|1}}"

  - title:
      en: ghauri - specific injection technique
      tr: ghauri - belirli enjeksiyon tekniği
    desc:
      en: |
        Force the tool to use a specific SQL injection technique rather than the default "BEST" selection.
        Available techniques include Boolean-based (B), Error-based (E), Time-based (T), and Union-based (U).
        This is useful when you already know which technique works and want to save time during the exploitation phase.
        Selecting a specific technique can also help in bypassing certain WAF rules that only monitor for specific injection patterns.
      tr: |
        Aracı varsayılan "BEST" seçimi yerine belirli bir SQL enjeksiyon tekniği kullanmaya zorlayın.
        Kullanılabilir teknikler arasında Bool tabanlı (B), Hata tabanlı (E), Zaman tabanlı (T) ve Birleşim (Union) tabanlı (U) bulunur.
        Hangi tekniğin çalıştığını zaten biliyor ve sömürü aşamasında zaman kazanmak istiyorsanız kullanışlıdır.
        Belirli bir teknik seçmek, yalnızca belirli enjeksiyon kalıplarını izleyen WAF kurallarını aşmaya da yardımcı olabilir.
    command: "ghauri -u {{url}} --technique {{tech|BEUT}}"

  # === ENUMERATION ===
  - title:
      en: ghauri - enumerate databases
      tr: ghauri - veritabanlarını numaralandırma
    desc:
      en: |
        Retrieve the list of all databases available on the target database management system.
        This is a vital step in the reconnaissance phase to identify where sensitive information might be stored.
        The command will automatically use the most efficient technique found during the detection phase to fetch the names.
        Once the database names are retrieved, you can focus your efforts on the most interesting ones.
      tr: |
        Hedef veritabanı yönetim sistemindeki tüm veritabanlarının listesini alın.
        Hassas bilginin nerede saklanabileceğini belirlemek için keşif aşamasında hayati bir adımdır.
        Komut, adları çekerken tespit aşamasında bulunan en verimli tekniği otomatik kullanır.
        Veritabanı adları alındıktan sonra çabanızı en ilginç olanlara odaklayabilirsiniz.
    command: "ghauri -u {{url}} --dbs --batch"

  - title:
      en: ghauri - enumerate tables in a database
      tr: ghauri - veritabanındaki tabloları numaralandırma
    desc:
      en: |
        List all tables within a specific database to understand the data structure.
        You must use the -D flag to specify the database name you want to explore.
        Identifying tables like 'users', 'passwords', or 'orders' is key to prioritizing the next steps of your assessment.
        This action helps map out the backend schema and find where the most valuable data resides.
      tr: |
        Veri yapısını anlamak için belirli bir veritabanındaki tüm tabloları listeleyin.
        Keşfetmek istediğiniz veritabanı adını belirtmek için -D bayrağını kullanmalısınız.
        'users', 'passwords' veya 'orders' gibi tabloları belirlemek, değerlendirmenizin sonraki adımlarına öncelik vermek için kilit önemdedir.
        Bu işlem arka uç şemayı haritalamaya ve en değerli verinin nerede olduğunu bulmaya yardımcı olur.
    command: "ghauri -u {{url}} -D {{db_name}} --tables --batch"

  - title:
      en: ghauri - enumerate columns in a table
      tr: ghauri - tablodaki sütunları numaralandırma
    desc:
      en: |
        Identify all column names and their associated data types within a specific table.
        Both the database name (-D) and the table name (-T) must be provided for this command to work.
        This allows you to find sensitive fields such as 'email', 'password_hash', or 'ssn'.
        Understanding the column structure is a mandatory prerequisite for dumping the actual records from the table.
      tr: |
        Belirli bir tablodaki tüm sütun adlarını ve ilişkili veri türlerini belirleyin.
        Bu komutun çalışması için hem veritabanı adı (-D) hem tablo adı (-T) verilmelidir.
        Bu, 'email', 'password_hash' veya 'ssn' gibi hassas alanları bulmanızı sağlar.
        Sütun yapısını anlamak, tablodaki gerçek kayıtları dökmeden önceki zorunlu ön koşuldur.
    command: "ghauri -u {{url}} -D {{db_name}} -T {{table_name}} --columns --batch"

  # === EXPLOITATION & DATA EXTRACTION ===
  - title:
      en: ghauri - dump table data
      tr: ghauri - tablo verisini dökme
    desc:
      en: |
        Extract and display the actual entries from a specific database table.
        This is the final stage of the exploitation where you actually retrieve the data you were looking for.
        You can use --start and --stop flags to limit the number of rows retrieved if the table is exceptionally large.
        The tool will format the output clearly, and the data is typically saved to a local session file for future analysis.
      tr: |
        Belirli bir veritabanı tablosundaki gerçek girdileri çıkarıp görüntüleyin.
        Bu, aradığınız veriyi gerçekten aldığınız sömürünün son aşamasıdır.
        Tablo olağanüstü büyükse alınan satır sayısını sınırlamak için --start ve --stop bayraklarını kullanabilirsiniz.
        Araç çıktıyı anlaşılır biçimlendirir ve veri genellikle ileri analiz için yerel bir oturum dosyasına kaydedilir.
    command: "ghauri -u {{url}} -D {{db_name}} -T {{table_name}} --dump --batch"

  - title:
      en: ghauri - get banner and current user
      tr: ghauri - başlık ve mevcut kullanıcı bilgisi alma
    desc:
      en: |
        Retrieve the DBMS version banner, the current database name, and the current user identity.
        The banner provides critical information about the database software, which might have specific known vulnerabilities.
        Checking the current user helps determine if the application is running with high privileges (like 'sa' or 'root').
        This information is essential for determining the full impact of the SQL injection vulnerability.
      tr: |
        VTYS sürüm başlığını (banner), mevcut veritabanı adını ve mevcut kullanıcı kimliğini alın.
        Başlık, belirli bilinen zafiyetleri olabilecek veritabanı yazılımı hakkında kritik bilgi sağlar.
        Mevcut kullanıcıyı denetlemek, uygulamanın yüksek yetkilerle ('sa' veya 'root' gibi) çalışıp çalışmadığını belirlemeye yardımcı olur.
        Bu bilgi, SQL enjeksiyon zafiyetinin tam etkisini belirlemek için gereklidir.
    command: "ghauri -u {{url}} --banner --current-user --current-db --batch"

  - title:
      en: ghauri - interactive sql shell
      tr: ghauri - etkileşimli SQL kabuğu
    desc:
      en: |
        Launch an interactive SQL shell to execute custom SQL queries directly against the target database.
        This feature provides maximum flexibility for advanced testers who need to perform manual queries or custom functions.
        The availability of this shell depends on the success of the initial injection and the techniques supported by the server.
        It is an excellent way to verify complex logic or perform tasks that aren't covered by the automated enumeration flags.
      tr: |
        Hedef veritabanına karşı doğrudan özel SQL sorguları çalıştırmak için etkileşimli bir SQL kabuğu başlatın.
        Bu özellik, elle sorgu veya özel işlev yapması gereken ileri düzey testçilere en fazla esnekliği sağlar.
        Bu kabuğun kullanılabilirliği ilk enjeksiyonun başarısına ve sunucunun desteklediği tekniklere bağlıdır.
        Karmaşık mantığı doğrulamanın veya otomatik numaralandırma bayraklarının kapsamadığı işleri yapmanın mükemmel bir yoludur.
    command: "ghauri -u {{url}} --sql-shell"

  # === MAINTENANCE ===
  - title:
      en: ghauri - flush session and fresh scan
      tr: ghauri - oturumu temizleme ve yeni tarama
    desc:
      en: |
        Clear the session files for the current target and force a fresh scan of the vulnerability.
        Use this when the target's environment has changed or if you suspect the previous results were inaccurate.
        Flushing the session ensures that ghauri does not use cached results from previous runs.
        This is also helpful if the tool is stuck or behaving unexpectedly due to corrupted session data.
      tr: |
        Mevcut hedefin oturum dosyalarını temizleyin ve zafiyetin yeni bir taramasını dayatın.
        Hedefin ortamı değiştiğinde veya önceki sonuçların hatalı olduğundan şüphelendiğinizde kullanın.
        Oturumu temizlemek, ghauri'nin önceki çalıştırmalardan önbelleğe alınmış sonuçları kullanmamasını sağlar.
        Araç bozuk oturum verisi nedeniyle takıldıysa veya beklenmedik davranıyorsa da yararlıdır.
    command: "ghauri -u {{url}} --flush-session --fresh-queries"
