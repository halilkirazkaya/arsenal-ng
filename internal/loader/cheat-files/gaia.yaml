tool: gaia
tags: [recon, web, urls, parameters, automation, discovery]

actions:
  # === BASIC USAGE ===
  - title:
      en: gaia - quick crawl with defaults
      tr: gaia - varsayılanlarla hızlı tarama
    desc:
      en: |
        Run Gaia against a single target URL using all default collectors (gau, arjun, linkfinder, uro, and AI reasoning).
        This is a fast way to enumerate endpoints, parameters, and interesting assets for a new target.
      tr: |
        Tüm varsayılan toplayıcıları (gau, arjun, linkfinder, uro ve yapay zeka muhakemesi) kullanarak tek bir hedef URL'ye karşı Gaia çalıştırın.
        Yeni bir hedef için uç noktaları, parametreleri ve ilginç varlıkları numaralandırmanın hızlı bir yoludur.
    command: "gaia --url {{url}}"

  - title:
      en: gaia - process urls from stdin
      tr: gaia - stdin'den URL işleme
    desc:
      en: |
        Feed Gaia with multiple URLs from a file or pipeline.
        Useful when chaining recon tools or reprocessing historical URL lists.
      tr: |
        Gaia'ya bir dosyadan veya hattan (pipeline) birden çok URL besleyin.
        Keşif araçlarını zincirlerken veya geçmiş URL listelerini yeniden işlerken kullanışlıdır.
    command: "cat {{urls_file}} | gaia --stdin"

  # === FOCUS & SPEED ===
  - title:
      en: gaia - parameters only without heavy collectors
      tr: gaia - ağır toplayıcılar olmadan yalnızca parametreler
    desc:
      en: |
        Focus on parameterized endpoints and skip historical URL gathering and JS discovery to reduce noise and runtime.
        Disables gau, arjun, and linkfinder while keeping normalization enabled.
      tr: |
        Gürültüyü ve çalışma süresini azaltmak için parametreli uç noktalara odaklanın; geçmiş URL toplama ve JS keşfini atlayın.
        Normalleştirmeyi etkin tutarken gau, arjun ve linkfinder'ı kapatır.
    command: "gaia --url {{url}} --only-params --no-gau --no-arjun --no-linkfinder"

  - title:
      en: gaia - show static assets and normalize urls
      tr: gaia - statik varlıkları gösterme ve URL normalleştirme
    desc:
      en: |
        Include static assets like JS, CSS, and images in the results while keeping normalized URL output.
        Handy for mapping external dependencies or spotting exposed asset paths.
      tr: |
        Normalleştirilmiş URL çıktısını korurken JS, CSS ve görseller gibi statik varlıkları sonuçlara dahil edin.
        Harici bağımlılıkları haritalamak veya açığa çıkmış varlık yollarını fark etmek için pratiktir.
    command: "gaia --url {{url}} --show-assets"

  # === OUTPUT CONTROL ===
  - title:
      en: gaia - limit results and auto-install deps
      tr: gaia - sonuçları sınırlama ve bağımlılıkları otomatik kurma
    desc:
      en: |
        Cap the number of collected URLs and let Gaia install any missing helper tools automatically.
        Helps prevent runaway output while keeping the toolchain ready.
      tr: |
        Toplanan URL sayısını sınırlayın ve eksik yardımcı araçları Gaia'nın otomatik kurmasına izin verin.
        Araç zincirini hazır tutarken kontrolden çıkan çıktıyı önlemeye yardımcı olur.
    command: "gaia --url {{url}} --max-urls {{max_urls|500}} --auto-install"

  - title:
      en: gaia - structured report to file
      tr: gaia - dosyaya yapısal rapor
    desc:
      en: |
        Export findings to a chosen format (console, md, or json) and save them to disk for later review.
        Combine with other filters to build reproducible recon reports.
      tr: |
        Bulguları seçilen bir biçime (konsol, md veya json) aktarıp sonradan inceleme için diske kaydedin.
        Yinelenebilir keşif raporları oluşturmak için başka filtrelerle birleştirin.
    command: "gaia --url {{url}} --format {{format|json}} --output {{output|gaia-report.json}}"

  - title:
      en: gaia - disable ai reasoning for strict results
      tr: gaia - katı sonuçlar için yapay zeka muhakemesini kapatma
    desc:
      en: |
        Turn off Gaia's AI reasoning layer when you need deterministic, tool-only output.
        Keeps historical URL collection, parameter discovery, and JS parsing enabled.
      tr: |
        Deterministik, yalnızca araç çıktısı gerektiğinde Gaia'nın yapay zeka muhakeme katmanını kapatın.
        Geçmiş URL toplama, parametre keşfi ve JS ayrıştırmayı etkin tutar.
    command: "gaia --url {{url}} --no-ai"
