tool: impacket-sniffer
tags: [network, sniffer, security, pentest, traffic-analysis, credentials, impacket]

actions:
  # === BASIC USAGE ===
  - title:
      en: impacket-sniffer - live interface sniffing
      tr: impacket-sniffer - canlı arayüz dinleme
    desc:
      en: |
        Captures and decodes network packets on a specified network interface in real-time. 
        This is the primary way to monitor local network traffic for sensitive protocol communications like SMB, LDAP, and MSSQL. 
        It is highly effective for identifying plaintext credentials or NTLM hashes being transmitted across the segment. 
        Requires root or administrative privileges to put the network interface into promiscuous mode.
      tr: |
        Belirtilen bir ağ arayüzündeki ağ paketlerini gerçek zamanlı olarak yakalar ve çözer.
        SMB, LDAP ve MSSQL gibi hassas protokol iletişimleri için yerel ağ trafiğini izlemenin birincil yoludur.
        Kesim boyunca iletilen açık kimlik bilgilerini veya NTLM hash'lerini tespit etmede oldukça etkilidir.
        Ağ arayüzünü karışık (promiscuous) kibe almak için root veya yönetici ayrıcalıkları gerektirir.
    command: "impacket-sniffer -i {{interface|eth0}}"

  - title:
      en: impacket-sniffer - verbose packet analysis
      tr: impacket-sniffer - ayrıntılı paket analizi
    desc:
      en: |
        Enables verbose output mode to provide more granular details about the captured packets. 
        This mode displays additional protocol headers and negotiation flags that are typically hidden in the default view. 
        It is particularly useful for troubleshooting connection issues or performing deep dive security audits of network traffic. 
        Use this when the standard output does not provide enough context for a specific protocol exchange.
      tr: |
        Yakalanan paketler hakkında daha ayrıntılı bilgi sağlamak için ayrıntılı çıktı kipini etkinleştirir.
        Bu kip, varsayılan görünümde genellikle gizli olan ek protokol başlıklarını ve anlaşma bayraklarını gösterir.
        Bağlantı sorunlarını gidermek veya ağ trafiğinde derinlemesine güvenlik denetimleri yapmak için özellikle faydalıdır.
        Standart çıktı belirli bir protokol alışverişi için yeterli bağlam sunmadığında bunu kullanın.
    command: "impacket-sniffer -i {{interface|eth0}} -v"

  # === FILTERING AND FORMATTING ===
  - title:
      en: impacket-sniffer - protocol specific filtering
      tr: impacket-sniffer - protokole özgü filtreleme
    desc:
      en: |
        Filters the sniffer output to only display traffic associated with a specific protocol. 
        This helps reduce noise in busy network environments, allowing the user to focus on high-value targets like SMB or database traffic. 
        Commonly used protocol filters include SMB, MSSQL, MYSQL, and LDAP. 
        This is essential during penetration tests when you are looking for specific lateral movement or authentication attempts.
      tr: |
        Dinleyici çıktısını yalnızca belirli bir protokolle ilişkili trafiği gösterecek şekilde filtreler.
        Yoğun ağ ortamlarında gürültüyü azaltmaya yardımcı olarak kullanıcının SMB veya veritabanı trafiği gibi yüksek değerli hedeflere odaklanmasını sağlar.
        Yaygın kullanılan protokol filtreleri arasında SMB, MSSQL, MYSQL ve LDAP bulunur.
        Belirli yatay hareket veya kimlik doğrulama denemelerini aradığınız sızma testleri sırasında gereklidir.
    command: "impacket-sniffer -i {{interface|eth0}} -p {{protocol|SMB}}"

  - title:
      en: impacket-sniffer - hex and ascii dumping
      tr: impacket-sniffer - hex ve ASCII dökümü
    desc:
      en: |
        Displays the raw hex and ASCII representation of every packet captured on the wire. 
        This is critical for analyzing custom or unknown protocols that the tool might not have a built-in decoder for. 
        It allows the researcher to manually inspect packet payloads for sensitive data or exploit patterns. 
        Be aware that this produces a large amount of output, which can be difficult to read in high-traffic scenarios.
      tr: |
        Kabloda yakalanan her paketin ham hex ve ASCII gösterimini görüntüler.
        Aracın yerleşik çözücüsüne sahip olmayabileceği özel veya bilinmeyen protokolleri analiz etmek için kritik öneme sahiptir.
        Araştırmacının hassas veri veya istismar kalıpları için paket yüklerini elle incelemesine olanak tanır.
        Bunun büyük miktarda çıktı ürettiğini ve yoğun trafik senaryolarında okunmasının zor olabileceğini unutmayın.
    command: "impacket-sniffer -i {{interface|eth0}} -e"

  # === FILE OPERATIONS ===
  - title:
      en: impacket-sniffer - read from pcap file
      tr: impacket-sniffer - PCAP dosyasından okuma
    desc:
      en: |
        Analyzes and decodes network traffic from a previously saved PCAP file instead of a live interface. 
        This is ideal for offline forensic analysis or when you have captured traffic from a remote system using tools like tcpdump. 
        The tool will apply its protocol decoders to the file content, highlighting credentials and session info. 
        It allows for repeatable analysis without needing to stay connected to the target network.
      tr: |
        Canlı arayüz yerine önceden kaydedilmiş bir PCAP dosyasındaki ağ trafiğini analiz eder ve çözer.
        Çevrimdışı adli analiz için veya tcpdump gibi araçlarla uzak bir sistemden trafik yakaladığınızda idealdir.
        Araç, kimlik bilgilerini ve oturum bilgilerini vurgulayarak dosya içeriğine protokol çözücülerini uygular.
        Hedef ağa bağlı kalmaya gerek olmadan tekrarlanabilir analize olanak tanır.
    command: "impacket-sniffer -f {{pcap_file}}"

  - title:
      en: impacket-sniffer - write capture to file
      tr: impacket-sniffer - yakalamayı dosyaya yazma
    desc:
      en: |
        Saves the captured live network traffic directly into a PCAP file for future inspection. 
        This allows you to use the tool's live decoding features while simultaneously creating a permanent record for Wireshark analysis. 
        It is a best practice during engagements to keep logs of the traffic you have monitored for reporting purposes. 
        Ensure the destination directory has enough disk space to handle potentially large capture files.
      tr: |
        Yakalanan canlı ağ trafiğini ileride incelemek üzere doğrudan bir PCAP dosyasına kaydeder.
        Wireshark analizi için kalıcı bir kayıt oluştururken aracın canlı çözümleme özelliklerini kullanmanıza olanak tanır.
        Testler sırasında izlediğiniz trafiğin günlüklerini raporlama amacıyla saklamak en iyi uygulamadır.
        Hedef dizinin olası büyük yakalama dosyaları için yeterli disk alanına sahip olduğundan emin olun.
    command: "impacket-sniffer -i {{interface|eth0}} -w {{output_file|capture.pcap}}"

  # === ADVANCED SCENARIOS ===
  - title:
      en: impacket-sniffer - filtered pcap analysis
      tr: impacket-sniffer - filtreli PCAP analizi
    desc:
      en: |
        Combines file reading and protocol filtering to analyze specific traffic within a large capture file. 
        This speeds up the analysis process significantly by ignoring irrelevant packets in the trace. 
        It is the most efficient way to extract credentials from a long-running packet capture session. 
        Useful for security operations centers (SOC) when investigating a specific alert from a recorded timeframe.
      tr: |
        Büyük bir yakalama dosyası içindeki belirli trafiği analiz etmek için dosya okumayı ve protokol filtrelemeyi birleştirir.
        İzdeki ilgisiz paketleri yok sayarak analiz sürecini önemli ölçüde hızlandırır.
        Uzun süren bir paket yakalama oturumundan kimlik bilgisi çıkarmanın en verimli yoludur.
        Kaydedilmiş bir zaman dilimindeki belirli bir uyarıyı incelerken güvenlik operasyon merkezleri (SOC) için faydalıdır.
    command: "impacket-sniffer -f {{pcap_file}} -p {{protocol|MSSQL}}"
