tool: impacket-mssqlclient
tags: [database, mssql, pentest, exploitation, enumeration, authentication, impacket]

actions:
  # === AUTHENTICATION METHODS ===
  - title:
      en: impacket-mssqlclient - basic authentication with password
      tr: impacket-mssqlclient - parolayla temel kimlik doğrulama
    desc:
      en: |
        Establishes a connection to the MSSQL server using standard username and password credentials.
        This is the most common method for interacting with a database instance after discovering valid credentials.
        Be cautious of account lockout policies when attempting multiple password variations, as MSSQL can be configured to lock domain accounts.
        The target format follows the standard Impacket syntax: domain/username:password@address.
      tr: |
        Standart kullanıcı adı ve parola kimlik bilgileriyle MSSQL sunucusuna bağlantı kurar.
        Geçerli kimlik bilgileri keşfedildikten sonra veritabanı örneğiyle etkileşimin en yaygın yöntemidir.
        MSSQL etki alanı hesaplarını kilitleyebilecek şekilde yapılandırılabildiğinden çoklu parola denemelerinde hesap kilitleme ilkelerine dikkat edin.
        Hedef biçimi standart Impacket sözdizimini izler: etki-alanı/kullanıcı-adı:parola@adres.
    command: "impacket-mssqlclient {{domain|}}/{{username}}:{{password}}@{{target_ip}}"

  - title:
      en: impacket-mssqlclient - authentication using NTLM hashes
      tr: impacket-mssqlclient - NTLM hash'leriyle kimlik doğrulama
    desc:
      en: |
        Performs authentication using the Pass-the-Hash technique by providing LM and NT hashes.
        This is extremely useful during post-exploitation when cleartext passwords are unavailable but hashes have been dumped from SAM or LSASS.
        The tool bypasses the need for the actual password to establish a valid TDS session.
        Ensure the hash is provided in the format LMHASH:NTHASH (use 32 zeros for the LM portion if unknown).
      tr: |
        LM ve NT hash'leri vererek Pass-the-Hash tekniğiyle kimlik doğrulaması yapar.
        Açık parolalar yokken ancak hash'ler SAM veya LSASS'tan döküldüğünde sızma sonrası için son derece kullanışlıdır.
        Araç, geçerli bir TDS oturumu kurmak için gerçek parolaya ihtiyacı ortadan kaldırır.
        Hash'in LMHASH:NTHASH biçiminde verildiğinden emin olun (LM bilinmiyorsa 32 sıfır kullanın).
    command: "impacket-mssqlclient {{domain|}}/{{username}}@{{target_ip}} -hashes {{lmhash|00000000000000000000000000000000}}:{{nthash}}"

  - title:
      en: impacket-mssqlclient - connect using windows authentication
      tr: impacket-mssqlclient - Windows kimlik doğrulamasıyla bağlanma
    desc:
      en: |
        Forces the client to use Windows Authentication (NTLM/Kerberos integrated security) instead of SQL Server's internal authentication.
        In many corporate environments, SQL servers are configured to only allow logins via Active Directory accounts.
        This flag is necessary when the target user is a domain account that does not have a separate SQL-specific password.
        It changes the underlying TDS login packet to request an integrated security handshake.
      tr: |
        İstemciyi SQL Server'ın iç kimlik doğrulaması yerine Windows Kimlik Doğrulaması (NTLM/Kerberos bütünleşik güvenlik) kullanmaya zorlar.
        Birçok kurumsal ortamda SQL sunucuları yalnızca Active Directory hesaplarıyla girişe izin verecek şekilde yapılandırılır.
        Hedef kullanıcı ayrı bir SQL parolası olmayan bir etki alanı hesabıysa bu bayrak gereklidir.
        Temel TDS giriş paketini bütünleşik güvenlik el sıkışması isteyecek şekilde değiştirir.
    command: "impacket-mssqlclient {{domain|}}/{{username}}:{{password}}@{{target_ip}} -windows-auth"

  - title:
      en: impacket-mssqlclient - connect using kerberos authentication
      tr: impacket-mssqlclient - Kerberos kimlik doğrulamasıyla bağlanma
    desc:
      en: |
        Utilizes Kerberos tickets for authentication, which is ideal for bypassing NTLM-restricted environments.
        The command typically requires a valid TGT (Ticket Granting Ticket) to be present in the cache (KRB5CCNAME).
        Using the -no-pass flag ensures the tool attempts to use the existing ticket rather than asking for a password.
        Ensure that the target name provided matches the Service Principal Name (SPN) registered in Active Directory.
      tr: |
        NTLM kısıtlı ortamları atlatmak için ideal Kerberos biletleriyle kimlik doğrulaması yapar.
        Komut genellikle önbellekte (KRB5CCNAME) geçerli bir TGT (Bilet Veren Bilet) gerektirir.
        -no-pass bayrağı, aracın parola sormak yerine mevcut bileti kullanmaya çalışmasını sağlar.
        Sağlanan hedef adının Active Directory'de kayıtlı Hizmet Asıl Adıyla (SPN) eşleştiğinden emin olun.
    command: "impacket-mssqlclient -k -no-pass {{target_name}}"

  # === COMMAND EXECUTION ===
  - title:
      en: impacket-mssqlclient - execute single SQL command
      tr: impacket-mssqlclient - tek SQL komutu çalıştırma
    desc:
      en: |
        Executes a specific SQL query or statement directly from the command line without entering the interactive shell.
        This is highly effective for automation, scripting, or quickly verifying permissions like 'sysadmin' status.
        It returns the result of the query directly to the terminal and exits.
        You can use this to execute common reconnaissance queries like 'SELECT @@version' or 'SELECT is_srvrolemember(\'sysadmin\')'.
      tr: |
        Etkileşimli kabuğa girmeden komut satırından doğrudan belirli bir SQL sorgusu veya ifadesi çalıştırır.
        Otomasyon, betikleme veya 'sysadmin' durumu gibi yetkileri hızlıca doğrulamak için oldukça etkilidir.
        Sorgunun sonucunu doğrudan terminale döndürür ve çıkar.
        'SELECT @@version' veya "SELECT is_srvrolemember('sysadmin')" gibi yaygın keşif sorguları için kullanabilirsiniz.
    command: "impacket-mssqlclient {{domain|}}/{{username}}:{{password}}@{{target_ip}} -command \"{{sql_query|SELECT @@version}}\""

  - title:
      en: impacket-mssqlclient - execute SQL commands from a file
      tr: impacket-mssqlclient - dosyadan SQL komutları çalıştırma
    desc:
      en: |
        Reads and executes a sequence of SQL commands stored in a local text file.
        This is the preferred method for complex operations, such as creating multiple procedures or running heavy data exfiltration scripts.
        It prevents manual typing errors and allows for repeatable exploitation steps across different targets.
        The tool will process each line in the file as a sequential command to the SQL server.
      tr: |
        Yerel bir metin dosyasında saklanan SQL komut dizisini okur ve çalıştırır.
        Birden çok yordam oluşturma veya ağır veri sızdırma betikleri gibi karmaşık işlemler için tercih edilen yöntemdir.
        Elle yazım hatalarını önler ve farklı hedeflerde tekrarlanabilir sömürü adımlarına olanak tanır.
        Araç, dosyadaki her satırı SQL sunucusuna sıralı komut olarak işler.
    command: "impacket-mssqlclient {{domain|}}/{{username}}:{{password}}@{{target_ip}} -file {{script_path}}"

  # === CONNECTION SETTINGS ===
  - title:
      en: impacket-mssqlclient - connect to non-standard port and specific database
      tr: impacket-mssqlclient - özel porta ve belirli veritabanına bağlanma
    desc:
      en: |
        Connects to an MSSQL instance listening on a custom port and immediately switches to a specific database context.
        While 1433 is the default, administrators often change the port for security through obscurity or to host multiple instances.
        Specifying the -db flag is useful if your user only has permissions on a specific database and not the master.
        This saves time by avoiding manual 'USE database_name' commands inside the shell.
      tr: |
        Özel bir portta dinleyen MSSQL örneğine bağlanır ve hemen belirli bir veritabanı bağlamına geçer.
        1433 varsayılan olsa da yöneticiler gizlilik için veya birden çok örnek barındırmak için portu sıkça değiştirir.
        Kullanıcınız yalnızca belirli bir veritabanında yetkili olup master'da değilse -db bayrağı kullanışlıdır.
        Bu, kabuk içinde elle 'USE veritabanı_adı' yazmaya gerek bırakmayarak zaman kazandırır.
    command: "impacket-mssqlclient {{domain|}}/{{username}}:{{password}}@{{target_ip}} -port {{port|1433}} -db {{database_name}}"

  - title:
      en: impacket-mssqlclient - specify target IP with NetBIOS name
      tr: impacket-mssqlclient - NetBIOS adıyla hedef IP belirtme
    desc:
      en: |
        Allows the user to provide a hostname for the target while explicitly defining the IP address to connect to.
        This is particularly useful in environments where DNS is unreliable or when attacking a specific IP that hosts a named instance.
        The target name is used for authentication headers (important for Kerberos), while the target-ip is used for the network connection.
        It helps in scenarios where you need to bypass local host file requirements.
      tr: |
        Bağlanılacak IP adresini açıkça tanımlarken hedef için bir ana makine adı vermeye olanak tanır.
        DNS'in güvenilmez olduğu veya adlandırılmış bir örneği barındıran belirli bir IP'ye saldırılan ortamlarda özellikle kullanışlıdır.
        Hedef adı kimlik doğrulama başlıklarında (Kerberos için önemli), target-ip ise ağ bağlantısında kullanılır.
        Yerel hosts dosyası gereksinimlerini atlamanız gereken senaryolara yardımcı olur.
    command: "impacket-mssqlclient {{domain|}}/{{username}}:{{password}}@{{target_name}} -target-ip {{target_ip}}"

  # === ADVANCED / TROUBLESHOOTING ===
  - title:
      en: impacket-mssqlclient - enable debug mode and timestamps
      tr: impacket-mssqlclient - hata ayıklama modu ve zaman damgaları
    desc:
      en: |
        Enables verbose debugging output and adds timestamps to every log entry.
        This is essential for troubleshooting connection failures, authentication errors, or understanding the TDS protocol exchange.
        If a connection is being dropped, the debug output might reveal if it's a firewall issue or a protocol mismatch.
        Timestamps are helpful for correlate logs with network captures or server-side event logs.
      tr: |
        Ayrıntılı hata ayıklama çıktısını etkinleştirir ve her günlük girdisine zaman damgası ekler.
        Bağlantı hataları, kimlik doğrulama hatalarını gidermek veya TDS protokol alışverişini anlamak için esastır.
        Bağlantı kopuyorsa hata ayıklama çıktısı bunun güvenlik duvarı mı protokol uyumsuzluğu mu olduğunu ortaya çıkarabilir.
        Zaman damgaları günlükleri ağ yakalamaları veya sunucu tarafı olay günlükleriyle ilişkilendirmeye yardımcı olur.
    command: "impacket-mssqlclient {{domain|}}/{{username}}:{{password}}@{{target_ip}} -debug -ts"

  - title:
      en: impacket-mssqlclient - show SQL queries being executed
      tr: impacket-mssqlclient - çalıştırılan SQL sorgularını gösterme
    desc:
      en: |
        Displays the exact SQL queries being sent over the wire during the session.
        This is a great educational tool and a way to verify exactly what the Impacket library is doing in the background.
        It is specifically helpful when running complex commands through the interactive shell.
        Use this to ensure that sensitive queries are formatted correctly before they reach the server.
      tr: |
        Oturum sırasında ağ üzerinden gönderilen SQL sorgularının tam metnini görüntüler.
        Impacket kütüphanesinin arka planda tam olarak ne yaptığını doğrulamanın harika bir eğitim aracı ve yoludur.
        Etkileşimli kabuk üzerinden karmaşık komutlar çalıştırırken özellikle yararlıdır.
        Hassas sorguların sunucuya ulaşmadan önce doğru biçimlendiğinden emin olmak için kullanın.
    command: "impacket-mssqlclient {{domain|}}/{{username}}:{{password}}@{{target_ip}} -show"