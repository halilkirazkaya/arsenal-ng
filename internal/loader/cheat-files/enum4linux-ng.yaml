tool: enum4linux-ng
tags: [network, windows, smb, enumeration, pentest, active-directory, security]

# === BASIC ENUMERATION ===

actions:
  - title:
      en: enum4linux-ng - full enumeration
      tr: enum4linux-ng - tam numaralandırma
    desc:
      en: |
        Perform all simple enumeration checks against the target host. 
        This is the most common starting point which combines user, group, share, password policy, OS, and NetBIOS lookups.
        It is equivalent to running multiple individual flags like -U, -G, -S, and -P simultaneously.
      tr: |
        Hedef hosta karşı tüm basit numaralandırma denetimlerini gerçekleştirin.
        Kullanıcı, grup, paylaşım, parola ilkesi, işletim sistemi ve NetBIOS sorgularını birleştiren en yaygın başlangıç noktasıdır.
        -U, -G, -S ve -P gibi birden çok bayrağı aynı anda çalıştırmaya eşdeğerdir.
    command: "enum4linux-ng -A {{target}}"

  - title:
      en: enum4linux-ng - short enumeration
      tr: enum4linux-ng - kısa numaralandırma
    desc:
      en: |
        Perform a quick enumeration scan without NetBIOS name lookups. 
        This is useful when you want to speed up the reconnaissance process or when NetBIOS is restricted.
        It still covers users, groups, shares, and OS information but skips the noisier nmblookup phase.
      tr: |
        NetBIOS isim sorguları olmadan hızlı bir numaralandırma taraması yapın.
        Keşif işlemini hızlandırmak istediğinizde veya NetBIOS kısıtlıyken kullanışlıdır.
        Gürültülü nmblookup aşamasını atlar ancak kullanıcı, grup, paylaşım ve işletim sistemi bilgilerini kapsar.
    command: "enum4linux-ng -As {{target}}"

# === USER AND GROUP ENUMERATION ===

  - title:
      en: enum4linux-ng - enumerate users via RPC
      tr: enum4linux-ng - RPC ile kullanıcı numaralandırma
    desc:
      en: |
        Retrieve a list of users from the target system using RPC calls. 
        This command is highly effective if the target allows anonymous null sessions or if valid credentials are provided.
        It attempts to query the SAM (Security Accounts Manager) database directly via the network.
      tr: |
        RPC çağrılarıyla hedef sistemden kullanıcı listesini alın.
        Hedef anonim boş oturumlara izin veriyorsa veya geçerli kimlik bilgileri sağlanmışsa bu komut oldukça etkilidir.
        SAM (Güvenlik Hesapları Yöneticisi) veritabanını doğrudan ağ üzerinden sorgulamaya çalışır.
    command: "enum4linux-ng -U {{target}}"

  - title:
      en: enum4linux-ng - enumerate groups with members
      tr: enum4linux-ng - üyeleriyle grup numaralandırma
    desc:
      en: |
        Extract all domain or local groups along with their respective members.
        Using the -Gm flag provides a more detailed view than the standard group listing.
        This is essential for identifying high-privilege accounts like Domain Admins or Enterprise Admins.
      tr: |
        Tüm etki alanı veya yerel grupları üyeleriyle birlikte çıkarın.
        -Gm bayrağı standart grup listelemeden daha ayrıntılı bir görünüm sağlar.
        Domain Admins veya Enterprise Admins gibi yüksek yetkili hesapları tespit etmek için gereklidir.
    command: "enum4linux-ng -Gm {{target}}"

  - title:
      en: enum4linux-ng - detailed user/group info
      tr: enum4linux-ng - ayrıntılı kullanıcı/grup bilgisi
    desc:
      en: |
        Get comprehensive details for all discovered users and groups.
        This flag adds verbosity to the user and group enumeration results, providing extra attributes if available.
        Use this when you need more than just a list of names, such as account descriptions or last logon times.
      tr: |
        Keşfedilen tüm kullanıcı ve gruplar için kapsamlı ayrıntıları alın.
        Bu bayrak, kullanıcı ve grup numaralandırma sonuçlarına ayrıntı katar ve varsa ek öznitelikler sunar.
        Hesap açıklamaları veya son oturum açma zamanları gibi isim listesinden fazlası gerektiğinde kullanın.
    command: "enum4linux-ng -d -U -G {{target}}"

  - title:
      en: enum4linux-ng - RID cycling enumeration
      tr: enum4linux-ng - RID döngüsüyle numaralandırma
    desc:
      en: |
        Enumerate users by cycling through Relative Identifiers (RIDs).
        This technique is powerful because it can discover users even if the standard "enum users" RPC call is restricted.
        By default, it checks common RID ranges (500-550, 1000-1050), but you can specify custom ranges if needed.
      tr: |
        Göreli Tanımlayıcılar (RID) arasında döngü yaparak kullanıcıları numaralandırın.
        Standart "kullanıcıları listele" RPC çağrısı kısıtlı olsa bile kullanıcı keşfedebildiği için bu teknik güçlüdür.
        Varsayılan olarak yaygın RID aralıklarını (500-550, 1000-1050) denetler, gerekirse özel aralıklar belirtebilirsiniz.
    command: "enum4linux-ng -R {{target}}"

# === AUTHENTICATION METHODS ===

  - title:
      en: enum4linux-ng - authenticated scan
      tr: enum4linux-ng - kimlik doğrulamalı tarama
    desc:
      en: |
        Perform enumeration using specific user credentials.
        Authenticated scans provide much more data than anonymous sessions, often revealing hidden shares and full user attributes.
        Always ensure you have permission to use the credentials as failed attempts might trigger account lockout policies.
      tr: |
        Belirli kullanıcı kimlik bilgilerini kullanarak numaralandırma yapın.
        Kimlik doğrulamalı taramalar anonim oturumlardan çok daha fazla veri sağlar; gizli paylaşımları ve tam kullanıcı özniteliklerini ortaya çıkarır.
        Başarısız denemeler hesap kilitleme ilkelerini tetikleyebileceğinden kimlik bilgilerini kullanma izniniz olduğundan emin olun.
    command: "enum4linux-ng -A -u {{user|administrator}} -p {{password}} {{target}}"

  - title:
      en: enum4linux-ng - pass-the-hash authentication
      tr: enum4linux-ng - hash ile kimlik doğrulama (pass-the-hash)
    desc:
      en: |
        Authenticate to the target using an NTLM hash instead of a plaintext password.
        This is a classic post-exploitation technique used when you have extracted hashes but cannot crack them.
        The hash should be provided in the format LM:NT or just the NT hash.
      tr: |
        Hedefe düz metin parola yerine NTLM özeti (hash) ile kimlik doğrulayın.
        Özetleri ele geçirip kıramadığınız durumlarda kullanılan klasik bir sömürü sonrası tekniktir.
        Özet, LM:NT biçiminde veya yalnızca NT özeti olarak verilmelidir.
    command: "enum4linux-ng -A -u {{user|administrator}} -H {{nthash}} {{target}}"

  - title:
      en: enum4linux-ng - kerberos authentication
      tr: enum4linux-ng - kerberos kimlik doğrulaması
    desc:
      en: |
        Use a Kerberos ticket file for authentication against a Windows target.
        This is specifically useful in Active Directory environments where you have obtained a valid .kirbi or .ccache ticket.
        Note that DNS must be correctly configured so the tool can resolve the domain name and reach the KDC.
      tr: |
        Bir Windows hedefine karşı kimlik doğrulama için Kerberos bileti kullanın.
        Geçerli bir .kirbi veya .ccache bileti ele geçirdiğiniz Active Directory ortamlarında özellikle kullanışlıdır.
        Aracın alan adını çözümleyip KDC'ye ulaşabilmesi için DNS'in doğru yapılandırılmış olması gerektiğini unutmayın.
    command: "enum4linux-ng -A -K {{ticket_file}} {{target}}"

# === SHARES AND SERVICES ===

  - title:
      en: enum4linux-ng - list shares and services
      tr: enum4linux-ng - paylaşımları ve hizmetleri listeleme
    desc:
      en: |
        Specifically target the discovery of SMB shares and running services on the remote host.
        Identifying shares is critical for finding sensitive files or misconfigured permissions (e.g., anonymous write access).
        The service enumeration helps identify what roles the server is performing within the network.
      tr: |
        Özellikle uzak hosttaki SMB paylaşımlarının ve çalışan hizmetlerin keşfini hedefleyin.
        Paylaşımları tespit etmek, hassas dosyaları veya yanlış yapılandırılmış izinleri (örn. anonim yazma erişimi) bulmak için kritiktir.
        Hizmet numaralandırma, sunucunun ağ içinde hangi rolleri üstlendiğini belirlemeye yardımcı olur.
    command: "enum4linux-ng -S -C {{target}}"

  - title:
      en: enum4linux-ng - share brute forcing
      tr: enum4linux-ng - paylaşım kaba kuvvet saldırısı
    desc:
      en: |
        Attempt to discover hidden or non-standard shares using a wordlist.
        This is useful if the target has "RestrictAnonymous" enabled, preventing a standard share listing.
        You must provide a path to a text file containing potential share names.
      tr: |
        Bir wordlist kullanarak gizli veya standart dışı paylaşımları keşfetmeye çalışın.
        Hedefte "RestrictAnonymous" etkinse ve standart paylaşım listeleme engelleniyorsa kullanışlıdır.
        Olası paylaşım adlarını içeren bir metin dosyasının yolunu vermelisiniz.
    command: "enum4linux-ng -s {{shares_file|/usr/share/wordlists/dirb/common.txt}} {{target}}"

# === ADVANCED INFRASTRUCTURE ENUMERATION ===

  - title:
      en: enum4linux-ng - domain controller enumeration (LDAP)
      tr: enum4linux-ng - etki alanı denetleyicisi numaralandırma (LDAP)
    desc:
      en: |
        Retrieve additional domain information via LDAP or LDAPS protocols.
        This flag is primarily designed for use against Domain Controllers to extract AD-specific data.
        It provides a deeper look into the directory structure compared to standard SMB-only tools.
      tr: |
        LDAP veya LDAPS protokolleriyle ek etki alanı bilgisi alın.
        Bu bayrak özellikle Etki Alanı Denetleyicilerine karşı AD'ye özgü veri çıkarmak için tasarlanmıştır.
        Yalnızca SMB kullanan standart araçlara kıyasla dizin yapısına daha derin bakış sağlar.
    command: "enum4linux-ng -L {{target}}"

  - title:
      en: enum4linux-ng - password policy enumeration
      tr: enum4linux-ng - parola ilkesi numaralandırma
    desc:
      en: |
        Extract the password policy from the target machine.
        This reveals critical information like minimum password length, complexity requirements, and lockout thresholds.
        Knowing the lockout threshold is vital before attempting any password spraying or brute-force attacks.
      tr: |
        Hedef makineden parola ilkesini çıkarın.
        Minimum parola uzunluğu, karmaşıklık gereksinimleri ve kilitlenme eşikleri gibi kritik bilgileri ortaya çıkarır.
        Parola püskürtme veya kaba kuvvet saldırılarından önce kilitlenme eşiğini bilmek hayati önem taşır.
    command: "enum4linux-ng -P {{target}}"

# === OUTPUT AND LOGGING ===

  - title:
      en: enum4linux-ng - export results to files
      tr: enum4linux-ng - sonuçları dosyalara aktarma
    desc:
      en: |
        Save the enumeration results into both JSON and YAML formats for further analysis.
        This is one of the main advantages of the 'ng' version over the original enum4linux.pl script.
        These structured files can be easily parsed by other security tools or used for automated reporting.
      tr: |
        Numaralandırma sonuçlarını ileri analiz için hem JSON hem YAML biçiminde kaydedin.
        Bu, 'ng' sürümünün özgün enum4linux.pl betiğine karşı başlıca avantajlarından biridir.
        Bu yapısal dosyalar diğer güvenlik araçlarınca kolayca işlenebilir veya otomatik raporlama için kullanılabilir.
    command: "enum4linux-ng -A -oA {{output_filename|enum_results}} {{target}}"
