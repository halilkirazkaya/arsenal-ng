tool: hurl
tags: [encoding, decoding, pentest, hex, url, base64, hash, crypto]

actions:
# === URL / HTML / BASE64 ===
 - title:
     en: hurl - url encode
     tr: hurl - url kodlama
   desc:
     en: |
       URL-encodes a string, converting special characters to percent notation.
       Useful for crafting payloads for web injection or bypassing input filters.
     tr: |
       Dizeyi yüzde notasyonuna çevirerek URL-kodlar.
       Web enjeksiyonu yükleri hazırlamak veya girdi filtrelerini atlatmak için kullanışlıdır.
   command: "hURL -U {{string|hello world}}"

 - title:
     en: hurl - url decode
     tr: hurl - url kod çözme
   desc:
     en: |
       Decodes a percent-encoded URL string back to plain text.
       Standard step when analyzing captured requests or encoded payloads.
     tr: |
       Yüzde-kodlu URL dizesini düz metne çevirir.
       Yakalanan istekleri veya kodlanmış yükleri incelerken standart adımdır.
   command: "hURL -u {{encoded|hello%20world}}"

 - title:
     en: hurl - double url encode
     tr: hurl - çift url kodlama
   desc:
     en: |
       Encodes a string twice, turning % into %25.
       Handy for bypassing WAFs that decode input only once.
     tr: |
       Dizeyi iki kez kodlar; % ifadesi %25 olur.
       Girdiyi yalnızca bir kez çözen WAF'leri atlatmak için kullanışlıdır.
   command: "hURL -D {{string|hello world}}"

 - title:
     en: hurl - double url decode
     tr: hurl - çift url kod çözme
   desc:
     en: |
       Decodes a doubly-encoded URL string.
       Use when a payload was encoded twice or passed two filter layers.
     tr: |
       İki kez kodlanmış URL dizesini çözer.
       Yük iki katmandan geçtiğinde veya iki kez kodlandığında kullanılır.
   command: "hURL -d {{encoded|hello%2520world}}"

 - title:
     en: hurl - base64 encode
     tr: hurl - base64 kodlama
   desc:
     en: |
       Encodes a string to Base64.
       Common for building basic-auth headers or obfuscating payloads.
     tr: |
       Dizeyi Base64 formatına kodlar.
       Temel-auth başlıkları hazırlamak veya yükleri gizlemek için yaygındır.
   command: "hURL -B {{string|hello world}}"

 - title:
     en: hurl - base64 decode
     tr: hurl - base64 kod çözme
   desc:
     en: |
       Decodes a Base64 string back to plain text.
       First step when inspecting tokens, blobs, or encoded exfil data.
     tr: |
       Base64 dizeyi düz metne çevirir.
       Jeton, blob veya sızdırılan kodlanmış veriyi incelerken ilk adımdır.
   command: "hURL -b {{encoded|aGVsbG8gd29ybGQ=}}"

 - title:
     en: hurl - html encode
     tr: hurl - html kodlama
   desc:
     en: |
       Encodes a string into HTML entities.
       Useful for testing XSS filters and reflected output handling.
     tr: |
       Dizeyi HTML varlıklarına (entities) çevirir.
       XSS filtrelerini ve yansıyan çıktı işlemeyi test etmek için kullanışlıdır.
   command: "hURL -H {{string|<hello world>}}"

 - title:
     en: hurl - html decode
     tr: hurl - html kod çözme
   desc:
     en: |
       Decodes HTML entities back to plain characters.
       Use when analyzing stored or reflected XSS output.
     tr: |
       HTML varlıklarını düz karakterlere çevirir.
       Saklanan veya yansıyan XSS çıktısını analiz ederken kullanılır.
   command: "hURL -h {{encoded|&lt;hello world&gt;}}"

# === HEX / INT / BIN / OCT / FLOAT ===
 - title:
     en: hurl - ascii to hex
     tr: hurl - ascii'den hex'e
   desc:
     en: |
       Converts plain ASCII text to lowercase hex pairs.
       Standard for building shellcode buffers and exploit payloads.
     tr: |
       Düz ASCII metni küçük harfli hex çiftlerine çevirir.
       Shellcode tamponları ve exploit yükleri hazırlamada standarttır.
   command: "hURL -X {{string|hello world}}"

 - title:
     en: hurl - hex to ascii
     tr: hurl - hex'ten ascii'ye
   desc:
     en: |
       Converts hex pairs back to ASCII text.
       Use to decode hex dumps found in binaries or traffic.
     tr: |
       Hex çiftlerini ASCII metne çevirir.
       İkili dosya veya trafikteki hex dökümlerini çözmek için kullanılır.
   command: "hURL -x {{hex|68656c6c6f20776f726c64}}"

 - title:
     en: hurl - int to hex
     tr: hurl - int'ten hex'e
   desc:
     en: |
       Converts a decimal integer to hex.
       Handy for address/offset math during exploitation.
     tr: |
       Ondalık tamsayıyı hex'e çevirir.
       Sömürü sırasında adres/ofset hesaplarında kullanışlıdır.
   command: "hURL -I {{int|10}}"

 - title:
     en: hurl - hex to int
     tr: hurl - hex'ten int'e
   desc:
     en: |
       Converts a hex value to a decimal integer.
       Use for interpreting return addresses and offsets.
     tr: |
       Hex değeri ondalık tamsayıya çevirir.
       Dönüş adresleri ve ofsetleri yorumlamak için kullanılır.
   command: "hURL -i {{hex|0xa}}"

 - title:
     en: hurl - negative int to hex
     tr: hurl - negatif int'ten hex'e
   desc:
     en: |
       Converts a negative integer to its hex representation.
       Needed when working with signed offsets in exploits.
     tr: |
       Negatif tamsayıyı hex karşılığına çevirir.
       Exploitlerde işaretli ofsetlerle çalışırken gereklidir.
   command: "hURL -n -- {{negint|-77}}"

 - title:
     en: hurl - negative hex to int
     tr: hurl - negatif hex'ten int'e
   desc:
     en: |
       Converts a two's-complement hex value to a signed integer.
       Use to interpret negative offsets from crash dumps.
     tr: |
       İkinin tümleyeni hex değeri işaretli tamsayıya çevirir.
       Çökme dökümlerindeki negatif ofsetleri yorumlamak için kullanılır.
   command: "hURL -N {{hex|0xffffffb3}}"

 - title:
     en: hurl - int to binary
     tr: hurl - int'ten binary'e
   desc:
     en: |
       Converts a decimal integer to binary.
       Useful for bit-flag and permission analysis.
     tr: |
       Ondalık tamsayıyı ikili (binary) tabana çevirir.
       Bit bayrak ve izin analizinde kullanışlıdır.
   command: "hURL -T {{int|30}}"

 - title:
     en: hurl - binary to int
     tr: hurl - binary'den int'e
   desc:
     en: |
       Converts a binary string to a decimal integer.
       Use when decoding bitfields or flags.
     tr: |
       İkili dizeyi ondalık tamsayıya çevirir.
       Bit alanları veya bayrakları çözerken kullanılır.
   command: "hURL -t {{bin|1010}}"

 - title:
     en: hurl - float to hex
     tr: hurl - float'tan hex'e
   desc:
     en: |
       Converts a float to its IEEE-754 hex representation.
       Needed when patching or analyzing float values in binaries.
     tr: |
       Float değeri IEEE-754 hex karşılığına çevirir.
       İkili dosyalarda float değerleri yamalarken veya analiz ederken gereklidir.
   command: "hURL -F {{float|3.33}}"

 - title:
     en: hurl - hex to float
     tr: hurl - hex'ten float'a
   desc:
     en: |
       Converts IEEE-754 hex back to a float.
       Use to interpret raw float bytes from memory dumps.
     tr: |
       IEEE-754 hex'i float değere çevirir.
       Bellek dökümlerindeki ham float baytlarını yorumlamak için kullanılır.
   command: "hURL -l {{hex|0x40551ed8}}"

 - title:
     en: hurl - octal to hex
     tr: hurl - octal'den hex'e
   desc:
     en: |
       Converts an octal value to hex.
       Useful when dealing with Unix permission-style encodings.
     tr: |
       Sekizlik (octal) değeri hex'e çevirir.
       Unix izin tarzı kodlamalarla uğraşırken kullanışlıdır.
   command: "hURL -o {{octal|35}}"

 - title:
     en: hurl - hex to octal
     tr: hurl - hex'ten octal'e
   desc:
     en: |
       Converts a hex value to octal.
       Use for cross-base conversions during shellcode work.
     tr: |
       Hex değeri sekizlik tabana çevirir.
       Shellcode çalışmasında tabanlar arası dönüşüm için kullanılır.
   command: "hURL -O {{hex|0x12}}"

 - title:
     en: hurl - binary to hex
     tr: hurl - binary'den hex'e
   desc:
     en: |
       Converts a binary string to hex.
       Handy for compacting binary shellcode representations.
     tr: |
       İkili dizeyi hex'e çevirir.
       İkili shellcode temsillerini sıkıştırmak için kullanışlıdır.
   command: "hURL -0 {{bin|1100011}}"

 - title:
     en: hurl - hex to binary
     tr: hurl - hex'ten binary'e
   desc:
     en: |
       Converts a hex value to binary.
       Use to inspect individual bits of an address or flag.
     tr: |
       Hex değeri ikili tabana çevirir.
       Adres veya bayrağın tekil bitlerini incelemek için kullanılır.
   command: "hURL -1 {{hex|0x63}}"

# === HASHES / MISC ===
 - title:
     en: hurl - sha1 checksum
     tr: hurl - sha1 sağlama
   desc:
     en: |
       Computes the SHA1 digest of a string.
       Quick way to fingerprint payloads or verify integrity.
     tr: |
       Dizenin SHA1 özetini hesaplar.
       Yükleri parmak izlemek veya bütünlüğü doğrulamak için hızlı yoldur.
   command: "hURL -2 {{string|hello world}}"

 - title:
     en: hurl - sha224 checksum
     tr: hurl - sha224 sağlama
   desc:
     en: |
       Computes the SHA224 digest of a string.
       Less common variant; use when a target expects 224-bit digests.
     tr: |
       Dizenin SHA224 özetini hesaplar.
       Daha az yaygın varyant; hedef 224-bit özet beklediğinde kullanılır.
   command: "hURL -3 {{string|hello world}}"

 - title:
     en: hurl - sha256 checksum
     tr: hurl - sha256 sağlama
   desc:
     en: |
       Computes the SHA256 digest of a string.
       Standard for integrity checks and password hash comparison.
     tr: |
       Dizenin SHA256 özetini hesaplar.
       Bütünlük kontrolleri ve parola hash karşılaştırma için standarttır.
   command: "hURL -4 {{string|hello world}}"

 - title:
     en: hurl - sha384 checksum
     tr: hurl - sha384 sağlama
   desc:
     en: |
       Computes the SHA384 digest of a string.
       Use when a 384-bit digest is required by the target.
     tr: |
       Dizenin SHA384 özetini hesaplar.
       Hedef 384-bit özet gerektirdiğinde kullanılır.
   command: "hURL -5 {{string|hello world}}"

 - title:
     en: hurl - sha512 checksum
     tr: hurl - sha512 sağlama
   desc:
     en: |
       Computes the SHA512 digest of a string.
       Common in modern hash storage and verification flows.
     tr: |
       Dizenin SHA512 özetini hesaplar.
       Modern hash saklama ve doğrulama akışlarında yaygındır.
   command: "hURL -6 {{string|hello world}}"

 - title:
     en: hurl - md5 digest
     tr: hurl - md5 özeti
   desc:
     en: |
       Computes the MD5 digest of a string.
       Still widespread for quick checksums despite being cryptographically broken.
     tr: |
       Dizenin MD5 özetini hesaplar.
       Kriptografik olarak kırık olmasına rağmen hızlı sağlama kontrollerinde hâlâ yaygındır.
   command: "hURL -m {{string|hello world}}"

 - title:
     en: hurl - rot13 encode
     tr: hurl - rot13 kodlama
   desc:
     en: |
       Applies ROT13 to a string (symmetric: same op decodes).
       Trivial obfuscation for strings in payloads or CTFs.
     tr: |
       Dizeye ROT13 uygular (simetriktir; aynı işlem çözer).
       Yük veya CTF'lerde basit gizleme için kullanılır.
   command: "hURL -7 {{string|hello world}}"

 - title:
     en: hurl - stack push format (corelan)
     tr: hurl - yığın push formatı (corelan)
   desc:
     en: |
       Formats a string as a series of stack pushes for exploit dev.
       Output follows the Corelan tutorial style for direct use in exploits.
     tr: |
       Dizeyi exploit geliştirme için yığın push serisi olarak formatlar.
       Çıktı doğrudan exploitlerde kullanılmak üzere Corelan tarzını takip eder.
   command: "hURL -9 {{string|hello world}}"

 - title:
     en: hurl - int to hex network byte order
     tr: hurl - int'ten ağ bayt sıralı hex'e
   desc:
     en: |
       Converts an integer (e.g. a port) to hex in network byte order.
       Essential for building bind/reverse shellcode port values.
     tr: |
       Tamsayıyı (ör. port) ağ bayt sırasında hex'e çevirir.
       Bind/reverse shellcode port değerleri için gereklidir.
   command: "hURL -e {{int|4444}}"

 - title:
     en: hurl - hex network byte order to int
     tr: hurl - ağ bayt sıralı hex'ten int'e
   desc:
     en: |
       Converts network-byte-order hex back to an integer.
       Use to decode ports or values extracted from shellcode.
     tr: |
       Ağ bayt sıralı hex'i tamsayıya çevirir.
       Shellcode'dan çıkarılan port veya değerleri çözmek için kullanılır.
   command: "hURL -E {{hex|5c11}}"

 - title:
     en: hurl - hex file to binary file
     tr: hurl - hex dosyasından binary dosyaya
   desc:
     en: |
       Converts a hex dump file to a raw binary file.
       Use to reconstruct payloads or shellcode binaries from text.
     tr: |
       Hex döküm dosyasını ham binary dosyaya çevirir.
       Metin halindeki yük veya shellcode ikililerini yeniden oluşturmak için kullanılır.
   command: "hURL -w -f {{infile}} {{outfile}}"

 - title:
     en: hurl - binary file to hex (corelan)
     tr: hurl - binary dosyadan hex'e (corelan)
   desc:
     en: |
       Converts a binary file to hex in Corelan format.
       Standard step to embed binary payloads into exploits.
     tr: |
       Binary dosyayı Corelan formatında hex'e çevirir.
       Binary yükleri exploitlere gömmek için standart adımdır.
   command: "hURL -r -f {{binfile|/tmp/msgbox.bin}}"

 - title:
     en: hurl - menu gui
     tr: hurl - menü arayüzü
   desc:
     en: |
       Launches the interactive menu-driven interface.
       Easiest way to explore all conversions without memorizing flags.
     tr: |
       İnteraktif menü tabanlı arayüzü başlatır.
       Bayrakları ezberlemeden tüm dönüşümleri keşfetmenin en kolay yoludur.
   command: "hURL -M"
