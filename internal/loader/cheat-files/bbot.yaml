tool: bbot
tags: [recon, scanner, pentest, subdomain-enum, web-security, osint, automation]

actions:
  # === BASIC ENUMERATION ===
  - title:
      en: bbot - standard subdomain enumeration
      tr: bbot - standart alt alan adı numaralandırma
    desc:
      en: |
        Performs a full subdomain enumeration using the predefined subdomain-enum preset.
        This command combines multiple modules to identify as many subdomains as possible for the target.
        It is the most common starting point for infrastructure reconnaissance and attack surface mapping.
      tr: |
        Önceden tanımlı subdomain-enum önayarıyla tam alt alan adı numaralandırması yapar.
        Bu komut, hedef için olabildiğince çok alt alan adı belirlemek üzere birden çok modülü birleştirir.
        Altyapı keşfi ve saldırı yüzeyi haritalama için en yaygın başlangıç noktasıdır.
    command: "bbot -t {{target}} -p subdomain-enum"

  - title:
      en: bbot - passive subdomain enumeration
      tr: bbot - pasif alt alan adı numaralandırma
    desc:
      en: |
        Conducts subdomain discovery using only passive sources without interacting directly with the target.
        It filters modules to ensure no packets are sent to the target infrastructure by requiring the passive flag.
        Use this when stealth is a priority or when you want to avoid triggering security alerts.
      tr: |
        Hedefle doğrudan etkileşime girmeden yalnızca pasif kaynaklarla alt alan adı keşfi yapar.
        Pasif bayrağı gerektirerek hedef altyapıya paket gönderilmemesi için modülleri filtreler.
        Gizlilik öncelikli olduğunda veya güvenlik alarmlarını tetiklemekten kaçınmak istediğinizde kullanın.
    command: "bbot -t {{target}} -p subdomain-enum -rf passive"

  - title:
      en: bbot - comprehensive kitchen sink scan
      tr: bbot - kapsamlı kitchen-sink taraması
    desc:
      en: |
        Runs the "kitchen-sink" preset which includes subdomains, emails, cloud buckets, port scans, and nuclei.
        This is a very intensive scan that covers almost every aspect of the target's external presence.
        Be aware that this can generate significant traffic and may take a long time to complete.
      tr: |
        Alt alan adları, e-postalar, bulut kovaları, bağlantı noktası taramaları ve nuclei içeren "kitchen-sink" önayarını çalıştırır.
        Bu, hedefin dış varlığının neredeyse her yönünü kapsayan çok yoğun bir taramadır.
        Belirgin trafik üretebileceğini ve tamamlanmasının uzun sürebileceğini unutmayın.
    command: "bbot -t {{target}} -p kitchen-sink"

  # === WEB & SPIDER OPERATIONS ===
  - title:
      en: bbot - web spidering and crawling
      tr: bbot - web örümcekleme ve tarama
    desc:
      en: |
        Crawls the target URL recursively to extract emails, secrets, and other sensitive data.
        The spider distance and depth are configurable to control how far the crawler goes from the starting point.
        This is essential for identifying hidden paths and sensitive information within web applications.
      tr: |
        E-posta, gizli bilgi ve diğer hassas verileri çıkarmak için hedef URL'yi özyinelemeli tarar.
        Tarayıcının başlangıç noktasından ne kadar uzaklaşacağını denetlemek için örümcek mesafesi ve derinliği yapılandırılabilir.
        Bu, web uygulamalarındaki gizli yolları ve hassas bilgileri belirlemede gereklidir.
    command: "bbot -t {{url}} -p spider -c web.spider_distance={{distance|2}} web.spider_depth={{depth|2}}"

  - title:
      en: bbot - subdomain enum with screenshots
      tr: bbot - ekran görüntülü alt alan adı numaralandırma
    desc:
      en: |
        Discovers subdomains and automatically takes screenshots of any active web services found.
        It utilizes the gowitness module to capture the visual state of the web applications.
        This helps researchers quickly identify interesting targets or forgotten login pages.
      tr: |
        Alt alan adlarını keşfedip bulunan etkin web hizmetlerinin ekran görüntülerini otomatik alır.
        Web uygulamalarının görsel durumunu yakalamak için gowitness modülünü kullanır.
        Bu, araştırmacıların ilginç hedefleri veya unutulmuş giriş sayfalarını hızlı belirlemesine yardımcı olur.
    command: "bbot -t {{target}} -p subdomain-enum -m gowitness -n {{scan_name|screenshot_scan}} -o {{output_path|.}}"

  - title:
      en: bbot - basic non-intrusive web scan
      tr: bbot - temel saldırgan olmayan web taraması
    desc:
      en: |
        Runs the web-basic preset which includes wappalyzer, robots.txt, and other safe modules.
        This provides a quick overview of the web technology stack and public files without aggressive probing.
        It is ideal for initial profiling of a target web server's configuration and software.
      tr: |
        wappalyzer, robots.txt ve diğer güvenli modülleri içeren web-basic önayarını çalıştırır.
        Bu, saldırgan yoklama olmadan web teknoloji yığını ve herkese açık dosyalara hızlı genel bakış sağlar.
        Hedef web sunucusunun yapılandırma ve yazılımının ilk profillenmesi için idealdir.
    command: "bbot -t {{target}} -p subdomain-enum web-basic"

  # === SCOPE & TARGETING ===
  - title:
      en: bbot - scan with strict scope
      tr: bbot - katı kapsamla tarama
    desc:
      en: |
        Restricts the scan scope strictly to the provided target without including child subdomains.
        By default, BBOT includes subdomains; this flag prevents it from expanding outside the specific host.
        Use this when you are only authorized to test a single host and must avoid collateral discovery.
      tr: |
        Tarama kapsamını alt alt alan adlarını dahil etmeden verilen hedefle sıkı şekilde sınırlar.
        BBOT varsayılan olarak alt alan adlarını içerir; bu bayrak belirli host'un dışına genişlemesini engeller.
        Yalnızca tek bir host'u test etmeye yetkili olduğunuzda ve yan keşiften kaçınmanız gerektiğinde kullanın.
    command: "bbot -t {{target}} --strict-scope -p subdomain-enum"

  - title:
      en: bbot - scan with whitelist and blacklist
      tr: bbot - beyaz ve kara listeyle tarama
    desc:
      en: |
        Seeds a scan with a target but restricts active interactions to a specific whitelist.
        The blacklist parameter ensures that certain sensitive or out-of-scope assets are never touched.
        This provides granular control over the scan perimeter, which is critical for compliance and safety.
      tr: |
        Taramayı bir hedefle başlatır ancak etkin etkileşimleri belirli bir beyaz listeyle sınırlar.
        Kara liste parametresi, belirli hassas veya kapsam dışı varlıklara asla dokunulmamasını sağlar.
        Bu, tarama çevresi üzerinde uyumluluk ve güvenlik için kritik olan ayrıntılı denetim sağlar.
    command: "bbot -t {{target}} --whitelist {{whitelist_cidr}} --blacklist {{blacklist_domain}} -p kitchen-sink"

  - title:
      en: bbot - blacklist by regex pattern
      tr: bbot - regex kalıbıyla kara liste
    desc:
      en: |
        Prevents the scanner from interacting with any event or URL that matches a specific regular expression.
        This is commonly used to avoid logout links (e.g., RE:signout) or specific sensitive directories.
        The RE: prefix is required to tell BBOT to treat the string as a regular expression.
      tr: |
        Tarayıcının belirli bir düzenli ifadeyle eşleşen olay veya URL ile etkileşime girmesini engeller.
        Bu, çıkış bağlantılarından (ör. RE:signout) veya belirli hassas dizinlerden kaçınmak için yaygın kullanılır.
        Dizeyi düzenli ifade olarak işlemesi için BBOT'a RE: önekini vermek gerekir.
    command: "bbot -t {{target}} --blacklist \"RE:{{regex_pattern|signout}}\""

  # === ADVANCED MODULES & OUTPUT ===
  - title:
      en: bbot - cloud resource enumeration
      tr: bbot - bulut kaynağı numaralandırma
    desc:
      en: |
        Enables all modules related to cloud discovery, such as S3 buckets and Azure tenants.
        The cloud-enum flag groups these specialized modules to find data leaks in public cloud infrastructure.
        It is highly effective for finding misconfigured storage buckets belonging to an organization.
      tr: |
        S3 kovaları ve Azure kiracıları gibi bulut keşfiyle ilgili tüm modülleri etkinleştirir.
        cloud-enum bayrağı, herkese açık bulut altyapısındaki veri sızıntılarını bulmak için bu özel modülleri gruplar.
        Bir kuruluşa ait yanlış yapılandırılmış depolama kovalarını bulmada oldukça etkilidir.
    command: "bbot -t {{target}} -f cloud-enum"

  - title:
      en: bbot - custom scan name and output directory
      tr: bbot - özel tarama adı ve çıktı dizini
    desc:
      en: |
        Specifies a custom name for the scan and a custom location for all output files.
        If the scan name is reused, BBOT will append the results to the existing files instead of overwriting.
        This helps in organizing results for different clients or recurring assessment projects.
      tr: |
        Tarama için özel bir ad ve tüm çıktı dosyaları için özel bir konum belirtir.
        Tarama adı yeniden kullanılırsa BBOT sonuçları üzerine yazmak yerine mevcut dosyalara ekler.
        Bu, farklı istemciler veya yinelenen değerlendirme projelerinin sonuçlarını düzenlemeye yardımcı olur.
    command: "bbot -t {{target}} -p subdomain-enum -n {{name}} -o {{path|./results}}"

  - title:
      en: bbot - increase reporting distance
      tr: bbot - raporlama mesafesini artırma
    desc:
      en: |
        Displays events that are further away from the initial scope by increasing the report distance.
        By default, BBOT only shows in-scope events; distance 1 will show assets one hop away (like related IPs).
        Use this to discover related infrastructure that might not be directly linked to the target domain.
      tr: |
        Rapor mesafesini artırarak ilk kapsamdan daha uzaktaki olayları gösterir.
        BBOT varsayılan olarak yalnızca kapsam içi olayları gösterir; 1 mesafesi bir atlama uzaktaki varlıkları (ilgili IP'ler gibi) gösterir.
        Hedef alan adıyla doğrudan bağlı olmayabilecek ilgili altyapıyı keşfetmek için kullanın.
    command: "bbot -t {{target}} -p subdomain-enum -c scope.report_distance={{distance|1}}"

  # === MAINTENANCE ===
  - title:
      en: bbot - install all module dependencies
      tr: bbot - tüm modül bağımlılıklarını kurma
    desc:
      en: |
        Downloads and installs all external binaries and libraries required by every BBOT module.
        This uses Ansible internally to ensure the system is fully prepared for any type of scan.
        Run this when setting up a new pentest machine or VPS to avoid runtime installation delays.
      tr: |
        Her BBOT modülünün gerektirdiği tüm harici ikili ve kitaplıkları indirip kurar.
        Bu, sistemin her tarama türüne tam hazır olması için dahili olarak Ansible kullanır.
        Çalışma anı kurulum gecikmelerinden kaçınmak için yeni sızma testi makinesi veya VPS kurarken çalıştırın.
    command: "bbot --install-all-deps"

  - title:
      en: bbot - list all available modules and flags
      tr: bbot - tüm modül ve bayrakları listeleme
    desc:
      en: |
        Provides a comprehensive list of all installed modules, their descriptions, and associated flags.
        This is useful for discovering new modules or checking if a specific tool is available.
        You can also use this to see which modules are categorized under flags like 'deadly' or 'aggressive'.
      tr: |
        Kurulu tüm modüllerin, açıklamalarının ve ilişkili bayraklarının kapsamlı listesini verir.
        Bu, yeni modülleri keşfetmek veya belirli bir aracın mevcut olup olmadığını denetlemek için yararlıdır.
        Ayrıca hangi modüllerin 'deadly' veya 'aggressive' gibi bayraklar altında toplandığını görmek için kullanabilirsiniz.
    command: "bbot -l"
