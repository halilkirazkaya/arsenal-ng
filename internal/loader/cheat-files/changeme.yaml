tool: changeme
tags: [pentest, security, enumeration, exploitation, authentication, vulnerability-scanner]

actions:
  # === BASIC SCANNING ===
  - title:
      en: changeme.py - basic http scan
      tr: changeme.py - temel HTTP taraması
    desc:
      en: |
        Perform a basic scan against a single target using the default HTTP protocol.
        This command is the primary way to identify web-based administrative interfaces with default credentials.
        It is highly recommended for initial reconnaissance on local networks or web servers.
        Note that this mode only checks HTTP unless other protocols are specified.
      tr: |
        Varsayılan HTTP iletişim kuralıyla tekil hedefe karşı temel tarama yapar.
        Varsayılan kimlik bilgileriyle çalışan web tabanlı yönetim arayüzlerini saptamanın başlıca yoludur.
        Yerel ağlar veya web sunucularında ilk keşif için şiddetle önerilir.
        Başka iletişim kuralı belirtilmedikçe bu kip yalnızca HTTP denetler.
    command: "changeme.py {{target}}"

  - title:
      en: changeme.py - scan all protocols
      tr: changeme.py - tüm iletişim kurallarını tarama
    desc:
      en: |
        Enable scanning for all supported protocols including HTTP, SSH, and others.
        This provides a more comprehensive security audit of the target by testing multiple services simultaneously.
        Use this when you want to ensure no common service is left with insecure default settings.
        Be aware that this may increase the network traffic and time required for the scan.
      tr: |
        HTTP, SSH ve diğerleri dahil desteklenen tüm iletişim kurallarında taramayı açar.
        Birden fazla servisi aynı anda sınayarak hedefte daha kapsamlı güvenlik denetimi sağlar.
        Yaygın servislerden hiçbirinin güvensiz varsayılan ayarla kalmadığını doğrulamak isteyenler için uygundur.
        Ağ trafiğini ve tarama süresini artırabileceğini göz önünde bulundurun.
    command: "changeme.py --all {{target}}"

  - title:
      en: changeme.py - scan by device category
      tr: changeme.py - cihaz türüne göre tarama
    desc:
      en: |
        Restrict the credential testing to a specific category of devices such as cameras or routers.
        This optimizes the scanning process by only using credentials relevant to the target device type.
        It is particularly useful when you have already identified the device type through other reconnaissance methods.
        Common categories include "camera", "printer", or "voip".
      tr: |
        Kimlik bilgisi sınamasını kamera veya yönlendirici benzeri belirli cihaz grubuyla sınırlar.
        Yalnızca hedef cihaz türüyle ilgili kimlik bilgilerini kullanarak tarama sürecini verimli kılar.
        Cihaz türünü başka keşif yöntemleriyle önceden belirlediğinizde özellikle yararlıdır.
        Yaygın gruplar arasında "camera", "printer" veya "voip" bulunur.
    command: "changeme.py --category {{category|camera}} {{target}}"

  # === ENUMERATION & FINGERPRINTING ===
  - title:
      en: changeme.py - fingerprint only
      tr: changeme.py - yalnızca parmak izi çıkarma
    desc:
      en: |
        Identify the target device or service type without attempting any credential logins.
        This is a "safe" mode that helps in mapping the network environment without the risk of account lockouts.
        Use this during the early stages of an engagement to gather information quietly.
        It returns metadata about what the tool thinks the target is based on its fingerprinting database.
      tr: |
        Kimlik bilgisiyle giriş denemeden hedef cihaz veya servis türünü belirler.
        Hesap kilitlenmesi riski olmadan ağ ortamını haritalamaya yardımcı olan "güvenli" kiptir.
        Çalışmanın erken aşamalarında sessizce bilgi toplamak için kullanın.
        Parmak izi veritabanına dayanarak aracın hedef hakkındaki görüşünü üstveri olarak döndürür.
    command: "changeme.py --fingerprint {{target}}"

  - title:
      en: changeme.py - dump credentials
      tr: changeme.py - kimlik bilgilerini dökme
    desc:
      en: |
        Print all the loaded credentials in the tool's database to the console.
        This is useful for verifying which default usernames and passwords the tool is currently checking.
        You can use this to manually audit the credential list or to verify if a specific vendor is covered.
        This command does not require a target as it only displays internal tool data.
      tr: |
        Araç veritabanına yüklenen tüm kimlik bilgilerini konsola yazdırır.
        Aracın güncel olarak hangi varsayılan kullanıcı adı ve parolaları denetlediğini doğrulamak için yararlıdır.
        Kimlik bilgisi listesini elle denetlemek veya belirli satıcının kapsandığını doğrulamak için kullanılabilir.
        Yalnızca araç içi veriyi gösterdiği için hedef gerektirmez.
    command: "changeme.py --dump"

  # === TARGETING & INTEGRATION ===
  - title:
      en: changeme.py - scan from shodan query
      tr: changeme.py - Shodan sorgusuyla tarama
    desc:
      en: |
        Fetch targets directly from Shodan based on a specific search query and perform scans.
        This allows for automated identification and testing of internet-facing devices with default credentials.
        You must provide a valid Shodan API key using the --shodan_key flag for this to function.
        Use this feature responsibly as it interacts with public-facing infrastructure.
      tr: |
        Belirli arama sorgusuna dayanarak hedefleri doğrudan Shodan üzerinden çeker ve tarar.
        İnternete açık, varsayılan kimlik bilgili cihazların otomatik saptanıp sınanmasına olanak tanır.
        Çalışması için --shodan_key seçeneğiyle geçerli Shodan API anahtarı vermek gerekir.
        Herkese açık altyapıyla etkileşime girdiği için bu özelliği sorumlu kullanın.
    command: "changeme.py --shodan_query \"{{query|netcam}}\" --shodan_key {{api_key}}"

  - title:
      en: changeme.py - specific protocol selection
      tr: changeme.py - belirli iletişim kurallarını seçme
    desc:
      en: |
        Manually specify which protocols to test against the target target.
        This is useful if you know exactly which ports are open and want to avoid unnecessary connection attempts.
        The protocols should be provided as a comma-separated list, such as "ssh,http".
        This helps in focusing the tool's resources on the most likely points of entry.
      tr: |
        Hedefe karşı hangi iletişim kurallarının sınanacağını el ile belirtir.
        Hangi bağlantı noktalarının açık olduğunu bilip gereksiz bağlantı denemelerinden kaçınmak isteyenler için yararlıdır.
        Kurallar virgülle ayrılmış liste olarak verilmelidir (örneğin "ssh,http").
        Aracın kaynaklarını giriş olasılığı en yüksek noktalara odaklamaya yardımcı olur.
    command: "changeme.py --protocols {{protocols|ssh,http}} {{target}}"

  # === PERFORMANCE & OUTPUT ===
  - title:
      en: changeme.py - optimized multi-threaded scan
      tr: changeme.py - iyileştirilmiş çok iş parçacıklı tarama
    desc:
      en: |
        Adjust the number of concurrent threads and the connection timeout for faster scanning.
        Increasing the thread count can significantly speed up scans against large subnets or multiple targets.
        Be careful not to set the threads too high, as it might cause network congestion or service instability.
        The timeout value ensures the tool doesn't hang indefinitely on unresponsive hosts.
      tr: |
        Daha hızlı tarama için eşzamanlı iş parçacığı sayısı ile bağlantı zaman aşımını ayarlar.
        İş parçacığı sayısını artırmak geniş alt ağlar veya çoklu hedeflerde taramayı ciddi ölçüde hızlandırır.
        Değeri aşırı yükseltmemeye dikkat edin; ağ tıkanıklığı veya servis kararsızlığına yol açabilir.
        Zaman aşımı değeri aracın yanıt vermeyen makinelerde süresiz takılmasını engeller.
    command: "changeme.py --threads {{threads|20}} --timeout {{timeout|5}} {{target}}"

  - title:
      en: changeme.py - export results to file
      tr: changeme.py - sonuçları dosyaya aktarma
    desc:
      en: |
        Save the scan results into a structured file format for later analysis or reporting.
        The tool determines the format based on the file extension provided, supporting JSON, CSV, and HTML.
        This is essential for maintaining documentation during professional penetration tests.
        Using the --oa flag instead can generate all three formats at once.
      tr: |
        Tarama sonuçlarını sonradan inceleme veya raporlama için yapısal dosya biçiminde kaydeder.
        Biçimi verilen dosya uzantısına göre belirler; JSON, CSV ve HTML destekler.
        Profesyonel sızma testlerinde belge düzenini korumak için vazgeçilmezdir.
        Bunun yerine --oa seçeneğiyle üç biçimi aynı anda üretebilirsiniz.
    command: "changeme.py --output {{filename|results.json}} {{target}}"

  - title:
      en: changeme.py - resume previous scan
      tr: changeme.py - önceki taramayı sürdürme
    desc:
      en: |
        Continue a scan that was previously interrupted or stopped.
        This uses the internal state to avoid re-scanning targets that have already been processed.
        It is highly recommended for long-running tasks on large network ranges or slow connections.
        Ensure you are running the command from the same environment where the initial scan started.
      tr: |
        Önceden yarıda kesilen veya durdurulan taramayı sürdürür.
        Dahili durum bilgisiyle işlenmiş hedefleri yeniden taramaktan kaçınır.
        Geniş ağ aralıkları veya yavaş bağlantılarda uzun süren işler için şiddetle önerilir.
        Komutu ilk taramanın başladığı ortamdan çalıştırdığınızı doğrulayın.
    command: "changeme.py --resume {{target}}"
