tool: impacket-getarch
tags: [network, enumeration, smb, impacket, security, pentest, reconnaissance]

actions:
# === BASIC ENUMERATION ===

 - title:
     en: impacket-getArch - basic target scan
     tr: impacket-getArch - temel hedef taraması
   desc:
     en: |
       Identifies the operating system architecture of a single remote target system.
       This tool is highly effective for determining if a target is running a 32-bit or 64-bit version of Windows.
       Knowing the architecture is a critical step before deploying exploits or specific post-exploitation binaries.
       It typically communicates over SMB and RPC ports to gather this information.
     tr: |
       Tek bir uzak hedef sistemin işletim sistemi mimarisini belirler.
       Hedefin 32 bit mi 64 bit mi Windows çalıştırdığını anlamak için son derece etkilidir.
       Sömürü araçları veya sızma sonrası ikili dosyalar dağıtmadan önce mimariyi bilmek kritik bir adımdır.
       Genellikle SMB ve RPC portları üzerinden iletişim kurarak bu bilgiyi toplar.
   command: "impacket-getArch -target {{target}}"

 - title:
     en: impacket-getArch - scan multiple targets from file
     tr: impacket-getArch - dosyadan çoklu hedef tarama
   desc:
     en: |
       Performs architecture enumeration against a list of targets specified in a text file.
       The input file should contain one target IP address or hostname per line.
       This is ideal for large-scale internal network scanning to map out the infrastructure.
       It helps in categorizing systems for mass exploitation or patch management analysis.
     tr: |
       Bir metin dosyasında listelenen hedeflere karşı mimari numaralandırması yapar.
       Girdi dosyası satır başına bir hedef IP adresi veya ana makine adı içermelidir.
       Altyapıyı haritalamak için geniş ölçekli iç ağ taramasında idealdir.
       Sistemleri toplu sömürü veya yama yönetimi analizi için sınıflandırmaya yardımcı olur.
   command: "impacket-getArch -targets {{targets_file}}"

# === ADVANCED CONFIGURATION ===

 - title:
     en: impacket-getArch - scan with custom timeout
     tr: impacket-getArch - özel zaman aşımıyla tarama
   desc:
     en: |
       Adjusts the socket timeout duration for the connection attempt to the target.
       The default timeout is 2 seconds, which may be insufficient for high-latency or congested networks.
       Increasing this value helps ensure the tool does not exit prematurely when scanning slow-responding systems.
       Use this setting if you are encountering connection reset or timeout errors in unstable environments.
     tr: |
       Hedefe bağlantı girişimi için soket zaman aşımı süresini ayarlar.
       Varsayılan zaman aşımı 2 saniyedir; yüksek gecikmeli veya kalabalık ağlar için yetersiz kalabilir.
       Bu değeri artırmak, yavaş yanıt veren sistemlerde aracın erken çıkmamasını sağlar.
       Kararsız ortamlarda bağlantı sıfırlama veya zaman aşımı hataları alıyorsanız bu ayarı kullanın.
   command: "impacket-getArch -target {{target}} -timeout {{timeout|5}}"

 - title:
     en: impacket-getArch - scan with debug output
     tr: impacket-getArch - hata ayıklama çıktısıyla tarama
   desc:
     en: |
       Enables verbose debug logging for the entire execution process.
       This provides deep visibility into the underlying protocol exchanges and Impacket library calls.
       It is extremely useful for troubleshooting connectivity issues or protocol-level errors.
       Use this when the tool fails to return an architecture despite the target being alive.
     tr: |
       Tüm çalıştırma süreci için ayrıntılı hata ayıklama günlüğünü etkinleştirir.
       Temel protokol alışverişlerine ve Impacket kütüphane çağrılarına derin görünürlük sağlar.
       Bağlantı sorunlarını veya protokol düzeyinde hataları gidermek için son derece kullanışlıdır.
       Hedef canlıyken araç mimari döndüremiyorsa bunu kullanın.
   command: "impacket-getArch -target {{target}} -debug"

 - title:
     en: impacket-getArch - scan with timestamps
     tr: impacket-getArch - zaman damgalarıyla tarama
   desc:
     en: |
       Adds a precise timestamp to every line generated in the tool's logging output.
       This feature is essential for maintaining accurate audit trails during a professional engagement.
       It allows consultants to correlate their activities with target system logs or network traffic captures.
       It is recommended to use this flag whenever output is being redirected to a log file for reporting.
     tr: |
       Aracın günlük çıktısındaki her satıra hassas zaman damgası ekler.
       Profesyonel bir çalışmada doğru denetim izi tutmak için temel bir özelliktir.
       Danışmanların faaliyetlerini hedef sistem günlükleri veya ağ trafiği yakalamalarıyla ilişkilendirmesini sağlar.
       Çıktı raporlama için bir günlük dosyasına yönlendirildiğinde bu bayrağın kullanılması önerilir.
   command: "impacket-getArch -target {{target}} -ts"