tool: emailharvester
tags: [osint, reconnaissance, email, enumeration, pentest, gathering]

actions:
  # === RECONNAISSANCE & DISCOVERY ===
  - title:
      en: emailharvester - list plugins
      tr: emailharvester - eklentileri listeleme
    desc:
      en: |
        List all available search engine plugins currently supported by the tool. This command allows the user to see which platforms (e.g., Google, Bing, LinkedIn, etc.) are available for harvesting. It is recommended to run this before a scan to ensure the desired plugins are active and ready.
      tr: |
        Aracın desteklediği tüm arama motoru eklentilerini listeleyin. Bu komut, kullanıcının hangi platformların (örn. Google, Bing, LinkedIn vb.) toplama için kullanılabilir olduğunu görmesini sağlar. İstenen eklentilerin etkin ve hazır olduğundan emin olmak için taramadan önce çalıştırılması önerilir.
    command: "emailharvester -p"

  - title:
      en: emailharvester - search domain with specific engine
      tr: emailharvester - belirli motorla alan adı arama
    desc:
      en: |
        Search for email addresses associated with a specific domain using a single targeted engine. This is ideal when you want to focus your reconnaissance on a specific source to avoid detection or rate limiting. It returns a list of discovered emails found by that specific plugin's logic.
      tr: |
        Tek bir hedefli motor kullanarak belirli bir alan adıyla ilişkili e-posta adreslerini arayın. Tespitten veya hız sınırlamasından kaçınmak için keşfi tek bir kaynağa odaklamak istediğinizde idealdir. O eklentinin mantığıyla bulunan e-postaların listesini döndürür.
    command: "emailharvester -d {{domain}} -e {{engine|google}}"

  - title:
      en: emailharvester - search domain using all engines
      tr: emailharvester - tüm motorlarla alan adı arama
    desc:
      en: |
        Perform a comprehensive search across all available search engine plugins for the specified domain. This is the most common method for maximum data collection during the initial OSINT phase. Be aware that querying all engines simultaneously may increase the likelihood of your IP being temporarily flagged by some providers.
      tr: |
        Belirtilen alan adı için mevcut tüm arama motoru eklentilerinde kapsamlı arama yapın. İlk OSINT aşamasında en fazla veri toplamanın en yaygın yoludur. Tüm motorları aynı anda sorgulamanın IP'nizin bazı sağlayıcılarca geçici olarak işaretlenme olasılığını artırabileceğini unutmayın.
    command: "emailharvester -d {{domain}} -e all"

  - title:
      en: emailharvester - search with result limit
      tr: emailharvester - sonuç limitli arama
    desc:
      en: |
        Search for emails while restricting the number of results returned by the engines. This is useful for quick sanity checks or when working under time constraints where a full scrape is not necessary. Limiting results can also help in staying under the radar of automated bot detection systems.
      tr: |
        Motorların döndürdüğü sonuç sayısını kısıtlayarak e-posta arayın. Tam taramanın gerekmediği hızlı kontrollerde veya zaman kısıtı altında çalışırken kullanışlıdır. Sonuçları sınırlamak, otomatik bot tespit sistemlerinin radarına yakalanmamaya da yardımcı olabilir.
    command: "emailharvester -d {{domain}} -e all -l {{limit|50}}"

  # === OUTPUT MANAGEMENT ===
  - title:
      en: emailharvester - search and save output
      tr: emailharvester - arama ve çıktıyı kaydetme
    desc:
      en: |
        Execute a search and automatically save the findings into both TXT and XML file formats. This is essential for report generation and maintaining a record of findings during a professional engagement. The tool will create the files using the provided filename prefix in the current directory.
      tr: |
        Arama yapın ve bulguları otomatik olarak TXT ve XML dosya biçimlerinde kaydedin. Bu, rapor oluşturma ve profesyonel bir çalışmada bulguların kaydını tutma açısından gereklidir. Araç, dosyaları verilen dosya adı önekiyle çalışma dizininde oluşturur.
    command: "emailharvester -d {{domain}} -e all -s {{output_name|harvested_results}}"

  - title:
      en: emailharvester - silent search
      tr: emailharvester - sessiz arama
    desc:
      en: |
        Run the harvesting process without printing the discovered emails to the terminal. This is particularly useful when the tool is part of an automated pipeline or script where you only care about the saved output files. It keeps the terminal clean while the tool works in the background.
      tr: |
        Toplama işlemini bulunan e-postaları terminale yazdırmadan çalıştırın. Aracın yalnızca kaydedilen çıktı dosyalarının önemli olduğu otomatik bir hattın veya betiğin parçası olduğu durumlarda özellikle kullanışlıdır. Araç arka planda çalışırken terminali temiz tutar.
    command: "emailharvester -d {{domain}} -e all --noprint -s {{output_name|silent_results}}"

  # === ADVANCED CONFIGURATION ===
  - title:
      en: emailharvester - search using proxy
      tr: emailharvester - vekil sunucuyla arama
    desc:
      en: |
        Route all search requests through a specified proxy server. This is a critical security measure to hide the researcher's origin IP and bypass IP-based blocks or regional restrictions. Ensure the proxy server is reachable and supports the protocol (e.g., HTTP/SOCKS) required for the connection.
      tr: |
        Tüm arama isteklerini belirtilen bir vekil sunucudan geçirin. Bu, araştırmacının kaynak IP'sini gizlemek ve IP tabanlı engelleri veya bölgesel kısıtlamaları aşmak için kritik bir güvenlik önlemidir. Vekil sunucunun erişilebilir olduğundan ve bağlantı için gereken protokolü (örn. HTTP/SOCKS) desteklediğinden emin olun.
    command: "emailharvester -d {{domain}} -e all -x {{proxy_url|http://127.0.0.1:8080}}"

  - title:
      en: emailharvester - search with custom user-agent
      tr: emailharvester - özel user-agent ile arama
    desc:
      en: |
        Define a custom User-Agent string for the HTTP requests made during the harvesting process. Using a realistic browser User-Agent helps in blending in with legitimate traffic and bypassing basic anti-scraping filters. This is a common practice to increase the success rate of web-based OSINT tools.
      tr: |
        Toplama işlemi sırasında yapılan HTTP istekleri için özel bir User-Agent dizesi tanımlayın. Gerçekçi bir tarayıcı User-Agent'ı kullanmak, meşru trafiğe karışmaya ve temel kazıma karşıtı filtreleri aşmaya yardımcı olur. Bu, web tabanlı OSINT araçlarının başarı oranını artırmanın yaygın bir yoludur.
    command: "emailharvester -d {{domain}} -e all -u \"{{user_agent|Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36}}\""

  - title:
      en: emailharvester - exclude specific plugins
      tr: emailharvester - belirli eklentileri hariç tutma
    desc:
      en: |
        Perform a search using all engines except for a specified list of excluded plugins. This is useful when certain plugins are known to be broken, slow, or producing too many false positives for a particular target. Multiple engines should be separated by a comma without spaces.
      tr: |
        Hariç tutulan eklenti listesi dışındaki tüm motorlarla arama yapın. Belirli eklentilerin bozuk, yavaş olduğu veya belirli bir hedef için çok fazla yanlış pozitif ürettiği bilindiğinde kullanışlıdır. Birden çok motor boşluksuz virgülle ayrılmalıdır.
    command: "emailharvester -d {{domain}} -e all -r {{excluded_engines|google,twitter}}"
