tool: impacket-net
tags: [network, pentest, active-directory, enumeration, impacket, security, samr]

actions:
  # === DOMAIN ENUMERATION ===
  - title:
      en: impacket-net - enumerate domain users
      tr: impacket-net - etki alanı kullanıcılarını numaralandırma
    desc:
      en: |
        Lists all user accounts within the target Active Directory domain. 
        This is a fundamental reconnaissance step used to build a target list for password spraying or identifying interesting accounts.
        It communicates with the SAMR (Security Account Manager Remote) RPC interface over SMB.
        Be aware that excessive enumeration might be logged by security monitoring tools.
      tr: |
        Hedef Active Directory etki alanındaki tüm kullanıcı hesaplarını listeler.
        Parola püskürtme için hedef listesi oluşturmak veya ilgi çekici hesapları belirlemek için temel bir keşif adımıdır.
        SMB üzerinden SAMR (Güvenlik Hesabı Yöneticisi Uzak) RPC arayüzüyle iletişim kurar.
        Aşırı numaralandırmanın güvenlik izleme araçlarınca günlüğe alınabileceğini unutmayın.
    command: "impacket-net {{domain}}/{{username}}:{{password}}@{{target_ip}} user"

  - title:
      en: impacket-net - enumerate domain computers
      tr: impacket-net - etki alanı bilgisayarlarını numaralandırma
    desc:
      en: |
        Retrieves a list of all computer accounts registered in the domain level.
        Identifying computer names and types helps in mapping the internal network infrastructure and finding high-value targets.
        This command is particularly useful for identifying potential Domain Controllers or SQL Servers based on naming conventions.
        It requires valid domain credentials to query the Domain Controller's SAM database.
      tr: |
        Etki alanı düzeyinde kayıtlı tüm bilgisayar hesaplarının listesini alır.
        Bilgisayar adları ve türlerini belirlemek iç ağ altyapısını haritalamaya ve yüksek değerli hedefleri bulmaya yardımcı olur.
        Bu komut, adlandırma kurallarına göre olası Etki Alanı Denetleyicilerini veya SQL Sunucularını belirlemek için özellikle kullanışlıdır.
        Etki Alanı Denetleyicisinin SAM veritabanını sorgulamak için geçerli etki alanı kimlik bilgileri gerektirir.
    command: "impacket-net {{domain}}/{{username}}:{{password}}@{{target_ip}} computer"

  - title:
      en: impacket-net - enumerate domain groups
      tr: impacket-net - etki alanı gruplarını numaralandırma
    desc:
      en: |
        Lists all global and security groups registered within the Domain Controller.
        Understanding the group structure is vital for mapping the privilege hierarchy and finding sensitive groups like 'Domain Admins'.
        This action helps attackers or auditors identify which groups hold significant power within the AD environment.
        The output typically includes the group names and their associated RID (Relative Identifier).
      tr: |
        Etki Alanı Denetleyicisinde kayıtlı tüm genel ve güvenlik gruplarını listeler.
        Grup yapısını anlamak, yetki hiyerarşisini haritalamak ve 'Domain Admins' gibi hassas grupları bulmak için hayati önem taşır.
        Bu eylem, saldırganların veya denetçilerin AD ortamında hangi grupların önemli güce sahip olduğunu belirlemesine yardımcı olur.
        Çıktı genellikle grup adlarını ve ilişkili RID değerlerini (Göreli Tanımlayıcı) içerir.
    command: "impacket-net {{domain}}/{{username}}:{{password}}@{{target_ip}} group"

  # === LOCAL ENUMERATION ===
  - title:
      en: impacket-net - enumerate local groups
      tr: impacket-net - yerel grupları numaralandırma
    desc:
      en: |
        Enumerate the local groups (aliases) defined on a specific target computer.
        This is useful for identifying who has local administrative rights or other specific local permissions on a workstation or server.
        It helps in lateral movement planning by showing which domain users or groups are mapped to local privileged roles.
        Note that this requires a successful connection to the target's SAMR interface, which usually requires administrative or specific RPC rights.
      tr: |
        Belirli bir hedef bilgisayarda tanımlı yerel grupları (diğer adlar) numaralandırır.
        İş istasyonu veya sunucuda kimin yerel yönetici haklarına veya diğer belirli yerel izinlere sahip olduğunu belirlemek için kullanışlıdır.
        Hangi etki alanı kullanıcı veya gruplarının yerel yetkili rollere eşlendiğini göstererek yanal hareket planlamaya yardımcı olur.
        Bunun için hedefin SAMR arayüzüne genellikle yönetici veya belirli RPC hakları gerektiren başarılı bir bağlantı gerekir.
    command: "impacket-net {{domain}}/{{username}}:{{password}}@{{target_ip}} localgroup"

  # === AUTHENTICATION VARIANTS ===
  - title:
      en: impacket-net - enumerate via pass-the-hash
      tr: impacket-net - hash ile (pass-the-hash) numaralandırma
    desc:
      en: |
        Performs enumeration using NTLM hashes instead of a cleartext password.
        This technique is essential during post-exploitation when you have extracted hashes but cannot crack them into plain text.
        The format for the hash must be LMHASH:NTHASH; if you only have the NTLM hash, provide an empty LM hash (32 zeros).
        This allows for the same level of enumeration as a standard password login.
      tr: |
        Açık parola yerine NTLM hash'leriyle numaralandırma yapar.
        Hash'leri çıkarıp düz metne kıramadığınızda sızma sonrası sırasında temel bir tekniktir.
        Hash biçimi LMHASH:NTHASH olmalı; yalnızca NTLM hash'i varsa boş bir LM hash'i (32 sıfır) verin.
        Standart parolalı girişle aynı düzeyde numaralandırmaya olanak tanır.
    command: "impacket-net {{domain}}/{{username}}@{{target_ip}} -hashes {{lmhash|00000000000000000000000000000000}}:{{nthash}} user"

  - title:
      en: impacket-net - enumerate using kerberos
      tr: impacket-net - Kerberos ile numaralandırma
    desc:
      en: |
        Uses Kerberos authentication for the enumeration process instead of NTLM.
        This requires a valid Kerberos ticket (TGT) in your environment or specified credentials to request one from the KDC.
        Using Kerberos is often preferred in environments where NTLM is restricted or to bypass certain security controls.
        Ensure that you use the FQDN/Hostname of the target instead of an IP address for Kerberos to function correctly.
      tr: |
        Numaralandırma sürecinde NTLM yerine Kerberos kimlik doğrulaması kullanır.
        Ortamınızda geçerli bir Kerberos bileti (TGT) veya KDC'den bilet isteyecek belirtilen kimlik bilgileri gerekir.
        NTLM'nin kısıtlı olduğu ortamlarda veya belirli güvenlik denetimlerini atlatmak için Kerberos kullanımı sıkça tercih edilir.
        Kerberos'un düzgün çalışması için IP adresi yerine hedefin FQDN/Ana makine adını kullandığınızdan emin olun.
    command: "impacket-net {{domain}}/{{username}}@{{target_name}} -k -no-pass -dc-ip {{dc_ip}} user"

  # === ADVANCED CONNECTION ===
  - title:
      en: impacket-net - specify target ip and port
      tr: impacket-net - hedef IP ve port belirtme
    desc:
      en: |
        Forces the connection to a specific IP address and port regardless of the target string.
        This is useful when the NetBIOS name or FQDN cannot be resolved by the local machine's DNS.
        It is also helpful if the SMB service is running on a non-standard port (e.g., via a port forward or tunnel).
        The target parameter in the command string still represents the identity you are connecting to.
      tr: |
        Hedef dizesinden bağımsız olarak bağlantıyı belirli bir IP adrese ve porta zorlar.
        NetBIOS adı veya FQDN yerel makinenin DNS'iyle çözülemediğinde kullanışlıdır.
        SMB hizmeti standart dışı bir porttaysa (ör. port yönlendirme veya tünel üzerinden) da yararlıdır.
        Komut dizesindeki hedef parametre yine bağlandığınız kimliği temsil eder.
    command: "impacket-net {{domain}}/{{username}}:{{password}}@{{target_name}} -target-ip {{target_ip}} -port {{port|445}} user"

  - title:
      en: impacket-net - debug mode enumeration
      tr: impacket-net - hata ayıklama modunda numaralandırma
    desc:
      en: |
        Runs the enumeration tool with the -debug flag enabled to provide verbose output.
        This is extremely useful for troubleshooting connection issues, RPC errors, or authentication failures.
        It displays the underlying packets and RPC calls being made to the target.
        Use this when the tool fails silently or returns unexpected error codes like Access Denied.
      tr: |
        Ayrıntılı çıktı için numaralandırma aracını -debug bayrağıyla çalıştırır.
        Bağlantı sorunları, RPC hataları veya kimlik doğrulama hatalarını gidermek için son derece kullanışlıdır.
        Hedefe yapılan temel paketleri ve RPC çağrılarını görüntüler.
        Araç sessizce başarısız olduğunda veya Erişim Engellendi gibi beklenmedik hata kodları döndürdüğünde kullanın.
    command: "impacket-net -debug {{domain}}/{{username}}:{{password}}@{{target_ip}} user"