tool: jwt_tool
tags: [security, jwt, pentest, exploitation, authentication, scanner, enumeration]

actions:
# === RECONNAISSANCE AND INFORMATION GATHERING ===

 - title:
    en: jwt_tool - decode and review token
    tr: jwt_tool - jetonu çözme ve inceleme
   desc:
     en: |
       Decodes the provided JWT and displays its header and payload contents in a readable format. 
       This is the primary starting point for any JWT assessment to understand the claims and algorithms being used. 
       The tool automatically validates the token structure and highlights the internal values for manual inspection.
     tr: |
       Verilen JWT'yi çözer ve başlık ile yük içeriklerini okunabilir biçimde gösterir.
       Kullanılan iddiaları (claim) ve algoritmaları anlamak için her JWT değerlendirmesinin birincil başlangıç noktasıdır.
       Araç, jeton yapısını otomatik olarak doğrular ve elle inceleme için iç değerleri vurgular.
   command: "jwt_tool {{jwt_token}}"

 - title:
    en: jwt_tool - analyze token via web request
    tr: jwt_tool - web isteğiyle jetonu analiz etme
   desc:
     en: |
       Sends a JWT to a target URL within a specific cookie to analyze how the application handles it. 
       This is useful for verifying if the application accepts the token and observing the response behavior. 
       You can include a canary value to identify successful authentication or specific reflections in the response.
     tr: |
       Uygulamanın onu nasıl işlediğini analiz etmek için belirli bir çerez içinde hedef URL'ye bir JWT gönderir.
       Uygulamanın jetonu kabul edip etmediğini doğrulamak ve yanıt davranışını gözlemlemek için faydalıdır.
       Başarılı kimlik doğrulamayı veya yanıttaki belirli yansımaları belirlemek için bir kanarya değeri ekleyebilirsiniz.
   command: "jwt_tool -t {{url}} -rc \"jwt={{jwt_token}}\" -cv {{canary_value|Welcome}}"

# === AUTOMATED SCANNING ===

 - title:
    en: jwt_tool - automated playbook scan
    tr: jwt_tool - otomatik playbook taraması
   desc:
     en: |
       Performs an automated "Playbook Scan" against a target URL to identify common JWT misconfigurations. 
       This mode tests for multiple vulnerabilities including alg:none, key confusion, and weak secrets in a single run. 
       It is highly recommended for initial security testing as it covers the most frequent attack vectors automatically.
     tr: |
       Yaygın JWT yanlış yapılandırmalarını belirlemek için hedef URL'ye karşı otomatik bir "Playbook Taraması" yapar.
       Bu kip, tek çalıştırmada alg:none, anahtar karışıklığı ve zayıf gizli anahtarlar dahil birden çok zafiyeti test eder.
       En sık rastlanan saldırı vektörlerini otomatik kapsadığından ilk güvenlik testleri için önemle önerilir.
   command: "jwt_tool -t {{url}} -rc \"jwt={{jwt_token}}\" -M pb"

 - title:
    en: jwt_tool - scan for forced errors
    tr: jwt_tool - zorunlu hata taraması
   desc:
     en: |
       Executes a scan designed to provoke error responses from the server by sending malformed JWTs. 
       Analyzing these errors can reveal information about the backend library, versioning, or logic flaws in the implementation. 
       This is particularly effective when the application does not provide verbose output under normal circumstances.
     tr: |
       Bozuk JWT'ler göndererek sunucudan hata yanıtları kışkırtmak üzere tasarlanmış bir tarama çalıştırır.
       Bu hataları analiz etmek, arka uç kütüphanesi, sürümleme veya uygulamadaki mantık kusurları hakkında bilgi verebilir.
       Uygulamanın normal koşullarda ayrıntılı çıktı vermediği durumlarda özellikle etkilidir.
   command: "jwt_tool -t {{url}} -rc \"jwt={{jwt_token}}\" -M er"

# === EXPLOITATION AND TAMPERING ===

 - title:
    en: jwt_tool - alg none signature bypass
    tr: jwt_tool - alg none imza atlatması
   desc:
     en: |
       Attempts the alg:none attack (CVE-2015-2951) by modifying the header and stripping the signature. 
       This exploit checks if the server incorrectly trusts tokens that claim to have no signature requirement. 
       If successful, it allows an attacker to modify any claim in the payload without needing a secret key.
     tr: |
       Başlığı değiştirip imzayı kaldırarak alg:none saldırısını (CVE-2015-2951) dener.
       Bu istismar, sunucunun imza gerektirmediğini iddia eden jetonlara hatalı şekilde güvenip güvenmediğini denetler.
       Başarılı olursa saldırganın gizli anahtara gerek kalmadan yükteki herhangi bir iddiayı değiştirmesine olanak tanır.
   command: "jwt_tool {{jwt_token}} -X a"

 - title:
    en: jwt_tool - RSA to HMAC key confusion
    tr: jwt_tool - RSA-HMAC anahtar karışıklığı
   desc:
     en: |
       Performs the RS256 to HS256 key mismatch attack (CVE-2016-10555). 
       It attempts to sign the token using HMAC-SHA256 with the provided public key as the shared secret. 
       This is a critical vulnerability often found when libraries are configured to use a generic "key" for both asymmetric and symmetric validation.
     tr: |
       RS256-HS256 anahtar uyumsuzluğu saldırısını (CVE-2016-10555) gerçekleştirir.
       Verilen açık anahtarı paylaşılan gizli anahtar olarak kullanıp jetonu HMAC-SHA256 ile imzalamaya çalışır.
       Kütüphaneler hem asimetrik hem simetrik doğrulama için genel bir "key" kullanacak şekilde yapılandırıldığında sıkça rastlanan kritik bir zafiyettir.
   command: "jwt_tool {{jwt_token}} -X k -pk {{public_key_file|public.pem}}"

 - title:
    en: jwt_tool - inject JWKS exploit
    tr: jwt_tool - JWKS enjeksiyon istismarı
   desc:
     en: |
       Exploits key injection vulnerabilities (CVE-2018-0114) by embedding a new JWKS in the header. 
       The tool generates a new key pair, signs the token with the private key, and includes the public key in the 'jwk' header claim. 
       Use this when the application trusts the key information provided within the token itself instead of a server-side trust store.
     tr: |
       Başlığa yeni bir JWKS gömerek anahtar enjeksiyon zafiyetlerini (CVE-2018-0114) istismar eder.
       Araç yeni bir anahtar çifti üretir, jetonu özel anahtarla imzalar ve açık anahtarı 'jwk' başlık iddiasına ekler.
       Uygulama, sunucu tarafı güven deposu yerine jetonun içindeki anahtar bilgisine güvendiğinde bunu kullanın.
   command: "jwt_tool {{jwt_token}} -X i"

 - title:
    en: jwt_tool - modify payload claims
    tr: jwt_tool - yük iddialarını değiştirme
   desc:
     en: |
       Tampers with specific claims in the JWT payload while attempting to maintain a valid structure. 
       You can specify the claim name and the new value to escalate privileges, such as changing a 'user' to 'admin'. 
       This action is typically combined with an exploitation method like alg:none or a known secret key.
     tr: |
       Geçerli bir yapıyı korumaya çalışırken JWT yükündeki belirli iddiaları kurcalar.
       Ayrıcalık yükseltmek için iddia adını ve yeni değeri belirtebilirsiniz; örneğin 'user' değerini 'admin' yapmak gibi.
       Bu işlem genellikle alg:none veya bilinen bir gizli anahtar gibi bir istismar yöntemiyle birlikte kullanılır.
   command: "jwt_tool {{jwt_token}} -I -pc {{claim_name|role}} -pv {{new_value|admin}}"

# === CRYPTOGRAPHY AND KEY ATTACKS ===

 - title:
    en: jwt_tool - dictionary attack on secret
    tr: jwt_tool - gizli anahtara sözlük saldırısı
   desc:
     en: |
       Initiates a high-speed dictionary attack to crack the HMAC secret key of a JWT. 
       It compares the signature of the provided token against signatures generated using words from a wordlist. 
       This is essential for testing if the application uses weak, predictable, or default secret keys for HS256.
     tr: |
       Bir JWT'nin HMAC gizli anahtarını kırmak için yüksek hızlı bir sözlük saldırısı başlatır.
       Verilen jetonun imzasını sözlükteki sözcüklerle üretilen imzalarla karşılaştırır.
       Uygulamanın HS256 için zayıf, tahmin edilebilir veya varsayılan gizli anahtarlar kullanıp kullanmadığını test etmek için gereklidir.
   command: "jwt_tool {{jwt_token}} -C -d {{wordlist|/usr/share/wordlists/rockyou.txt}}"

 - title:
    en: jwt_tool - verify token with public key
    tr: jwt_tool - jetonu açık anahtarla doğrulama
   desc:
     en: |
       Verifies the signature of a JWT using a local public key file. 
       This helps confirm if a token was actually signed by the expected private key during a manual assessment. 
       Ensure the public key is in the correct PEM or JWKS format as required by the tool.
     tr: |
       Yerel bir açık anahtar dosyasıyla bir JWT'nin imzasını doğrular.
       Elle değerlendirme sırasında bir jetonun gerçekten beklenen özel anahtarla imzalanıp imzalanmadığını teyit etmeye yardımcı olur.
       Açık anahtarın aracın gerektirdiği doğru PEM veya JWKS biçiminde olduğundan emin olun.
   command: "jwt_tool {{jwt_token}} -V -pk {{public_key_file|public.pem}}"

# === ADVANCED INTERACTION ===

 - title:
    en: jwt_tool - scan using request file
    tr: jwt_tool - istek dosyasıyla tarama
   desc:
     en: |
       Reads a raw HTTP request from a file and injects the JWT into the appropriate locations automatically. 
       This is the most reliable way to handle complex requests involving multiple headers, cookies, and POST data. 
       It mimics the behavior of tools like SQLMap or Burp Suite by parsing the full context of the web communication.
     tr: |
       Ham bir HTTP isteğini dosyadan okur ve JWT'yi uygun konumlara otomatik olarak enjekte eder.
       Birden çok başlık, çerez ve POST verisi içeren karmaşık istekleri işlemenin en güvenilir yoludur.
       Web iletişiminin tüm bağlamını ayrıştırarak SQLMap veya Burp Suite gibi araçların davranışını taklit eder.
   command: "jwt_tool -r {{request_file|request.txt}} -M pb"

 - title:
    en: jwt_tool - fuzz header claims
    tr: jwt_tool - başlık iddialarını fuzzing
   desc:
     en: |
       Fuzzes the header claims of a JWT with custom payloads, such as SQL injection or path traversal strings. 
       This is used to find vulnerabilities in the code that processes the JWT headers, like the 'kid' (Key ID) field. 
       Input a file containing the fuzzing vectors to systematically test the target's processing logic.
     tr: |
       JWT'nin başlık iddialarını SQL enjeksiyonu veya yol geçişi dizgileri gibi özel yüklerle fuzzing'e tabi tutar.
       JWT başlıklarını işleyen kodda, örneğin 'kid' (Anahtar Kimliği) alanında zafiyet bulmak için kullanılır.
       Hedefin işleme mantığını sistematik test etmek için fuzzing vektörlerini içeren bir dosya girin.
   command: "jwt_tool -t {{url}} -rc \"jwt={{jwt_token}}\" -I -hc {{header_claim|kid}} -hv {{fuzz_list|sqli.txt}}"
