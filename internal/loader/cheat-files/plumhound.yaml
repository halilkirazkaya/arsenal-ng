tool: plumhound
tags: [active-directory, bloodhound, security, pentest, blue-team, purple-team, enumeration, reporting]

actions:
  # === CONNECTIVITY & BASIC OPERATIONS ===
  - title:
      en: PlumHound - basic connectivity test
      tr: PlumHound - temel bağlantı testi
    desc:
      en: |
        Use the easy mode to test the connection to the Neo4j database. It outputs all Active Directory user objects 
        directly to the standard output. This is the fastest way to verify that your credentials and server 
        address are correct before running complex tasks.
      tr: |
        Neo4j veritabanına bağlantıyı test etmek için kolay modu kullanın. Tüm Active Directory kullanıcı nesnelerini
        doğrudan standart çıktıya yazar. Karmaşık görevleri çalıştırmadan önce kimlik bilgilerinizin ve sunucu
        adresinizin doğru olduğunu doğrulamanın en hızlı yoludur.
    command: "PlumHound.py --easy"

  - title:
      en: PlumHound - connect with custom credentials
      tr: PlumHound - özel kimlik bilgileriyle bağlanma
    desc:
      en: |
        Specify a custom Neo4j server URI, username, and password for database interaction. This is necessary 
        when the database is not running on the default localhost or uses non-standard credentials. 
        Ensure the server string follows the bolt protocol format for proper communication with the Neo4j instance.
      tr: |
        Veritabanı etkileşimi için özel bir Neo4j sunucu URI'si, kullanıcı adı ve parola belirtin. Veritabanı
        varsayılan localhost üzerinde çalışmıyorsa veya standart dışı kimlik bilgileri kullanıyorsa bu gereklidir.
        Neo4j örneğiyle sağlıklı iletişim için sunucu dizesinin bolt protokolü biçimine uyduğundan emin olun.
    command: "PlumHound.py -s {{server|bolt://127.0.0.1:7687}} -u {{username|neo4j}} -p {{password|neo4jneo4j}}"

  # === TASK-BASED REPORTING ===
  - title:
      en: PlumHound - execute task list
      tr: PlumHound - görev listesi çalıştırma
    desc:
      en: |
        Run a predefined list of tasks from a file to automate multiple Cypher queries and reporting steps. 
        Task files allow for complex auditing workflows to be executed in a single command, producing various 
        output formats like HTML or CSV. This is highly useful for generating comprehensive security reports 
        after a SharpHound ingest.
      tr: |
        Birden fazla Cypher sorgusunu ve raporlama adımını otomatikleştirmek için dosyadan önceden tanımlı görev listesi çalıştırın.
        Görev dosyaları, HTML veya CSV gibi çeşitli çıktı biçimleri üreterek karmaşık denetim iş akışlarının tek komutla
        yürütülmesine olanak tanır. SharpHound veri aktarımından sonra kapsamlı güvenlik raporları üretmek için çok kullanışlıdır.
    command: "PlumHound.py -x {{task_file|tasks/default.tasks}}"

  - title:
      en: PlumHound - execute tasks with quiet output
      tr: PlumHound - sessiz çıktıyla görev çalıştırma
    desc:
      en: |
        Execute a task file while suppressing standard output by setting the verbosity level to zero. 
        This is ideal for automated environments or background jobs where you only care about the 
        generated report files. It prevents the terminal from being flooded with progress bars and query logs.
      tr: |
        Ayrıntı düzeyini sıfıra ayarlayarak standart çıktıyı bastırırken bir görev dosyası çalıştırın.
        Yalnızca üretilen rapor dosyalarının önemli olduğu otomatik ortamlar veya arka plan işleri için idealdir.
        Terminalin ilerleme çubukları ve sorgu kayıtlarıyla dolmasını engeller.
    command: "PlumHound.py -x {{task_file|tasks/default.tasks}} -v 0"

  # === SINGLE QUERIES & EXPORTS ===
  - title:
      en: PlumHound - single cypher query to stdout
      tr: PlumHound - standart çıktıya tek cypher sorgusu
    desc:
      en: |
        Execute a single custom Cypher query against the Neo4j database and display the results in the terminal. 
        This mode is ideal for quick lookups of specific objects, relationships, or AD attributes without 
        generating a full report. It allows researchers to interact with the BloodHound data directly from the CLI.
      tr: |
        Neo4j veritabanına karşı tek bir özel Cypher sorgusu çalıştırıp sonuçları terminalde görüntüleyin.
        Bu mod, tam rapor üretmeden belirli nesneleri, ilişkileri veya AD özniteliklerini hızlıca sorgulamak için idealdir.
        Araştırmacıların BloodHound verisiyle doğrudan komut satırından etkileşime girmesini sağlar.
    command: "PlumHound.py -q \"{{query|MATCH (n:User) RETURN n.name, n.displayname LIMIT 10}}\""

  - title:
      en: PlumHound - single query HTML report
      tr: PlumHound - tek sorguyla HTML raporu
    desc:
      en: |
        Run a specific Cypher query and generate a formatted HTML report for easier visualization and sharing. 
        You can specify the report title, the output file name, and the destination directory path. 
        This helps in presenting specific findings to stakeholders or documenting critical attack paths 
        discovered during a red or purple team engagement.
      tr: |
        Belirli bir Cypher sorgusu çalıştırıp kolay görselleştirme ve paylaşım için biçimlendirilmiş bir HTML raporu üretin.
        Rapor başlığını, çıktı dosyası adını ve hedef dizin yolunu belirtebilirsiniz.
        Bu, kırmızı veya mor takım çalışması sırasında bulunan kritik saldırı yollarını belgelemeye ya da
        belirli bulguları paydaşlara sunmaya yardımcı olur.
    command: "PlumHound.py -q \"{{query}}\" --title \"{{title}}\" --of \"{{outfile|report.html}}\" --op \"{{outpath|reports/}}\" --ox HTML"

  - title:
      en: PlumHound - single query CSV export
      tr: PlumHound - tek sorguyla CSV dışa aktarma
    desc:
      en: |
        Execute a Cypher query and export the resulting data into a CSV file for further analysis in Excel or other tools. 
        This is useful for data manipulation, such as filtering large lists of vulnerable users or misconfigured 
        computers. Ensure the output format is explicitly set to CSV using the --ox flag.
      tr: |
        Bir Cypher sorgusu çalıştırıp sonuç verisini Excel veya başka araçlarda ileri analiz için CSV dosyasına aktarın.
        Bu, zafiyetli kullanıcıların veya yanlış yapılandırılmış bilgisayarların uzun listelerini filtrelemek gibi
        veri işleme işleri için kullanışlıdır. --ox bayrağıyla çıktı biçiminin açıkça CSV ayarlandığından emin olun.
    command: "PlumHound.py -q \"{{query}}\" --of \"{{outfile|data_export}}\" --ox CSV"

  # === ADVANCED PATH ANALYSIS (BLUEHOUND MODULES) ===
  - title:
      en: PlumHound - analyze paths by label
      tr: PlumHound - etikete göre yol analizi
    desc:
      en: |
        Analyze attack paths based on object labels like User, Group, Computer, OU, or GPO. 
        The function identifies which specific relationships (e.g., HasSession, AdminTo) must be 
        remediated to break the path to sensitive targets. It provides blue teams with concrete, 
        actionable steps to improve the overall AD security posture.
      tr: |
        User, Group, Computer, OU veya GPO gibi nesne etiketlerine göre saldırı yollarını analiz edin.
        İşlev, hassas hedeflere giden yolu kırmak için hangi ilişkilerin (ör. HasSession, AdminTo)
        düzeltilmesi gerektiğini belirler. Mavi takımlara genel AD güvenlik durumunu iyileştirmek için
        somut, uygulanabilir adımlar sunar.
    command: "PlumHound.py -ap {{label|user}}"

  - title:
      en: PlumHound - analyze paths between specific nodes
      tr: PlumHound - belirli düğümler arası yol analizi
    desc:
      en: |
        Identify and analyze all possible attack paths between a specific starting node (source) and a target end node. 
        The output details which relationships need to be removed to effectively break the entire attack chain. 
        This is particularly useful for verifying if a specific user or computer can reach Domain Admin privileges.
      tr: |
        Belirli bir başlangıç düğümü (source) ile hedef bir bitiş düğümü arasındaki tüm olası saldırı yollarını belirleyip analiz edin.
        Çıktı, tüm saldırı zincirini etkili biçimde kırmak için hangi ilişkilerin kaldırılması gerektiğini ayrıntılandırır.
        Bu, belirli bir kullanıcının veya bilgisayarın Domain Admin yetkilerine ulaşıp ulaşamayacağını doğrulamak için özellikle kullanışlıdır.
    command: "PlumHound.py -ap \"{{start_node|domain users@example.com}}\" \"{{end_node|domain admins@example.com}}\""

  - title:
      en: PlumHound - find busiest shortest paths
      tr: PlumHound - en yoğun en kısa yolları bulma
    desc:
      en: |
        Find the "busiest" shortest paths that grant the highest number of users a route to Domain Admin privileges. 
        The command takes an algorithm type (short or all) and the number of top results to return. 
        This helps security teams identify the most critical "choke points" in the network that attackers 
        are likely to exploit.
      tr: |
        En fazla sayıda kullanıcıya Domain Admin yetkilerine giden yol veren "en yoğun" en kısa yolları bulun.
        Komut bir algoritma türü (short veya all) ve döndürülecek en iyi sonuç sayısını alır.
        Bu, güvenlik ekiplerinin saldırganların sömürme olasılığı yüksek olan ağdaki en kritik
        "darboğazları" belirlemesine yardımcı olur.
    command: "PlumHound.py -bp {{algorithm|short}} {{limit|5}}"

  # === HTML CUSTOMIZATION ===
  - title:
      en: PlumHound - generate report with custom CSS
      tr: PlumHound - özel CSS ile rapor üretme
    desc:
      en: |
        Apply a custom CSS template to the generated HTML reports to match corporate branding or specific design needs. 
        This allows for professional-looking reports that are ready for executive presentation. 
        The tool uses default templates if this path is not specified.
      tr: |
        Kurumsal kimliğe veya belirli tasarım ihtiyaçlarına uyması için üretilen HTML raporlarına özel bir CSS şablonu uygulayın.
        Bu, yönetici sunumuna hazır profesyonel görünümlü raporlar elde etmenizi sağlar.
        Bu yol belirtilmezse araç varsayılan şablonları kullanır.
    command: "PlumHound.py -x {{task_file}} --HTMLCSS {{css_file|templates/custom.css}}"
