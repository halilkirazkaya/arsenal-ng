tool: impacket-services
tags: [pentest, security, impacket, windows, services, enumeration, exploitation, lateral-movement]

actions:
# === ENUMERATION ===

 - title:
    en: impacket-services - list services
    tr: impacket-services - hizmetleri listeleme
   desc:
     en: |
       Lists all available services on the remote Windows machine. This is a primary step in reconnaissance to understand the target's environment and installed software. 
       Note that listing all services usually requires administrative privileges or specific permissions on the Service Control Manager.
     tr: |
       Uzak Windows makinesindeki tüm kullanılabilir hizmetleri listeler. Hedefin ortamını ve yüklü yazılımları anlamak için keşifte birincil bir adımdır.
       Tüm hizmetleri listelemenin genellikle yönetici ayrıcalıkları veya Hizmet Denetim Yöneticisi üzerinde belirli izinler gerektirdiğini unutmayın.
   command: "impacket-services {{domain/username:password}}@{{target}} list"

 - title:
    en: impacket-services - get service status
    tr: impacket-services - hizmet durumunu öğrenme
   desc:
     en: |
       Queries the current running state of a specific service. This command is useful to verify if a target service is active before attempting to stop or modify it. 
       You must provide the exact service name (e.g., 'Spooler') rather than the display name.
     tr: |
       Belirli bir hizmetin mevcut çalışma durumunu sorgular. Hedef hizmeti durdurmaya veya değiştirmeye çalışmadan önce etkin olup olmadığını doğrulamak için faydalıdır.
       Görünen ad yerine hizmetin tam adını (örn. 'Spooler') vermelisiniz.
   command: "impacket-services {{domain/username:password}}@{{target}} status -name {{service_name}}"

 - title:
    en: impacket-services - query service configuration
    tr: impacket-services - hizmet yapılandırmasını sorgulama
   desc:
     en: |
       Retrieves the detailed configuration for a specific service, including its binary path and start type. 
       This is critical for identifying privilege escalation opportunities, such as unquoted service paths or services running as SYSTEM that point to modifiable binaries. 
       Always verify the 'BINARY_PATH_NAME' to understand what executable is being triggered.
     tr: |
       Belirli bir hizmetin ikili yolu ve başlatma türü dahil ayrıntılı yapılandırmasını getirir.
       Tırnaksız hizmet yolları veya değiştirilebilir ikililere işaret eden SYSTEM olarak çalışan hizmetler gibi ayrıcalık yükseltme fırsatlarını belirlemede kritik öneme sahiptir.
       Hangi çalıştırılabilir dosyanın tetiklendiğini anlamak için daima 'BINARY_PATH_NAME' değerini doğrulayın.
   command: "impacket-services {{domain/username:password}}@{{target}} config -name {{service_name}}"

# === SERVICE MANIPULATION ===

 - title:
    en: impacket-services - start a service
    tr: impacket-services - bir hizmeti başlatma
   desc:
     en: |
       Sends a start command to a stopped service on the target host. This can be used to trigger a malicious service you've created or to restart a legitimate service after modification. 
       Be aware that some services may have dependencies that must be started first, otherwise the command might fail.
     tr: |
       Hedef makinede durmuş bir hizmete başlatma komutu gönderir. Oluşturduğunuz zararlı bir hizmeti tetiklemek veya değişiklik sonrası meşru bir hizmeti yeniden başlatmak için kullanılabilir.
       Bazı hizmetlerin önce başlatılması gereken bağımlılıkları olabileceğini, aksi halde komutun başarısız olabileceğini unutmayın.
   command: "impacket-services {{domain/username:password}}@{{target}} start -name {{service_name}}"

 - title:
    en: impacket-services - stop a service
    tr: impacket-services - bir hizmeti durdurma
   desc:
     en: |
       Remotely stops a running service. This is often used to disable security agents, antivirus software, or logging services during a penetration test. 
       Stopping critical system services might cause target instability or a blue screen (BSOD), so use this with caution.
     tr: |
       Çalışan bir hizmeti uzaktan durdurur. Sızma testi sırasında güvenlik ajanlarını, antivirüs yazılımlarını veya günlükleme hizmetlerini devre dışı bırakmak için sıkça kullanılır.
       Kritik sistem hizmetlerini durdurmak hedefte kararsızlığa veya mavi ekrana (BSOD) yol açabileceğinden dikkatli kullanın.
   command: "impacket-services {{domain/username:password}}@{{target}} stop -name {{service_name}}"

# === EXPLOITATION & PERSISTENCE ===

 - title:
    en: impacket-services - create new service
    tr: impacket-services - yeni hizmet oluşturma
   desc:
     en: |
       Creates a new service on the remote system with a specified binary path. This is a common method for lateral movement, allowing an attacker to execute commands or payloads with SYSTEM privileges. 
       The binary path can point to a local file on the target or a file hosted on a network share. 
       Requires administrative privileges.
     tr: |
       Uzak sistemde belirtilen bir ikili yolla yeni bir hizmet oluşturur. Saldırganın SYSTEM ayrıcalıklarıyla komut veya yük çalıştırmasına olanak tanıyan, yatay hareket için yaygın bir yöntemdir.
       İkili yol, hedefteki yerel bir dosyayı veya bir ağ paylaşımında barındırılan bir dosyayı gösterebilir.
       Yönetici ayrıcalıkları gerektirir.
   command: "impacket-services {{domain/username:password}}@{{target}} create -name {{service_name}} -display {{display_name}} -path {{bin_path}}"

 - title:
    en: impacket-services - change service config
    tr: impacket-services - hizmet yapılandırmasını değiştirme
   desc:
     en: |
       Modifies the configuration of an existing service, most commonly used to overwrite the binary path. 
       By changing a service that runs as SYSTEM to point to a malicious executable, you can achieve privilege escalation when the service restarts. 
       It is a best practice to note down the original path to restore it after the engagement to avoid breaking the system.
     tr: |
       Mevcut bir hizmetin yapılandırmasını değiştirir; en yaygın olarak ikili yolu üzerine yazmak için kullanılır.
       SYSTEM olarak çalışan bir hizmeti zararlı bir çalıştırılabilir dosyaya yönlendirerek hizmet yeniden başladığında ayrıcalık yükseltebilirsiniz.
       Sistemi bozmamak için test sonrası geri yüklemek üzere özgün yolu not etmek en iyi uygulamadır.
   command: "impacket-services {{domain/username:password}}@{{target}} change -name {{service_name}} -path {{new_bin_path}}"

 - title:
    en: impacket-services - delete a service
    tr: impacket-services - bir hizmeti silme
   desc:
     en: |
       Permanently removes a service from the target machine's Service Control Manager. 
       This action is typically performed as part of a cleanup process to remove any backdoors or temporary services created during the assessment. 
       This operation is irreversible; the service must be manually recreated if deleted by mistake.
     tr: |
       Hedef makinenin Hizmet Denetim Yöneticisinden bir hizmeti kalıcı olarak kaldırır.
       Bu işlem genellikle değerlendirme sırasında oluşturulan arka kapıları veya geçici hizmetleri kaldırmak için temizlik sürecinin parçası olarak yapılır.
       Bu işlem geri alınamaz; yanlışlıkla silinirse hizmet elle yeniden oluşturulmalıdır.
   command: "impacket-services {{domain/username:password}}@{{target}} delete -name {{service_name}}"

# === ADVANCED AUTHENTICATION ===

 - title:
    en: impacket-services - pass-the-hash authentication
    tr: impacket-services - pass-the-hash kimlik doğrulaması
   desc:
     en: |
       Authenticates to the target using NTLM hashes instead of a cleartext password. 
       This is the standard approach for lateral movement when you have dumped hashes from memory but do not have the original password. 
       The hash must be provided in the format LMHASH:NTHASH.
     tr: |
       Hedefe açık parola yerine NTLM hash'leri ile kimlik doğrulaması yapar.
       Bellekten hash döküp özgün parolaya sahip olmadığınızda yatay hareket için standart yaklaşımdır.
       Hash, LMHASH:NTHASH biçiminde verilmelidir.
   command: "impacket-services {{domain/username}}@{{target}} -hashes {{lmhash:nthash|aad3b435b51404eeaad3b435b51404ee:584ee30706703640b643f1138459f20c}} list"

 - title:
    en: impacket-services - kerberos authentication
    tr: impacket-services - Kerberos kimlik doğrulaması
   desc:
     en: |
       Uses Kerberos tickets for authentication, which is often more stealthy and avoids NTLM logging. 
       You must have a valid Kerberos ticket (TGT) in your KRB5CCNAME environment variable and provide the -k flag. 
       Ensure the target is specified as a FQDN (hostname) rather than an IP address for Kerberos to function correctly, and use -dc-ip to point to the Domain Controller.
     tr: |
       Kimlik doğrulama için Kerberos biletlerini kullanır; bu genellikle daha gizlidir ve NTLM günlüğüne düşmekten kaçınır.
       KRB5CCNAME ortam değişkeninizde geçerli bir Kerberos bileti (TGT) bulunmalı ve -k bayrağını vermelisiniz.
       Kerberos'un doğru çalışması için hedefin IP adresi yerine FQDN (ana makine adı) olarak belirtildiğinden emin olun ve Etki Alanı Denetleyicisini göstermek için -dc-ip kullanın.
   command: "impacket-services -k -no-pass -dc-ip {{dc_ip}} {{domain/username}}@{{target_fqdn}} list"
